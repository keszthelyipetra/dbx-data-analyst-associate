d values from another requires LEFT JOIN combined with NULL handling. SUM of NULL returns NULL, so COALESCE is needed to convert NULL sums to zero. The COALESCE can be placed either outside SUM wrapping the aggregate or inside SUM on individual values. Both correctly produce 0 for rows with no matches while preserving actual totals.", "syntax": "LEFT JOIN t2 ON ... ; COALESCE(SUM(col), 0)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Testing for NULL and zero", "definition": "Testing for both NULL and zero requires IS NULL for the null check, since equality operators cannot be used with NULL (col = NULL always returns NULL, treated as false). OR combines the two conditions so either match returns the row. The COALESCE approach (COALESCE(col, 0) = 0) is an elegant alternative that converts NULL to a default value enabling a single equality comparison.", "syntax": "WHERE col IS NULL OR col = 0"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Three-level namespace addressing", "definition": "Unity Catalog uses a three-level dot-notation namespace: catalog.schema.table. Using the full three-level reference ensures the correct table is accessed regardless of the active session catalog or schema. This is particularly important when writing queries that span multiple catalogs, as partial references may silently resolve to the wrong object in the active catalog.", "syntax": "catalog.schema.table"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "COUNT(column)", "definition": "COUNT(column) counts only the non-null values in a column, excluding rows where the value is NULL. COUNT(*) instead counts every row, and COUNT never sums values.", "syntax": "SELECT COUNT(commission) FROM employees;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "CAST for Numeric Aggregation", "definition": "Casting a string column to a numeric type such as INT or DECIMAL lets aggregate functions like SUM operate on the values correctly. Relying on implicit conversion is unsafe, and CONCAT or TRIM do not make values numeric.", "syntax": "SELECT SUM(CAST(col AS INT)) FROM my_table;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "WHERE vs HAVING", "definition": "WHERE filters individual rows before aggregation and cannot reference aggregate functions, while HAVING filters grouped results using aggregates such as COUNT(*). WHERE executes before grouping and before HAVING.", "syntax": "SELECT dept, COUNT(*) FROM emp WHERE active = true GROUP BY dept HAVING COUNT(*) > 5;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "TRANSFORM Function", "definition": "TRANSFORM is a higher-order function that applies a lambda to each element of an array. The correct syntax uses the lambda arrow: TRANSFORM(array_column, value -> expression) AS new_column.", "syntax": "TRANSFORM(dollars_spent, value -> value / 100) AS hundreds_spent"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Top-N Query with LIMIT", "definition": "Databricks SQL uses LIMIT (not TOP) to cap the number of returned rows. Combining a date filter with GROUP BY and ORDER BY total_spent DESC then returns the top N spenders.", "syntax": "SELECT customer_id, SUM(price) AS total_spent FROM sales WHERE date >= DATEADD(day,-30,GETDATE()) GROUP BY customer_id ORDER BY total_spent DESC LIMIT 5;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Query Profile memory peak metric", "definition": "In the Query Profile, resource-constraint aborts indicate memory exhaustion, and the Memory peak per operator metric reveals which operator consumed the most RAM and needs tuning. Shuffle size measures data movement, time measures duration, and disk spill is a symptom rather than the direct memory culprit.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Serverless SQL endpoint", "definition": "Serverless SQL endpoints start almost instantly because compute is pre-provisioned by Databricks, removing the cold-start wait without forcing you to keep a cluster running. Resizing the cluster or disabling Auto stop either raises cost or doesn't address start-up time.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "CASE WHEN expression", "definition": "A CASE WHEN expression evaluates conditions row by row and returns the matching label, making it ideal for bucketing or labeling values inline within a SELECT. Unlike WHERE/HAVING (which filter) or GROUP BY (which aggregates), it produces a derived value per row.", "syntax": "CASE WHEN amount > 100 THEN 'High' ELSE 'Low' END"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "SQL Warehouse cost reduction", "definition": "Enabling Auto stop halts an idle warehouse so you stop paying for unused compute, and lowering the maximum cluster count caps how far it scales out. Increasing size, extending idle timeout, or disabling the result cache all raise cost.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "GROUP BY WITH CUBE", "definition": "WITH CUBE generates every possible grouping combination, including subtotals for each grouping column alone and a grand total row. WITH ROLLUP, by contrast, only produces subtotals along a hierarchy plus the grand total.", "syntax": "SELECT a, b, count(*) FROM t GROUP BY a, b WITH CUBE;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Aggregate revenue query (GROUP BY / ORDER BY)", "definition": "To total a measure per group over a date range, filter with WHERE, group by the key, apply the aggregate (e.g. SUM), and order results as requested. Unnecessary LIMIT, HAVING, or reversed ORDER BY direction change the intended output.", "syntax": "SELECT store_id, SUM(total_sales) FROM purchase WHERE date >= '2023-01-01' AND date <= '2023-01-31' GROUP BY store_id ORDER BY 2 DESC;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Deduplication with SELECT DISTINCT (CTAS)", "definition": "SELECT DISTINCT * returns only unique rows, and wrapping it in CREATE TABLE ... AS materializes those deduplicated rows into a new table. Other constructs like MERGE DEDUPLICATE or INSERT * are not valid or do not deduplicate.", "syntax": "CREATE TABLE table_silver AS SELECT DISTINCT * FROM table_bronze;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "substring()", "definition": "substring(str, start, length) returns a portion of a string beginning at a 1-based position for the given length, e.g. the first three characters of a phone number. concat joins strings, length counts characters, and replace substitutes text.", "syntax": "substring(phone, 1, 3)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "SQL Warehouse scaling for concurrency", "definition": "To handle query queuing under heavy concurrent load, enable scaling so the warehouse adds clusters (raising the max cluster count). A larger t-shirt size speeds single queries but does not add concurrency clusters.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "filter higher-order function", "definition": "filter applies a predicate to an array column and returns a new array containing only the elements that satisfy it, without exploding the array into rows. transform maps every element, reduce aggregates to a scalar, and explode flattens an array into rows.", "syntax": "filter(arr, x -> x > 0)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Top-N percentile filtering with a subquery", "definition": "To return the top 10% of rows by a metric, compute the 90th percentile in a subquery and use it as a threshold in the WHERE clause. LIMIT and OFFSET do not accept percentages, and PERCENTILE without a subquery cannot filter directly.", "syntax": "SELECT * FROM customers WHERE total_spend > (SELECT PERCENTILE(total_spend, 0.9) FROM customers)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "array_contains function", "definition": "array_contains(column, value) returns true when an array column contains the given element, correctly filtering rows whose array holds that value. IN and LIKE do not work on array columns — IN expects a value list or subquery, and LIKE operates on strings.", "syntax": "SELECT * FROM articles WHERE array_contains(tags, 'sql');"}, {"category": "Analyzing Queries", "term": "EXPLAIN", "definition": "Displays the execution plan for a query without running it, showing the operators, algorithms, and estimated cost of each step. It helps you understand and optimize how Spark will process the query. It does not validate results, only the plan.", "syntax": "EXPLAIN SELECT * FROM sales WHERE region = 'EU';"}, {"category": "Analyzing Queries", "term": "Query Profile", "definition": "A visual, post-execution breakdown of a query's stages, time, and resource usage in Databricks SQL. It pinpoints bottlenecks like expensive joins, large scans, or skew. The go-to tool for troubleshooting slow queries.", "syntax": null}, {"category": "Analyzing Queries", "term": "Caching", "definition": "Stores query results or table data in memory so repeated reads are served without recomputing from source. It speeds up latency for frequently run queries. Result caching and CACHE TABLE are two common forms.", "syntax": "CACHE TABLE hot_sales;"}, {"category": "Analyzing Queries", "term": "Predicate Pushdown & Partition Pruning", "definition": "Optimizations that reduce the data scanned. Predicate pushdown applies filters as early as possible (even at the file/format level), while partition pruning skips entire partitions that cannot match the filter. Both cut I/O and speed up queries.", "syntax": null}, {"category": "Analyzing Queries", "term": "ANALYZE TABLE (Statistics)", "definition": "Computes and stores table/column statistics that the query optimizer uses to choose better plans (join order, strategies). Fresh statistics help especially on large tables. Run it after major data changes.", "syntax": "ANALYZE TABLE sales COMPUTE STATISTICS FOR ALL COLUMNS;"}, {"category": "Analyzing Queries", "term": "Mean vs Median", "definition": "The mean is the arithmetic average (sum divided by count) and reflects overall level but is sensitive to outliers. The median is the middle value when sorted and is robust to skew and extreme values. Choose based on whether outliers should influence the result.", "syntax": "SELECT AVG(score), percentile(score, 0.5) FROM survey;"}, {"category": "Analyzing Queries", "term": "Discrete vs Continuous Data", "definition": "Discrete data takes specific separate values (counts, categories), while continuous data can take any value within a range (height, temperature, time). The distinction guides which charts and statistics are appropriate. Continuous data is often binned for visualization.", "syntax": null}, {"category": "Analyzing Queries", "term": "Data Blending", "definition": "Combining data from two or more different sources into a single unified view for analysis. It joins or aligns datasets that live apart so they can be reported together. Distinct from enrichment, which adds new attributes.", "syntax": null}, {"category": "Analyzing Queries", "term": "Data Enhancement / Enrichment", "definition": "Augmenting an existing dataset with additional data to improve its completeness, accuracy, or value, such as adding third-party demographics to user profiles. It increases the analytical value of the base data. Often a Silver/Gold-layer activity.", "syntax": null}, {"category": "Analyzing Queries", "term": "Temporary Table (materialize once)", "definition": "A short-lived table (or temp view) created to hold a filtered or precomputed result so an expensive subquery runs only once. Later steps read the cheap intermediate instead of recomputing it. It disappears at the end of the session.", "syntax": "CREATE OR REPLACE TEMP VIEW recent AS\nSELECT * FROM sales WHERE dt >= current_date() - 30;"}, {"category": "Analyzing Queries", "term": "Frequency Distribution", "definition": "A summary that counts how often each value or range of values occurs in a dataset. In SQL it is produced with GROUP BY and COUNT. It reveals the shape and most common values of the data.", "syntax": "SELECT rating, COUNT(*) FROM reviews GROUP BY rating ORDER BY rating;"}, {"category": "Analyzing Queries", "term": "OPTIMIZE with ZORDER BY", "definition": "OPTIMIZE with ZORDER BY improves filter performance on Delta tables by co-locating rows with similar column values in the same files. This lets the Delta engine use file-level min/max statistics to skip files that cannot contain matching rows, reducing data scanned without requiring table repartitioning.", "syntax": "OPTIMIZE orders ZORDER BY (order_date)"}, {"category": "Analyzing Queries", "term": "Photon execution engine", "definition": "Photon is Databricks' native vectorized execution engine written in C++ that accelerates SQL and DataFrame operations by processing columnar data in batches rather than using JVM bytecode. It is particularly effective for large table scans, aggregations, joins, and sorts, and is the default engine powering Databricks SQL Warehouses.", "syntax": null}, {"category": "Analyzing Queries", "term": "Broadcast join", "definition": "When one side of a join is small, a broadcast join is significantly faster than a sort-merge join because it sends the small table to all worker nodes so each can join locally, eliminating the expensive shuffle phase. In Databricks SQL you can hint the optimizer with a BROADCAST hint or configure autoBroadcastJoinThreshold to broadcast tables below a size threshold automatically.", "syntax": "SELECT /*+ BROADCAST(lookup_table) */ *\nFROM large_table JOIN lookup_table USING (id)"}, {"category": "Analyzing Queries", "term": "Query History", "definition": "Query History is the correct tool for identifying poorly performing queries in Databricks SQL. It provides a filterable log of every executed query with detailed metrics including duration, compute resource used, bytes scanned, rows returned, and I/O performance. Filtering and sorting by these metrics quickly surfaces the slowest and most resource-intensive queries for further investigation using the Query Profiler.", "syntax": null}, {"category": "Analyzing Queries", "term": "Databricks SQL result caching", "definition": "Databricks SQL result caching automatically stores query outputs and serves them for identical subsequent queries when the underlying data has not changed. This is why dashboard queries appear much faster on repeated loads, returning near-instant responses without re-executing against the data source. Result caching is transparent to the analyst and requires no configuration.", "syntax": null}, {"category": "Analyzing Queries", "term": "Delta Lake Data Quality Features", "definition": "Delta Lake provides ACID transactions and schema enforcement as foundational data quality and reliability features. ACID compliance ensures consistent results for concurrent access, so readers see a consistent snapshot and writes either fully commit or fully roll back. Schema enforcement rejects writes incompatible with the table schema, preventing corruption from mismatched or extra columns.", "syntax": null}, {"category": "Analyzing Queries", "term": "VACUUM Command", "definition": "VACUUM is a storage management command that removes data files no longer referenced by the Delta transaction log, reducing storage costs. The critical risk is that it permanently deletes files needed for time travel queries to historical versions. By default it retains files for 7 days; always verify the retention period matches your time travel requirements before running it.", "syntax": "VACUUM sales.transactions RETAIN 168 HOURS;"}, {"category": "Analyzing Queries", "term": "ZORDER and Liquid Clustering", "definition": "To improve filter performance on a specific column in a Delta table, the two recommended approaches are OPTIMIZE with ZORDER BY and Liquid Clustering. Both co-locate related data and improve data skipping statistics so the engine can skip files that cannot contain the filtered values. Liquid Clustering is preferred for new tables or when ongoing maintenance is a concern as it operates incrementally, while ZORDER suits existing tables already using OPTIMIZE-based maintenance.", "syntax": "OPTIMIZE sales.orders ZORDER BY (region);\n-- or\nALTER TABLE sales.orders CLUSTER BY (region);"}, {"category": "Analyzing Queries", "term": "OPTIMIZE File Compaction vs Data Skipping", "definition": "OPTIMIZE without ZORDER BY compacts small files into larger ones but does not reorganise data by column values, so data skipping on specific columns does not improve. File-level statistics may improve slightly from larger files, but targeted column-based data skipping requires ZORDER BY or Liquid Clustering on that column.", "syntax": "OPTIMIZE sales.orders ZORDER BY (order_status);"}, {"category": "Analyzing Queries", "term": "Liquid Clustering vs Hive Partitioning", "definition": "Liquid Clustering offers two key advantages over Hive-style partitioning. First, it handles high-cardinality columns without creating the small files problem. Second, the clustering columns can be changed without rewriting the table. These characteristics make Liquid Clustering more flexible and maintainable for evolving analytical workloads compared to static Hive-style partition schemes.", "syntax": "ALTER TABLE table CLUSTER BY (new_column)"}, {"category": "Analyzing Queries", "term": "Delta Time Travel with EXCEPT", "definition": "Comparing current and historical Delta table states uses time travel with TIMESTAMP AS OF or VERSION AS OF combined with set operations. EXCEPT against a past snapshot efficiently identifies rows added since that historical point. DESCRIBE HISTORY helps verify available history and identify specific versions, but time travel syntax can reference dates directly without manual version lookup.", "syntax": "SELECT * FROM orders EXCEPT SELECT * FROM orders TIMESTAMP AS OF date_sub(current_date(), 7)"}, {"category": "Analyzing Queries", "term": "BROADCAST Join Hint", "definition": "The BROADCAST join hint forces a broadcast join strategy for the specified table. The small table is serialised and sent to all worker nodes so each node can perform the join locally without shuffling the large fact table. Broadcast joins are significantly faster than sort-merge joins for small dimension tables, typically under a few hundred MB, and the hint overrides the automatic join strategy selected by the optimiser.", "syntax": "SELECT /*+ BROADCAST(dim_product) */ f.order_id, p.product_name FROM fact_orders f JOIN dim_product p ON f.product_id = p.product_id"}, {"category": "Analyzing Queries", "term": "REFRESH TABLE for Cache Invalidation", "definition": "REFRESH TABLE is the correct command to invalidate stale metadata and result cache entries in Databricks SQL. After execution, subsequent queries against the table re-execute against the Delta transaction log to retrieve the latest committed data. This is particularly useful after bulk data loads or pipeline completions where the result cache may not yet reflect the new data.", "syntax": "REFRESH TABLE table_name"}, {"category": "Analyzing Queries", "term": "Query Profiler", "definition": "The Query Profiler in Databricks SQL displays a visual DAG of the physical execution plan with per-operator metrics including time spent, rows processed, and bytes scanned. It lets analysts pinpoint which stages (scans, joins, aggregations) are the performance bottleneck. It works for both successful and failed queries; high scan times indicate missing data skipping, while high join times may indicate missing broadcast hints or data skew.", "syntax": null}, {"category": "Analyzing Queries", "term": "Stale result cache in Databricks SQL", "definition": "Databricks SQL result caching can cause analysts to see stale data when a query is served from a cache populated before recent updates were committed. This is the most common explanation for missing recent commits when the updates are confirmed as successful. Re-running the query with a forced refresh or invalidating the cache retrieves the latest committed data, and DESCRIBE HISTORY can verify when commits were made.", "syntax": null}, {"category": "Analyzing Queries", "term": "delta.logRetentionDuration for time travel", "definition": "The delta.logRetentionDuration table property controls how long Delta transaction log entries are retained. Setting it to interval 30 days via ALTER TABLE ensures the log files covering the last 30 days are preserved, which is required for time travel to work alongside the data-file retention managed by VACUUM.", "syntax": "ALTER TABLE t SET TBLPROPERTIES (delta.logRetentionDuration = 'interval 30 days');"}, {"category": "Analyzing Queries", "term": "OPTIMIZE ZORDER and Liquid Clustering for scan efficiency", "definition": "For a large unpartitioned Delta table, the two best actions to improve filter scan performance are OPTIMIZE with ZORDER BY for immediate improvement and Liquid Clustering for ongoing incremental improvement. OPTIMIZE ZORDER compacts small files and co-locates similar values while updating min/max statistics for data skipping; Liquid Clustering keeps future writes clustered without periodic manual OPTIMIZE runs.", "syntax": "OPTIMIZE transactions ZORDER BY (transaction_date); ALTER TABLE transactions CLUSTER BY (transaction_date);"}, {"category": "Analyzing Queries", "term": "OPTIMIZE with ZORDER for data skipping", "definition": "A full table scan despite a filter column indicates that data skipping is ineffective due to poor data layout or missing file statistics. Running OPTIMIZE compacts small files and refreshes per-file column statistics. ZORDER BY co-locates similar column values in the same files making the statistics more selective. After OPTIMIZE ZORDER, subsequent queries with a matching filter skip files whose statistics do not overlap the filter value, dramatically reducing scan size.", "syntax": "OPTIMIZE orders ZORDER BY (region)"}, {"category": "Analyzing Queries", "term": "VACUUM and time travel retention", "definition": "VACUUM permanently deletes data files older than the configured retention period. If VACUUM runs with a retention period shorter than the time travel window needed the historical files are lost. Prevent this by setting delta.deletedFileRetentionDuration on the table to a value matching your required time travel window, and by never running VACUUM with RETAIN 0 HOURS unless you explicitly intend to remove all time travel history.", "syntax": "ALTER TABLE t SET TBLPROPERTIES ('delta.deletedFileRetentionDuration' = 'interval 30 days')"}, {"category": "Analyzing Queries", "term": "ZORDER Optimization", "definition": "ZORDER optimises data layout within the existing partition structure. When a table is partitioned each partition is independently reorganised by ZORDER so rows with similar values are stored in the same files and file-level statistics are updated. This enables data skipping within partitions for filters on the ZORDER column, reducing I/O even when the filter column differs from the partition column. ZORDER and partitioning are complementary optimisations.", "syntax": "OPTIMIZE table ZORDER BY (order_date)"}, {"category": "Analyzing Queries", "term": "Diagnosing data fan-out with the Query Profiler", "definition": "Data fan-out in joins is diagnosed by examining row count metrics in the Query Profiler. When a join node outputs more rows than its largest input table, the join keys are not unique on one or both sides, causing many-to-many row multiplication. The fix is to verify join key uniqueness, add deduplication before the join, or refine the join condition.", "syntax": null}, {"category": "Analyzing Queries", "term": "OPTIMIZE and VACUUM impact on time travel", "definition": "OPTIMIZE compacts small files into larger ones and marks the originals as deleted in the transaction log but does not physically remove them. VACUUM is what physically deletes the marked files. If VACUUM runs with a retention period shorter than the desired time travel window after OPTIMIZE, the original pre-compaction files are deleted, making time travel to those versions impossible.", "syntax": null}, {"category": "Analyzing Queries", "term": "Cohort retention analysis", "definition": "Cohort retention analysis requires two steps: identifying each customer's cohort by their first purchase week, then measuring their activity in subsequent weeks relative to cohort size. A subquery joins purchases to the first-week cohort assignment, a window function calculates cohort sizes efficiently within the same query, and the outer aggregation computes retention percentages per cohort per subsequent week.", "syntax": null}, {"category": "Analyzing Queries", "term": "Optimising SortMergeJoin spill", "definition": "SortMergeJoin slowness with spill to disk is caused by too much data entering the join. Two targeted solutions address this: reducing row count with selective early filters to lower the data volume entering the join, and using broadcast joins for small tables to eliminate the expensive shuffle entirely. Both can be applied independently or together for compounding benefit.", "syntax": null}, {"category": "Analyzing Queries", "term": "Exchange node (shuffle)", "definition": "The Exchange node in a Spark execution plan represents a shuffle where data is redistributed across executor partitions to align rows with matching join or aggregation keys. High Exchange volume means large amounts of data moving across the network, a common bottleneck in large join queries. Mitigation includes broadcast joins for small tables, bucketing both tables on join keys, and reducing data volume with early filters.", "syntax": null}, {"category": "Analyzing Queries", "term": "Databricks SQL result cache", "definition": "Sub-second query completion that is dramatically faster than expected for a table's size is the characteristic signature of result cache hits in Databricks SQL. The cache stores the complete result of a query and serves it immediately for identical subsequent queries when the underlying table data has not changed. A stable table since the last refresh keeps the cache entry valid.", "syntax": null}, {"category": "Analyzing Queries", "term": "HashAggregate spill on high-cardinality GROUP BY", "definition": "High-cardinality GROUP BY operations can cause HashAggregate to consume significant memory tracking many distinct group states. When memory is insufficient the aggregation spills to disk causing dramatic slowdowns. Mitigation strategies include filtering data before aggregation to reduce row count, ensuring adequate executor memory, partitioning data on the GROUP BY key to reduce shuffle, and considering approximate aggregation with APPROX_COUNT_DISTINCT for very large distinct counts.", "syntax": null}, {"category": "Analyzing Queries", "term": "Delta Lake Partitioning", "definition": "Delta Lake stores table data as Parquet files, and declaring a partition column with PARTITIONED BY organizes those files into Hive-style directories, one per distinct column value. Queries filtering on the partition column can then skip entire directories through partition pruning.", "syntax": "CREATE TABLE t (...) USING DELTA PARTITIONED BY (region);"}, {"category": "Analyzing Queries", "term": "Continuous Variable", "definition": "A continuous variable is a quantitative variable that can take any value within a range, i.e. an uncountable set such as height or temperature. A finite or countable set of values instead describes a discrete variable.", "syntax": null}, {"category": "Analyzing Queries", "term": "Correlated EXISTS subquery", "definition": "A correlated EXISTS subquery efficiently tests whether at least one matching row exists for each outer row without returning columns from the inner table. It is the cleanest way to express a 'has at least one' existence check, unlike a UNION, CROSS JOIN, or COUNT condition.", "syntax": "SELECT ... FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)"}, {"category": "Analyzing Queries", "term": "Descriptive statistics", "definition": "Descriptive statistics summarize and quantitatively describe a dataset using measures like mean, median, and spread. Inferring properties of an underlying probability distribution is inferential statistics instead.", "syntax": null}, {"category": "Analyzing Queries", "term": "Temporary (TEMP) views", "definition": "A TEMP (temporary) view exists only for the session that created it and is dropped automatically when that session ends. After logging out and back in, the view is gone.", "syntax": "CREATE TEMP VIEW v AS SELECT * FROM t WHERE ...;"}, {"category": "Analyzing Queries", "term": "COUNT with GROUP BY", "definition": "To total a metric per group, use an aggregate like count(order_id), a GROUP BY on the grouping column, and an alias (AS) to name the output column. Statements missing GROUP BY don't aggregate per group, and clauses like USE are invalid syntax.", "syntax": "SELECT customer_name, count(order_id) AS number_of_orders FROM customers JOIN orders ON customers.customer_id = orders.customer_id GROUP BY customer_name;"}, {"category": "Analyzing Queries", "term": "GROUP BY requirement with aggregates", "definition": "Whenever you select a non-aggregated column alongside an aggregate like count(*), you must group by that column. Omitting the GROUP BY on the selected non-aggregated column is a mistake even if ORDER BY is present.", "syntax": "SELECT region, count(*) AS number_of_customers FROM customers GROUP BY region ORDER BY region;"}, {"category": "Creating Dashboards and Visualizations", "term": "AI/BI Dashboard", "definition": "A native Databricks dashboard built from datasets (SQL queries) with attached visualizations. It supports global, page, and widget level filters and can be published and shared with view-only access. Data refreshes on demand or on a schedule.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Query Parameter", "definition": "A placeholder in a query, written in double curly braces, that is substituted with a value at runtime via a widget. It lets one query serve many filter values instead of writing near-duplicate queries. Great for reusable, interactive dashboards.", "syntax": "SELECT * FROM sales WHERE region = {{ region }};"}, {"category": "Creating Dashboards and Visualizations", "term": "Alert", "definition": "A rule set on a query's results that sends a notification when a condition or threshold is met. Alerts can be scheduled to check as often as every minute in Databricks. Used for monitoring metrics and data thresholds.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Visualization Types", "definition": "Databricks SQL offers chart types such as counter, table, pivot, bar, line, and box, each suited to a different story. Bar charts emphasize comparisons and trends, tables show detailed values, and box charts show distribution and outliers. Choose the type that matches the question.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Box Plot", "definition": "A chart that shows the distribution of a numeric field through its median, quartiles, and outliers. It is ideal for comparing spread across categories and spotting anomalies. Also called a box-and-whisker plot.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Refresh Schedule", "definition": "A time-based trigger that automatically re-runs a dashboard's or query's data so viewers see current results. It is configured in the dashboard or query schedule settings. Balance data freshness against warehouse cost.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Query-Based Dropdown List", "definition": "A dashboard parameter whose selectable values are populated dynamically from the distinct results of a query. It keeps filter options in sync with live data instead of a hard-coded list. Improves interactive exploration.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Customizable Table", "definition": "A Databricks SQL visualization that renders query results as a table with conditional formatting and column-specific styling. It goes beyond a plain result grid. Useful for highlighting values by rule.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Counter", "definition": "A visualization widget that displays a single numeric summary value, such as a KPI or sales goal. It is meant for at-a-glance metrics on a dashboard. Often paired with a target for comparison.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Text widget", "definition": "The Text widget in AI/BI Dashboards renders Markdown-formatted static content and is the correct choice for adding explanatory text, methodology notes, titles, and descriptions. It helps viewers interpret visualizations by providing context without requiring any dataset or query connection.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Scheduled dashboard refresh vs SQL Alert", "definition": "A scheduled dashboard refresh automatically updates visualizations by re-running the underlying queries on a defined schedule, keeping content current. A SQL Alert monitors a query result against a threshold and sends a notification through channels like email or Slack when the condition is met. Both can be configured in Databricks SQL but address different needs: currency of information versus threshold-based notification.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "SQL query for a ranked bar chart", "definition": "For a ranked bar chart showing total revenue by category, the query must include the dimension column in SELECT, aggregate the measure with SUM, GROUP BY the dimension, and ORDER BY the aggregate measure in descending order. All four elements are required for the visualization to render correctly with properly labelled and ordered bars.", "syntax": "SELECT category, SUM(revenue) AS total_revenue\nFROM sales\nGROUP BY category\nORDER BY total_revenue DESC"}, {"category": "Creating Dashboards and Visualizations", "term": "Diagnosing unexpected data point counts", "definition": "When a dashboard displays fewer data points than expected, first check whether the number of visible points maps cleanly to a known grouping interval. For example, 13 points from 90 days of daily data is not random; it maps exactly to weekly aggregation, making a misconfigured dashboard date filter set to group by week rather than day the most likely cause.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Pie and donut charts for part-to-whole", "definition": "Pie and donut charts are the most effective visualization type for displaying proportional or part-to-whole relationships across a small number of discrete categories, with each slice representing a category's proportional contribution to the total. When the number of categories is large, a stacked bar chart is often a better alternative since pie charts become hard to read with many small slices.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Dashboard Refresh Schedule", "definition": "Dashboard data freshness is controlled by the refresh schedule. Without a scheduled refresh, a Databricks AI/BI dashboard displays results from the last time queries were manually run or the last scheduled refresh executed, showing stale data. Configure a refresh schedule that matches the frequency of underlying data updates; daily-updated data requires at minimum a daily dashboard refresh.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Line Chart for Time Series", "definition": "Line charts are the standard and most effective visualisation for time series trends. The x-axis represents the time dimension and the y-axis represents the measured value. Daily granularity over a period such as 12 months produces enough data points for a line chart to clearly communicate trends, seasonality, and anomalies that other chart types would obscure.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Counter Widget for KPI", "definition": "The Counter widget is the correct choice for displaying a single numeric KPI value prominently on a Databricks AI/BI Dashboard. It renders the value in large bold text suitable for headline metrics such as total customers, revenue, or order count. The widget connects to a query that returns a single value and updates automatically when the data refreshes.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Databricks SQL Alerts", "definition": "Databricks SQL Alerts require a SQL query and a threshold condition as core components and support multiple simultaneous notification destinations. They are monitoring and notification tools only and do not perform data modifications. Understanding what SQL Alerts can and cannot do is an important distinction.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Dashboard Refresh Schedule and Data Freshness", "definition": "Dashboard data freshness depends entirely on the refresh schedule. Without a configured refresh schedule, or with an infrequent one, the dashboard shows results from the last manual or scheduled execution. Configuring a refresh schedule that matches the data update frequency ensures viewers always see current data. This applies to both workspace users and external viewers accessing via shareable links.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Bar Chart for Discrete Categories", "definition": "Bar charts are the standard and most effective visualisation for showing counts or frequencies across discrete categories. When the categories are predefined ordered groups like age bands, a bar chart clearly communicates relative group sizes and distribution patterns. Histograms are used for continuous numeric distributions, while bar charts are for discrete categorical counts.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Shared Parameters Across Dashboard Widgets", "definition": "AI/BI Dashboards support multiple visualisation widgets on a single page. Widgets can share dataset queries or reference the same parameters so that a single date-range selector filters all visualisations simultaneously. This is the standard pattern for building interactive multi-visualisation dashboards in Databricks.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Sharing Dashboards via Public Link", "definition": "Databricks AI/BI Dashboards can be published and shared via a shareable link that does not require recipients to have a Databricks account. This is the recommended approach for distributing dashboards to external stakeholders who only need to view the content, unlike exporting PDFs or embedding via REST API.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Embedding AI/BI Dashboards externally", "definition": "Databricks AI/BI Dashboards can be published and embedded in external applications using an iframe with the published dashboard URL. Viewers can interact with the live dashboard without needing a Databricks account. This is the standard approach for distributing dashboards to external stakeholders through web portals or internal applications.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Dashboard date range filter connection", "definition": "Dashboard filters work by connecting filter widgets to the relevant fields or parameters used by the dashboard's datasets. A date range filter can be configured to filter a date field across one or more datasets, or it can be connected to a dashboard parameter. If the filter is not correctly connected to the relevant dataset field or parameter, changing it has no effect on the visualisations.", "syntax": "WHERE date_col BETWEEN :date_param.min AND :date_param.max"}, {"category": "Creating Dashboards and Visualizations", "term": "Filter widget with parameterised query", "definition": "Dashboard interactivity is implemented using Filter widgets linked to parameterised queries. The parameter is referenced in each dataset query using double curly brace syntax and the filter widget provides the UI control (such as a dropdown) for selecting values. When a viewer changes the filter, all linked queries re-execute with the new parameter value, updating all associated visualisations.", "syntax": "WHERE region = {{region}}"}, {"category": "Creating Dashboards and Visualizations", "term": "SQL Alert required components", "definition": "A Databricks SQL Alert is built on a SQL query whose result is evaluated against a threshold condition. The query must return a numeric value or a result that can be compared against the defined threshold. The threshold condition defines the comparison logic (such as greater than, less than, or equal to a number); when the result meets the condition the alert fires and notifications are sent.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "SQL Alert for scheduled threshold monitoring", "definition": "A full Databricks SQL Alert has four components: a SQL query that returns the value to monitor, a threshold condition such as Value > 3, a notification destination such as email or Slack, and a run schedule. The alert runs the query on schedule and automatically sends notifications when the result meets the condition. This provides proactive automated monitoring without manual dashboard checks or a separate DLT pipeline or job.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Multi-series line chart for time-series comparison", "definition": "A multi-series line chart is the most effective visualization for time-series data requiring year-over-year comparison. Configuring the x-axis as month and grouping the series by year overlays multiple years as separate lines, making seasonal patterns, growth trends, and same-period differences immediately visible.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "SQL Alerts for threshold monitoring", "definition": "A Databricks SQL Alert provides automated threshold-based monitoring: it executes a SQL query on a schedule, evaluates the result against a condition, and sends notifications to a configured destination when the condition is met. This enables proactive alerting (e.g. daily order count below 100) without requiring analysts to manually check dashboards.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Dashboard Filter widget with query parameter", "definition": "Interactive dashboard filtering uses a Filter widget linked to a query parameter defined with double curly brace syntax. A single Filter widget with a dropdown of values passes the selection as a parameter to every linked dataset query's WHERE clause, so when a viewer picks a value all visualizations refresh simultaneously without duplicating dashboard content.", "syntax": "SELECT * FROM revenue WHERE quarter = {{quarter}};"}, {"category": "Creating Dashboards and Visualizations", "term": "Equal-height bars from missing GROUP BY", "definition": "Equal height bars in a chart where different values are expected almost always indicate a missing GROUP BY on the x-axis dimension. Without GROUP BY the aggregate function collapses all rows into one value which is then plotted identically for every x-axis category. Adding GROUP BY the time dimension ensures each bar reflects the aggregate for that specific period.", "syntax": "SELECT month, SUM(revenue) FROM sales GROUP BY month"}, {"category": "Creating Dashboards and Visualizations", "term": "Exporting a notebook as HTML", "definition": "Exporting a notebook as HTML creates a static rendered document capturing all cell outputs including visualisations, tables, and narrative text. The HTML file can be opened in any web browser without Databricks access and cannot be run or modified by the viewer. This is the standard approach for sharing completed analyses with stakeholders who do not have Databricks workspace access.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Investigating dashboard refresh errors", "definition": "Investigating dashboard refresh errors requires two steps: checking the dashboard refresh history for the failure record and error summary, and reviewing Query History in Databricks SQL for the specific failing query and its detailed error message. Together these two sources provide the information needed to diagnose whether the issue is a query error, a permissions problem, a data source change, or a warehouse availability issue.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Dashboard scheduled refresh", "definition": "Dashboard data staleness without visible errors is almost always caused by a missing or disabled refresh schedule. Dashboards display the most recently cached query results and without scheduled refresh they never re-execute their queries against updated data. Checking the dashboard refresh history and configuring an appropriate refresh schedule aligned with the pipeline completion time resolves this class of issue.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Grouped Bar Chart", "definition": "Grouped bar charts are the standard visualisation for comparing two related measures across discrete categories. Each category has a group of bars representing each measure, making it immediately clear whether each unit is above or below target and by how much. The side-by-side positioning enables direct visual comparison across all categories simultaneously.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Cascading Filters in AI/BI Dashboards", "definition": "Cascading filters link downstream filter widgets to upstream parameter values. The downstream filter's dataset query includes a WHERE clause referencing the upstream parameter, so the available options dynamically update whenever the upstream selection changes. This provides a hierarchical filtering experience within a single dashboard without duplicating content.", "syntax": "WHERE continent = {{continent}}"}, {"category": "Creating Dashboards and Visualizations", "term": "Dashboard Performance Optimization", "definition": "Dashboard performance optimisation uses multiple complementary techniques. Result caching eliminates redundant query execution for unchanged data. Off-peak refresh scheduling reduces resource contention. Materialised Views reduce query complexity by serving pre-computed results. Warehouse sizing is one lever but should be applied after query and data optimisations have been exhausted.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Embedding Dashboards with URL Parameters", "definition": "Pre-populated dashboard filters for embedded use cases are implemented by passing URL parameters when constructing the embed iframe URL. The portal reads the authenticated user's attribute from the session context and appends it to the dashboard embed URL, causing the filter widget to load with the correct value pre-selected. This provides a seamless personalised experience without requiring the viewer to interact with filter widgets.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Case Sensitivity in Dashboard Filters", "definition": "When a dashboard filter returns correct results for one value but no results for another the most common cause is a case sensitivity mismatch between the parameter value and the stored data. Databricks SQL string comparisons are case-sensitive by default so South does not match SOUTH or south. The fix is to normalise case on both sides using LOWER or UPPER, or to use ILIKE for case-insensitive matching.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Counter widgets for executive KPI dashboards", "definition": "The standard executive dashboard pattern for at-a-glance KPI display uses Counter widgets arranged in a row at the top of the dashboard, each prominently displaying one metric value with its label in large bold text. This immediately communicates all key metrics without requiring users to interpret charts or scroll, with supporting visualisations placed below for trend context.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Map visualisation for geographic data", "definition": "Map visualisations are the correct choice for displaying geographic data such as store locations. They use latitude and longitude coordinates to plot markers on an actual map background, providing the geographic context needed to understand distribution patterns, coverage gaps, and regional density. Databricks AI/BI Dashboards support map visualisations for geographic data display.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Rolling average with AVG window function", "definition": "A 7-day rolling average is calculated using the AVG window function with ROWS BETWEEN 6 PRECEDING AND CURRENT ROW, which includes the current day and the six preceding days, producing a smooth trend line that reduces day-of-week noise. The window function adds a new column to the existing query without changing the row structure, making it straightforward to add to any time-series query.", "syntax": "AVG(col) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)"}, {"category": "Creating Dashboards and Visualizations", "term": "Scheduled dashboard refresh and SQL Alerts", "definition": "Implementing automatic dashboard refresh and threshold-based alerting requires two separate Databricks SQL features. The dashboard scheduled refresh keeps visualisations current by re-executing queries on a defined schedule. The SQL Alert monitors a specific query result against a threshold and sends notifications when the condition is met. These two features operate independently and complement each other.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Multiple Visualizations from One Query", "definition": "A single Databricks SQL query can back multiple visualizations, so an analyst can add two separate visualizations from that one query to a dashboard. There is no need to split the result set, duplicate the query, or use two dashboards.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Markdown Text Boxes", "definition": "Databricks dashboards support Markdown text boxes, which let you add formatted headings and labels to designate sections of a dashboard. Endpoints, queries, and color palettes do not add section text.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Default Visualization Type", "definition": "When a query result has one categorical (string) dimension and one numeric measure, the SQL Editor defaults to a Bar Chart when adding a visualization. Histograms, line, and violin charts are not the default for this shape of result.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Databricks SQL vs. dedicated BI tools", "definition": "Databricks SQL provides quick querying and lightweight visualization right where the data lives. It complements rather than replaces specialized BI platforms like Tableau, Power BI, and Looker, which still lead on rich, presentation-ready dashboards.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Sankey diagram", "definition": "A Sankey diagram is purpose-built to depict flows and transitions between stages, making it ideal for visualizing how users move through a website or process.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Counter visualization", "definition": "A Counter visualization shows a single aggregate value as one large figure, ideal for a headline KPI such as total revenue. Scatter, box, and Sankey charts are instead built for relationships, distributions, and flows.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Funnel visualization", "definition": "A funnel visualization displays sequential stages with decreasing counts, making step-by-step drop-off obvious. A heatmap, box plot, or plain bar chart don't convey staged conversion as clearly.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Date widget parameter", "definition": "A Date widget feeds the selected start and end dates into the query's WHERE clause, filtering the data that backs the chart. It is not merely an axis setting or a label, and by itself it filters only its bound visualization.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Query result cache detection (Query History)", "definition": "Query History records each run, and clicking the query text opens a slideout that indicates whether the results were served from cache. Other tabs do not expose per-query cache status this way.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Line chart requirements", "definition": "An accurate time-series line chart needs a continuous, properly sorted date/time X-axis, plus aggregation of the Y-axis measure when data isn't pre-aggregated to avoid overplotting. Databricks does not auto-interpolate gaps, there is no 'Auto-format' fix, and a scatter plot doesn't resolve ordering or missing data.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Saving a SQL statement as a Query", "definition": "Saving a SQL statement as a Query lets you rerun it, reference it later, and use its results as the basis for counters, tables, and visualizations on dashboards.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Alerts and query parameters", "definition": "Databricks SQL alerts evaluate a single static query result against a threshold. A query that contains a query parameter cannot be used as an alert source, because the parameter's presence — not its type — prevents a single fixed result.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Alert TRIGGERED status", "definition": "When an alert's condition evaluates to true and the monitored value crosses the threshold, Databricks marks the alert TRIGGERED. 'OK' means the condition was not met (healthy), 'SUCCESS' only indicates the execution finished, and 'YES' is not a real alert state.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Named query parameters in the SQL editor", "definition": "Databricks SQL supports named parameters prefixed with a colon (e.g. :region, :year); the editor renders input boxes so you can supply different values and rerun without editing the query. '?' placeholders and notebook variables do not apply to the SQL editor.", "syntax": "SELECT * FROM sales WHERE region = :region AND year = :year"}, {"category": "Creating Dashboards and Visualizations", "term": "Dashboard Parameter", "definition": "Choosing 'Dashboard Parameter' for a visualization's parameter links it to a shared dashboard-level control, so that visualization and every other one using the same parameter update together. It is not frozen, isolated, or converted into a parameter itself.", "syntax": null}, {"category": "Creating Dashboards and Visualizations", "term": "Sharing dashboards via subscribers list", "definition": "Adding stakeholders' email addresses to a dashboard's refresh schedule subscribers list automatically sends them the dashboard on each refresh, with no account needed and no manual work. Granting permissions requires accounts, and emailing PDFs is manual.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "AI/BI Genie", "definition": "A conversational analytics experience that lets business users ask questions in natural language and get answers grounded in Unity Catalog's governed tables and metadata. It is created against a SQL warehouse and respects UC permissions. Column descriptions improve its accuracy.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "AI/BI Genie Space", "definition": "A configured space where Genie answers natural-language questions over a chosen set of governed tables. It is created against a SQL warehouse and honors Unity Catalog permissions. Curating tables and column descriptions improves answer quality.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie Instructions", "definition": "Natural-language notes and rules you add to a Genie space to steer how it interprets questions and generates SQL. They encode business context, preferred logic, and caveats. Good instructions markedly improve answer accuracy.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie Trusted Assets (Example SQL)", "definition": "Certified example queries or SQL functions provided to a Genie space so it answers common questions in a known-correct way. Genie reuses these trusted patterns instead of guessing. They make results more reliable and consistent.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie Sample Questions", "definition": "Curated starter questions attached to a Genie space that show users what they can ask and guide Genie's behavior. They lower the barrier for business users. They also help demonstrate the space's scope.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie Benchmarks", "definition": "A set of question-and-expected-answer pairs used to evaluate and monitor a Genie space's accuracy over time. Running benchmarks helps you maintain quality as data or instructions change. Key to the 'maintaining' part of a Genie space.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Column Descriptions (for Genie)", "definition": "Descriptive metadata on tables and columns that Genie reads to understand what the data means. They can be populated with the AI Generate button in Catalog Explorer. Rich descriptions directly improve Genie's answers.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie Trusted Assets", "definition": "Trusted Assets in a Genie space are pre-validated SQL queries for specific business metrics. When a user asks a question that matches a Trusted Asset, Genie uses the approved query rather than generating its own SQL. This is the correct approach for ensuring critical financial metrics like MRR are always calculated using the approved formula, rather than relying on certified tags or natural-language domain instructions.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie Space Sample Questions", "definition": "Sample questions in a Genie space are example natural language questions manually curated by the administrator to guide users toward the types of questions the space can answer effectively. They appear as clickable prompts on the space home screen. Good sample questions are representative of the target audience's most common analytical needs and demonstrate the phrasing patterns Genie handles best.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie Space Permission Levels", "definition": "Genie spaces have three main permission levels. CAN USE allows asking questions and viewing responses only. CAN EDIT adds modifying instructions, curated queries, and datasets, but cannot add new data sources or manage access. CAN MANAGE gives full control including adding data sources, managing permissions, and all CAN EDIT capabilities. CAN EDIT sits in the middle: not read-only, but not full admin.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "AI/BI Genie Space vs Dashboard", "definition": "Genie spaces differ from AI/BI Dashboards in their interaction model. Dashboards present fixed predefined visualisations for recurring reporting, while Genie spaces provide conversational natural language exploration where users ask questions dynamically and receive AI-generated answers. Genie supports follow-up questions within a session, enabling iterative data exploration without SQL knowledge.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Sharing a Genie Space", "definition": "To make a Genie space available to business users, two things are needed: sharing the space with users by granting CAN USE permission or generating a shareable link, and ensuring the space has curated datasets configured so users have data to query. Without shared access users cannot find or open the space, and without curated datasets the space cannot answer any questions.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Trusted Assets in Genie", "definition": "Trusted Assets are administrator-defined, pre-validated SQL queries added to a Genie space that Genie uses when answering questions about specific business metrics. When a user asks a question that matches a Trusted Asset, Genie uses that pre-approved query rather than generating its own, ensuring consistent and accurate results for key calculations like conversion rate, revenue, or churn.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Improving Genie Space Accuracy", "definition": "Genie space accuracy improves through iterative refinement: monitoring the questions users ask, refining domain-specific instructions, and adding Trusted Assets for key business metrics. Reviewing user question logs identifies where Genie misinterprets intent, and adding clear instructions plus a vetted SQL query as a Trusted Asset ensures correct calculations in future responses. Changing permissions or warehouse size does not improve accuracy.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "CAN MANAGE Permission on Genie Spaces", "definition": "CAN MANAGE is the highest permission level for a Genie space. It grants full administrative control, including editing the space instructions, curated datasets, and trusted assets, as well as sharing the space with other users and managing their permission levels. Users who only need to ask natural language questions require CAN USE (or CAN VIEW) permission instead.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie domain instructions", "definition": "Domain-specific instructions in a Genie space are the correct mechanism for teaching Genie business terminology and metric definitions. Instructions bridge the gap between the natural language terms used by business users and the underlying data model. Defining key terms and their data mappings significantly improves Genie's accuracy for domain-specific questions.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Trusted Assets in Genie Spaces", "definition": "Trusted Assets are the correct mechanism for ensuring critical business metrics with complex calculations are always computed correctly in a Genie space. The administrator writes and validates the SQL query, adds it as a Trusted Asset with a descriptive name, and Genie uses this approved query whenever a matching question is asked. This eliminates the risk of Genie generating incorrect SQL for complex multi-table metrics.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie Space Validation", "definition": "Genie space validation combines manual testing against known correct answers and the use of Trusted Assets for critical metrics. Testing representative questions before launch identifies inaccuracies in how Genie interprets domain terminology and data relationships. Trusted Assets eliminate accuracy risk for the most important metrics by guaranteeing the use of pre-validated SQL. Both actions together form a comprehensive pre-launch validation approach.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie domain instructions and Trusted Assets", "definition": "Ensuring consistent and accurate answers for specific business metrics in Genie requires combining domain instructions with Trusted Assets. Domain instructions define business terminology so Genie correctly interprets terms like churn, while Trusted Assets provide pre-validated SQL queries that Genie uses for those metrics, bypassing its generative SQL where accuracy is critical.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Enforcing business metric definitions in Genie", "definition": "Ensuring Genie uses a specific business definition for a metric requires two complementary configurations. Domain instructions define the terminology so Genie understands what a term such as net revenue means in context, and Trusted Assets provide the pre-validated SQL formula Genie applies to those questions, ensuring business-rule compliance without modifying the underlying data model.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie space configuration components", "definition": "An effective Genie space requires well-annotated datasets registered to Unity Catalog for governed metadata, plus curated sample queries and domain-specific instructions that guide accurate natural-language-to-SQL translation. A dedicated server, replicated external warehouse, or custom chatbot are not needed.", "syntax": null}, {"category": "Developing, Sharing & Maintaining AI/BI Genie Spaces", "term": "Genie sample questions setup", "definition": "To guide a Genie space, use Configure > Context > SQL Queries to define sample natural-language questions paired with their SQL, then review and resolve inconsistencies in the guidance. Notebook-linking, the Description field, and spreadsheet mappings are not the recommended approach.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Medallion Architecture", "definition": "A layered design that refines data through Bronze (raw, as-ingested), Silver (cleaned, joined, validated), and Gold (business-ready aggregates) tables. Each layer improves quality and usability for downstream consumers. Dashboards and reporting typically read from Gold.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Star Schema", "definition": "A dimensional model with a central fact table (measures/events) linked by foreign keys to several denormalized dimension tables (context like date, product, customer). It is simple and fast for analytical queries. The classic model for BI and dashboards.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Snowflake Schema", "definition": "A variation of the star schema where dimension tables are normalized into related sub-tables to reduce redundancy. This saves storage but adds joins and complexity. Use it when dimensions have deep hierarchies.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Fact vs Dimension Table", "definition": "A fact table stores quantitative, measurable events (sales amounts, counts) and foreign keys to dimensions. A dimension table stores descriptive context (who, what, when, where) used to slice those facts. Facts are typically tall and narrow; dimensions are shorter and wider.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Data Vault", "definition": "A modeling approach built from Hubs (business keys), Links (relationships), and Satellites (descriptive, historized attributes). It is designed for auditability, scalability, and handling change over time. More agile for integration than a pure star schema.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Star schema fact and dimension tables", "definition": "In a star schema the central fact table contains numeric measures such as sales amount and quantity, along with foreign keys that reference the primary keys of the surrounding dimension tables. Each dimension table holds descriptive attributes for one dimension of the business, such as customer or product details. All joins go through the fact table, enabling fast aggregation queries.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Snowflake vs Star Schema", "definition": "A snowflake schema extends the star schema by normalising dimension tables into multiple related sub-dimension tables linked by foreign keys, reducing data redundancy at the cost of additional joins. Both have a central fact table. Star schemas are denormalised and optimised for query simplicity and performance, while snowflake schemas prioritise storage efficiency and data integrity.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Data vault Hub table", "definition": "In data vault modelling the three core table types are Hubs, Links, and Satellites. A Hub stores the unique business keys and source metadata (surrogate hash key, load date, record source) for a single business entity, with no descriptive attributes. Links store relationships between Hub entities and Satellites store descriptive attributes and their history.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Star schema fact-to-dimension joins", "definition": "Star schema queries join the central fact table to the required dimension tables using the foreign key to primary key relationships. Dimensions are not directly related to each other, so joins route through the fact table. Descriptive attributes from dimensions replace surrogate keys in the output, GROUP BY on dimension attributes produces the breakdown, and aggregate functions on fact measures calculate the metrics.", "syntax": "SELECT dp.category, dd.month, SUM(fo.revenue) FROM fact_orders fo JOIN dim_product dp ON fo.product_id = dp.product_id JOIN dim_date dd ON fo.date_id = dd.date_id GROUP BY dp.category, dd.month;"}, {"category": "Data Modeling with Databricks SQL", "term": "Star schema analytical advantage", "definition": "The star schema's primary analytical advantage is query simplicity and performance through single-level joins. Because dimension tables are denormalised, joining the fact table to any dimension requires only a single join, unlike normalised transactional schemas where the same information might require chaining multiple joins. This trades storage efficiency for query simplicity, speed, and readability.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Star schema for the Gold layer", "definition": "The Gold layer of the Medallion Architecture hosts business-ready analytical data optimized for BI consumption. A star schema, with fact tables holding pre-aggregated metrics and dimension tables holding descriptive attributes, is the standard modeling approach because it minimizes join complexity, denormalizes for readable queries, and delivers fast aggregation performance for dashboards.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "SCD Type 2 with MERGE INTO", "definition": "Slowly Changing Dimension Type 2 in Delta Lake is implemented with MERGE INTO using conditional logic. When a changed attribute is detected, the MERGE closes the expiring record by setting its end_date and is_current flag to false and inserts a new active row with the updated attributes, maintaining complete row-level change history as multiple rows per entity.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Star vs snowflake schema trade-off", "definition": "The star versus snowflake trade-off is query simplicity and performance versus storage efficiency and normalization integrity. A star schema denormalizes dimension attributes into a single table requiring only one join per dimension from the fact table, while a snowflake schema normalizes dimensions into hierarchies requiring additional joins. For analytical BI workloads where query performance is the priority, star schemas are generally preferred.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Data Vault modelling", "definition": "Data vault modelling is typically positioned in the Silver integration layer of the Medallion Architecture. It provides a highly auditable, source-aligned model using Hub tables for business keys, Link tables for entity relationships, and Satellite tables for historical attributes. This integration layer feeds Gold layer dimensional models such as star schemas optimised for analytical consumption and BI reporting.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Databricks SQL Analytics Tasks", "definition": "Databricks SQL is built for SQL-based analytics, making analysis-specific ETL on cleaned gold-layer tables an ideal use case. Streaming latency tests, churn modeling, and ML monitoring belong to engineering or ML surfaces instead.", "syntax": null}, {"category": "Data Modeling with Databricks SQL", "term": "Star Schema Keys", "definition": "In a star schema, each dimension table has a primary key that the fact table references as a foreign key, creating one-to-many relationships. This lets the central fact table join cleanly with multiple dimension tables for analytics.", "syntax": null}, {"category": "Securing Data", "term": "Unity Catalog", "definition": "Databricks' unified governance layer for all data and AI assets across workspaces. It centralizes access control, auditing, and lineage using a single metastore. It enforces security consistently no matter which tool queries the data.", "syntax": null}, {"category": "Securing Data", "term": "GRANT / REVOKE", "definition": "SQL commands that give or remove privileges (such as SELECT, MODIFY, CREATE) on securable objects to users or groups. The object owner (or a metastore admin) manages permissions. This is how fine-grained access control is applied.", "syntax": "GRANT SELECT ON TABLE sales TO analysts;\nREVOKE SELECT ON TABLE sales FROM marketing;"}, {"category": "Securing Data", "term": "Tags", "definition": "Key-value labels attached to catalogs, schemas, tables, or columns to organize and classify data (for example marking PII). They aid discovery, governance, and policy enforcement. Tags can be set and queried through SQL or the UI.", "syntax": "ALTER TABLE customers SET TAGS ('pii' = 'true');"}, {"category": "Securing Data", "term": "Personal Access Token (PAT)", "definition": "A workspace-scoped credential used to authenticate to Databricks APIs and tools. PATs operate at the workspace level and cannot automate account-level functions. Treat them as secrets.", "syntax": null}, {"category": "Securing Data", "term": "Service Principal", "definition": "A non-human identity used to automate Databricks operations securely, including account-level tasks. It is preferred over personal credentials for jobs and integrations. Permissions are granted to it like any principal.", "syntax": null}, {"category": "Securing Data", "term": "Data Masking / PII Protection", "definition": "Techniques that hide or transform sensitive fields so unauthorized users cannot read raw values. Approaches include column masking, anonymization, and row filtering, governed centrally by Unity Catalog. They protect privacy while keeping data usable.", "syntax": null}, {"category": "Securing Data", "term": "Unity Catalog security best practices", "definition": "Unity Catalog security best practices include assigning object ownership to service principals or groups rather than individual users, which prevents access disruption when employees leave. PII columns should be protected with column masking policies or dynamic views. The principle of least privilege should guide all grants, giving access at the most specific level required rather than broad catalog-level grants.", "syntax": null}, {"category": "Securing Data", "term": "Unity Catalog three-level namespace", "definition": "Unity Catalog organizes all data assets in a three-level namespace: Catalog at the top level, Schema (equivalent to a database) at the second level, and Tables, Views, and Volumes at the third level. This hierarchy enables fine-grained governance across multiple workspaces and cloud environments. Fully qualified references use the pattern catalog.schema.object_name.", "syntax": "SELECT * FROM catalog.schema.table"}, {"category": "Securing Data", "term": "Hierarchical grants in Unity Catalog", "definition": "Unity Catalog requires hierarchical grants across the three-level namespace. To query tables, analysts need USE CATALOG on the catalog, USE SCHEMA on the schema, and SELECT on the tables or all tables in the schema. Granting only SELECT without the USE grants leaves analysts unable to navigate to the objects even if they hold SELECT permission.", "syntax": "GRANT USE CATALOG ON CATALOG prod TO reporting_team;\nGRANT USE SCHEMA ON SCHEMA prod.analytics TO reporting_team;\nGRANT SELECT ON ALL TABLES IN SCHEMA prod.analytics TO reporting_team"}, {"category": "Securing Data", "term": "Unity Catalog Multi-Catalog for Data Mesh", "definition": "Unity Catalog's multi-catalog architecture naturally supports data mesh principles by allowing each business domain to own a dedicated catalog with full administrative control over its data products. Central governance is maintained at the metastore level while domain autonomy is preserved through catalog-level ownership. This separation between platform governance and domain ownership is foundational to a decentralised data mesh.", "syntax": null}, {"category": "Securing Data", "term": "Unity Catalog View Owner Privileges", "definition": "Unity Catalog supports secure view access patterns where a user can query a view without having direct access to the underlying base tables. The view executes with the owner's privileges for base table access, so the querying user only needs SELECT on the view plus USE CATALOG and USE SCHEMA on the namespace. This lets users see only curated or filtered data through views rather than raw tables.", "syntax": "GRANT SELECT ON VIEW my_view TO `analyst`;"}, {"category": "Securing Data", "term": "Row-Level vs Column-Level Security", "definition": "Unity Catalog provides both row-level and column-level security. Row-level security filters visible rows based on user identity using dynamic views or row filter policies. Column-level security controls column value visibility
