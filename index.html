ustering columns without rewriting data, optimizing files incrementally in the background as query patterns evolve, while Hive partitioning needs costly rewrites. Compression, data-type support, and backups aren't its defining advantage.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "A column stored as STRING contains numeric values like '1500', and an analyst needs to sum them numerically. What should they do first?", "type": "single", "options": [{"label": "A", "text": "Use SUM() directly; Databricks auto-converts strings"}, {"label": "B", "text": "Wrap the column in CONCAT()"}, {"label": "C", "text": "Apply TRIM() and then SUM the strings"}, {"label": "D", "text": "CAST the column to an integer or decimal type before summing"}], "correct_answers": ["D"], "explanation": "Casting the string column to a numeric type (CAST(col AS INT) or DECIMAL) lets SUM aggregate the values correctly. Relying on implicit conversion is unsafe, and CONCAT or TRIM don't make the values numeric.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst wants to build two visualizations from a single query and place both on the same Databricks SQL dashboard. What must they do?", "type": "single", "options": [{"label": "A", "text": "Add two separate visualizations based on the same query to the dashboard"}, {"label": "B", "text": "Create two separate dashboards"}, {"label": "C", "text": "Alter the query to return two separate result sets"}, {"label": "D", "text": "Copy the query and create one visualization per copy"}], "correct_answers": ["A"], "explanation": "A single query can back multiple visualizations, so the analyst simply adds two separate visualizations from that one query to the dashboard. There's no need to split the result set, duplicate the query, or use two dashboards.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Unity Catalog & Data Governance", "question": "A data analyst wants to programmatically mark the Unity Catalog table sales_data as deprecated so users across the organization can clearly see it is no longer recommended. Which SQL command should they use?", "type": "single", "options": [{"label": "A", "text": "ALTER TABLE sales_data SET TAGS ('system.certification_status' = 'deprecated');"}, {"label": "B", "text": "UPDATE TABLE sales_data ADD COMMENT 'Deprecated dataset';"}, {"label": "C", "text": "ALTER TABLE sales_data SET TBLPROPERTIES ('system.certification_status' = 'deprecated');"}, {"label": "D", "text": "ALTER TABLE sales_data SET TAGS ('deprecated' = 'true');"}], "correct_answers": ["A"], "explanation": "Unity Catalog conveys certification status through system-controlled tags, so ALTER TABLE ... SET TAGS ('system.certification_status' = 'deprecated') is recognized by Databricks UI and tools as the official deprecated flag. A generic tag lacks the system namespace, a comment isn't a status flag, and TBLPROPERTIES isn't the certification-tag mechanism.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Databricks Workspace & Navigation", "question": "When connecting Power BI and Tableau, what does Partner Connect actually do?", "type": "single", "options": [{"label": "A", "text": "Creates a Personal Access Token for Databricks SQL authentication and emails it to you"}, {"label": "B", "text": "Downloads a connection configuration file for Power BI or Tableau to reach a SQL Warehouse (formerly SQL Endpoint)"}, {"label": "C", "text": "Creates a Personal Access Token, downloads and installs an ODBC driver, and downloads a connection configuration file so Power BI or Tableau can reach a SQL Warehouse (formerly SQL Endpoint)"}, {"label": "D", "text": "Downloads and installs an ODBC driver"}], "correct_answers": ["C"], "explanation": "Partner Connect automates the full BI handshake: it generates a Personal Access Token, installs the ODBC driver, and produces a configuration file so the BI tool can connect to a SQL Warehouse. The other options each cover only part of that.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "Which TWO statements about the WHERE and HAVING clauses in Databricks SQL are correct? (Choose two.)", "type": "multiple", "options": [{"label": "A", "text": "WHERE can reference aggregate functions directly"}, {"label": "B", "text": "HAVING can filter on aggregate results such as COUNT(*)"}, {"label": "C", "text": "HAVING must appear before GROUP BY"}, {"label": "D", "text": "HAVING executes before WHERE"}, {"label": "E", "text": "WHERE filters individual rows before aggregation"}], "correct_answers": ["B", "E"], "explanation": "WHERE filters individual rows before aggregation, while HAVING can filter on aggregate results such as COUNT(*). WHERE cannot reference aggregates, HAVING comes after GROUP BY, and WHERE runs before HAVING.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "An analyst has my_table with a customer_name column and a dollars_spent array column (e.g. [125.34, 100.15, 9003.99]). They want to divide every array value by 100, using: SELECT customer_name, ______ FROM my_table. Which line of code fills the blank?", "type": "single", "options": [{"label": "A", "text": "TRANSFORM(dollars_spent, value -> value / 100) AS hundreds_spent"}, {"label": "B", "text": "TRANSFORM(dollars_spent, dollars_spent / 100) AS hundreds_spent"}, {"label": "C", "text": "TRANSFORM(dollars_spent, value / 100) AS hundreds_spent"}, {"label": "D", "text": "TRANSFORM(hundreds_spent, dollars_spent / 100)"}], "correct_answers": ["A"], "explanation": "TRANSFORM applies a lambda to each array element, with the correct syntax TRANSFORM(array_column, value -> expression) AS new_column. Only the option using the lambda arrow (value -> value / 100) is valid.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Delta Lake & Delta Tables", "question": nt, Testing, Production) using text. Which tool lets them label those sections?", "type": "single", "options": [{"label": "A", "text": "A different color palette per section"}, {"label": "B", "text": "Text typed straight into the dashboard while editing"}, {"label": "C", "text": "A separate endpoint per section"}, {"label": "D", "text": "A separate query per section"}, {"label": "E", "text": "Markdown-based text boxes"}], "correct_answers": ["E"], "explanation": "Databricks dashboards support Markdown text boxes, which let you add formatted headings and labels to designate sections. Endpoints, queries and color palettes don't add section text.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Databricks SQL & Warehouses", "question": "Where in the Databricks SQL workspace does an analyst set a refresh schedule for a query that isn't tied to a dashboard or alert?", "type": "single", "options": [{"label": "A", "text": "The Dashboard Editor"}, {"label": "B", "text": "Data Explorer"}, {"label": "C", "text": "The Visualization Editor"}, {"label": "D", "text": "The Query Editor"}], "correct_answers": ["D"], "explanation": "Any saved query can be scheduled directly from the Query Editor, independent of whether it's used in a dashboard or alert.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "Databricks Workspace & Navigation", "question": "An analyst wants to browse a table's schema, preview sample rows, and review its permissions through a point-and-click interface. Which Databricks tool provides this?", "type": "single", "options": [{"label": "A", "text": "The Query Profiler"}, {"label": "B", "text": "Catalog Explorer (Data Explorer)"}, {"label": "C", "text": "Auto Loader"}, {"label": "D", "text": "The notebook revision history"}], "correct_answers": ["B"], "explanation": "Catalog Explorer lets you visually inspect schema, sample data, and permissions for catalog objects. The Query Profiler analyzes execution, Auto Loader ingests files, and revision history tracks notebook edits.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "Data Ingestion & Streaming", "question": "A data analyst needs to automate scheduled ETL jobs that ingest and transform data from multiple sources, wants flexibility to use multiple programming languages, and needs the pipeline to handle schema changes automatically as new data arrives. Which Databricks approach meets this?", "type": "single", "options": [{"label": "A", "text": "Databricks Workflows with Apache Spark notebooks and manual schema management."}, {"label": "B", "text": "Separate Delta tables for each data source with fixed schemas."}, {"label": "C", "text": "Lakeflow Spark Declarative Pipelines with Auto Loader."}, {"label": "D", "text": "Unity Catalog with manual ETL scripts and cron-based scheduling."}], "correct_answers": ["C"], "explanation": "Lakeflow Spark Declarative Pipelines with Auto Loader automate scheduling, support multiple languages, and handle schema evolution automatically as new data arrives. The other options require manual schema handling, extra scripting, or fixed schemas that can't adapt.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Databricks SQL & Warehouses", "question": "Which data project is a common analytics task best done in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Performing analysis-specific ETL on gold-layer tables"}, {"label": "B", "text": "Testing the latency of real-time streaming workloads"}, {"label": "C", "text": "Monitoring the performance of deployed machine learning solutions"}, {"label": "D", "text": "Predicting customer churn by automatically building time-series models"}], "correct_answers": ["A"], "explanation": "Databricks SQL is built for SQL-based analytics, so doing analysis-specific ETL on cleaned gold-layer tables fits it well. Streaming latency tests, churn modeling and ML monitoring belong to engineering or ML surfaces.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Databricks Workspace & Navigation", "question": "A data analyst wants to draw insights from large, complex datasets. They need to rapidly grasp what each column means, pose questions in plain language, and get AI-based suggestions for improving queries and workflows. Which Databricks component chiefly delivers these abilities?", "type": "single", "options": [{"label": "A", "text": "Databricks Assistant"}, {"label": "B", "text": "Data Intelligence Engine"}, {"label": "C", "text": "Unity Catalog"}, {"label": "D", "text": "Genie Spaces"}], "correct_answers": ["B"], "explanation": "The Data Intelligence Engine catalogs assets, infers schema and semantics, and powers natural-language search plus AI query/workflow recommendations across the lakehouse. Unity Catalog handles governance, Genie answers questions within a defined space, and the Assistant focuses on in-editor coding help.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "Data Modeling & Architecture", "question": "A company uses a star schema to analyze sales: a sales fact table records transactions, with products, stores, and dates as dimension tables. How are primary and foreign keys used to enable efficient joins between these tables?", "type": "single", "options": [{"label": "A", "text": "The fact and dimension tables are joined on arbitrary columns; primary/foreign key relationships aren't required in a star schema."}, {"label": "B", "text": "Each dimension table has a primary key referenced as a foreign key in the fact table, so the fact table can join with multiple dimensions for analytics."}, {"label": "C", "text": "Both fact and dimension tables use only foreign keys, with joins on non-unique columns."}, {"label": "D", "text": "The fact table holds primary keys that directly match the primary keys in each dimension table, allowing one-to-one joins."}], "correct_answers": ["B"], "explanation": "Each dimension table has a primary key that the fact table references as a foreign key, creating one-to-many relationships that let the fact table join cleanly to every dimension. The other options misdescribe the keys as arbitrary, one-to-one, or non-unique.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Query Optimization & Performance", "question": "An analyst is sharing the benefits of Query History with their team, but one statement is wrong. Which statement about Query History is incorrect?", "type": "single", "options": [{"label": "A", "text": "It can be used to troubleshoot slow-running queries"}, {"label": "B", "text": "It can be used to view the query plan of queries that have run"}, {"label": "C", "text": "It can be used to debug queries"}, {"label": "D", "text": "It can be used to automate query execution across multiple warehouses"}], "correct_answers": ["D"], "explanation": "Query History is a read-only audit and diagnostics view; it does not schedule or automate query execution across warehouses. It does let you inspect query plans, debug, and troubleshoot slow queries.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "An analyst needs the top 5 customers by total spend over the last 30 days from a sales table. Which Databricks SQL statement is correct?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_id, SUM(price) AS total_spent FROM sales WHERE date >= DATEADD(day,-30,GETDATE()) GROUP BY customer_id ORDER BY total_spent DESC LIMIT 5;"}, {"label": "B", "text": "SELECT customer_id, SUM(price) AS total_spent FROM sales WHERE date >= DATEADD(day,-30,GETDATE()) GROUP BY customer_id HAVING total_spent > 0 ORDER BY total_spent DESC LIMIT 5;"}, {"label": "C", "text": "SELECT customer_id, SUM(price) AS total_spent FROM sales WHERE date BETWEEN DATEADD(day,-30,GETDATE()) AND GETDATE() GROUP BY customer_id ORDER BY total_spent DESC LIMIT 5;"}, {"label": "D", "text": "SELECT TOP 5 customer_id, SUM(price) AS total_spent FROM sales WHERE date >= DATEADD(day,-30,GETDATE()) GROUP BY customer_id ORDER BY total_spent DESC;"}], "correct_answers": ["A"], "explanation": "Databricks SQL uses LIMIT (not TOP) to cap rows, and filtering with date >= DATEADD(day,-30,...) plus GROUP BY and ORDER BY total_spent DESC returns the top 5 spenders. BETWEEN ... GETDATE() includes today's endpoint and the HAVING filter is unnecessary.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst creates a Databricks SQL query whose result schema is region STRING, number_of_customers INT. When they click 'Add visualization' in the SQL Editor, which visualization type is selected by default?", "type": "single", "options": [{"label": "A", "text": "Bar Chart"}, {"label": "B", "text": "Violin Chart"}, {"label": "C", "text": "Line Chart"}, {"label": "D", "text": "Histogram"}], "correct_answers": ["A"], "explanation": "With one categorical (string) dimension and one numeric measure, the SQL Editor defaults to a Bar Chart. Histograms, line, and violin charts aren't the default for this shape of result.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "Unity Catalog & Data Governance", "question": "A data analyst in a Unity Catalog workspace runs SELECT * FROM sales_data; on a shared SQL Warehouse and gets TABLE_OR_VIEW_NOT_FOUND, even though the table exists in corp_data.reporting, the analyst has SELECT and USAGE on it, and another user querying from a cluster-attached notebook succeeds without full qualification. Which action resolves this without rewriting the query?", "type": "single", "options": [{"label": "A", "text": "Set spark.databricks.sql.initial.catalog.namespace on the cluster attached to the SQL Warehouse."}, {"label": "B", "text": "Set spark.sql.default.database to corp_data.reporting.sales_data in the warehouse runtime config."}, {"label": "C", "text": "Run USE CATALOG corp_data; USE SCHEMA reporting; to set the session default catalog and schema."}, {"label": "D", "text": "Change the workspace-level catalog default so all SQL Warehouses point to corp_data.reporting."}], "correct_answers": ["C"], "explanation": "Unqualified names resolve against the session's current catalog/schema, so USE CATALOG corp_data; USE SCHEMA reporting; makes the query resolve for this session only, with no rewrite or workspace change.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "AI/BI Dashboards & Visualization", "question": "How is Databricks SQL best positioned relative to dedicated BI tools such as Tableau, Power BI, and Looker?", "type": "single", "options": [{"label": "A", "text": "As a complementary tool aimed at presentation-grade deliverables"}, {"label": "B", "text": "As a replacement that offers less capability"}, {"label": "C", "text": "As a complete replacement that adds extra capability"}, {"label": "D", "text": "As a like-for-like replacement offering identical functionality"}, {"label": "E", "text": "As a complementary tool for fast, in-platform BI work"}], "correct_answers": ["E"], "explanation": "Databricks SQL gives quick querying and lightweight visualization right where the data lives, complementing rather than replacing specialized BI platforms that still lead on rich, presentation-ready dashboards.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Data Modeling & Architecture", "question": "An architect tells an analyst team they'll adopt a pattern that logically organizes lakehouse data and progressively improves its structure and quality as it flows through each layer. What is this pattern called?", "type": "single", "options": [{"label": "A", "text": "Data mesh"}, {"label": "B", "text": "Medallion architecture"}, {"label": "C", "text": "Delta Lake"}, {"label": "D", "text": "Change data feed"}], "correct_answers": ["B"], "explanation": "Landing raw data and progressively refining it through bronze, silver and gold layers describes the medallion architecture, a layered lakehouse design pattern.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "An analyst wants customers who have placed at least one order, checking existence rather than returning order data. Which construct is most appropriate?", "type": "single", "options": [{"label": "A", "text": "A UNION of both tables"}, {"label": "B", "text": "A CROSS JOIN"}, {"label": "C", "text": "A correlated EXISTS subquery"}, {"label": "D", "text": "A GROUP BY with COUNT(*) = 0"}], "correct_answers": ["C"], "explanation": "A correlated EXISTS subquery efficiently tests whether at least one matching order exists for each customer without returning order columns.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst must build a visualization showing how users flow through a website. Which chart type is designed for that kind of flow?", "type": "single", "options": [{"label": "A", "text": "Pivot Table"}, {"label": "B", "text": "Heatmap"}, {"label": "C", "text": "Sankey"}, {"label": "D", "text": "Word Cloud"}, {"label": "E", "text": "Choropleth"}], "correct_answers": ["C"], "explanation": "Sankey diagrams are purpose-built to depict flows and transitions between stages, making them ideal for visualizing how users move through a website.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "Query Optimization & Performance", "question": "A data analyst is debugging a Databricks SQL query that fails on large datasets with complex joins, with logs showing repeated aborts from resource-constraint errors on the cluster. Which Query Profile metric helps identify the operator causing resource overuse?", "type": "single", "options": [{"label": "A", "text": "Shuffle read size per operator"}, {"label": "B", "text": "Memory peak per operator"}, {"label": "C", "text": "Time spent per operator"}, {"label": "D", "text": "Bytes spilled to disk per operator"}], "correct_answers": ["B"], "explanation": "Resource-constraint aborts indicate memory exhaustion, so Memory peak per operator reveals which operator consumed the most RAM and needs tuning; shuffle, time, and disk spill are movement, duration, or symptoms rather than the direct memory culprit.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "Unity Catalog & Data Governance", "question": "An analyst needs to give a reporting group read-only access to a specific table. Which SQL command grants this?", "type": "single", "options": [{"label": "A", "text": "GRANT MODIFY ON TABLE sales TO report_group"}, {"label": "B", "text": "GRANT OWNERSHIP ON TABLE sales TO report_group"}, {"label": "C", "text": "GRANT ALL PRIVILEGES ON TABLE sales TO report_group"}, {"label": "D", "text": "GRANT SELECT ON TABLE sales TO report_group"}], "correct_answers": ["D"], "explanation": "GRANT SELECT provides read-only access, the least privilege needed for reporting. MODIFY allows writes, ALL PRIVILEGES is excessive, and OWNERSHIP transfers control of the object.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "AI/BI Dashboards & Visualization", "question": "A dashboard must prominently display a single KPI: total revenue this month, as one large number. Which visualization type is most appropriate?", "type": "single", "options": [{"label": "A", "text": "Scatter plot"}, {"label": "B", "text": "Box plot"}, {"label": "C", "text": "Counter"}, {"label": "D", "text": "Sankey"}], "correct_answers": ["C"], "explanation": "A Counter visualization shows a single aggregate value as one large figure, ideal for a headline KPI. Scatter, box, and Sankey charts are built for relationships, distributions, and flows.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "Delta Lake & Delta Tables", "question": "Which open-source project enables the data lakehouse by adding organization, reliability, performance, and governance to data lake architectures?", "type": "single", "options": [{"label": "A", "text": "Delta Lake"}, {"label": "B", "text": "Apache Spark"}, {"label": "C", "text": "MLflow"}, {"label": "D", "text": "Databricks SQL"}], "correct_answers": ["A"], "explanation": "Delta Lake is the open-source storage layer that sits on top of a data lake and brings warehouse-grade reliability, performance and governance, the foundation of the lakehouse pattern.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst wants to show how many users progress through each step of a checkout process, highlighting drop-off. Which visualization fits best?", "type": "single", "options": [{"label": "A", "text": "Funnel"}, {"label": "B", "text": "Bar chart of totals"}, {"label": "C", "text": "Heatmap"}, {"label": "D", "text": "Box plot"}], "correct_answers": ["A"], "explanation": "A funnel visualization displays sequential stages with decreasing counts, making step-by-step drop-off obvious, which a heatmap, box plot, or plain bar chart don't convey as clearly.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "Data Modeling & Architecture", "question": "A data analyst needs a sales report joining a Unity Catalog-managed table with a table in a MySQL database. The join should be efficient, run inside Databricks, and be governed by Unity Catalog permissions and lineage. Which approach meets these requirements?", "type": "single", "options": [{"label": "A", "text": "Fully ingest the MySQL table into Databricks as a new Delta table before joining."}, {"label": "B", "text": "Register the MySQL table as a temporary view via a standard Spark JDBC read, then join it in Databricks SQL."}, {"label": "C", "text": "Write a Python script to connect to both sources, download the data, and join in memory outside Databricks."}, {"label": "D", "text": "Use Lakehouse Federation to create a foreign catalog for MySQL, then write a SQL query joining the Delta table and the federated MySQL table directly in Databricks."}], "correct_answers": ["D"], "explanation": "Lakehouse Federation exposes MySQL as a foreign catalog so the join runs natively in Databricks with Unity Catalog permissions, auditing, and lineage and no data movement. Other options lose governance or duplicate data.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "AI/BI Dashboards & Visualization", "question": "A dashboard has a bar chart with a Date widget parameter attached. Which statement about that Date widget parameter is true?", "type": "single", "options": [{"label": "A", "text": "It supplies a start and end date that sets the chart's x-axis range"}, {"label": "B", "text": "It acts only as a text box telling users which date range the dashboard is using"}, {"label": "C", "text": "It supplies a start and end date that filters every visualization on the dashboard"}, {"label": "D", "text": "It supplies a start and end date that a WHERE clause in the chart's underlying query uses"}], "correct_answers": ["D"], "explanation": "A Date widget feeds the selected start and end dates into the query's WHERE clause, filtering the data that backs the chart. It is not merely an axis setting or a label, and by itself it filters only its bound visualization.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Analytics Fundamentals", "question": "Which statement best describes descriptive statistics?", "type": "single", "options": [{"label": "A", "text": "A branch of statistics inferring properties of an underlying probability distribution"}, {"label": "B", "text": "A branch of statistics using summary statistics to quantitatively describe and summarize data"}, {"label": "C", "text": "A branch of statistics restricted to variables with a finite or countably infinite set of values"}, {"label": "D", "text": "A branch of statistics using summary statistics to categorically describe data"}], "correct_answers": ["B"], "explanation": "Descriptive statistics summarize and quantitatively describe a dataset using measures like mean, median, and spread. Inferring an underlying distribution is inferential statistics.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Unity Catalog & Data Governance", "question": "An analyst finds a column containing PII that they shouldn't have access to. How should they proceed?", "type": "single", "options": [{"label": "A", "text": "Stop working with the data and delete the table along with any metadata or data files"}, {"label": "B", "text": "Stop working with the data and notify their supervisor so it's handled per organizational and legal best practices"}, {"label": "C", "text": "Drop the PII column and continue the project without telling anyone"}, {"label": "D", "text": "Stop working with the data and continue the project using other data"}], "correct_answers": ["B"], "explanation": "The correct response is to stop and escalate to a supervisor so the PII is handled according to company policy and the law. Deleting data or quietly working around it bypasses proper governance.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Databricks SQL & Warehouses", "question": "Which of the following statements about a refresh schedule is FALSE?", "type": "single", "options": [{"label": "A", "text": "A refresh schedule is not the same thing as an alert"}, {"label": "B", "text": "A query can be refreshed on intervals ranging from 1 minute to 2 weeks"}, {"label": "C", "text": "Configuring a refresh schedule requires workspace administrator privileges"}, {"label": "D", "text": "A scheduled refresh consumes a SQL Warehouse (formerly SQL Endpoint) when it runs"}, {"label": "E", "text": "Refresh schedules can be set up in the Query Editor"}], "correct_answers": ["C"], "explanation": "The false claim is that admin privileges are required; regular users can configure refresh schedules on their own queries. The other statements accurately describe how refresh schedules behave.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "The stakeholders.customers table has 15 columns and 3,000 rows. An analyst runs CREATE TEMP VIEW stakeholders.eur_customers AS SELECT * FROM stakeholders.customers WHERE continent = 'eur'; and SELECT * FROM stakeholders.eur_customers returns 15 rows. The analyst then logs out and logs back in two days later. What is the status of the eur_customers view now?", "type": "single", "options": [{"label": "A", "text": "The view is gone from the metastore, but the data is reachable via SELECT * FROM delta.`stakeholders.eur_customers`"}, {"label": "B", "text": "The view remains but SELECT returns an empty set because view data is auto-deleted at logout"}, {"label": "C", "text": "The view remains and SELECT * FROM stakeholders.eur_customers runs correctly"}, {"label": "D", "text": "The view has been dropped"}, {"label": "E", "text": "The view was converted into a table"}], "correct_answers": ["D"], "explanation": "A TEMP (temporary) view exists only for the session that created it and is dropped automatically when that session ends, so after logging out and back in it is gone.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Databricks SQL & Warehouses", "question": "A scheduled query runs every four hours on a SQL endpoint, but each run wastes time waiting for the endpoint to spin up. Which change cuts that start-up delay while still keeping costs in check?", "type": "single", "options": [{"label": "A", "text": "Shrink the SQL endpoint cluster size"}, {"label": "B", "text": "Grow the SQL endpoint cluster size"}, {"label": "C", "text": "Disable the Auto stop feature"}, {"label": "D", "text": "Switch to a Serverless SQL endpoint"}, {"label": "E", "text": "Raise the minimum scaling value"}], "correct_answers": ["D"], "explanation": "Serverless SQL endpoints start almost instantly because the compute is pre-provisioned by Databricks, removing the cold-start wait without forcing you to keep a cluster running. The other options either raise cost or don't address start-up time.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Delta Lake & Delta Tables", "question": "Which Databricks SQL action is used to audit and view the history of operations performed on a Delta Lake table?", "type": "single", "options": [{"label": "A", "text": "Use the SHOW TRANSACTIONS table_name command."}, {"label": "B", "text": "Run a SELECT logs FROM table_name query."}, {"label": "C", "text": "Use the DESCRIBE HISTORY table_name command."}, {"label": "D", "text": "Execute a VACUUM table_name statement."}], "correct_answers": ["C"], "explanation": "DESCRIBE HISTORY table_name shows the full transaction history of a Delta table (INSERT, UPDATE, DELETE, MERGE, schema changes, timestamps, and user info) and is the primary way to audit changes. The other commands don't exist for this purpose or do something unrelated.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "An analyst must determine, in one statement, which customers have placed an order in the past year and which have not, by joining the customers table (unique by customer ID) with the orders table. Which join type should they use?", "type": "single", "options": [{"label": "A", "text": "Left Semi Join"}, {"label": "B", "text": "Middle Join"}, {"label": "C", "text": "Left Anti Join"}, {"label": "D", "text": "Left Join"}], "correct_answers": ["D"], "explanation": "A Left Join returns every customer along with their matching orders, filling nulls where there's no match, letting you see both customers who ordered and those who didn't. Semi/Anti joins return only one of the two groups.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "An analyst wants a two-column output of customer_name and number_of_orders (for example John Doe / 388, Zhang San / 234). Which statement produces it?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_name, count(order_id) AS number_of_orders FROM customers JOIN orders ON customers.customer_id = orders.customer_id GROUP BY customer_name;"}, {"label": "B", "text": "SELECT customer_name, count(order_id) AS number_of_orders FROM customers JOIN orders ON customers.customer_id = orders.customer_id;"}, {"label": "C", "text": "SELECT customer_name, count(order_id) FROM customers JOIN orders ON customers.customer_id = orders.customer_id GROUP BY customer_name;"}, {"label": "D", "text": "SELECT customer_name, (order_id) number_of_orders FROM customers JOIN orders ON customers.customer_id = orders.customer_id;"}, {"label": "E", "text": "SELECT customer_name, count(order_id) number_of_orders FROM customers JOIN orders ON customers.customer_id = orders.customer_id USE customer_name;"}], "correct_answers": ["A"], "explanation": "You need count(order_id) to total orders per customer, GROUP BY customer_name to aggregate by person, and the alias AS number_of_orders to name the column. Choices missing GROUP BY don't aggregate, and the USE clause is invalid syntax.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "SQL Basics & Syntax", "question": "An analyst is asked to count customers per region and writes: SELECT region, count(*) AS number_of_customers FROM customers ORDER BY region; If there's a mistake, which statement describes it?", "type": "single", "options": [{"label": "A", "text": "The query is missing a GROUP BY region clause"}, {"label": "B", "text": "Using ORDER BY is not allowed in an aggregation"}, {"label": "C", "text": "count(*) will count every customer regardless of region"}, {"label": "D", "text": "There is no mistake in the query"}, {"label": "E", "text": "region is selected but should appear only in ORDER BY"}], "correct_answers": ["A"], "explanation": "Whenever you select a non-aggregated column (region) alongside an aggregate like count(*), you must group by that column. The query is missing GROUP BY region.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Unity Catalog & Data Governance", "question": "A data analyst using Unity Catalog has datasets tagged by sensitivity, with confidential data marked by the tag key confidential. They want to quickly find all tables tagged confidential in the workspace search bar to review access permissions. Which search text should they use?", "type": "single", "options": [{"label": "A", "text": "search tag = 'confidential'"}, {"label": "B", "text": "tag-confidential"}, {"label": "C", "text": "tag:confidential"}, {"label": "D", "text": "confidential:true"}], "correct_answers": ["C"], "explanation": "The workspace search bar supports the tag: operator, so tag:confidential finds all assets carrying that tag key. Boolean forms like confidential:true aren't evaluated as tag filters, and the hyphen and equals-sign forms aren't valid search syntax.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "Unity Catalog & Data Governance", "question": "A dataset contains PII columns that multiple teams will use for reports, but some teams must not see the sensitive columns. The data must be stored securely and PII protected per organizational standards in Databricks. Which action secures the PII while still allowing safe reporting access?", "type": "single", "options": [{"label": "A", "text": "Grant SELECT on the required data subset of the base table to all report writers."}, {"label": "B", "text": "Mask the PII by obfuscating it in the source table before any analysis."}, {"label": "C", "text": "Use Dynamic Views with IS_MEMBER() to restrict PII columns based on user roles."}, {"label": "D", "text": "Store the PII in a shared CSV on DBFS and apply folder-level access control."}], "correct_answers": ["C"], "explanation": "Dynamic views with IS_MEMBER() expose non-PII columns to unprivileged users while the base table keeps full PII, evaluating the caller's role at query time. Masking the source destroys data, broad SELECT grants over-expose, and a DBFS CSV abandons Unity Catalog controls.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "An analyst wants to label each order as 'High', 'Medium', or 'Low' based on its amount within the SELECT. Which SQL construct does this inline?", "type": "single", "options": [{"label": "A", "text": "A CASE WHEN expression"}, {"label": "B", "text": "A WHERE filter"}, {"label": "C", "text": "A HAVING clause"}, {"label": "D", "text": "A GROUP BY rollup"}], "correct_answers": ["A"], "explanation": "A CASE WHEN expression evaluates conditions row by row and returns the matching label, ideal for bucketing values inline. HAVING and WHERE filter rows rather than label them, and GROUP BY ROLLUP aggregates.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "Databricks SQL & Warehouses", "question": "Which TWO actions help reduce the running cost of a SQL Warehouse? (Choose two.)", "type": "multiple", "options": [{"label": "A", "text": "Increase the warehouse t-shirt size permanently"}, {"label": "B", "text": "Disable the result cache"}, {"label": "C", "text": "Lower the maximum cluster count for scaling"}, {"label": "D", "text": "Raise the auto-stop timeout to several hours"}, {"label": "E", "text": "Enable Auto stop so the warehouse shuts down when idle"}], "correct_answers": ["C", "E"], "explanation": "Auto stop halts an idle warehouse so you stop paying for unused compute, and lowering the maximum cluster count caps how far it scales out. A larger size and a longer idle timeout both raise cost, and disabling the result cache forces redundant recomputation.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "An analyst runs a complex aggregation on a table with no null values and gets a result containing: a grand-total row (group_1 and group_2 both null), subtotals for each group_1 value (group_2 null), subtotals for each group_2 value (group_1 null), and every detailed group_1/group_2 combination. Which query produced this?", "type": "single", "options": [{"label": "A", "text": "SELECT group_1, group_2, count(values) AS count FROM my_table GROUP BY group_1, group_2;"}, {"label": "B", "text": "SELECT group_1, group_2, count(values) AS count FROM my_table GROUP BY group_1, group_2 INCLUDING NULL;"}, {"label": "C", "text": "SELECT group_1, group_2, count(values) AS count FROM my_table GROUP BY group_1, group_2 WITH CUBE;"}, {"label": "D", "text": "SELECT group_1, group_2, count(values) AS count FROM my_table GROUP BY group_1, group_2, (group_1, group_2);"}, {"label": "E", "text": "SELECT group_1, group_2, count(values) AS count FROM my_table GROUP BY group_1, group_2 WITH ROLLUP;"}], "correct_answers": ["C"], "explanation": "Subtotals exist for group_1 alone AND group_2 alone, plus the grand total, so every grouping combination is present. WITH CUBE generates all combinations; WITH ROLLUP would only give group_1 subtotals and the grand total.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Data Ingestion & Streaming", "question": "An analyst repeatedly loads new CSV files from a cloud folder into an existing Delta table and wants an idempotent, incremental load that skips files already processed. Which command fits best?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE AS SELECT"}, {"label": "B", "text": "INSERT OVERWRITE"}, {"label": "C", "text": "COPY INTO"}, {"label": "D", "text": "SELECT INTO"}], "correct_answers": ["C"], "explanation": "COPY INTO incrementally ingests only new files from a location into a Delta table and tracks what it has already loaded, making re-runs idempotent. INSERT OVERWRITE replaces everything, CTAS recreates the table, and SELECT INTO isn't valid Databricks SQL.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "Analytics Fundamentals", "question": "Which description fits descriptive statistics?", "type": "single", "options": [{"label": "A", "text": "A branch of statistics that uses summary statistics to categorically describe and summarize data"}, {"label": "B", "text": "A branch of statistics that infers properties of an underlying probability distribution from data"}, {"label": "C", "text": "A branch of statistics dealing with quantitative variables taking an uncountable set of values"}, {"label": "D", "text": "A branch of statistics that uses summary statistics to quantitatively describe and summarize data"}, {"label": "E", "text": "A branch of statistics dealing with quantitative variables limited to a finite or countably infinite set of values"}], "correct_answers": ["D"], "explanation": "Descriptive statistics summarizes data quantitatively using measures like mean, median and standard deviation. Inferring properties of an underlying distribution is inferential statistics, a different branch.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Data Modeling & Architecture", "question": "A database is created with: CREATE SCHEMA accounting LOCATION 'dbfs:/accounting/data'; Where will this database's data be stored?", "type": "single", "options": [{"label": "A", "text": "dbfs:/accounting/data/accounting.db"}, {"label": "B", "text": "dbfs:/accounting/data"}, {"label": "C", "text": "dbfs:/accounting/data.db"}, {"label": "D", "text": "dbfs:/user/hive/warehouse/accounting.db"}], "correct_answers": ["B"], "explanation": "Because the CREATE SCHEMA statement includes an explicit LOCATION clause, the database directory is created at exactly that path: dbfs:/accounting/data. The default Hive warehouse path only applies when no LOCATION is specified, and Databricks does not append a schema-name suffix or a .db extension to an explicitly provided location.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "Databricks Workspace & Navigation", "question": "Which Databricks SQL benefit does Data Explorer deliver?", "type": "single", "options": [{"label": "A", "text": "Running UPDATE queries against any table in a database"}, {"label": "B", "text": "Building visualizations to share with stakeholders"}, {"label": "C", "text": "Producing dashboards for data exploration"}, {"label": "D", "text": "Viewing metadata and data plus viewing and changing permissions"}, {"label": "E", "text": "Connecting to third-party BI tools"}], "correct_answers": ["D"], "explanation": "Data Explorer is a UI for data discovery and governance: it lets you inspect metadata and data and manage permissions. Running updates, building dashboards/visualizations, and BI connections are handled elsewhere.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "A retailer needs total revenue per store for January from a purchase table. Which SQL statement returns the correct results?", "type": "single", "options": [{"label": "A", "text": "SELECT store_id, SUM(total_sales) AS revenue FROM purchase WHERE date BETWEEN '2023-01-01' AND '2023-01-31' GROUP BY store_id ORDER BY revenue DESC LIMIT 5;"}, {"label": "B", "text": "SELECT store_id, SUM(total_sales) AS revenue FROM purchase WHERE date >= '2023-01-01' AND date <= '2023-01-31' GROUP BY store_id HAVING revenue > 0 ORDER BY revenue ASC;"}, {"label": "C", "text": "SELECT store_id, SUM(total_sales) AS revenue FROM purchase WHERE date >= '2023-01-01' AND date <= '2023-01-31' GROUP BY store_id HAVING revenue > 0 ORDER BY revenue DESC;"}, {"label": "D", "text": "SELECT store_id, SUM(total_sales) AS revenue FROM purchase WHERE date >= '2023-01-01' AND date <= '2023-01-31' GROUP BY store_id ORDER BY revenue DESC;"}], "correct_answers": ["D"], "explanation": "Filtering the January date range, grouping by store_id, summing sales, and ordering DESC gives each store's total revenue highest-first. The LIMIT 5 caps results unnecessarily, ASC reverses the requested order, and the HAVING filters aren't needed.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "An analysis team finds that table_bronze is the source of duplicate downstream data. Which query removes the duplicates from table_bronze and writes the unique rows to a new table_silver?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE table_silver AS INSERT * FROM table_bronze;"}, {"label": "B", "text": "INSERT OVERWRITE TABLE table_silver SELECT * FROM table_bronze;"}, {"label": "C", "text": "CREATE TABLE table_silver AS MERGE DEDUPLICATE * FROM table_bronze;"}, {"label": "D", "text": "CREATE TABLE table_silver AS SELECT DISTINCT * FROM table_bronze;"}, {"label": "E", "text": "INSERT INTO TABLE table_silver SELECT * FROM table_bronze;"}], "correct_answers": ["D"], "explanation": "SELECT DISTINCT * returns only unique rows, and wrapping it in CREATE TABLE ... AS materializes those deduplicated rows into table_silver. The other options either aren't valid syntax or don't deduplicate.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Data Ingestion & Streaming", "question": "Which approach lets you ingest data directly from cloud-based object storage in Databricks?", "type": "single", "options": [{"label": "A", "text": "Create an external table specifying the object storage path with LOCATION"}, {"label": "B", "text": "Create an external table specifying the DBFS storage path with FROM"}, {"label": "C", "text": "Direct ingestion from cloud object storage is not possible"}, {"label": "D", "text": "Create an external table specifying the object storage path with PATH"}], "correct_answers": ["A"], "explanation": "An external table that references the object storage path via the LOCATION clause reads data directly from cloud storage without copying it. The DBFS/FROM variants and PATH use the wrong clause, and direct ingestion from object storage is fully supported.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Databricks Workspace & Navigation", "question": "Among the various roles on the Databricks Lakehouse Platform, which one uses Databricks SQL as its primary service?", "type": "single", "options": [{"label": "A", "text": "Data scientist"}, {"label": "B", "text": "Data engineer"}, {"label": "C", "text": "Platform architect"}, {"label": "D", "text": "Business analyst"}], "correct_answers": ["D"], "explanation": "Business analysts mainly run ad-hoc queries, build reports and create dashboards, all SQL-centric work, so Databricks SQL is their primary tool. The other roles primarily live in engineering or data science surfaces.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "Data Ingestion & Streaming", "question": "A data analyst team wants reliable, production-grade pipelines on Databricks where they can define transformations declaratively, automatically enforce data-quality expectations, and handle errors without manual steps. Which Databricks capability fits these needs?", "type": "single", "options": [{"label": "A", "text": "Lakeflow Jobs"}, {"label": "B", "text": "Lakeflow Spark Declarative Pipelines"}, {"label": "C", "text": "Lakeflow Tables"}, {"label": "D", "text": "Lakeflow Connect"}], "correct_answers": ["B"], "explanation": "Lakeflow Spark Declarative Pipelines let you define transformations declaratively, enforce data-quality rules automatically at each stage, and route failed expectations to fallback actions without code changes. Jobs schedule work and Connect handles ingestion, neither providing this declarative quality model.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "Unity Catalog & Data Governance", "question": "An analyst wants governed access to external datasets and analytics assets to enrich lakehouse reporting, using Databricks with Unity Catalog, without complex ETL or replication. What is the benefit of using Databricks Marketplace here?", "type": "single", "options": [{"label": "A", "text": "It enables scheduling ETL pipelines to load partner data into proprietary formats before use."}, {"label": "B", "text": "It lets the analyst copy external datasets into their workspace for offline analysis, removing dependency on provider access."}, {"label": "C", "text": "It enables direct, governed access to live external data, notebooks, models, and dashboards via Delta Sharing, without data replication."}, {"label": "D", "text": "It offers a marketplace for buying compute and serverless SQL warehouses managed outside Unity Catalog."}], "correct_answers": ["C"], "explanation": "Databricks Marketplace delivers live external assets shared through Delta Sharing and governed by Unity Catalog policies, queried in place with no replication or ETL. The other options describe buying compute, building ETL, or copying data offline, none of which is the Marketplace benefit.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Query Optimization & Performance", "question": "A data analyst must quickly estimate the number of unique user sessions in a billion-record dataset in Databricks SQL, balancing efficiency against acceptable accuracy. What is the main advantage of APPROX_COUNT_DISTINCT over COUNT_DISTINCT here?", "type": "single", "options": [{"label": "A", "text": "APPROX_COUNT_DISTINCT uses the HyperLogLog++ algorithm for fast approximate counts with configurable accuracy (default ~5% relative standard deviation)."}, {"label": "B", "text": "APPROX_COUNT_DISTINCT works only on string columns while COUNT_DISTINCT works on numeric ones."}, {"label": "C", "text": "APPROX_COUNT_DISTINCT gives exact counts while COUNT_DISTINCT only estimates."}, {"label": "D", "text": "APPROX_COUNT_DISTINCT uses less memory by storing only the first 1000 unique values."}], "correct_answers": ["A"], "explanation": "APPROX_COUNT_DISTINCT uses HyperLogLog++ to estimate distinct values with far less memory and compute than exact counting, with a tunable accuracy (~5% default). It is approximate (not exact), works on any column type, and doesn't simply cap at 1000 values.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "An analyst wants to extract the area code (first three characters) from a phone string. Which function does this?", "type": "single", "options": [{"label": "A", "text": "concat(phone, 3)"}, {"label": "B", "text": "length(phone)"}, {"label": "C", "text": "substring(phone, 1, 3)"}, {"label": "D", "text": "replace(phone, 3)"}], "correct_answers": ["C"], "explanation": "substring(phone, 1, 3) returns the first three characters starting at position 1. concat joins strings, length counts characters, and replace substitutes text.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "Caching & Performance", "question": "How can an analyst tell whether a query's results were served from the cache?", "type": "single", "options": [{"label": "A", "text": "Open the SQL Warehouse tab, click Cache, and the cache file shows its contents"}, {"label": "B", "text": "Open the Queries tab, click Cache Status, and a green status means the last run was cached"}, {"label": "C", "text": "Open the Alerts tab and read the Cache Status alert"}, {"label": "D", "text": "Open Query History, click the query text, and the slideout indicates whether the results came from cache"}, {"label": "E", "text": "Open the Data tab, click Last Query, and the details show whether results were cached"}], "correct_answers": ["D"], "explanation": "Query History records each run, and clicking a query opens a slideout that reports whether the result came from the cache. The other tabs don't expose per-query cache status this way.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Analytics Fundamentals", "question": "An analyst must identify which columns are continuous so they can build histograms for each. Which description defines a continuous variable?", "type": "single", "options": [{"label": "A", "text": "A categorical variable whose number of categories keeps growing over time"}, {"label": "B", "text": "A quantitative variable that can take an uncountable set of values"}, {"label": "C", "text": "A quantitative variable limited to a finite or countably infinite set of values"}, {"label": "D", "text": "A quantitative variable that never stops changing"}], "correct_answers": ["B"], "explanation": "A continuous variable can take any value within a range, an uncountably infinite set including decimals. A variable restricted to a countable set of values is discrete, not continuous.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst loading a Spark DataFrame of daily transactions wants a line chart of total sales over time in a Databricks notebook, but the chart displays incorrectly, shows incomplete data, or has an out-of-order X-axis. Which two actions ensure the line chart accurately depicts sales trends over time? (Choose two.)", "type": "multiple", "options": [{"label": "A", "text": "Aggregate the Y-axis (total sales) in the visualization editor if the data isn't already aggregated, to avoid overplotting."}, {"label": "B", "text": "Use a scatter plot instead, as it automatically handles unsorted and missing data points."}, {"label": "C", "text": "Check that the X-axis column contains continuous date or time values and is sorted appropriately."}, {"label": "D", "text": "Ignore missing data points, since Databricks automatically interpolates gaps in line charts."}, {"label": "E", "text": "Enable 'Auto-format' for the X-axis to let Databricks automatically interpret date fields and fix ordering."}], "correct_answers": ["A", "C"], "explanation": "Line charts need a continuous, properly sorted date/time X-axis, and aggregating total sales when the data isn't pre-aggregated prevents overplotting and gives one value per time point. There's no 'Auto-format' fix, Databricks doesn't auto-interpolate gaps, and a scatter plot doesn't solve ordering or missing data.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Databricks SQL & Warehouses", "question": "An analyst's SQL Warehouse queues queries under heavy concurrent load. Which configuration adds more clusters to handle concurrency?", "type": "single", "options": [{"label": "A", "text": "Enabling scaling to allow more clusters (min/max clusters)"}, {"label": "B", "text": "Shortening the auto-stop timeout"}, {"label": "C", "text": "Increasing the warehouse t-shirt size only"}, {"label": "D", "text": "Switching the default catalog"}], "correct_answers": ["A"], "explanation": "Configuring the warehouse to scale out across multiple clusters (raising the max cluster count) handles more concurrent queries. A larger size speeds single queries but doesn't add concurrency clusters, and the other options don't address queuing.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst reviewing a Genie space used by operations managers notices multiple responses flagged as inaccurate. Which action should they take to improve performance?", "type": "single", "options": [{"label": "A", "text": "Add more tables and columns, since more data helps Genie find correct answers."}, {"label": "B", "text": "Turn off the feedback feature to prevent noise from affecting Genie's learning."}, {"label": "C", "text": "Delete the flagged responses to clear prior data biasing Genie's answers."}, {"label": "D", "text": "Update the instructions and add example SQL queries to guide Genie toward correct, context-aware responses."}], "correct_answers": ["D"], "explanation": "Genie relies on clear instructions and representative example queries to understand business context and produce accurate answers, so refining those is the fix. Adding more tables adds noise, disabling feedback removes a correction signal, and deleting responses doesn't address the guidance.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Databricks SQL & Warehouses", "question": "An analyst writes a SQL statement in the SQL Editor and wants to save it for later reference and dashboard use, with results that can appear as a counter, table, or visualization. How should they save it?", "type": "single", "options": [{"label": "A", "text": "Save the SQL statement as a Dashboard"}, {"label": "B", "text": "Save the SQL statement as a Query"}, {"label": "C", "text": "Save the SQL statement on the Query History page"}, {"label": "D", "text": "Save the SQL statement inside a Notebook"}], "correct_answers": ["B"], "explanation": "Saving a statement as a Query lets you rerun it, reference it later, and use its results as the basis for counters, tables and visualizations on dashboards.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst configures an alert on a query that returns income from accounts_receivable over a configurable Date parameter range, but the alert won't work. Why?", "type": "single", "options": [{"label": "A", "text": "Alerts only work with Date and Time parameters, and the wrong one is used"}, {"label": "B", "text": "Queries that use query parameters cannot be used with alerts"}, {"label": "C", "text": "Queries returning date-based results cannot be used with alerts"}, {"label": "D", "text": "Alerts only work with dropdown-list parameters, not dates"}], "correct_answers": ["B"], "explanation": "Alerts evaluate a single static result, so a query containing a query parameter cannot be used as an alert source. The issue is the presence of the parameter, not its type.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Databricks SQL & Warehouses", "question": "Which statement about a refresh schedule is incorrect?", "type": "single", "options": [{"label": "A", "text": "A refresh schedule is not the same thing as an alert"}, {"label": "B", "text": "A query on a refresh schedule does not use a SQL Warehouse"}, {"label": "C", "text": "A query can be refreshed anywhere from 1 minute to 2 weeks"}, {"label": "D", "text": "Refresh schedules can be configured in the Query Editor"}], "correct_answers": ["B"], "explanation": "A scheduled refresh must execute the query on a running SQL Warehouse, so claiming it uses none is false. The refresh interval range, distinction from alerts, and Query Editor configuration are all correct.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Delta Lake & Delta Tables", "question": "A data analyst must create a table in Unity Catalog for a production analytics workload that is queried frequently, needs automatic performance optimization, and should be governed by Unity Catalog with lifecycle management. Which approach should they use?", "type": "single", "options": [{"label": "A", "text": "Create a foreign table with CREATE FOREIGN TABLE to keep data in its original location while still getting Liquid Clustering and Deletion Vectors."}, {"label": "B", "text": "Create a temporary table with CREATE TEMPORARY TABLE for performance, then convert it to managed later via ALTER TABLE SET MANAGED."}, {"label": "C", "text": "Create a managed table with CREATE TABLE catalog.schema.table_name (columns...) so Unity Catalog governs the lifecycle, storage, and automatic optimizations like Predictive Optimization."}, {"label": "D", "text": "Create an external table with CREATE EXTERNAL TABLE ... LOCATION 's3://bucket/path/' to control data location under Unity Catalog governance."}], "correct_answers": ["C"], "explanation": "A managed table places data under Unity Catalog's control, registers it in the metastore, and enables automatic features such as Predictive Optimization, best for frequently queried production data. Foreign and external tables keep data outside that lifecycle.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Data Ingestion & Streaming", "question": "A data analyst needs to ingest a new CSV file of sales data into Databricks and prefers a simple, no-code, secure method that integrates with the company's data governance tools. Which ingestion method should they use?", "type": "single", "options": [{"label": "A", "text": "UI (drag-and-drop file ingestion)"}, {"label": "B", "text": "Notebook scheduled ETL"}, {"label": "C", "text": "Auto Loader"}, {"label": "D", "text": "SQL batch ingestion"}], "correct_answers": ["A"], "explanation": "The UI drag-and-drop ingestion lets users upload a CSV without code while staying integrated with Unity Catalog governance, ideal for a one-off, no-code, secure load. Auto Loader, SQL batch, and scheduled notebook ETL all require code or target automated/streaming ingestion.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Data Modeling & Architecture", "question": "An analyst working on an ad-hoc project with gold-layer tables receives an extra dataset from a stakeholder that can be used to augment those tables. What term describes this augmentation?", "type": "single", "options": [{"label": "A", "text": "Last-mile dashboarding"}, {"label": "B", "text": "Data enhancement"}, {"label": "C", "text": "Last-mile ETL"}, {"label": "D", "text": "Ad-hoc improvements"}, {"label": "E", "text": "Data testing"}], "correct_answers": ["B"], "explanation": "Enriching existing refined (gold) tables with an additional dataset to add value is called data enhancement, distinct from the transformation step of last-mile ETL.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "An analyst wants to keep only the positive numbers within an array column without exploding it into rows. Which higher-order function fits?", "type": "single", "options": [{"label": "A", "text": "explode(arr)"}, {"label": "B", "text": "transform(arr, x -> x * 2)"}, {"label": "C", "text": "filter(arr, x -> x > 0)"}, {"label": "D", "text": "reduce(arr, 0, (a,b) -> a+b)"}], "correct_answers": ["C"], "explanation": "filter applies a predicate and returns a new array containing only elements that satisfy it, here x > 0. transform maps every element, reduce aggregates to a scalar, and explode flattens to rows.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "An analyst wants a view showing only the top 10% of customers by total spend. Which SQL query achieves this?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM customers WHERE total_spend > PERCENTILE(total_spend, 0.9)"}, {"label": "B", "text": "SELECT * FROM customers WHERE total_spend > (SELECT PERCENTILE(total_spend, 0.9) FROM customers)"}, {"label": "C", "text": "SELECT * FROM customers ORDER BY total_spend DESC OFFSET 10%"}, {"label": "D", "text": "SELECT * FROM customers ORDER BY total_spend DESC LIMIT 10%"}], "correct_answers": ["B"], "explanation": "A subquery computing the 90th percentile (PERCENTILE with 0.9), used as a threshold in WHERE, returns customers above that cutoff — the top 10% by spend. LIMIT 10% and OFFSET 10% aren't valid, and PERCENTILE without a subquery doesn't filter correctly.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Delta Lake & Delta Tables", "question": "A data analyst wants to compare a Delta table's contents as they were last week against its current state to track changes in sales records. Which Delta Lake capability makes this comparison possible?", "type": "single", "options": [{"label": "A", "text": "RESTORE command"}, {"label": "B", "text": "Time travel querying"}, {"label": "C", "text": "CLONE with VERSION AS OF"}, {"label": "D", "text": "VACUUM retention settings"}], "correct_answers": ["B"], "explanation": "Time travel lets you read a retained snapshot of a Delta table by timestamp or version (e.g. TIMESTAMP AS OF), giving a read-only view of an earlier state without changing current data. RESTORE overwrites the current version, VACUUM governs file cleanup, and CLONE copies rather than queries history.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is checking the Databricks SQL Alerts listing page. An alert just ran, the monitored value satisfied the configured condition and crossed the threshold, so the alert's criteria were fulfilled. What status will be shown for this alert in the list?", "type": "single", "options": [{"label": "A", "text": "Status: OK"}, {"label": "B", "text": "Status: TRIGGERED"}, {"label": "C", "text": "Status: YES"}, {"label": "D", "text": "Status: SUCCESS"}], "correct_answers": ["B"], "explanation": "When an alert's condition evaluates to true and the value crosses the threshold, Databricks marks it TRIGGERED. 'OK' means the condition was not met (healthy), 'SUCCESS' only refers to the execution finishing, and 'YES' is not a real alert state.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Caching & Performance", "question": "A data analyst wants to speed up a daily sales report that aggregates a large transactions table. The report runs several times a day but the underlying data changes only once daily. Which approach improves performance while minimizing redundant computation?", "type": "single", "options": [{"label": "A", "text": "Set up a streaming table to ingest new sales data in real time."}, {"label": "B", "text": "Use a dynamic view that computes the aggregation on each query."}, {"label": "C", "text": "Create a materialized view that precomputes the daily sales aggregation."}, {"label": "D", "text": "Use a standard view and schedule a notebook to cache results."}], "correct_answers": ["C"], "explanation": "A materialized view stores the aggregated output physically and refreshes only when the daily source changes, so repeated report runs reuse the precomputed result instead of recomputing. Dynamic/standard views recompute each run and a streaming table doesn't address aggregate recomputation.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "A data analyst tries to filter rows whose tags array holds the value 'sql' with: SELECT * FROM main.analytics.articles WHERE tags = 'sql'; but this returns nothing. Which query correctly filters rows where the tags array contains 'sql'?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM main.analytics.articles WHERE 'sql' IN tags;"}, {"label": "B", "text": "SELECT * FROM main.analytics.articles WHERE tags LIKE '%sql%';"}, {"label": "C", "text": "SELECT * FROM main.analytics.articles WHERE tags IN ('sql');"}, {"label": "D", "text": "SELECT * FROM main.analytics.articles WHERE array_contains(tags, 'sql');"}], "correct_answers": ["D"], "explanation": "array_contains(tags, 'sql') returns true when an array column contains the given element, so it filters exactly the rows whose tags array holds 'sql'. 'sql' IN tags is invalid syntax, tags IN ('sql') compares the whole array against a scalar, and LIKE operates on strings not arrays.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Data Modeling & Architecture", "question": "A data analyst is designing a reporting schema in Databricks SQL for sales analytics. They want a central fact table of transactions surrounded by descriptive tables for products, stores, and dates so BI queries stay simple. Which data-modeling pattern does this describe?", "type": "single", "options": [{"label": "A", "text": "A fully normalized third-normal-form model"}, {"label": "B", "text": "A single wide table with no relationships"}, {"label": "C", "text": "A star schema with a fact table and dimension tables"}, {"label": "D", "text": "An append-only raw log with no schema"}], "correct_answers": ["C"], "explanation": "A star schema places a central fact table (the sales transactions) surrounded by dimension tables (products, stores, dates) holding descriptive attributes, keeping analytical queries simple and performant. A fully normalized model complicates joins, a single wide table loses reusable dimensions, and a raw log has no modeled structure.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Data Modeling & Architecture", "question": "In the Delta Lake medallion architecture on Databricks, how are analytical models mapped to the Gold layer?", "type": "single", "options": [{"label": "A", "text": "The Gold layer is used for cleaning, deduplication, and cross-domain joins to establish data integrity."}, {"label": "B", "text": "The Gold layer mainly stores backup copies of all data for disaster recovery."}, {"label": "C", "text": "The Gold layer stores raw, unprocessed data for initial ingestion and schema evolution."}, {"label": "D", "text": "The Gold layer holds de-normalized data models optimized for analytics, reporting, and machine learning."}], "correct_answers": ["D"], "explanation": "Gold tables are the final, production-ready datasets — denormalized, curated models tuned for analytics, reporting and ML after passing through Bronze and Silver. Raw ingestion is Bronze, cleaning/joining is Silver, and backup is a cross-layer concern.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Delta Lake & Delta Tables", "question": "An analyst notices a Delta table accumulating many tiny files from frequent small writes, hurting read performance. Which command compacts them into larger files?", "type": "single", "options": [{"label": "A", "text": "VACUUM"}, {"label": "B", "text": "ANALYZE TABLE"}, {"label": "C", "text": "OPTIMIZE"}, {"label": "D", "text": "REFRESH"}], "correct_answers": ["C"], "explanation": "OPTIMIZE compacts many small files into fewer larger ones, improving read efficiency. VACUUM removes obsolete files, REFRESH updates metadata/cache, and ANALYZE TABLE collects statistics.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is setting up a Genie space in Databricks. Which sequence should they follow to define good sample questions that guide user interactions and improve Genie's accuracy?", "type": "single", "options": [{"label": "A", "text": "Create a dedicated notebook per sample question, write the SQL in it, and link the notebooks to the Genie space via a workspace object reference."}, {"label": "B", "text": "Go to 'Configure' > 'Settings' and enter the sample questions in the 'Description' field, which Genie parses automatically."}, {"label": "C", "text": "Upload a spreadsheet of sample questions, manually map each to a SQL query in a separate document, and update the mappings periodically."}, {"label": "D", "text": "Open 'Configure' > 'Context', use the 'SQL Queries' tab to add sample questions with matching SQL, then review and resolve inconsistencies in the guidance."}], "correct_answers": ["D"], "explanation": "The supported workflow is Configure > Context > SQL Queries, where you define sample natural-language questions with their SQL and then resolve any inconsistencies; Genie uses these as guidance. The notebook-linking, Description-field, and spreadsheet methods aren't recommended.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "A data analyst is building a parameterized SQL query in Databricks to filter sales by region and year and wants to test it with different parameter values before adding it to a dashboard. Which approach allows dynamic testing of parameters in the Databricks SQL editor?", "type": "single", "options": [{"label": "A", "text": "Hard-code the region and year values into the query and rerun it for each test."}, {"label": "B", "text": "Use parameter markers (e.g. :region, :year) and enter their values in the input boxes before running."}, {"label": "C", "text": "Add the parameters as variables in a Python notebook cell and reference them in the SQL query."}, {"label": "D", "text": "Replace column names with question marks ('?') and expect Databricks to prompt for values at runtime."}], "correct_answers": ["B"], "explanation": "Databricks SQL supports named parameters prefixed with a colon (:region, :year); the editor renders input boxes so you can supply different values and rerun without editing the query. The notebook-variable route doesn't apply to the SQL editor, '?' placeholders aren't how it prompts, and hard-coding defeats reuse.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Databricks SQL & Warehouses", "question": "A consultant hands a data team several projects to implement on the Databricks Lakehouse Platform. Which project is best completed in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Segmenting customers into groups using a clustering algorithm"}, {"label": "B", "text": "Tracking usage of feature variables for machine learning"}, {"label": "C", "text": "Combining two data sources into a single comprehensive dataset"}, {"label": "D", "text": "Automating complex notebook-based workflows with multiple tasks"}], "correct_answers": ["C"], "explanation": "Joining and combining sources into one analytical dataset is core SQL work, well suited to Databricks SQL. Clustering, ML feature tracking, and multi-task workflow orchestration belong to notebooks and Jobs.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Query Optimization & Performance", "question": "An analyst must optimize a Databricks SQL query over a large dataset. Which option best improves query performance?", "type": "single", "options": [{"label": "A", "text": "Increase the query timeout"}, {"label": "B", "text": "Partition the data into smaller chunks"}, {"label": "C", "text": "Raise the level of parallelism"}, {"label": "D", "text": "Increase the cluster size"}], "correct_answers": ["B"], "explanation": "Partitioning lets the engine prune and process less data per operation, often the most cost-effective performance gain on large datasets. Bigger clusters or more parallelism can help but cost more, and a longer timeout doesn't speed anything up.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst adds an area chart (with a query parameter) to a dashboard and selects 'Dashboard Parameter' for that parameter. Which statement is true?", "type": "single", "options": [{"label": "A", "text": "Only the area chart responds to the selection; all other visualizations stay unchanged"}, {"label": "B", "text": "The area chart converts into a Dashboard Parameter"}, {"label": "C", "text": "The area chart uses the selected value along with all other dashboard visualizations that share the same parameter"}, {"label": "D", "text": "The area chart uses whatever value was chosen when it was added and can't be changed afterward"}], "correct_answers": ["C"], "explanation": "Choosing 'Dashboard Parameter' links the visualization to a shared dashboard-level control, so it and every other visualization using that same parameter update together. It isn't frozen, isolated, or converted into a parameter itself.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "SQL Basics & Syntax", "question": "A data analyst has a Unity Catalog table sales_data where the INTEGER column order_quantity occasionally holds -1, indicating a data-entry error. They need a new view clean_sales_data that excludes those rows. Which SQL query creates the view filtering out records where order_quantity is -1?", "type": "single", "options": [{"label": "A", "text": "CREATE VIEW clean_sales_data AS SELECT * FROM sales_data WHERE ABS(order_quantity) != 1;"}, {"label": "B", "text": "CREATE VIEW clean_sales_data AS SELECT * FROM sales_data WHERE order_quantity IS NOT NULL AND order_quantity > 0;"}, {"label": "C", "text": "CREATE VIEW clean_sales_data AS SELECT * FROM sales_data WHERE order_quantity != -1;"}, {"label": "D", "text": "CREATE VIEW clean_sales_data AS SELECT * FROM sales_data HAVING order_quantity != -1;"}], "correct_answers": ["C"], "explanation": "WHERE order_quantity != -1 removes exactly the erroneous -1 rows while keeping all other rows and columns via SELECT *. Filtering on order_quantity > 0 drops valid zero and positive edge cases, ABS(order_quantity) != 1 would also exclude +1, and HAVING without grouping is invalid.", "is_one_word": false}, {"source": "Udemy Test B", "theme": "Data Modeling & Architecture", "question": "A BI analyst is building an analytical model in Databricks with Delta Lake tables, applying Data Vault 2.0 to track historical changes with scalability and auditability across business domains. Which component captures the many-to-many relationship between hubs in a Data Vault v2 model?", "type": "single", "options": [{"label": "A", "text": "Hub Table"}, {"label": "B", "text": "Satellite Table"}, {"label": "C", "text": "Link Table"}, {"label": "D", "text": "Reference Table"}], "correct_answers": ["C"], "explanation": "In Data Vault 2.0, Hubs hold business keys, Satellites hold descriptive attributes, and Links model relationships — so a Link Table holds the foreign keys to each hub and naturally represents many-to-many relationships. Reference tables only store lookup/code data.", "is_one_word": true}, {"source": "Udemy Test B", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst must share a Databricks SQL dashboard with stakeholders who can't have accounts in the deployment, and they must be notified each time it refreshes. What is the lowest-effort approach?", "type": "single", "options": [{"label": "A", "text": "Download the dashboard as a PDF and email it after every refresh"}, {"label": "B", "text": "Add the stakeholders' email addresses to the SQL Warehouse (formerly endpoint) subscribers list"}, {"label": "C", "text": "Add the stakeholders' email addresses to the refresh schedule's subscribers list"}, {"label": "D", "text": "Grant the stakeholders' email addresses permissions to the dashboard"}], "correct_answers": ["C"], "explanation": "Adding their emails to the refresh schedule's subscribers list automatically sends them the dashboard on each refresh, with no account needed and no manual work. Granting permissions would require accounts, and emailing PDFs is manual.", "is_one_word": false}];
