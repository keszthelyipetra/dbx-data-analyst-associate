el": "B", "text": "CREATE TABLE prod.silver.sales_new AS SELECT *, 'Standard' AS revenue_tier FROM prod.silver.sales; DROP TABLE prod.silver.sales; ALTER TABLE prod.silver.sales_new RENAME TO sales"}, {"label": "C", "text": "INSERT INTO prod.silver.sales (revenue_tier) VALUES ('Standard')"}, {"label": "D", "text": "ALTER TABLE prod.silver.sales ADD COLUMN revenue_tier STRING DEFAULT 'Standard'"}], "correct_answers": ["A"], "explanation": "Correct: The two-statement approach first adds the column to the schema with no default, leaving existing rows with NULL values in the new column. The UPDATE then sets the value to Standard for all rows where revenue_tier is NULL, correctly populating the new column for all existing rows.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Unity Catalog & Data Governance", "question": "After creating a new Unity Catalog schema, a data engineer runs SHOW SCHEMAS IN prod and does not see the new schema in the results. What is the most likely explanation?", "type": "single", "options": [{"label": "A", "text": "SHOW SCHEMAS IN prod requires the data engineer to first run USE CATALOG prod to activate the catalog before the command returns accurate results"}, {"label": "B", "text": "The data engineer does not have USE SCHEMA privilege on the new schema so it is not visible in their SHOW SCHEMAS output"}, {"label": "C", "text": "New schemas require a 10-minute propagation delay in Unity Catalog before they become visible to other users"}, {"label": "D", "text": "SHOW SCHEMAS IN prod only displays schemas that contain at least one table. Empty schemas are hidden from the output"}], "correct_answers": ["B"], "explanation": "Correct: Unity Catalog follows a deny-by-default model. SHOW SCHEMAS IN catalog returns only the schemas that the current user has at minimum USE SCHEMA privilege on. If the schema was created by another user and no grants have been made to the data engineer the schema is not visible in their query results even though it exists in the catalog.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Delta Lake & Delta Tables", "question": "Which two statements correctly describe Liquid Clustering in Delta Lake?", "type": "multiple", "options": [{"label": "A", "text": "Unlike traditional Hive-style partitioning Liquid Clustering supports high-cardinality clustering columns and allows the clustering columns to be changed without rewriting all existing data"}, {"label": "B", "text": "Liquid Clustering must be applied at table creation time and cannot be added to an existing Delta table after data has been loaded"}, {"label": "C", "text": "Liquid Clustering progressively reorganises data files to co-locate rows with similar clustering column values, improving query performance for filter predicates on the clustered columns"}, {"label": "D", "text": "Liquid Clustering automatically runs in the background without requiring OPTIMIZE to be executed, continuously maintaining optimal data layout as new data arrives"}], "correct_answers": ["A", "C"], "explanation": "Correct: Traditional Hive partitioning creates a separate directory per partition value making it unsuitable for high-cardinality columns. Liquid Clustering handles high-cardinality columns efficiently and allows the clustering definition to be changed with ALTER TABLE CLUSTER BY without requiring a full table rewrite. It also improves data layout by physically grouping rows with similar values into the same files, enabling effective data skipping.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Analytics Fundamentals", "question": "The standard deviation of a dataset measures which of the following?", "type": "single", "options": [{"label": "A", "text": "The most frequently occurring value in the dataset"}, {"label": "B", "text": "The difference between the maximum and minimum values in the dataset"}, {"label": "C", "text": "The middle value when all data points are sorted in ascending order"}, {"label": "D", "text": "The average distance of each data point from the mean, indicating how spread out the values are around the average"}], "correct_answers": ["D"], "explanation": "Correct: Standard deviation quantifies the typical distance between individual data points and the mean. A low standard deviation indicates values cluster tightly around the mean while a high standard deviation indicates values are widely dispersed. It is one of the most important measures of data variability.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Delta Lake & Delta Tables", "question": "What is the purpose of the VACUUM command in Databricks Delta Lake?", "type": "single", "options": [{"label": "A", "text": "VACUUM compacts small Parquet files into larger files to improve query scan performance"}, {"label": "B", "text": "VACUUM removes old data files from cloud storage that are no longer referenced by the current Delta table version and are older than the configured retention period, reclaiming storage space"}, {"label": "C", "text": "VACUUM refreshes the statistics for all columns in a Delta table to improve query optimiser decisions"}, {"label": "D", "text": "VACUUM validates the integrity of the Delta transaction log and repairs any corrupted log entries found during the scan"}], "correct_answers": ["B"], "explanation": "Correct: As Delta tables accumulate writes through updates, deletes, and compaction operations the old versions of data files become unreferenced in the transaction log but remain on cloud storage. VACUUM physically deletes these unreferenced files that exceed the retention threshold, freeing up cloud storage costs.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "The data team wants to understand the average time between a customer's first and second order to inform retention campaigns. The orders table has customer_id and order_date columns. Which query correctly calculates this average gap in days?", "type": "single", "options": [{"label": "A", "text": "SELECT AVG(DATEDIFF(second_order, first_order)) AS avg_days_to_second FROM ( SELECT customer_id, MIN(order_date) AS first_order, MIN(CASE WHEN order_date > MIN(order_date) OVER (PARTITION BY customer_id) THEN order_date END) AS second_order FROM orders GROUP BY customer_id );"}, {"label": "B", "text": "SELECT AVG(DATEDIFF(order_date, LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date))) AS avg_days_to_second FROM orders WHERE ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date) = 2;"}, {"label": "C", "text": "SELECT AVG(DATEDIFF(second_order_date, first_order_date)) AS avg_days_to_second FROM ( SELECT customer_id, MIN(order_date) AS first_order_date, MIN(order_date) FILTER (WHERE order_date > MIN(order_date)) AS second_order_date FROM orders GROUP BY customer_id ) WHERE second_order_date IS NOT NULL;"}, {"label": "D", "text": "WITH ranked AS ( SELECT customer_id, order_date, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date) AS rn FROM orders ), first_and_second AS ( SELECT r1.customer_id, DATEDIFF(r2.order_date, r1.order_date) AS days_to_second FROM ranked r1 JOIN ranked r2 ON r1.customer_id = r2.customer_id AND r1.rn = 1 AND r2.rn = 2 ) SELECT AVG(days_to_second) AS avg_days_to_second FROM first_and_second;"}], "correct_answers": ["D"], "explanation": "Correct: The first CTE uses ROW_NUMBER to rank each customer's orders chronologically. The second CTE joins the first-order row to the second-order row per customer using the rank numbers and calculates the day difference. The outer query averages across all customers who have at least two orders. Window functions cannot be used directly in WHERE or FILTER clauses and must be computed in a prior CTE or subquery step.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Analytics Fundamentals", "question": "A data analyst needs to understand the spread of order values in a dataset. They calculate that the minimum order value is 5 and the maximum is 500. What does the range tell the analyst and what are its limitations?", "type": "single", "options": [{"label": "A", "text": "The range of 495 tells the analyst the average order value and can be used to predict future order amounts"}, {"label": "B", "text": "The range of 495 tells the analyst the total spread between the extreme values but is highly sensitive to outliers and tells nothing about how values are distributed between the minimum and maximum"}, {"label": "C", "text": "The range of 495 tells the analyst the complete distribution of all order values between 5 and 500. It has no limitations because it captures all data points"}, {"label": "D", "text": "The range of 495 indicates that exactly 495 distinct order values exist in the dataset between 5 and 500"}], "correct_answers": ["B"], "explanation": "Correct: Range is calculated as maximum minus minimum (500 minus 5 = 495). It provides a quick sense of the overall spread but its primary limitation is sensitivity to outliers. A single unusually high or low value can make the range appear much larger than the typical spread of most values. It reveals nothing about the distribution pattern between the extremes.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "Which Databricks SQL function correctly returns the current date without a time component?", "type": "single", "options": [{"label": "A", "text": "CURRENT_DATE()"}, {"label": "B", "text": "NOW()"}, {"label": "C", "text": "CURRENT_TIMESTAMP()"}, {"label": "D", "text": "TODAY()"}], "correct_answers": ["A"], "explanation": "Correct: CURRENT_DATE() returns today's date as a DateType value with no time component. It is the correct function for date-only comparisons and calculations where the time portion is not relevant.", "is_one_word": true}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "A data analyst creates a subquery to find customers who made the highest payment. The payments table has customer_id, customer_name, and payment_amount columns. Which query correctly uses a subquery to return the customer name and payment amount for the highest payment?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_name, payment_amount FROM payments WHERE payment_amount = (SELECT MAX(payment_amount) FROM payments)"}, {"label": "B", "text": "SELECT customer_name, payment_amount FROM payments WHERE payment_amount = MAX(payment_amount)"}, {"label": "C", "text": "SELECT customer_name, payment_amount FROM payments HAVING payment_amount = MAX(payment_amount)"}, {"label": "D", "text": "SELECT customer_name, MAX(payment_amount) FROM payments GROUP BY customer_name ORDER BY MAX(payment_amount) DESC LIMIT 1"}], "correct_answers": ["A"], "explanation": "Correct: The scalar subquery SELECT MAX(payment_amount) FROM payments executes first and returns the single maximum payment value. The outer query then uses this value in the WHERE clause to return all rows where payment_amount equals the maximum. This correctly handles ties by returning all customers who share the highest payment amount.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "A data analyst runs the following query and receives an error: SELECT customer_id, order_date, SUM(order_value) OVER (PARTITION BY customer_id ORDER BY order_date) AS running_total, AVG(order_value) AS avg_order FROM orders GROUP BY customer_id. What is the cause of the error?", "type": "single", "options": [{"label": "A", "text": "AVG without an OVER clause is not supported when any window function appears in the SELECT list"}, {"label": "B", "text": "The query mixes a window function SUM OVER with a regular aggregate AVG in a query that has a GROUP BY clause. The order_date column is in the SELECT list and used in the window function's ORDER BY but is not in the GROUP BY clause, causing an AnalysisException"}, {"label": "C", "text": "The PARTITION BY clause in a window function cannot reference a column that is also used in the GROUP BY clause of the same query"}, {"label": "D", "text": "SUM with an OVER clause cannot be used alongside AVG in the same SELECT statement"}], "correct_answers": ["B"], "explanation": "Correct: When a query has a GROUP BY clause all columns in the SELECT list that are not inside aggregate functions must appear in GROUP BY. order_date appears in the SELECT list and in the window function's ORDER BY but is not in the GROUP BY clause. Additionally mixing window functions with GROUP BY requires careful handling because window functions are evaluated after grouping. The missing order_date in GROUP BY is the direct cause of the error.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Unity Catalog & Data Governance", "question": "Which statement correctly describes what happens to the underlying data files when a managed table is dropped in Databricks Unity Catalog?", "type": "single", "options": [{"label": "A", "text": "The data files are moved to a recycle bin location and retained for 30 days before permanent deletion"}, {"label": "B", "text": "The data files remain in their original storage location and must be manually deleted by the data engineer after the table metadata is removed from the catalog"}, {"label": "C", "text": "The underlying data files are permanently deleted from managed storage when the table is dropped because Unity Catalog owns the data lifecycle of managed tables"}, {"label": "D", "text": "The data files are converted to read-only archive files that remain accessible through time travel queries but cannot be modified"}], "correct_answers": ["C"], "explanation": "Correct: Managed tables are fully owned by Unity Catalog. When a managed table is dropped Unity Catalog removes both the table metadata from the catalog and the underlying data files from the managed storage location. This is the defining characteristic that distinguishes managed tables from external tables.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Data Modeling & Architecture", "question": "What is the key difference between a snowflake schema and a star schema in dimensional modelling?", "type": "single", "options": [{"label": "A", "text": "Snowflake schemas are used exclusively for streaming data pipelines while star schemas are used for batch analytical workloads"}, {"label": "B", "text": "In a snowflake schema dimension tables are normalised into multiple related sub-dimension tables reducing data redundancy. In a star schema dimension tables are denormalised into flat tables containing all descriptive attributes in a single table"}, {"label": "C", "text": "A snowflake schema has no fact table whereas a star schema requires exactly one fact table at the centre of the model"}, {"label": "D", "text": "A snowflake schema stores all data in a single wide table while a star schema separates data into multiple tables"}], "correct_answers": ["B"], "explanation": "Correct: The snowflake schema normalises dimension tables into hierarchies of related tables, for example splitting a product dimension into separate product, subcategory, and category tables linked by foreign keys. This reduces storage redundancy but requires more joins for analytical queries. The star schema denormalises all attributes into a single flat dimension table requiring fewer joins but storing some repeated values.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Unity Catalog & Data Governance", "question": "Which statement correctly describes the purpose of adding tags to tables and schemas in Unity Catalog?", "type": "single", "options": [{"label": "A", "text": "Tags automatically apply row-level security policies to tagged tables, restricting which rows different user groups can see based on the tag values"}, {"label": "B", "text": "Tags replace table comments and column comments in Unity Catalog. Adding a tag automatically removes any existing comments from the object"}, {"label": "C", "text": "Tags are mandatory metadata required by Unity Catalog before a table can be queried. Without tags a table returns empty results"}, {"label": "D", "text": "Tags are key-value metadata labels applied to catalog objects such as tables, schemas, and columns to support data discovery, classification, and governance workflows without affecting query behaviour"}], "correct_answers": ["D"], "explanation": "Correct: Tags in Unity Catalog are descriptive metadata labels that help data teams classify and discover data assets. Common uses include tagging tables with sensitivity levels such as PII or Confidential, labelling by domain such as Finance or Marketing, or indicating data quality status. Tags do not affect how data is stored or queried but support governance and discovery workflows.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to apply a JOIN that returns all customers whether or not they have placed any orders. Which JOIN type and query correctly achieves this?", "type": "single", "options": [{"label": "A", "text": "CROSS JOIN: SELECT c.customer_name, o.order_id FROM customers c CROSS JOIN orders o"}, {"label": "B", "text": "INNER JOIN: SELECT c.customer_name, o.order_id FROM customers c INNER JOIN orders o ON c.customer_id = o.customer_id"}, {"label": "C", "text": "LEFT JOIN: SELECT c.customer_name, o.order_id FROM customers c LEFT JOIN orders o ON c.customer_id = o.customer_id"}, {"label": "D", "text": "RIGHT JOIN: SELECT c.customer_name, o.order_id FROM customers c RIGHT JOIN orders o ON c.customer_id = o.customer_id"}], "correct_answers": ["C"], "explanation": "Correct: LEFT JOIN returns all rows from the left table (customers) regardless of whether a match exists in the right table (orders). For customers with no orders the o.order_id column returns NULL. This correctly returns all customers including those who have never placed an order.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Data Modeling & Architecture", "question": "The medallion architecture organises data into three layers. Which statement correctly describes the purpose of each layer?", "type": "single", "options": [{"label": "A", "text": "The medallion architecture requires data to skip the Silver layer and move directly from Bronze to Gold for real-time analytics workloads"}, {"label": "B", "text": "Bronze stores aggregated KPIs, Silver stores raw data, and Gold stores cleaned intermediate data ready for transformation"}, {"label": "C", "text": "Bronze stores raw ingested data as-is, Silver applies cleaning and enrichment transformations, and Gold contains business-ready aggregated data optimised for analytical consumption"}, {"label": "D", "text": "Bronze, Silver, and Gold all store identical copies of the data at different quality levels to provide redundancy in case one layer fails"}], "correct_answers": ["C"], "explanation": "Correct: The Bronze layer preserves raw data exactly as received from source systems with no transformation, providing a complete historical record. Silver applies data quality rules, deduplication, joins, and enrichment to create cleaned structured datasets. Gold contains pre-aggregated business metrics and dimensional models optimised for BI tools and dashboards.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "Which SQL statement correctly renames an existing table called sales_data to sales_transactions in Databricks?", "type": "single", "options": [{"label": "A", "text": "DROP TABLE sales_data; CREATE TABLE sales_transactions AS SELECT * FROM sales_data"}, {"label": "B", "text": "UPDATE TABLE sales_data SET name = 'sales_transactions'"}, {"label": "C", "text": "ALTER TABLE sales_data RENAME TO sales_transactions"}, {"label": "D", "text": "RENAME TABLE sales_data TO sales_transactions"}], "correct_answers": ["C"], "explanation": "Correct: ALTER TABLE RENAME TO is the correct Databricks SQL syntax for renaming a table. This changes the table name in the catalog metadata while preserving all data, schema, and table properties. The renamed table is immediately accessible under its new name.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Analytics Fundamentals", "question": "What does frequency distribution show in statistical analysis and how is it typically represented in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Frequency distribution calculates the cumulative sum of all values from smallest to largest showing the total at each step"}, {"label": "B", "text": "Frequency distribution is only applicable to categorical variables and cannot be used to analyse continuous numeric data"}, {"label": "C", "text": "Frequency distribution shows the central tendency of a dataset by calculating the weighted average of all values"}, {"label": "D", "text": "Frequency distribution shows how often each distinct value or range of values occurs in a dataset. In Databricks SQL it is computed using GROUP BY on the value column with COUNT(*) to count occurrences of each value"}], "correct_answers": ["D"], "explanation": "Correct: Frequency distribution reveals the occurrence pattern of values in a dataset. GROUP BY the value column combined with COUNT(*) produces a table showing how many times each distinct value appears. This can then be visualised as a bar chart or histogram where the x-axis shows the values and the y-axis shows their frequencies.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Data Modeling & Architecture", "question": "Which two statements correctly describe the data vault modelling approach?", "type": "multiple", "options": [{"label": "A", "text": "Data vault models are optimised for direct BI consumption and provide better query performance than star schemas for dashboard queries"}, {"label": "B", "text": "A data vault model consists of three core table types: Hub tables that store business keys, Link tables that store relationships between business keys, and Satellite tables that store descriptive attributes and historical changes"}, {"label": "C", "text": "Data vault modelling is designed to be highly auditable and adaptable to schema changes from source systems, making it well suited to integration layers where source system schemas may change over time"}, {"label": "D", "text": "Data vault modelling eliminates the need for a fact table because Hub tables serve as the fact tables in the analytical model"}], "correct_answers": ["B", "C"], "explanation": "Correct: The data vault model uses three specialised table types. Hub tables capture the unique business keys for each core business entity such as customer_id or product_id. Link tables record the relationships between business keys from different hubs. Satellite tables store the descriptive attributes and historical changes associated with Hub or Link records. Data vault's separation of business keys, relationships, and attributes makes it resilient to schema changes and well suited to integration layers.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Data Modeling & Architecture", "question": "Which two statements correctly describe the star schema data model?", "type": "multiple", "options": [{"label": "A", "text": "Star schemas are only suitable for real-time streaming data and cannot be used for historical batch analytical workloads"}, {"label": "B", "text": "A star schema consists of a central fact table containing measurable events and numeric measures, surrounded by dimension tables containing descriptive attributes connected to the fact table through foreign key relationships"}, {"label": "C", "text": "Star schemas are optimised for analytical queries because they minimise the number of joins required to retrieve both measures and descriptive context, typically requiring only a single join between the fact table and each dimension table"}, {"label": "D", "text": "All dimension tables in a star schema must contain exactly the same number of columns as the fact table to maintain join symmetry"}], "correct_answers": ["B", "C"], "explanation": "Correct: The star schema gets its name from the visual appearance of a central fact table connected by foreign keys to multiple surrounding dimension tables. The fact table stores transactional events with numeric measures like quantity and revenue. Dimension tables store descriptive attributes. The denormalised structure means all descriptive attributes for an entity are in a single table, requiring only a single join per dimension, making star schemas highly efficient for BI queries.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "AI/BI Dashboards & Visualization", "question": "A dashboard parameter widget is configured with the name date_filter. A data analyst writes the following query to use this parameter: SELECT * FROM orders WHERE order_date = date_filter. The dashboard loads without errors but the filter has no effect and all rows are returned regardless of the date selected. What is the cause?", "type": "single", "options": [{"label": "A", "text": "The query references date_filter as a plain identifier rather than using the double curly brace syntax. The correct syntax is WHERE order_date = {{date_filter}} to inject the parameter value at query execution time"}, {"label": "B", "text": "Parameters only work in HAVING clauses and cannot be used in WHERE clauses in Databricks AI/BI Dashboard queries"}, {"label": "C", "text": "The parameter widget name must exactly match the column name in the table for the filter to work automatically"}, {"label": "D", "text": "The date_filter parameter widget must be configured as a Date type rather than a Text type for date filtering to function correctly in SQL queries"}], "correct_answers": ["A"], "explanation": "Correct: Dashboard parameters are injected into queries using the double curly brace syntax {{parameter_name}}. Writing date_filter without curly braces treats it as a SQL identifier such as a column name or variable rather than a parameter placeholder. Since no column named date_filter exists in the orders table the condition may evaluate unexpectedly. The correct syntax is {{date_filter}} to substitute the widget's selected value into the query.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to find the second-highest order_value (distinct value) for each customer in a large orders table in Databricks SQL. If multiple orders share the same highest order_value, how can the analyst ensure they still correctly identify the second-highest distinct value for each customer? Which query correctly returns this value for all customers?", "type": "single", "options": [{"label": "A", "text": "Use DENSE_RANK() OVER (PARTITION BY customer_id ORDER BY order_value DESC) and select rows where dense_rank = 2"}, {"label": "B", "text": "Use SUM(order_value) grouped by customer and subtract the smallest order."}, {"label": "C", "text": "Use ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_value DESC) and select rows where rn = 2."}, {"label": "D", "text": "Use MIN(order_value) filtered to exclude the first order."}], "correct_answers": ["A"], "explanation": "Correct: Using DENSE_RANK() OVER (PARTITION BY customer_id ORDER BY order_value DESC) will assign a unique rank to each row within the partition of each customer based on the order_value in descending order. By selecting rows where dense_rank = 2, the analyst can ensure they are retrieving the second-highest distinct order_value for each customer.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Data Ingestion & Streaming", "question": "What is the key difference between batch data processing and streaming data processing in Databricks?", "type": "single", "options": [{"label": "A", "text": "Streaming processing stores data in CSV format while batch processing always uses Delta format"}, {"label": "B", "text": "Batch processing handles data in discrete scheduled chunks at defined intervals while streaming processing handles data continuously as it arrives with low latency"}, {"label": "C", "text": "Batch processing is only supported for structured data formats while streaming processing supports all data formats including unstructured text and images"}, {"label": "D", "text": "Batch processing requires a dedicated always-on cluster while streaming processing uses serverless compute that starts only when new data arrives"}], "correct_answers": ["B"], "explanation": "Correct: Batch processing collects data over a period (hourly, daily, etc.) and processes it all at once when triggered. Streaming processing ingests and processes data events continuously as they occur, providing near real-time results with much lower latency. The choice between them depends on how quickly the business needs to act on new data.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns the name of the customer who has spent the most total revenue across all orders. The customers table has customer_id and customer_name columns. The orders table has customer_id and order_value columns. Which query correctly identifies this single top-spending customer?", "type": "single", "options": [{"label": "A", "text": "SELECT c.customer_name, SUM(o.order_value) AS total_spent FROM customers c JOIN orders o ON c.customer_id = o.customer_id GROUP BY c.customer_name ORDER BY total_spent DESC LIMIT 1;"}, {"label": "B", "text": "SELECT customer_name FROM customers WHERE customer_id = (SELECT customer_id FROM orders ORDER BY order_value DESC LIMIT 1)"}, {"label": "C", "text": "SELECT customer_id, MAX(order_value) AS total_spent FROM orders GROUP BY customer_id ORDER BY total_spent DESC LIMIT 1"}, {"label": "D", "text": "SELECT c.customer_name FROM customers c JOIN orders o ON c.customer_id = o.customer_id GROUP BY c.customer_name HAVING o.order_value = (SELECT MAX(total) FROM (SELECT SUM(order_value) AS total FROM orders GROUP BY customer_id));"}], "correct_answers": ["A"], "explanation": "Correct: Joining customers to orders and grouping by customer_name computes each customer's total spend. ORDER BY total_spent DESC sorts from highest to lowest and LIMIT 1 returns only the top spender. This is the most readable approach for finding the single maximum aggregate row.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Query Optimization & Performance", "question": "A data analyst is writing a Databricks SQL query that references the same filtered subset of the orders table multiple times within the query. The analyst wants to ensure that the expensive filter and scan of the large table is executed only once and that all subsequent references reuse the computed result. Which approach guarantees that the filtered dataset is computed once and reused in the rest of the query?", "type": "single", "options": [{"label": "A", "text": "Create a temporary table using CREATE TEMP TABLE filtered_orders AS SELECT ... and reference it in the query"}, {"label": "B", "text": "Add DISTINCT to the subquery to reduce duplicate rows before it is referenced multiple times"}, {"label": "C", "text": "Define a CTE in a WITH clause and reference it multiple times in the query"}, {"label": "D", "text": "Use a BROADCAST hint on the orders table"}], "correct_answers": ["A"], "explanation": "Correct: Creating a temporary table materialises the filtered result as a physical intermediate dataset. The expensive scan and filter execute once when the table is created, and all subsequent references ubstring'"}, {"label": "B", "text": "WHERE column BETWEEN 'start' AND 'end'"}, {"label": "C", "text": "WHERE column LIKE 'pattern'"}, {"label": "D", "text": "WHERE column IN ('pattern1', 'pattern2')"}], "correct_answers": ["C"], "explanation": "Correct: The LIKE operator performs pattern matching on string columns. The % wildcard matches any sequence of characters and the _ wildcard matches exactly one character. For example LIKE 'J%' matches any string starting with J and LIKE '%son' matches any string ending with son.", "is_one_word": true}, {"source": "Udemy Practice Test 1", "theme": "Databricks Workspace & Navigation", "question": "Which statement correctly describes the purpose of Partner Connect in Databricks?", "type": "single", "options": [{"label": "A", "text": "Partner Connect is only available for data ingestion tools and cannot be used to connect BI or visualisation tools to Databricks"}, {"label": "B", "text": "Partner Connect is a feature that allows Databricks to automatically purchase licenses for third-party tools on behalf of the user"}, {"label": "C", "text": "Partner Connect replaces the need for SQL Warehouses by routing all external tool queries through the partner's compute infrastructure instead of Databricks compute"}, {"label": "D", "text": "Partner Connect provides a curated catalogue of pre-built integrations with partner tools such as Fivetran and Power BI, simplifying the process of connecting these external tools to Databricks by pre-populating connection settings"}], "correct_answers": ["D"], "explanation": "Correct: Partner Connect is a workspace feature that lists certified partner integrations across categories including data ingestion, BI, data quality, and security. For each partner it pre-populates connection configuration with the workspace's connection details, reducing the manual setup required to connect external tools to Databricks.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to use the ROLLUP operator to produce a report showing total sales at three levels: individual store, regional subtotals, and a company-wide grand total. The sales table has region, store_id, and sale_amount columns. Which query correctly produces all three levels?", "type": "single", "options": [{"label": "A", "text": "SELECT region, store_id, SUM(sale_amount) AS total_sales FROM sales GROUP BY region, store_id UNION ALL SELECT region, NULL, SUM(sale_amount) FROM sales GROUP BY region UNION ALL SELECT NULL, NULL, SUM(sale_amount) FROM sales"}, {"label": "B", "text": "SELECT region, store_id, SUM(sale_amount) AS total_sales FROM sales GROUP BY ROLLUP(region, store_id)"}, {"label": "C", "text": "SELECT region, store_id, SUM(sale_amount) AS total_sales FROM sales GROUP BY CUBE(region, store_id)"}, {"label": "D", "text": "SELECT region, store_id, SUM(sale_amount) AS total_sales FROM sales GROUP BY region, store_id, ROLLUP"}], "correct_answers": ["B"], "explanation": "Correct: GROUP BY ROLLUP(region, store_id) generates three aggregation levels. The most granular level groups by both region and store_id producing one row per store. The next level groups by region only (with NULL for store_id) producing regional subtotals. The final level groups by nothing (with NULL for both columns) producing the grand total. All three levels are returned in a single query.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to build a dashboard that shows sales performance at three levels of granularity: company-wide totals, regional totals, and individual store totals, all from the same underlying sales data. Rather than writing three separate queries the analyst wants a single query that produces all three levels. Which SQL feature correctly generates subtotals and a grand total in a single query?", "type": "single", "options": [{"label": "A", "text": "SELECT region, store_id, SUM(revenue) AS total_revenue FROM sales GROUP BY region, store_id UNION ALL SELECT region, NULL, SUM(revenue) FROM sales GROUP BY region UNION ALL SELECT NULL, NULL, SUM(revenue) FROM sales"}, {"label": "B", "text": "SELECT region, store_id, SUM(revenue) AS total_revenue FROM sales GROUP BY ROLLUP(region, store_id)"}, {"label": "C", "text": "SELECT region, store_id, SUM(revenue) AS total_revenue FROM sales GROUP BY GROUPING SETS ((region, store_id), (region), ())"}, {"label": "D", "text": "SELECT region, store_id, SUM(revenue) AS total_revenue FROM sales GROUP BY CUBE(region, store_id)"}], "correct_answers": ["B"], "explanation": "Correct: GROUP BY ROLLUP(region, store_id) generates three levels of aggregation in a single query: one row per region-store combination (store totals), one row per region with NULL store_id (regional totals), and one row with NULL region and NULL store_id (company grand total). This provides all three required levels without writing separate queries. GROUPING SETS ((region, store_id), (region), ()) is also equivalent for this three-level hierarchy.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Databricks SQL & Warehouses", "question": "Which two statements correctly describe the role of a SQL Warehouse in Databricks SQL?", "type": "multiple", "options": [{"label": "A", "text": "A SQL Warehouse is the compute resource that executes SQL queries in Databricks SQL, providing the processing power for query execution against Delta tables and other data sources"}, {"label": "B", "text": "SQL Warehouses support multiple concurrent users and can automatically scale by adding clusters when query demand increases beyond the capacity of a single cluster"}, {"label": "C", "text": "A SQL Warehouse stores the data for all Delta tables in the workspace, acting as both the compute and storage layer for Databricks SQL"}, {"label": "D", "text": "Each SQL Warehouse is dedicated to a single user and cannot be shared across multiple analysts or dashboard viewers"}], "correct_answers": ["A", "B"], "explanation": "Correct: SQL Warehouses are the compute layer for Databricks SQL. They execute queries submitted through the SQL Editor, dashboards, and alerts. They are multi-user compute resources that support concurrent query execution, and when concurrent demand exceeds a single cluster's capacity the warehouse can automatically scale out by adding additional clusters up to the configured maximum. They are purely compute resources and do not store data.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "AI/BI Dashboards & Visualization", "question": "Which of the following visualization types can be created using Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Counter, Table, and Pivot"}, {"label": "B", "text": "Treemap and Sunburst"}, {"label": "C", "text": "Heatmap and Radar chart"}, {"label": "D", "text": "Gantt chart and Venn diagram"}], "correct_answers": ["A"], "explanation": "Databricks SQL allows users to create Counter, Table, and Pivot visualizations. These visualization types are commonly used for displaying numerical data, tabular data, and summarizing data in a pivot table format. They are essential for data analysis and reporting tasks within Databricks.", "is_one_word": true}, {"source": "Udemy Practice Test 2", "theme": "AI/BI Dashboards & Visualization", "question": "What best describes how different visualizations tell different stories?", "type": "single", "options": [{"label": "A", "text": "Visualizations are only for aesthetics"}, {"label": "B", "text": "Bar charts might emphasize trends, while tables emphasize detailed values"}, {"label": "C", "text": "Only pie charts are appropriate for storytelling"}, {"label": "D", "text": "All visualization types provide the same insights"}], "correct_answers": ["B"], "explanation": "Bar charts are effective at highlighting trends and comparisons between different categories, making them ideal NT SELECT, MODIFY ON SCHEMA project_schema TO data_engineers; GRANT SELECT, CREATE VIEW ON SCHEMA project_schema TO business_analysts; GRANT SELECT ON TABLE project_schema.certified_table TO auditors;"}, {"label": "C", "text": "GRANT MODIFY ON SCHEMA project_schema TO data_engineers; GRANT READ ON SCHEMA project_schema TO business_analysts; GRANT READ ON TABLE project_schema.certified_table TO auditors;"}, {"label": "D", "text": "GRANT ALL PRIVILEGES ON SCHEMA project_schema TO data_engineers; GRANT SELECT ON SCHEMA project_schema TO business_analysts; GRANT SELECT ON TABLE project_schema.certified_table TO auditors;"}], "correct_answers": ["B"], "explanation": "This choice correctly grants the SELECT and MODIFY permissions on the project schema to data engineers, allowing them to read and write to all tables. It also grants SELECT and CREATE VIEW permissions to business analysts on the project schema, enabling them to read from tables and create views. Lastly, it grants SELECT permission on the specific certified table to auditors, restricting their access to only that table.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Data Modeling & Architecture", "question": "A data analyst is building a star schema for sales analytics. The fact table contains sales transactions with measures like sales_amount, quantity_sold, and discount_amount. The analyst needs to enable analysis by date, product, store, and customer. Which statement correctly describes the star schema structure for this requirement?", "type": "single", "options": [{"label": "A", "text": "Create a fact table connected to hubs and satellites"}, {"label": "B", "text": "Create a fact table with all dimension attributes included as columns to avoid joins"}, {"label": "C", "text": "Create a central fact table (sales_fact) with foreign keys to four dimension tables (dim_date, dim_product, dim_store, dim_customer), where each dimension table is denormalized and connects directly to the fact table"}, {"label": "D", "text": "Create multiple fact tables for each dimension to distribute the data evenly"}], "correct_answers": ["C"], "explanation": "In a star schema, the central fact table contains the measures (sales_amount, quantity_sold, discount_amount) and foreign keys to dimension tables (dim_date, dim_product, dim_store, dim_customer). Each dimension table is denormalized, meaning it contains all the relevant attributes for that dimension, and connects directly to the fact table for easy analysis by date, product, store, and customer.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Caching & Performance", "question": "Which of the following benefits does query result caching provide?", "type": "single", "options": [{"label": "A", "text": "Compresses query results into a ZIP file"}, {"label": "B", "text": "Speeds up query latency for repeated queries"}, {"label": "C", "text": "Eliminates the need for cluster compute"}, {"label": "D", "text": "Automatically indexes the database"}], "correct_answers": ["B"], "explanation": "Query result caching speeds up query latency for repeated queries by storing the results of previously executed queries in memory. This allows subsequent identical queries to retrieve the results from the cache instead of re-executing the query, resulting in faster response times.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "SQL Basics & Syntax", "question": "A data analyst executes the following command: CREATE OR REPLACE TEMP VIEW top_customers AS SELECT * FROM sales.customers WHERE purchases > 1000; They log out of Databricks shortly after. What happens to the top_customers view the next day?", "type": "single", "options": [{"label": "A", "text": "It will no longer exist and needs to be recreated"}, {"label": "B", "text": "It remains accessible from notebooks only"}, {"label": "C", "text": "It becomes read-only after session expiration"}, {"label": "D", "text": "It will persist as  information to existing data, which can provide more insights and context for analysis.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Delta Lake & Delta Tables", "question": "What problem does Liquid Clustering aim to solve in Databricks?", "type": "single", "options": [{"label": "A", "text": "Creating highly compressed file formats for storage savings"}, {"label": "B", "text": "Encrypting data at rest and in transit"}, {"label": "C", "text": "Ensuring data is replicated across multiple regions"}, {"label": "D", "text": "Improving performance by dynamically optimizing data layout as data changes"}], "correct_answers": ["D"], "explanation": "Liquid Clustering in Databricks aims to solve the problem of improving performance by dynamically optimizing data layout as data changes. It helps in organizing and storing data in a way that maximizes query performance and minimizes data movement, leading to faster and more efficient data processing.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "SQL Basics & Syntax", "question": "A data analyst is exploring a dataset that includes nested JSON columns. They want to extract values and filter based on inner attributes. Which of the following tools should they use for this task in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Scalar functions like mean() and sum()"}, {"label": "B", "text": "JOIN functions"}, {"label": "C", "text": "JSON_PATH queries with inline extraction"}, {"label": "D", "text": "Markdown queries"}, {"label": "E", "text": "Simple SELECT * statements"}], "correct_answers": ["C"], "explanation": "JSON_PATH queries with inline extraction are the most appropriate tool for extracting values and filtering based on inner attributes in nested JSON columns. This allows the data analyst to navigate through the nested structure of the JSON data and extract specific values efficiently.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "the : "They allow filtering of rows based on fixed values"}, {"label": "C", "text": "They store results as temporary views"}, {"label": "D", "text": "They summarize all rows into one result"}], "correct_answers": ["A"], "explanation": "Window functions in Databricks SQL allow for row-level calculations across partitions, which is particularly useful for analyzing time-based data. This enables users to perform calculations on specific rows within a partition without affecting the overall query results, providing a more granular analysis of the data.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "AI/BI Dashboards & Visualization", "question": "What makes a customizable table in Databricks SQL unique compared to a standard table output?", "type": "single", "options": [{"label": "A", "text": "It can only display the first 10 rows"}, {"label": "B", "text": "It allows conditional formatting and column-specific color rules"}, {"label": "C", "text": "It automatically refreshes every second"}, {"label": "D", "text": "It supports exporting to HTML only"}], "correct_answers": ["B"], "explanation": "Customizable tables in Databricks SQL allow users to apply conditional formatting and define specific color rules for individual columns. This feature enhances the visual representation of data and provides more flexibility in presenting information compared to standard table outputs.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Analytics Fundamentals", "question": "Which best describes the difference between discrete and continuous statistics?", "type": "single", "options": [{"label": "A", "text": "Discrete variables take specific separate values; continuous variables can take any value within a range"}, {"label": "B", "text": "Discrete values are for real-time data, continuous for batch processing"}, {"label": "C", "text": "Discrete deals with uncountable values, continuous with whole numbers"}, {"label": "D", "text": "Discrete statistics refer to numerical values, and continuous to categorical values"}], "correct_answers": ["A"], "explanation": "Discrete variables are distinct and separate, taking on specific values such as integers or whole numbers. Continuous variables, on the other hand, can take on any value within a range, including decimal values. This distinction is important in statistics as it affects the type of analysis and methods used for each type of variable.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Unity Catalog & Data Governance", "question": "A data analyst manages multiple tables across different schemas and needs to implement a tagging strategy to identify PII-containing columns and track data quality certification status.", "type": "single", "options": [{"label": "A", "text": "ALTER TABLE table_name SET TAGS ('pii' = 'true'); ALTER SCHEMA schema_name SET TAGS ('certified' = 'yes');"}, {"label": "B", "text": "UPDATE TABLE table_name ADD TAG pii; UPDATE SCHEMA schema_name ADD TAG certified;"}, {"label": "C", "text": "INSERT TAGS INTO table_name VALUES ('pii', 'true'); INSERT TAGS INTO schema_name VALUES ('certified', 'yes');"}, {"label": "D", "text": "CREATE TAG pii ON TABLE table_name; CREATE TAG certified ON SCHEMA schema_name;"}], "correct_answers": ["A"], "explanation": "The correct choice uses the ALTER TABLE and ALTER SCHEMA commands to set tags for identifying PII-containing columns and tracking data quality certification status. By setting tags at the table and schema level, the data analyst can easily manage and track the required information for each table and schema.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Databricks SQL & Warehouses", "question": "A team has noticed that their SQL endpoint takes longer to spin up before scheduled reports run. What's a cost-effective way to reduce this wait time?", "type": "single", "options": [{"label": "A", "text": "Enable Auto-stop at longer intervals"}, {"label": "B", ta Tables", "question": "What is a key benefit of Delta Lake compared to traditional data lakes?", "type": "single", "options": [{"label": "A", "text": "It replaces all SQL-based tools"}, {"label": "B", "text": "It only works with structured data"}, {"label": "C", "text": "It requires real-time streaming pipelines"}, {"label": "D", "text": "It provides ACID transactions for data reliability"}, {"label": "E", "text": "It stores data in proprietary formats"}], "correct_answers": ["D"], "explanation": "Delta Lake provides ACID transactions for data reliability, ensuring that data operations are atomic, consistent, isolated, and durable. This feature helps maintain data integrity and reliability in the data lake environment, which is a significant benefit compared to traditional data lakes.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "AI/BI Dashboards & Visualization", "question": "A dashboard is connected to a table that updates every few minutes via structured streaming. Stakeholders want near real-time results. What should the analyst mention before enabling fast dashboard refreshes?", "type": "single", "options": [{"label": "A", "text": "The table must be converted to Delta Live before usage"}, {"label": "B", "text": "Serverless endpoints don't support frequent dashboard refresh"}, {"label": "C", "text": "Dashboards can only be refreshed manually"}, {"label": "D", "text": "Frequent updates might increase latency in streaming jobs"}, {"label": "E", "text": "Enabling fast refresh could increase compute costs"}], "correct_answers": ["E"], "explanation": "Enabling fast dashboard refreshes could potentially increase compute costs as the system would need to process and update the data more frequently, leading to higher resource usage and costs.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "SQL Basics & Syntax", "question": "Which of the following is true about UDFs (User Defined Functions) in Databricks?", "type": "single", "options": [{"label": "A", "text": "UDFs are useful when built-in Spark functions don't meet your needs"}, {"label": "B", "text": "They can only be used in Scala and R"}, {"label": "C", "text": "UDFs cannot be reused across notebooks"}, {"label": "D", "text": "UDFs always run faster than built-in functions"}], "correct_answers": ["A"], "explanation": "UDFs are indeed useful when the built-in Spark functions do not provide the necessary functionality. They allow users to define custom logic and operations that are not available in the standard Spark functions, making them a valuable tool for data transformation and processing.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Databricks SQL & Warehouses", "question": "What happens if a dashboard's refresh schedule is set to a frequency less than the SQL Warehouse's \"Auto Stop\" setting?", "type": "single", "options": [{"label": "A", "text": "The dashboard refresh will start the warehouse if it's stopped, potentially increasing costs"}, {"label": "B", "text": "The dashboard refresh will fail unless manually triggered by the owner"}, {"label": "C", "text": "The dashboard will refresh using a cached version of the data to avoid restarting the warehouse"}, {"label": "D", "text": "The dashboard will wait until the next refresh period"}], "correct_answers": ["A"], "explanation": "Setting a dashboard's refresh schedule to a frequency less than the SQL Warehouse's \"Auto Stop\" setting means that the warehouse may be stopped when the dashboard needs to refresh. In this case, the dashboard refresh will start the warehouse if it's stopped, potentially increasing costs as the warehouse will be running more frequently.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Analytics Fundamentals", "question": "Which of the following best defines data blending?", "type": "single", "options": [{"label": "A", "text": "Formatting SQL outputs"}, {"label": "B", "text": "Combining data from two different data sources into one view"}, {"label": "C", "text": "Converting data to JSON for external use"}, {"label": "D", "text": "Merging two charts in the same dashboard"}], "correct_answers": ["B"], "explanation": "Data blending refers to the process of combining data from two different data sources into a single view or dataset. This allows analysts to create a comprehensive analysis by integrating information from multiple sources.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst needs to enable business users to ask natural language questions about sales data without writing SQL queries. The analyst wants a solution that can understand business terminology and generate accurate SQL automatically. Which Databricks feature should the analyst implement?", "type": "single", "options": [{"label": "A", "text": "An AI/BI Genie Space that allows users to ask questions in natural language and automatically generates SQL queries"}, {"label": "B", "text": "A Databricks Dashboard with pre-built visualizations that users can filter"}, {"label": "C", "text": "A Databricks SQL Editor with saved query templates for common questions"}, {"label": "D", "text": "A Databricks Notebook with interactive widgets for parameter input"}], "correct_answers": ["A"], "explanation": "An AI/BI Genie Space in Databricks is specifically designed to enable users to ask questions in natural language and automatically generate SQL queries. This feature understands business terminology and can accurately translate natural language queries into SQL, making it the ideal solution for the analyst's requirements.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Query Optimization & Performance", "question": "What is a key advantage of a Materialized View over a regular view?", "type": "single", "options": [{"label": "A", "text": "It requires no permissions to access the underlying tables"}, {"label": "B", "text": "It allows users to edit underlying data directly through the view"}, {"label": "C", "text": "It stores precomputed results for faster query performance"}, {"label": "D", "text": "It can only be used with streaming Delta tables"}], "correct_answers": ["C"], "explanation": "Materialized Views store precomputed results, which can significantly improve query performance by reducing the need to recompute the results every time the view is queried. This can lead to faster response times and more efficient data analysis.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to grant SELECT access on a table to the marketing_team group, but later discovers that this team should no longer have access to historical data. The analyst needs to remove their access.", "type": "single", "options": [{"label": "A", "text": "DROP PERMISSIONS SELECT ON TABLE sales_data WHERE user = 'marketing_team';"}, {"label": "B", "text": "REVOKE SELECT ON TABLE sales_data FROM marketing_team;"}, {"label": "C", "text": "REMOVE GRANT SELECT ON TABLE sales_data FOR marketing_team;"}, {"label": "D", "text": "DELETE PRIVILEGES ON TABLE sales_data FROM marketing_team;"}], "correct_answers": ["B"], "explanation": "The correct syntax to revoke SELECT access on a table from a specific group is using the REVOKE statement. In this case, the analyst needs to revoke SELECT access on the 'sales_data' table from the 'marketing_team' group, which is achieved by using the REVOKE SELECT ON TABLE sales_data FROM marketing_team; statement.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Databricks SQL & Warehouses", "question": "A senior data scientist mostly works in machine learning projects using Databricks ML, but occasionally uses Databricks SQL. What best describes their usage pattern?", "type": "single", "options": [{"label": "A", "text": "They use Databricks SQL only for Delta Live Tables"}, {"label": "B", "text": "They use Databricks SQL as a reporting tool only"}, {"label": "C", "text": "They don't use SQL-related tools at all"}, {"label": "D", "text": "They are a core user of Databricks SQL"}, {"label": "E", "text": "They treat Databricks SQL as a secondary or supporting tool"}], "correct_answers": ["E"], "explanation": "As a senior data scientist primarily focused on machine learning projects using Databricks ML, their main area of expertise lies in ML tasks. They may occasionally use Databricks SQL for data querying, exploration, or data preparation tasks that support their machine learning projects. Therefore, treating Databricks SQL as a secondary or supporting tool aligns with their overall usage pattern.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Delta Lake & Delta Tables", "question": "A data analyst notices that a frequently updated Delta table is consuming excessive storage. The table has a retention period configured for 7 days, and the analyst wants to remove old data files that are no longer needed while ensuring time travel capabilities are preserved for the required period.", "type": "single", "options": [{"label": "A", "text": "Verify that the table's retention period is set correctly, wait at least 7 days after the last update, then run VACUUM table_name RETAIN 168 HOURS"}, {"label": "B", "text": "Delete the table and recreate it to reclaim storage space"}, {"label": "C", "text": "Run VACUUM table_name RETAIN 0 HOURS to remove all unnecessary files instantly"}, {"label": "D", "text": "Run VACUUM table_name immediately to remove all old files"}], "correct_answers": ["A"], "explanation": "This choice is correct because it ensures that the retention period is set correctly and allows enough time for the necessary data to be retained for time travel capabilities. By waiting at least 7 days after the last update and then running VACUUM with the specified retention period, old data files that are no longer needed will be removed while preserving time travel capabilities for the required period.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "SQL Basics & Syntax", "question": "A data analyst uses this SQL command:\n\nSELECT region, sales\nFROM store_data\nWHERE sales >= 5000;\n\nWhich of the following describes the likely result?", "type": "single", "options": [{"label": "A", "text": "A syntax error due to incorrect SELECT clause"}, {"label": "B", "text": "A full table scan with grouped sales values"}, {"label": "C", "text": "No results are returned due to session limits"}, {"label": "D", "text": "A filtered list of high-performing regions"}, {"label": "E", "text": "A new table is created"}], "correct_answers": ["D"], "explanation": "The SQL command provided filters the 'store_data' table to only include rows where the 'sales' column is greater than or equal to 5000. Therefore, the likely result is a filtered list of regions that are considered high-performing based on the sales criteria specified in the WHERE clause.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Unity Catalog & Data Governance", "question": "A data analyst has created a Delta Share to provide customer analytics data to three external partner companies. Each partner should only see data relevant to their own customer segment, and the analyst needs to ensure partners cannot modify the source data. What is the correct approach to implement this requirement?", "type": "single", "options": [{"label": "A", "text": "Use Delta Sharing's built-in write-back feature to track any modifications made by partners"}, {"label": "B", "text": "Create three separate shares, each containing a filtered view of the data for the respective partner, ensuring recipients have read-only access by design"}, {"label": "C", "text": "Create one share with row-level security that dynamically filters based on the recipient's identity"}, {"label": "D", "text": "Grant each partner MODIFY permissions on the shared table with instructions not to change the data"}], "correct_answers": ["B"], "explanation": "Creating three separate shares, each containing filtered data for the respective partner, ensures that each partner only sees data relevant to their segment. By design, recipients will have read-only access, preventing them from modifying the source data and maintaining data integrity.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "SQL Basics & Syntax", "question": "How can a user create an external table in Databricks SQL using data stored in a cloud bucket like AWS S3 or Azure Blob?", "type": "single", "options": [{"label": "A", "text": "Copy the files to DBFS first"}, {"label": "B", "text": "Use the table UI wizard exclusively"}, {"label": "C", "text": "Use the LOCATION keyword in the CREATE TABLE statement"}, {"label": "D", "text": "Define the schema using Delta Live Templates"}, {"label": "E", "text": "Use FROM to specify the file path directly"}], "correct_answers": ["C"], "explanation": "Using the LOCATION keyword in the CREATE TABLE statement allows the user to specify the path to the data stored in a cloud bucket like AWS S3 or Azure Blob. This method creates an external table that references the data without physically moving it into Databricks, enabling efficient querying and analysis.", "is_one_word": false}, {"source": "Udemy Practice Test 2", "theme": "Delta Lake & Delta Tables", "question": "A user wants to restore a Delta table to a previous version. What command should they use?", "type": "single", "options": [{"label": "A", "text": "DELTA UNDO"}, {"label": "B", "text": "RESTORE TABLE TO VERSION"}, {"label": "C", "text": "SELECT PREVIOUS"}, {"label": "D", "text": "ROLLBACK TABLE"}, {"label": "E", "text": "TIME_REVERT"}], "correct_answers": ["B"], "explanation": "The correct command to restore a Delta table to a previous version is \"RESTORE TABLE TO VERSION\". This command allows the user to revert the Del , "options": [{"label": "A", "text": "Ensures new data matches the schema"}, {"label": "B", "text": "Automatically adjusts the schema"}, {"label": "C", "text": "Rejects all write operations"}, {"label": "D", "text": "Tracks data lineage"}], "correct_answers": ["A"], "explanation": "Delta Lake Schema Enforcement ensures new data matches the table's schema, rejecting non-conforming writes.", "is_one_word": false}, {"source": "Get Started SQL Analytics", "theme": "SQL Basics & Syntax", "question": "Which operation is considered a Data Manipulation Language (DML) operation?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE"}, {"label": "B", "text": "INSERT"}, {"label": "C", "text": "DESCRIBE HISTORY"}, {"label": "D", "text": "RESTORE TABLE"}], "correct_answers": ["B"], "explanation": "INSERT is a Data Manipulation Language (DML) operation. CREATE TABLE is DDL.", "is_one_word": true}, {"source": "Get Started SQL Analytics", "theme": "Unity Catalog & Data Governance", "question": "Unity Catalog helps Databricks deliver a unique business context by enabling what?", "type": "single", "options": [{"label": "A", "text": "Compute isolation"}, {"label": "B", "text": "Data lineage"}, {"label": "C", "text": "Automated ETL"}, {"label": "D", "text": "Cluster resizing"}], "correct_answers": ["B"], "explanation": "Unity Catalog delivers unique business context by enabling data lineage tracking across assets.", "is_one_word": true}, {"source": "Get Started SQL Analytics", "theme": "Databricks Workspace & Navigation", "question": "Databricks AI provides support for what type of application?", "type": "single", "options": [{"label": "A", "text": "Data Warehousing"}, {"label": "B", "text": "Domain-specific agentic applications"}, {"label": "C", "text": "Data ingestion"}, {"label": "D", "text": "BI Dashboard creation"}], "correct_answers": ["B"], "explanation": "Databricks AI (Mosaic AI) provides support for domain-specific agentic applications.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "SQL Basics & Syntax", "question": "You have created a standard view called sales_summary_vw that aggregates daily sales data from a transactions table. After creating the view, 100 new transactions are added to the transactions table. What happens when you query sales_summary_vw?", "type": "single", "options": [{"label": "A", "text": "The view automatically executes the stored query and includes the new transactions in the results"}, {"label": "B", "text": "The view returns an error because the underlying data has changed"}, {"label": "C", "text": "The view needs to be manually refreshed before it will include the new transactions"}, {"label": "D", "text": "The view returns the original data from when it was created, ignoring the new transactions"}], "correct_answers": ["A"], "explanation": "A standard view automatically executes its stored query each time it is queried, so it includes the new transactions in the results.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Unity Catalog & Data Governance", "question": "What powers the Databricks Marketplace's ability to share data?", "type": "single", "options": [{"label": "A", "text": "AWS S3"}, {"label": "B", "text": "Open Sharing"}, {"label": "C", "text": "Unity Catalog Metastore"}, {"label": "D", "text": "REST APIs"}], "correct_answers": ["B"], "explanation": "Open Sharing (Delta Sharing) powers the Databricks Marketplace's ability to share data across organizations.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Databricks SQL & Warehouses", "question": "What must you do before creating streaming tables with Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Install a Python library"}, {"label": "B", "text": "Request admin access"}, {"label": "C", "text": "Select a SQL warehouse"}, {"label": "D", "text": "Create a dashboard"}], "correct_answers": ["C"], "explanation": "You must select a SQL warehouse before creating streaming tables with Databricks SQL.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Databricks Workspace & Navigation", "question": "What is the primary purpose of using Catalog Explorer in Databricks?", "type": "single", "options": [{"label": "A", "text": "To write Python scripts"}, {"label": "B", "text": "To manage compute resources"}, {"label": "C", "text": "To discover and inspect datasets for analytics"}, {"label": "D", "text": "To monitor clusters"}], "correct_answers": ["C"], "explanation": "The primary purpose of Catalog Explorer is to discover and inspect datasets for analytics.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Unity Catalog & Data Governance", "question": "In the Catalog Explorer, which concept shows end-to-end flow of data?", "type": "single", "options": [{"label": "A", "text": "Object owner details"}, {"label": "B", "text": "Data access controls"}, {"label": "C", "text": "Data lineage"}, {"label": "D", "text": "Query history"}], "correct_answers": ["C"], "explanation": "Data lineage in Catalog Explorer shows the end-to-end flow of data across tables and transformations.", "is_one_word": true}, {"source": "SQL Analytics on Databricks", "theme": "Query Optimization & Performance", "question": "You run a complex SQL query with an INNER JOIN and GROUP BY in Databricks SQL. The query completes successfully but takes longer than expected. You want to understand why the query took that long and where time was spent during execution. Which tool should you use?", "type": "single", "options": [{"label": "A", "text": "Review warehouse monitoring metrics to understand overall system utilization"}, {"label": "B", "text": "Download query execution logs and analyze them outside of Databricks"}, {"label": "C", "text": "Use the query performance and query profile view to inspect execution stages, joins, and aggregations"}, {"label": "D", "text": "Re-run the query multiple times and compare execution"}], "correct_answers": ["C"], "explanation": "The query performance and query profile view lets you inspect execution stages, joins, and aggregations to understand performance.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "SQL Basics & Syntax", "question": "You have a CSV file named customer_data.csv stored in a Unity Catalog volume at /Volumes/company/marketing/files. The file includes a header row, and you want to create a table named customers from this file using read_files(). Which option correctly reads the CSV file and creates the table?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE customers AS SELECT * FROM read_files('/Volumes/company/marketing/files/customer_data.csv', header => True);"}, {"label": "B", "text": "CREATE TABLE customers AS SELECT * FROM read_files('/Volumes/company/marketing/files/customer_data.csv', header => true);"}, {"label": "C", "text": "CREATE TABLE customers AS SELECT * FROM read_files('/Volumes/company/marketing/files/customer_data.csv', header = True);"}, {"label": "D", "text": "COPY INTO customers FROM read_files('/Volumes/company/marketing/files/customer_data.csv') FILEFORMAT = CSV;"}], "correct_answers": ["B"], "explanation": "CREATE TABLE customers AS SELECT * FROM read_files() with header => true correctly reads the CSV and creates the table.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Unity Catalog & Data Governance", "question": "Which entity is responsible for granting privileges on data objects?", "type": "single", "options": [{"label": "A", "text": "Workspace Administrator"}, {"label": "B", "text": "Databricks Account Administrator"}, {"label": "C", "text": "Data object owner"}, {"label": "D", "text": "Billing Administrator"}], "correct_answers": ["C"], "explanation": "The data object owner is responsible for granting privileges on data objects in Unity Catalog.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Databricks SQL & Warehouses", "question": "You are a SQL developer who is used to working in traditional SQL editors for writing and running analytical queries. In Databricks, which tool provides the most similar experience?", "type": "single", "options": [{"label": "A", "text": "Databricks Notebooks"}, {"label": "B", "text": "Databricks SQL Editor"}, {"label": "C", "text": "LakeFlow Jobs"}, {"label": "D", "text": "LakeFlow Spark Declarative Pipelines"}], "correct_answers": ["B"], "explanation": "The Databricks SQL Editor provides the most similar experience to traditional SQL editors for writing and running queries.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "SQL Basics & Syntax", "question": "You have a table called sales_data with columns order_id, customer_id, order_amount, and sales_rep. You need to create a new column called order_category that classifies orders as: 'Small' for < $50,000; 'Medium' for $50,000-$200,000; 'Large' for > $200,000. Which query is correct?", "type": "single", "options": [{"label": "A", "text": "SELECT *, if(order_amount <= 50000, 'Small', if(order_amount <= 200000, 'Medium', 'Large')) AS order_category FROM sales_data;"}, {"label": "B", "text": "SELECT *, CASE WHEN order_amount <= 50000 THEN 'Small' WHEN order_amount > 50000 AND order_amount <= 200000 THEN 'Medium' ELSE 'Large' END AS order_category FROM sales_data;"}, {"label": "C", "text": "SELECT *, CATEGORIZE(order_amount, 50000, 200000, 'Small', 'Medium', 'Large') AS order_category FROM sales_data;"}, {"label": "D", "text": "SELECT *, CASE order_amount WHEN <= 50000 THEN 'Small' WHEN <= 200000 THEN 'Medium' ELSE 'Large' END AS order_category FROM sales_data;"}], "correct_answers": ["B"], "explanation": "The CASE WHEN expression with proper range conditions correctly classifies orders into Small, Medium, and Large categories.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Data Ingestion & Streaming", "question": "Which statement best describes the types of files you can upload to a Databricks volume?", "type": "single", "options": [{"label": "A", "text": "Structured, semi structured, and unstructured files such as CSV, JSON, images, or PDFs"}, {"label": "B", "text": "Only files smaller than 10 MB and in text format"}, {"label": "C", "text": "Only CSV files used for structured tables"}, {"label": "D", "text": "Only files that will be immediately converted into Delta tables"}], "correct_answers": ["A"], "explanation": "Databricks volumes support structured, semi-structured, and unstructured files such as CSV, JSON, images, or PDFs.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Data Modeling & Architecture", "question": "What is the hierarchical structure of the Unity Catalog namespace?", "type": "single", "options": [{"label": "A", "text": "Workspace.Table.Schema"}, {"label": "B", "text": "Metastore.Schema.Catalog"}, {"label": "C", "text": "Schema.Table.Catalog"}, {"label": "D", "text": "Catalog.Schema.Data object"}], "correct_answers": ["D"], "explanation": "The Unity Catalog namespace hierarchy is Catalog.Schema.Data object (e.g. table or volume).", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "SQL Basics & Syntax", "question": "How can you programmatically identify the owner of a Databricks object?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM INFORMATION_SCHEMA"}, {"label": "B", "text": "DESCRIBE TABLE EXTENDED statement"}, {"label": "C", "text": "QUERY PERFORMANCE statement"}, {"label": "D", "text": "SHOW SCHEMAS command"}], "correct_answers": ["B"], "explanation": "The DESCRIBE TABLE EXTENDED statement programmatically identifies the owner and other metadata of a Databricks object.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Query Optimization & Performance", "question": "You are working with a large dataset containing millions of customer transactions. You need to create a view that shows monthly sales summaries by department. This summary involves complex aggregations and joins that take several minutes to compute each time. The business team needs to access this data frequently throughout the day, but the underlying transaction data is only updated once every 4 hours. Which type of view is most appropriate?", "type": "single", "options": [{"label": "A", "text": "Create a standard view because it will always show the most up-to-date data"}, {"label": "B", "text": "Create a materialized view with manual refresh only, refreshing it whenever the business team requests updated data"}, {"label": "C", "text": "Create a materialized view with scheduled refresh every 4 hours to align with the data update frequency"}, {"label": "D", "text": "Create a temporary view because it's faster and doesn't take up storage space"}], "correct_answers": ["C"], "explanation": "A materialized view with scheduled refresh every 4 hours aligns with the data update frequency, providing fast access to precomputed results.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "SQL Basics & Syntax", "question": "Which SQL statement is recommended for creating Delta Lake tables from existing data in Databricks?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE _ AS SELECT (CTAS)"}, {"label": "B", "text": "INSERT INTO"}, {"label": "C", "text": "UPDATE TABLE"}, {"label": "D", "text": "DROP TABLE"}], "correct_answers": ["A"], "explanation": "CREATE TABLE AS SELECT (CTAS) is recommended for creating Delta Lake tables from existing data.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Unity Catalog & Data Governance", "question": "What is the main function of Unity Catalog in Databricks?", "type": "single", "options": [{"label": "A", "text": "To schedule jobs"}, {"label": "B", "text": "To manage user accounts"}, {"label": "C", "text": "To govern and manage datasets, including non-tabular files like CSVs"}, {"label": "D", "text": "To create dashboards"}], "correct_answers": ["C"], "explanation": "Unity Catalog's main function is to govern and manage datasets, including non-tabular files like CSVs.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Unity Catalog & Data Governance", "question": "Unity Catalog centrally manages security, audit, and management for what?", "type": "single", "options": [{"label": "A", "text": "Data and AI assets"}, {"label": "B", "text": "Databricks Account identities"}, {"label": "C", "text": "Cloud provider network settings"}, {"label": "D", "text": "Workspace level notebooks only"}], "correct_answers": ["A"], "explanation": "Unity Catalog centrally manages security, audit, and management for data and AI assets.", "is_one_word": false}, {"source": "SQL Analytics on Databricks", "theme": "Data Modeling & Architecture", "question": "What object sits at the top level of the data access hierarchy in Unity Catalog?", "type": "single", "options": [{"label": "A", "text": "Metastore"}, {"label": "B", "text": "Schema"}, {"label": "C", "text": "Workspace"}, {"label": "D", "text": "Table"}], "correct_answers": ["A"], "explanation": "The Metastore sits at the top level of the data access hierarchy in Unity Catalog.", "is_one_word": true}, {"source": "SQL Analytics on Databricks", "theme": "Data Modeling & Architecture", "question": "What is the primary benefit of setting a default catalog and schema in Databricks?", "type": "single", "options": [{"label": "A", "text": "Avoids using the full three level namespace"}, {"label": "B", "text": "Allows querying Hive tables"}, {"label": "C", "text": "Limits data visibility"}, {"label": "D", "text": "Enables cluster auto scaling"}], "correct_answers": ["A"], "explanation": "Setting a default catalog and schema avoids having to use the full three-level namespace in every query.", "is_one_word": false}, {"source": "SQL Analytic
