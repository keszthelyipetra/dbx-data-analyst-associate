nction extracts the numeric month from a DateType column. IN (1, 2) matches January (month 1) and February (month 2) across all years in the table. This is the most concise and correct approach.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to identify the top-performing sales representative in each region based on total revenue. If two representatives have the same revenue within a region both should be returned. Which window function correctly assigns the same rank to tied values without skipping subsequent rank numbers?", "type": "single", "options": [{"label": "A", "text": "ROW_NUMBER() OVER (PARTITION BY region ORDER BY total_revenue DESC)"}, {"label": "B", "text": "DENSE_RANK() OVER (PARTITION BY region ORDER BY total_revenue DESC)"}, {"label": "C", "text": "NTILE(1) OVER (PARTITION BY region ORDER BY total_revenue DESC)"}, {"label": "D", "text": "RANK() OVER (PARTITION BY region ORDER BY total_revenue DESC)"}], "correct_answers": ["B"], "explanation": "DENSE_RANK() assigns the same rank to tied values without skipping subsequent rank numbers. If two representatives are tied for first they both receive rank 1 and the next representative receives rank 2. Filtering WHERE dense_rank = 1 correctly returns all representatives tied for the top position.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query returning customers who placed their first order in 2024. The orders table has customer_id and order_date columns. Which query correctly identifies these customers?", "type": "single", "options": [{"label": "A", "text": "SELECT DISTINCT customer_id FROM orders WHERE order_date BETWEEN '2024-01-01' AND '2024-12-31' AND customer_id NOT IN (SELECT customer_id FROM orders WHERE order_date < '2024-01-01')"}, {"label": "B", "text": "SELECT customer_id FROM orders WHERE YEAR(order_date) = 2024"}, {"label": "C", "text": "SELECT customer_id FROM orders GROUP BY customer_id HAVING MIN(order_date) >= '2024-01-01' AND MIN(order_date) < '2025-01-01'"}, {"label": "D", "text": "SELECT customer_id FROM orders WHERE order_date = (SELECT MIN(order_date) FROM orders) AND YEAR(order_date) = 2024"}], "correct_answers": ["C"], "explanation": "Grouping by customer_id and applying HAVING on MIN(order_date) identifies customers whose earliest order falls within 2024. Customers whose first order was before 2024 have a MIN(order_date) earlier than 2024-01-01 and are excluded.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is designing a Genie space for a marketing team and wants to validate that Genie is producing accurate results before sharing it with end users. Which two actions correctly support this validation process?", "type": "multiple", "options": [{"label": "A", "text": "Add validated SQL queries for key marketing metrics as Trusted Assets so those specific metrics always use the pre-approved calculation rather than Genie-generated SQL"}, {"label": "B", "text": "Enable the automatic accuracy validation setting in the Genie space which runs all sample questions daily and flags any results that deviate from the previous day's answers"}, {"label": "C", "text": "Share the Genie space with all end users immediately and use their feedback to identify inaccuracies, fixing them after the space has been live for at least two weeks"}, {"label": "D", "text": "Ask representative questions in the Genie space and compare the generated SQL and results against known correct answers verified manually or through trusted reports"}, {"label": "E", "text": "Generate a Unity Catalog certification badge for the Genie space which automatically verifies that all queries produce statistically accurate results within a 5 percent margin of error"}], "correct_answers": ["A", "D"], "explanation": "Testing Genie by asking typical questions and comparing the generated SQL and results to known correct values is the primary method for validating accuracy, while adding Trusted Assets for critical metrics guarantees the use of pre-validated SQL. Together they form a comprehensive pre-launch validation approach.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Data Ingestion & Streaming", "question": "A data analyst is reviewing the Databricks Marketplace and wants to acquire a third-party dataset to enrich their internal customer data. After finding the dataset and clicking Get instant access, what happens next?", "type": "single", "options": [{"label": "A", "text": "The dataset provider receives the analyst's payment information and manually provisions access within 2 to 5 business days"}, {"label": "B", "text": "The dataset is ingested into a new managed Delta table in the analyst's default schema using Auto Loader to continuously sync updates from the provider"}, {"label": "C", "text": "The dataset files are automatically downloaded to the analyst's local machine as Parquet files for manual upload to the Databricks workspace"}, {"label": "D", "text": "The dataset is made available as a shared catalog in the analyst's Unity Catalog, accessible through the three-level namespace without the data being physically copied into the workspace's storage"}], "correct_answers": ["D"], "explanation": "Marketplace data products delivered via Delta Sharing appear as a shared catalog in the recipient's Unity Catalog. The data stays in the provider's storage and is accessed through the sharing protocol. The analyst can query the dataset using standard SQL as if it were any other catalog object.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst needs to create an AI/BI Dashboard that will be embedded in the company's internal web portal. The embedded dashboard should automatically display data relevant to the logged-in employee without requiring the employee to select their own department filter. Which approach supports this personalised embedding?", "type": "single", "options": [{"label": "A", "text": "Use a dynamic view as the dashboard data source that automatically filters data based on current_user() so each employee sees only their department's data without any URL parameter configuration"}, {"label": "B", "text": "Configure the dashboard to read the employee's department from a Unity Catalog user attribute that automatically filters all queries when the dashboard loads"}, {"label": "C", "text": "Create a separate dashboard for each department with hardcoded filters and link each department's portal page to its corresponding dashboard"}, {"label": "D", "text": "Embed the dashboard using an iframe with a URL parameter that passes the employee's department from the portal's authentication context to the dashboard as a pre-set filter value"}], "correct_answers": ["D"], "explanation": "Databricks AI/BI Dashboards support embedding with URL parameters that can pre-set filter values. The web portal can append the authenticated employee's department to the embed URL, causing the dashboard to load with that department's data already filtered without the employee needing to manually select it.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst is writing a query to find the second highest salary in a company. The employees table has a salary column. Which query correctly returns the second highest salary?", "type": "single", "options": [{"label": "A", "text": "SELECT salary FROM employees WHERE DENSE_RANK() OVER (ORDER BY salary DESC) = 2"}, {"label": "B", "text": "SELECT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1"}, {"label": "C", "text": "SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees)"}, {"label": "D", "text": "SELECT salary FROM employees ORDER BY salary ASC LIMIT 1 OFFSET 1"}], "correct_answers": ["C"], "explanation": "The inner subquery finds the overall maximum salary. The outer query then returns the maximum salary that is strictly less than that value, which is the second highest salary. This approach also correctly handles duplicate maximum salaries since it compares values rather than row positions.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A dashboard shows sales data filtered by a region parameter. When the region parameter is set to North the dashboard shows correct results. When it is changed to South the dashboard shows no data despite the underlying table containing South records. What is the most likely cause?", "type": "single", "options": [{"label": "A", "text": "The SQL Warehouse caches the North result and ignores the South parameter until the cache expires after 24 hours"}, {"label": "B", "text": "The visualisation widget is configured to only display the top 1 result by region and North always ranks higher than South alphabetically"}, {"label": "C", "text": "The region values in the underlying table use different capitalisation than the parameter value, for example SOUTH in the table versus South from the parameter widget"}, {"label": "D", "text": "The dashboard parameter widget only supports a single active value at a time and South exceeds the parameter character limit"}], "correct_answers": ["C"], "explanation": "String comparison in SQL is case-sensitive by default in Databricks SQL. If the table stores region values as SOUTH or south while the parameter passes South the WHERE clause region = {{region}} finds no matches. Using UPPER or LOWER on both sides of the comparison or using ILIKE resolves the case mismatch.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Databricks SQL & Warehouses", "question": "An operations team needs to be notified within minutes if the number of failed transactions in the last hour exceeds 50. They want the notification sent to their team Slack channel automatically. Which Databricks feature correctly implements this requirement?", "type": "single", "options": [{"label": "A", "text": "Create an AI/BI Dashboard with a counter showing the failed transaction count and configure a custom Slack integration that monitors the dashboard value"}, {"label": "B", "text": "Use a Lakeflow Job with a Python notebook that queries failed transactions and sends a Slack message using the requests library, triggered every 5 minutes"}, {"label": "C", "text": "Set up a Delta Live Tables pipeline with an expectation that fires when failed transactions exceed 50 and write a custom notification handler in the pipeline code"}, {"label": "D", "text": "Configure a Databricks SQL Alert on a query that counts failed transactions in the last hour, set the condition to Value > 50, and configure a Slack webhook as the notification destination"}], "correct_answers": ["D"], "explanation": "SQL Alerts are designed for exactly this use case. The alert runs a query on a schedule that counts recent failed transactions, evaluates the result against the Value > 50 condition, and sends an automatic notification to the configured Slack webhook destination when the condition is triggered.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns the names of all customers who have placed more than 5 orders AND whose total spend exceeds 1000. Which WHERE or HAVING clause correctly implements both conditions?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_id, COUNT(order_id) AS order_count, SUM(order_value) AS total_spend FROM orders GROUP BY customer_id HAVING order_count > 5 AND total_spend > 1000"}, {"label": "B", "text": "SELECT customer_id, COUNT(order_id) AS order_count, SUM(order_value) AS total_spend FROM orders GROUP BY customer_id HAVING COUNT(order_id) > 5 AND SUM(order_value) > 1000"}, {"label": "C", "text": "SELECT customer_id FROM orders GROUP BY customer_id HAVING COUNT(order_id) > 5 WHERE SUM(order_value) > 100"}, {"label": "D", "text": "SELECT customer_id, COUNT(order_id) AS order_count, SUM(order_value) AS total_spend FROM orders WHERE COUNT(order_id) > 5 AND SUM(order_value) > 1000 GROUP BY customer_id"}], "correct_answers": ["B"], "explanation": "Both conditions are post-aggregation filters on aggregate functions. HAVING correctly filters groups after the GROUP BY aggregation, applying both the order count threshold and the total spend threshold simultaneously using AND, and referencing the full aggregate expressions rather than SELECT-list aliases.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe how to implement column-level security in Unity Catalog to protect sensitive data?", "type": "multiple", "options": [{"label": "A", "text": "A column mask policy can be applied to a table column using ALTER TABLE to transform or hide the column's values for users who do not have the unmasked privilege, while authorised users see the original values"}, {"label": "B", "text": "Column-level security can only be applied to string columns and is not supported for numeric or date columns in Unity Catalog"}, {"label": "C", "text": "Column-level security in Unity Catalog is configured by setting the column to a private access mode using ALTER TABLE COLUMN SET ACCESS MODE PRIVATE"}, {"label": "D", "text": "Applying a column mask to a sensitive column automatically encrypts the column values at rest in the underlying Parquet files for additional storage-level protection"}, {"label": "E", "text": "A dynamic view can implement column-level security by using a CASE expression in the SELECT list that returns the actual column value for authorised users and a masked or NULL value for unauthorised users, based on IS_MEMBER() or current_user() conditions"}], "correct_answers": ["A", "E"], "explanation": "Unity Catalog column masks are applied using ALTER TABLE SET MASK policies that transform or NULL the value for users who do not match the authorisation condition, while dynamic views use a CASE expression evaluating the user's identity or group membership to return real or masked values. Both provide column-level security without modifying the stored data.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to write a query that returns all rows from a products table but adds a column showing the total count of all products. No GROUP BY should be used. Which query correctly adds the total count as a column alongside each row?", "type": "single", "options": [{"label": "A", "text": "SELECT product_id, product_name, COUNT(*) AS total_products FROM products GROUP BY product_id, product_name"}, {"label": "B", "text": "SELECT product_id, product_name, COUNT(*) OVER () AS total_products FROM products"}, {"label": "C", "text": "SELECT product_id, product_name, SUM(1) AS total_products FROM products GROUP BY product_id, product_name"}, {"label": "D", "text": "SELECT product_id, product_name, COUNT(*) AS total_products FROM products"}], "correct_answers": ["B"], "explanation": "COUNT(*) OVER () is a window function with an empty OVER clause, meaning the window encompasses all rows in the result set. It adds the total row count as a column to every row without collapsing the result, preserving all individual product rows.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is setting up a Genie space for a customer success team. The team frequently asks questions about customer churn rates. The analyst notices that Genie generates different SQL for similar churn questions depending on slight variations in phrasing, sometimes producing incorrect results. What is the most effective configuration to ensure consistent and accurate churn rate answers?", "type": "single", "options": [{"label": "A", "text": "Add all possible phrasing variations for churn questions as separate Trusted Assets, one for each way the team might ask the question"}, {"label": "B", "text": "Add a domain instruction to the Genie space defining how churn is calculated in the organisation, for example that a customer is considered churned if they have had no activity in 90 days, and add a Trusted Asset with the validated SQL for the churn rate calculation"}, {"label": "C", "text": "Restrict the Genie space to only answer exact keyword matches to approved questions, rejecting any question that uses different phrasing from the approved list"}, {"label": "D", "text": "Retrain the Genie model on the customer success team's historical questions and correct answers to improve its churn rate calculation accuracy"}], "correct_answers": ["B"], "explanation": "Domain instructions provide the business context that standardises how Genie interprets terminology like churn, and the Trusted Asset provides the exact pre-validated SQL Genie uses for churn rate questions. Together they ensure consistent, accurate results regardless of how the question is phrased.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst creates the following query but it returns zero rows despite knowing the data exists: SELECT * FROM orders WHERE order_status = 'completed' AND order_date = '2024-01-15' AND customer_id = NULL. What is the reason for the zero row result?", "type": "single", "options": [{"label": "A", "text": "The single quotes around completed indicate it is treated as a column reference rather than a string literal, which never matches any value in the order_status column"}, {"label": "B", "text": "The AND operator requires all three conditions to use the same column, and mixing different column conditions with AND is not supported in Databricks SQL"}, {"label": "C", "text": "The order_date column is stored as a TimestampType and cannot be compared to a date string using the equality operator without an explicit CAST"}, {"label": "D", "text": "The condition customer_id = NULL is never true for any row because NULL comparisons using the equality operator always return NULL rather than true, effectively filtering out all rows. The correct syntax is customer_id IS NULL"}], "correct_answers": ["D"], "explanation": "NULL comparisons using = always return NULL in SQL, which is treated as false in a WHERE clause, so no row satisfies customer_id = NULL. To test for NULL values the IS NULL operator must be used.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is building a Genie space for a finance team and wants to ensure that when users ask about revenue the answer always uses net revenue (revenue minus returns and discounts) rather than gross revenue. The underlying tables have separate columns for each component. Which configuration in the Genie space correctly enforces this business rule?", "type": "single", "options": [{"label": "A", "text": "Rename the gross revenue column to gross_revenue_do_not_use in the source table so Genie avoids using it when answering revenue questions"}, {"label": "B", "text": "Add a domain instruction to the Genie space stating that revenue always means net revenue calculated as revenue minus returns minus discounts, and add a Trusted Asset SQL query that implements this calculation for revenue-related questions"}, {"label": "C", "text": "Create a calculated column in the underlying Delta table that pre-computes net revenue so Genie always finds it as a single column rather than needing to calculate it"}, {"label": "D", "text": "Add a column tag of net_revenue to the relevant columns in Unity Catalog so Genie automatically uses tagged columns when answering revenue questions"}], "correct_answers": ["B"], "explanation": "Domain instructions provide context to Genie about how business terms should be interpreted, so defining revenue as net revenue guides Genie's SQL generation. Adding a Trusted Asset with the exact SQL formula guarantees specific revenue metric questions always use the correct pre-validated calculation.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Query Optimization & Performance", "question": "A data analyst is reviewing a Databricks SQL query that runs successfully but returns unexpected results. The query uses multiple joins and the analyst suspects a data fan-out issue where rows are being unexpectedly multiplied. Which approach in the Query Profiler helps identify whether row multiplication is occurring?", "type": "single", "options": [{"label": "A", "text": "Examine the number of output rows reported for each Join node in the Query Profiler and compare them to the expected row counts. If a join node outputs significantly more rows than either input table the join condition may be producing a many-to-many match causing fan-out"}, {"label": "B", "text": "Run ANALYZE TABLE on all joined tables to refresh statistics which automatically corrects fan-out issues by updating the query plan"}, {"label": "C", "text": "Check the Duration column for each operator node to identify which node takes the longest to execute, as the slowest node is always the one causing row multiplication"}, {"label": "D", "text": "Add DISTINCT to the SELECT list which always resolves fan-out issues by removing duplicate rows introduced by many-to-many joins"}], "correct_answers": ["A"], "explanation": "The Query Profiler shows input and output row counts for each operator. A join that outputs more rows than either of its inputs indicates multiple rows from one table are matching multiple rows from the other, causing row multiplication. This is the key diagnostic signal for fan-out issues.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query returning all employees who earn more than the average salary in their own department. Which query correctly achieves this using a correlated subquery?", "type": "single", "options": [{"label": "A", "text": "SELECT e.employee_id, e.name, e.salary, e.department FROM employees e WHERE e.salary > (SELECT AVG(salary) FROM employees WHERE department = e.department)"}, {"label": "B", "text": "SELECT e.employee_id, e.name, e.salary, e.department FROM employees e WHERE e.salary > (SELECT AVG(salary) FROM employees WHERE department = 'Sales')"}, {"label": "C", "text": "SELECT e.employee_id, e.name, e.salary, e.department FROM employees e WHERE e.salary > (SELECT AVG(salary) FROM employees)"}, {"label": "D", "text": "SELECT employee_id, name, salary, department FROM employees WHERE salary > AVG(salary) OVER (PARTITION BY department)"}], "correct_answers": ["A"], "explanation": "The correlated subquery references e.department from the outer query to calculate the average salary for each employee's specific department. For each outer row the subquery executes with that row's department value, returning only employees earning above their own departmental average.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that identifies customers who placed orders in both 2023 and 2024. Which set operation query correctly returns only customers present in both years?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_id FROM orders WHERE YEAR(order_date) = 2023 INTERSECT SELECT customer_id FROM orders WHERE YEAR(order_date) = 2024"}, {"label": "B", "text": "SELECT customer_id FROM orders WHERE YEAR(order_date) = 2023 EXCEPT SELECT customer_id FROM orders WHERE YEAR(order_date) = 2024"}, {"label": "C", "text": "SELECT customer_id FROM orders WHERE YEAR(order_date) = 2023 UNION ALL SELECT customer_id FROM orders WHERE YEAR(order_date) = 2024"}, {"label": "D", "text": "SELECT customer_id FROM orders WHERE YEAR(order_date) = 2023 UNION SELECT customer_id FROM orders WHERE YEAR(order_date) = 2024"}], "correct_answers": ["A"], "explanation": "INTERSECT returns only the rows that appear in both result sets. This correctly returns customer_ids that appear in both the 2023 orders and the 2024 orders, identifying customers who were active in both years.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is designing a dashboard for an executive team that needs to quickly understand business performance across four key metrics: total revenue, number of active customers, average order value, and customer satisfaction score. The executives want to see all four metrics prominently at a glance without scrolling. What is the most effective dashboard layout approach?", "type": "single", "options": [{"label": "A", "text": "Create a single table widget with four rows each showing one metric name and its current value"}, {"label": "B", "text": "Create four separate dashboards each dedicated to one metric with navigation links between them"}, {"label": "C", "text": "Create a multi-line chart with all four metrics plotted as separate lines on the same y-axis to show their trends simultaneously"}, {"label": "D", "text": "Place four Counter widgets in a single row at the top of the dashboard each displaying one key metric with its label, followed by supporting trend charts below"}], "correct_answers": ["D"], "explanation": "Counter widgets arranged in a row provide the most prominent at-a-glance display for key metrics, letting executives immediately see all four values without scrolling. Supporting trend charts placed below provide additional context, following the standard executive dashboard pattern of leading with KPIs.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Delta Lake & Delta Tables", "question": "A data analyst runs OPTIMIZE on a Delta table and subsequently notices that time travel queries for versions older than the pre-OPTIMIZE state are returning errors. What is the most likely explanation?", "type": "single", "options": [{"label": "A", "text": "OPTIMIZE compacts small files into larger ones and removes the original small files from storage. If VACUUM was also run after OPTIMIZE with a short retention period the original files needed for pre-OPTIMIZE time travel were permanently deleted"}, {"label": "B", "text": "OPTIMIZE rewrites the Delta transaction log from scratch, removing all version history prior to the optimization run"}, {"label": "C", "text": "OPTIMIZE automatically runs VACUUM with a zero-hour retention period as part of its execution to reclaim storage immediately after compaction"}, {"label": "D", "text": "Time travel queries always fail after OPTIMIZE because compacted files use a different format that is incompatible with the Delta time travel mechanism"}], "correct_answers": ["A"], "explanation": "OPTIMIZE rewrites data into new compacted files and marks the original small files as deleted in the transaction log, but they remain on storage until VACUUM removes them. If VACUUM was run after OPTIMIZE with a retention period shorter than the age of the desired time travel version, the original files are permanently deleted, making time travel to those versions impossible.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns the total revenue per region but only for regions where the total revenue exceeds 100000. The orders table has columns region and revenue. Which query correctly filters based on the aggregate result?", "type": "single", "options": [{"label": "A", "text": "SELECT region, SUM(revenue) AS total_revenue FROM orders WHERE SUM(revenue) > 100000 GROUP BY region"}, {"label": "B", "text": "SELECT region, SUM(revenue) AS total_revenue FROM orders GROUP BY region HAVING COUNT(*) > 100000"}, {"label": "C", "text": "SELECT region, SUM(revenue) AS total_revenue FROM orders GROUP BY region HAVING SUM(revenue) > 100000"}, {"label": "D", "text": "SELECT region, SUM(revenue) AS total_revenue FROM orders WHERE revenue > 100000 GROUP BY region"}], "correct_answers": ["C"], "explanation": "HAVING filters the results of a GROUP BY aggregation. It is evaluated after the GROUP BY and aggregate functions are computed, making it the correct clause for filtering groups based on aggregate values such as SUM(revenue) > 100000.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Delta Lake & Delta Tables", "question": "Which two statements correctly describe the behaviour of the VACUUM command on Delta tables?", "type": "multiple", "options": [{"label": "A", "text": "VACUUM removes data files that are no longer referenced by the current version of the Delta table and are older than the specified retention period, freeing up cloud storage space"}, {"label": "B", "text": "After VACUUM completes the data that was stored in the deleted files can be recovered using Delta Lake time travel commands"}, {"label": "C", "text": "VACUUM compacts small files into larger optimised files and removes the originals to improve query performance on subsequent reads"}, {"label": "D", "text": "Running VACUUM with a retention period shorter than 7 days requires setting spark.databricks.delta.retentionDurationCheck.enabled to false, which is generally not recommended in production as it risks deleting files needed for concurrent readers or time travel"}, {"label": "E", "text": "VACUUM can be safely run with a 0 hour retention period in production to maximise storage reclamation without any risk to query performance or data integrity"}], "correct_answers": ["A", "D"], "explanation": "VACUUM identifies files no longer referenced by the current Delta table state and permanently deletes those older than the retention threshold, reclaiming storage. Delta Lake enforces a minimum 7-day default retention to protect concurrent readers and time travel, so bypassing it requires disabling the retention check, which should be avoided in production.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Databricks Workspace & Navigation", "question": "A data analyst is given access to a new Databricks workspace and needs to explore what data assets are available to them before writing any queries. Which tool in the Databricks workspace is most appropriate for browsing available catalogs, schemas, tables, and their descriptions without writing SQL?", "type": "single", "options": [{"label": "A", "text": "A Genie space, where the analyst can ask what tables are available in natural language and Genie will list all accessible data assets"}, {"label": "B", "text": "The Catalog Explorer in the Databricks workspace, which provides a visual hierarchical browser of all Unity Catalog objects the analyst has access to, including table descriptions, column details, sample data, and lineage"}, {"label": "C", "text": "The SQL Editor, where the analyst can run SHOW CATALOGS, SHOW SCHEMAS, and SHOW TABLES commands to discover available data assets"}, {"label": "D", "text": "The Query History panel in Databricks SQL, which shows all tables that have been queried in the workspace and can be used to discover what data is available"}], "correct_answers": ["B"], "explanation": "Catalog Explorer is the purpose-built data discovery tool in the Databricks workspace. It displays the full Unity Catalog hierarchy visually and lets analysts browse catalogs, schemas, and tables, view column definitions, read descriptions and comments, preview sample data, and see lineage without writing any SQL.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to grant a reporting group read access to all current and future tables in the prod.gold schema without granting any other privileges. Which grant statement correctly covers both existing and future tables?", "type": "single", "options": [{"label": "A", "text": "GRANT SELECT ON ALL TABLES IN SCHEMA prod.gold TO reporting_group; ALTER DEFAULT PRIVILEGES IN SCHEMA prod.gold GRANT SELECT ON TABLES TO reporting_group"}, {"label": "B", "text": "GRANT SELECT ON SCHEMA prod.gold TO reporting_group"}, {"label": "C", "text": "GRANT ALL PRIVILEGES ON FUTURE TABLES IN SCHEMA prod.gold TO reporting_group"}, {"label": "D", "text": "GRANT SELECT ON ALL TABLES IN SCHEMA prod.gold TO reporting_group"}], "correct_answers": ["A"], "explanation": "The two-statement approach covers both cases: GRANT SELECT ON ALL TABLES IN SCHEMA grants SELECT on all currently existing tables, while ALTER DEFAULT PRIVILEGES configures Unity Catalog to automatically grant SELECT to the reporting_group on any new tables created in the schema, ensuring future tables are covered without additional manual grants.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "An organisation stores customer contact data in a table that includes email addresses, phone numbers, and physical addresses. A new regulation requires that any analyst querying this table from a European IP address must only see masked versions of these contact fields. Which Unity Catalog feature most precisely supports this dynamic IP-based access restriction?", "type": "single", "options": [{"label": "A", "text": "Add a CHECK constraint to the contact columns that validates IP ranges before returning data"}, {"label": "B", "text": "Use VACUUM on the contact columns to remove historical versions of contact data that might be accessible to European analysts through time travel"}, {"label": "C", "text": "Set delta.columnMasking.enableIPFilter = true on the table to activate built-in IP-based masking"}, {"label": "D", "text": "Create a dynamic view that uses a CASE expression to return masked contact values based on current_user() group membership, granting European analysts membership in a group that triggers the masking logic"}], "correct_answers": ["D"], "explanation": "Dynamic views using IS_MEMBER() or current_user() can implement context-aware masking. By placing European analysts in a specific group and using IS_MEMBER() in the CASE expression, the view returns masked values for group members and real values for others, enforcing the restriction by group assignment.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Data Ingestion & Streaming", "question": "A data analyst needs to load a CSV file that has been uploaded to a Unity Catalog volume into a new managed Delta table. The CSV has a header row and uses a comma delimiter. Which SQL statement correctly creates and populates the table from the file?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE prod.silver.customers USING CSV LOCATION '/Volumes/prod/raw/customers.csv' OPTIONS (header = 'true')"}, {"label": "B", "text": "CREATE TABLE prod.silver.customers AS SELECT * FROM read_files('/Volumes/prod/raw/customers.csv', format => 'csv', header => 'true', inferSchema => 'true')"}, {"label": "C", "text": "COPY INTO prod.silver.customers FROM '/Volumes/prod/raw/customers.csv' FILEFORMAT = CSV COPY_OPTIONS ('header' = 'true')"}, {"label": "D", "text": "INSERT INTO prod.silver.customers SELECT * FROM '/Volumes/prod/raw/customers.csv'"}], "correct_answers": ["B"], "explanation": "CREATE TABLE AS SELECT with read_files() reads the CSV from the Unity Catalog volume path and creates a new managed Delta table with the inferred schema. The format, header, and inferSchema options correctly configure the CSV reader, and the resulting table stores the data independently of the source file.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "Which of the following correctly describes the purpose of the system.access audit logs in Unity Catalog and how they support data governance?", "type": "single", "options": [{"label": "A", "text": "The system.access audit logs store the actual query results for every SELECT statement executed in the workspace, allowing administrators to review the data that was returned to each user"}, {"label": "B", "text": "The system.access audit logs are only available to workspace administrators and cannot be queried by data analysts or data stewards regardless of their role or permissions"}, {"label": "C", "text": "The system.access audit logs record all compute events such as cluster starts and stops, enabling administrators to track resource usage and identify unused compute resources"}, {"label": "D", "text": "The system.access audit logs automatically record all data access events including who queried which tables, when permissions were granted or revoked, and what data was read or modified, enabling organisations to demonstrate compliance with data governance policies"}], "correct_answers": ["D"], "explanation": "Unity Catalog system.access tables capture a comprehensive audit trail of data governance events, including SELECT queries on tables, permission changes such as GRANT and REVOKE, and DML operations. Organisations use these logs to demonstrate compliance with regulations such as GDPR and HIPAA by showing who accessed sensitive data and when.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Delta Lake & Delta Tables", "question": "Which Databricks SQL command is used to examine the transaction history of a Delta table and identify who performed the most recent write operation?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM table_name DESCRIBE HISTORY"}, {"label": "B", "text": "EXPLAIN HISTORY table_name"}, {"label": "C", "text": "DESCRIBE HISTORY table_name"}, {"label": "D", "text": "SHOW HISTORY table_name"}], "correct_answers": ["C"], "explanation": "DESCRIBE HISTORY returns the full audit trail of all commits on a Delta table. Each row represents one transaction and includes the version number, timestamp, userName of the user or service principal who performed the operation, and the operation type such as WRITE, MERGE, or OPTIMIZE, with the first row being the most recent commit.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Analytics Fundamentals", "question": "A data analyst is building a query to track weekly cohort retention. For each week a customer first made a purchase (their cohort week) the analyst wants to see what percentage of those customers also made a purchase in each subsequent week. The purchases table has columns customer_id and purchase_week. Which approach correctly structures this analysis?", "type": "single", "options": [{"label": "A", "text": "SELECT cohort_week, COUNT(DISTINCT customer_id) AS cohort_size FROM (SELECT customer_id, MIN(purchase_week) AS cohort_week FROM purchases GROUP BY customer_id) GROUP BY cohort_week"}, {"label": "B", "text": "SELECT customer_id, MIN(purchase_week) AS first_purchase, MAX(purchase_week) AS last_purchase, MAX(purchase_week) - MIN(purchase_week) AS customer_lifespan FROM purchases GROUP BY customer_id"}, {"label": "C", "text": "SELECT cohort_week, purchase_week, COUNT(DISTINCT customer_id) / MAX(cohort_size) * 100 AS retention_pct FROM (SELECT p.customer_id, c.first_week AS cohort_week, p.purchase_week, COUNT(DISTINCT c.customer_id) OVER (PARTITION BY c.first_week) AS cohort_size FROM purchases p JOIN (SELECT customer_id, MIN(purchase_week) AS first_week FROM purchases GROUP BY customer_id) c ON p.customer_id = c.customer_id) GROUP BY cohort_week, purchase_week ORDER BY cohort_week, purchase_week"}, {"label": "D", "text": "SELECT purchase_week, COUNT(DISTINCT customer_id) AS active_customers, COUNT(DISTINCT customer_id) / SUM(COUNT(DISTINCT customer_id)) OVER () * 100 AS retention_pct FROM purchases GROUP BY purchase_week"}], "correct_answers": ["C"], "explanation": "The inner subquery joins each purchase to the customer's first purchase week to identify their cohort and uses a window function to calculate cohort size. The outer aggregation counts distinct active customers per cohort per week and divides by the cohort size to produce the retention percentage, correctly structuring a cohort retention analysis.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst is exploring a new Delta table and wants to see a sample of the first 10 rows to understand the data structure and content. Which SQL query is most appropriate for this purpose?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM prod.silver.events LIMIT 10"}, {"label": "B", "text": "SELECT TOP 10 * FROM prod.silver.events"}, {"label": "C", "text": "SELECT * FROM prod.silver.events ROWNUM <= 10"}, {"label": "D", "text": "SELECT * FROM prod.silver.events WHERE ROWNUM <= 10"}], "correct_answers": ["A"], "explanation": "SELECT * with LIMIT 10 returns the first 10 rows from the table, providing a quick sample of all columns and their values. This is the standard and most direct approach for exploring a table's content and structure in Databricks SQL.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "A data analyst wants to understand how data flows from raw ingestion tables through to the Gold layer dashboards in their Unity Catalog environment. Which feature provides a visual representation of this end-to-end data lineage?", "type": "single", "options": [{"label": "A", "text": "DESCRIBE HISTORY on each table in the pipeline to trace which operations wrote data at each stage"}, {"label": "B", "text": "The Query Profiler in Databricks SQL which shows the execution plan of a query as a directed acyclic graph of operator nodes"}, {"label": "C", "text": "The lineage graph in Unity Catalog Catalog Explorer, which shows upstream sources and downstream consumers for each table including how columns are derived from source columns"}, {"label": "D", "text": "The Databricks Jobs run history which logs which notebooks and SQL queries ran in each pipeline execution"}], "correct_answers": ["C"], "explanation": "Unity Catalog's lineage feature in Catalog Explorer provides an interactive visual graph showing how data flows between tables. For each table it shows upstream tables that contributed data and downstream tables or dashboards that consume it, including column-level lineage showing how individual columns are derived from source columns.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Data Ingestion & Streaming", "question": "Which two statements correctly describe how Auto Loader handles schema evolution when ingesting files from cloud storage?", "type": "multiple", "options": [{"label": "A", "text": "Auto Loader automatically enforces schema constraints and rejects any file that contains a column not present in the originally inferred schema, raising an error that stops the pipeline"}, {"label": "B", "text": "When Auto Loader detects a new column in incoming files that does not exist in the current schema it can automatically add the new column to the target table's schema and continue ingestion without manual intervention"}, {"label": "C", "text": "Auto Loader uses schema inference to detect the schema of incoming files on the first run and stores this inferred schema in a checkpoint location, avoiding the cost of re-inferring the schema on every microbatch"}, {"label": "D", "text": "Auto Loader and COPY INTO provide identical schema evolution capabilities and the choice between them has no impact on how schema changes are handled"}, {"label": "E", "text": "Auto Loader requires the source file schema to be explicitly defined by the analyst using a StructType before the pipeline can start ingesting files"}], "correct_answers": ["B", "C"], "explanation": "Auto Loader supports schema evolution by detecting new columns in incoming files and, when configured, automatically adding them to the target table schema without stopping the pipeline. It also infers the schema from the first batch of files and stores it in the checkpoint directory, so subsequent runs load the stored schema rather than re-inferring, improving efficiency.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to create a SQL query that categorises customers into three spending tiers based on their total annual spend: Platinum for spend over 10000, Gold for spend between 5000 and 10000 inclusive, and Silver for spend below 5000. Which query correctly implements this tiering?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_id, total_spend, IIF(total_spend > 10000, 'Platinum', IIF(total_spend >= 5000, 'Gold', 'Silver')) AS tier FROM customer_spend"}, {"label": "B", "text": "SELECT customer_id, total_spend, CASE WHEN total_spend >= 5000 THEN 'Gold' WHEN total_spend > 10000 THEN 'Platinum' ELSE 'Silver' END AS tier FROM customer_spend"}, {"label": "C", "text": "SELECT customer_id, total_spend, DECODE(total_spend, 10000, 'Platinum', 5000, 'Gold', 'Silver') AS tier FROM customer_spend"}, {"label": "D", "text": "SELECT customer_id, total_spend, CASE WHEN total_spend > 10000 THEN 'Platinum' WHEN total_spend >= 5000 THEN 'Gold' ELSE 'Silver' END AS tier FROM customer_spend"}], "correct_answers": ["D"], "explanation": "CASE WHEN evaluates conditions in order and returns the first matching result. total_spend > 10000 identifies Platinum first, so total_spend >= 5000 correctly captures the 5000 to 10000 range for Gold, and ELSE assigns Silver to the rest.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Data Ingestion & Streaming", "question": "A data analyst needs to load data incrementally from a cloud storage location where new files are added daily. The analyst wants to avoid reprocessing files that have already been loaded in previous runs. Which feature of COPY INTO makes it suitable for this incremental loading pattern?", "type": "single", "options": [{"label": "A", "text": "COPY INTO maintains an internal record of files that have already been successfully loaded and skips those files in subsequent runs, ensuring each file is processed exactly once without manual file tracking"}, {"label": "B", "text": "COPY INTO uses a distributed shuffle to detect duplicate rows across all loaded files and automatically removes them from the target Delta table"}, {"label": "C", "text": "COPY INTO automatically detects the most recently modified file in the source directory and loads only that single file on each run, ignoring all previously loaded files"}, {"label": "D", "text": "COPY INTO requires the analyst to pass a list of new file names as a parameter on each run to specify which files should be loaded, preventing reprocessing of existing files"}], "correct_answers": ["A"], "explanation": "COPY INTO is idempotent by design. It maintains a load history in the Delta transaction log and skips files already successfully processed, making it safe to re-run repeatedly on the same source location without duplicating data.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Delta Lake & Delta Tables", "question": "A business intelligence team has built a dashboard showing weekly revenue trends. During a team review meeting, the head of finance asks why last month's revenue figures look different from what was reported in the previous month's board presentation. Which Delta Lake capability allows the analyst to retrieve the exact data that powered the previous month's report?", "type": "single", "options": [{"label": "A", "text": "DESCRIBE HISTORY to find the version number from last month and RESTORE TABLE to revert the current table to that version permanently"}, {"label": "B", "text": "Run VACUUM RETAIN 0 HOURS to restore the table to its original clean state from before last month's changes"}, {"label": "C", "text": "Create a new table using CREATE TABLE AS SELECT on a backup copy stored in an archive storage bucket"}, {"label": "D", "text": "SELECT with TIMESTAMP AS OF specifying last month's date to retrieve a read-only snapshot of the table as it existed when the previous report was generated"}], "correct_answers": ["D"], "explanation": "Delta Lake time travel using TIMESTAMP AS OF retrieves a read-only snapshot of the table at the specified historical point in time without modifying the current table state, enabling direct comparison with current figures.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to understand the schema of a Delta table including column names, data types, nullable flags, and any column comments. Which SQL command provides the most detailed column-level metadata?", "type": "single", "options": [{"label": "A", "text": "SHOW TABLES IN prod.silver"}, {"label": "B", "text": "SELECT * FROM prod.silver.orders LIMIT 0"}, {"label": "C", "text": "SHOW COLUMNS IN prod.silver.orders"}, {"label": "D", "text": "DESCRIBE TABLE EXTENDED prod.silver.orders"}], "correct_answers": ["D"], "explanation": "DESCRIBE TABLE EXTENDED returns all the information provided by DESCRIBE TABLE plus additional metadata such as table properties, storage location, creation time, table type, and partition information, giving the most comprehensive view of both column-level and table-level metadata.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst needs to implement a dashboard that shows sales performance against target. The target is 1 million in monthly revenue and the current month's revenue is stored in a query result column called current_revenue. Which visualisation type most effectively communicates progress toward the target as a single prominent indicator?", "type": "single", "options": [{"label": "A", "text": "A scatter plot with current_revenue on the x-axis and the target value on the y-axis showing one data point"}, {"label": "B", "text": "A Counter widget configured to display current_revenue with a target comparison that highlights whether the value is above or below the 1 million target"}, {"label": "C", "text": "A line chart showing current_revenue as a single data point on a timeline"}, {"label": "D", "text": "A histogram showing the distribution of monthly revenue values from previous months to contextualise the current month's performance"}], "correct_answers": ["B"], "explanation": "Counter widgets in Databricks AI/BI Dashboards support target comparison configuration. The widget displays the current value prominently and can visually indicate whether it is above or below the configured target, making it the most effective single-metric progress indicator.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "The data team has a policy requiring all Delta tables in the prod catalog to have a comment describing their purpose. Which SQL command adds a description to an existing table?", "type": "single", "options": [{"label": "A", "text": "DESCRIBE TABLE prod.gold.sales_summary ADD COMMENT 'Pre-aggregated daily sales summary for executive dashboards'"}, {"label": "B", "text": "COMMENT ON TABLE prod.gold.sales_summary IS 'Pre-aggregated daily sales summary for executive dashboards'"}, {"label": "C", "text": "UPDATE TABLE prod.gold.sales_summary SET comment = 'Pre-aggregated daily sales summary for executive dashboards'"}, {"label": "D", "text": "ALTER TABLE prod.gold.sales_summary SET TBLPROPERTIES ('description' = 'Pre-aggregated daily sales summary for executive dashboards')"}], "correct_answers": ["B"], "explanation": "COMMENT ON TABLE ... IS is the standard SQL command for setting a table description in Databricks SQL. The comment is stored as the table's description in Unity Catalog and displayed prominently in Catalog Explorer's table details panel.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that replaces the value in a revenue column with zero whenever it is negative, leaving positive values unchanged. Which SQL expression correctly implements this?", "type": "single", "options": [{"label": "A", "text": "IF(revenue < 0, NULL, revenue)"}, {"label": "B", "text": "CASE WHEN revenue < 0 THEN 0 ELSE revenue END"}, {"label": "C", "text": "ABS(revenue)"}, {"label": "D", "text": "NULLIF(revenue, 0)"}], "correct_answers": ["B"], "explanation": "CASE WHEN evaluates the condition and returns 0 for negative values and the original revenue value for non-negative values. This is the standard SQL conditional replacement pattern for clamping values at a minimum threshold.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to create a reusable SQL snippet that calculates customer lifetime value and can be referenced by name in multiple queries without creating a permanent table or view. Which Databricks SQL feature supports this within a single query execution?", "type": "single", "options": [{"label": "A", "text": "A Common Table Expression (CTE) defined at the top of the query with the WITH keyword that calculates CLV and can be referenced by name multiple times within the same query execution"}, {"label": "B", "text": "A saved query in the SQL Editor that calculates CLV and can be imported by other queries using an IMPORT statement"}, {"label": "C", "text": "A temporary function created with CREATE TEMPORARY FUNCTION that encapsulates the CLV calculation and can be called by name in any query within the current session"}, {"label": "D", "text": "A Materialised View named clv_calculation that pre-computes CLV and can be referenced by name in other queries across sessions"}], "correct_answers": ["A"], "explanation": "CTEs defined with the WITH keyword are the correct tool for creating named reusable calculation blocks within a single query. The CLV calculation is defined once and referenced by name wherever needed in the main query body, avoiding repetition.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns all products and the total quantity sold for each product, including products that have never been sold with a quantity of zero rather than NULL. The products table and the order_items table are joined on product_id. Which query correctly handles products with no sales?", "type": "single", "options": [{"label": "A", "text": "SELECT p.product_id, p.product_name, COALESCE(SUM(oi.quantity), 0) AS total_quantity FROM products p LEFT JOIN order_items oi ON p.product_id = oi.product_id GROUP BY p.product_id, p.product_name"}, {"label": "B", "text": "SELECT p.product_id, p.product_name, COALESCE(SUM(oi.quantity), 0) AS total_quantity FROM products p RIGHT JOIN order_items oi ON p.product_id = oi.product_id GROUP BY p.product_id, p.product_name"}, {"label": "C", "text": "SELECT p.product_id, p.product_name, SUM(oi.quantity) AS total_quantity FROM products p INNER JOIN order_items oi ON p.product_id = oi.product_id GROUP BY p.product_id, p.product_name"}, {"label": "D", "text": "SELECT p.product_id, p.product_name, SUM(oi.quantity) AS total_quantity FROM products p LEFT JOIN order_items oi ON p.product_id = oi.product_id GROUP BY p.product_id, p.product_name"}], "correct_answers": ["A"], "explanation": "LEFT JOIN returns all rows from the products table including those with no matching order_items. For products with no sales the columns are NULL, so SUM returns NULL and COALESCE converts the NULL sum to zero, correctly showing 0.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Query Optimization & Performance", "question": "A data analyst writes a query joining five tables and notices it is very slow. The Query Profiler shows a SortMergeJoin node processing 2 billion rows with high spill to disk. Which two actions most directly address this performance issue?", "type": "multiple", "options": [{"label": "A", "text": "Split the query into multiple smaller queries that each join two or three tables and store intermediate results in temporary tables"}, {"label": "B", "text": "Add a more selective WHERE clause filter on the large fact table before the join to reduce the number of rows entering the join operation"}, {"label": "C", "text": "Convert all five tables to CSV format which has lower shuffle overhead than Delta Lake for large join operations"}, {"label": "D", "text": "Increase the number of shuffle partitions by setting spark.sql.shuffle.partitions to a higher value to give the SortMergeJoin more partitions to work with"}, {"label": "E", "text": "Check whether any of the joined tables are small enough to broadcast and add BROADCAST hints for those tables to replace the SortMergeJoin with broadcast joins that avoid shuffling the large table"}], "correct_answers": ["B", "E"], "explanation": "Reducing the row count of the large table with a selective early filter cuts the work the SortMergeJoin must perform, and broadcasting a small table with a BROADCAST hint eliminates the shuffle for the large table side entirely, both reducing shuffle volume and spill.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is creating a dashboard for a retail operations team and wants to include a visualisation that shows the geographic distribution of store locations across the country. Which visualisation type is most appropriate?", "type": "single", "options": [{"label": "A", "text": "A bar chart with store location names on the x-axis and latitude values on the y-axis"}, {"label": "B", "text": "A scatter plot with longitude on the x-axis and latitude on the y-axis showing one point per store"}, {"label": "C", "text": "A line chart connecting store locations in the order they were added to the database"}, {"label": "D", "text": "A map visualisation with store locations plotted as markers using latitude and longitude coordinates, showing the geographic spread and density of store locations across the country"}], "correct_answers": ["D"], "explanation": "Map visualisations are designed for geographic data. Plotting store locations as markers using latitude and longitude coordinates immediately communicates the geographic distribution, clustering, and coverage gaps in a way no other chart type can achieve.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Query Optimization & Performance", "question": "A data analyst is troubleshooting a slow query that joins two large Delta tables. The Query Profiler shows an Exchange node with very high data volume between the scan and join stages. What does the Exchange node represent and what does high volume at this stage indicate?", "type": "single", "options": [{"label": "A", "text": "The Exchange node represents a shuffle operation where data is redistributed across executor nodes to align rows with matching join keys. High volume indicates large amounts of data are being moved across the network, which may be reduced by using a broadcast join for the smaller table or ensuring both tables are bucketed on the join key"}, {"label": "B", "text": "The Exchange node represents data being written to a temporary disk location for spill management. High volume indicates insufficient executor memory and the warehouse should be scaled up"}, {"label": "C", "text": "The Exchange node represents the transfer of query results from the SQL Warehouse back to the client. High volume indicates the query returns too many rows and a LIMIT clause should be added"}, {"label": "D", "text": "The Exchange node represents data being read from cloud storage. High volume indicates the Delta tables are stored in a suboptimal file format and should be converted to Parquet for better performance"}], "correct_answers": ["A"], "explanation": "The Exchange node in the Spark execution plan represents a shuffle where rows are redistributed across partitions based on the join key. High data volume means significant network transfer, which can be mitigated by broadcasting the smaller table or bucketing both tables on the join key.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Databricks SQL & Warehouses", "question": "Which two statements correctly describe how Databricks SQL Warehouses support multiple concurrent users?", "type": "multiple", "options": [{"label": "A", "text": "Each user connected to a SQL Warehouse receives a dedicated isolated cluster that is reserved exclusively for their queries to ensure consistent performance"}, {"label": "B", "text": "SQL Warehouses use a round-robin query routing strategy that distributes queries equally across all running clusters regardless of each cluster's current load or available capacity"}, {"label": "C", "text": "SQL Warehouses require manual cluster management where administrators must manually start and stop clusters based on observed query queue lengths"}, {"label": "D", "text": "A SQL Warehouse can automatically scale out by adding additional compute clusters when concurrent query demand increases, distributing queries across multiple clusters to reduce waiting time"}, {"label": "E", "text": "Each cluster within a SQL Warehouse can execute multiple queries concurrently, with the warehouse routing incoming queries to available clusters based on current load"}], "correct_answers": ["D", "E"], "explanation": "SQL Warehouses support multi-cluster autoscaling: when concurrent queries exceed capacity the warehouse automatically starts additional clusters up to the configured maximum, and each cluster executes multiple queries concurrently with the query router distributing load across available clusters.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Data Ingestion & Streaming", "question": "A data analyst has been asked to prepare a one-time data load from a set of JSON files stored in a Unity Catalog volume into a Delta table. The table already exists and the analyst wants to load all files from the directory once without setting up a continuous ingestion pipeline. Which SQL command is most appropriate?", "type": "single", "options": [{"label": "A", "text": "COPY INTO target_table FROM '/Volumes/prod/raw/json_files/' FILEFORMAT = JSON"}, {"label": "B", "text": "Auto Loader configured with a trigger once setting to process all files in the directory and then stop"}, {"label": "C", "text": "CREATE OR REPLACE STREAMING TABLE target_table AS SELECT * FROM STREAM read_files('/Volumes/prod/raw/json_files/', format => 'json')"}, {"label": "D", "text": "CREATE TABLE target_table AS SELECT * FROM read_files('/Volumes/prod/raw/json_files/', format => 'json')"}], "correct_answers": ["A"], "explanation": "COPY INTO is designed for batch loading files from cloud storage into an existing Delta table. It reads all files from the specified path in the given format and inserts them, while tracking loaded files so it is safe to re-run without duplicating data.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to share a dataset with an external business partner who uses a different cloud platform and does not have access to the company's Databricks workspace. The partner should be able to query the data using their own tools. Which Databricks feature enables this cross-platform data sharing?", "type": "single", "options": [{"label": "A", "text": "Grant the external partner a guest user account in the Databricks workspace with read-only access to the relevant tables through Unity Catalog"}, {"label": "B", "text": "Export the Delta table to CSV files and upload them to a shared cloud storage bucket that the partner can access with their credentials"}, {"label": "C", "text": "Use Delta Sharing to create a share containing the relevant tables and provide the partner with a sharing credential that allows them to query the data using their own tools including open source Delta Sharing clients"}, {"label": "D", "text": "Create a public SQL Warehouse endpoint that the partner can connect to using standard JDBC without requiring workspace authentication"}], "correct_answers": ["C"], "explanation": "Delta Sharing is the open protocol designed for sharing live Delta Lake data with external recipients across platforms and cloud providers. The recipient uses a sharing credential to access the shared tables with Delta Sharing compatible clients without needing a Databricks workspace.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to identify all transactions where the discount_amount column contains either a NULL value or a value of zero, as both indicate no discount was applied. Which WHERE clause correctly captures both conditions?", "type": "single", "options": [{"label": "A", "text": "WHERE NVL(discount_amount, 0) = 0"}, {"label": "B", "text": "WHERE discount_amount IS NULL OR discount_amount = 0"}, {"label": "C", "text": "WHERE discount_amount = 0 OR discount_amount = NULL"}, {"label": "D", "text": "WHERE discount_amount != NULL AND discount_amount != 0"}], "correct_answers": ["B"], "explanation": "IS NULL correctly identifies rows where discount_amount has no value, and the equality check discount_amount = 0 identifies rows where a zero discount was explicitly recorded. OR combines both conditions so rows matching either are returned.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "SQL Basics & Syntax", "question": "A data analyst creates a line chart on a dashboard showing daily website visits over the past 90 days. A stakeholder requests that the chart also show a 7-day rolling average line to smooth out day-of-week patterns. Which change to the underlying query correctly adds the rolling average?", "type": "single", "options": [{"label": "A", "text": "Add a self-join to the query joining the table to itself on dates within a 7-day range and averaging the joined rows"}, {"label": "B", "text": "Add a GROUP BY ROLLUP(visit_date) to the query which automatically generates rolling average subtotals for the date hierarchy"}, {"label": "C", "text": "Add MOVING_AVERAGE(daily_visits, 7) to the SELECT list which is the built-in Databricks SQL moving average function"}, {"label": "D", "text": "Add AVG(daily_visits) OVER (ORDER BY visit_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS rolling_7day_avg to the SELECT list"}], "correct_answers": ["D"], "explanation": "The window function AVG with ROWS BETWEEN 6 PRECEDING AND CURRENT ROW calculates the average of the current day and the six preceding days, producing a 7-day rolling average as an additional column without changing the row structure.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Caching & Performance", "question": "Two analysts are working on the same project and both need to query the prod.silver.transactions table frequently throughout the day. After the first analyst runs a query it completes in 45 seconds. The second analyst runs the identical query three minutes later and it completes in under one second. What explains the difference in execution time?", "type": "single", "options": [{"label": "A", "text": "The second analyst's query used a larger SQL Warehouse cluster that had been autoscaled up while the first query was running"}, {"label": "B", "text": "The first analyst's query warmed up the JVM on the SQL Warehouse executor nodes making subsequent queries faster through compiled code caching"}, {"label": "C", "text": "The Databricks SQL result cache served the second analyst's query from the stored result of the first execution because the query text was identical and the underlying table had not changed between executions"}, {"label": "D", "text": "The transactions table was automatically partitioned by the query engine after the first execution making subsequent scans faster"}], "correct_answers": ["C"], "explanation": "Databricks SQL result caching automatically stores the complete result of a query. When an identical query is submitted within the cache validity window and the underlying table data has not changed, the cached result is returned immediately without re-executing the query.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe how Unity Catalog handles privilege inheritance across the three-level namespace hierarchy?", "type": "multiple", "options": [{"label": "A", "text": "Granting USE CATALOG on a catalog does not automatically grant access to any schemas or tables within that catalog. Separate USE SCHEMA and SELECT grants are required at each level for full query access"}, {"label": "B", "text": "Granting SELECT on a table automatically grants USE SCHEMA on the parent schema and USE CATALOG on the parent catalog to avoid permission errors when querying the table"}, {"label": "C", "text": "Granting ALL PRIVILEGES on a schema automatically grants the same privileges on all existing and future tables within that schema without requiring separate table-level grants"}, {"label": "D", "text": "Revoking a privilege at a higher level of the hierarchy such as revoking USE CATALOG automatically revokes the effective access to all objects within that catalog even if lower-level grants remain in place"}, {"label": "E", "text": "A user who is a metastore admin automatically has SELECT access on all tables in all catalogs without requiring explicit grants at any level"}], "correct_answers": ["A", "D"], "explanation": "Unity Catalog follows an explicit non-cascading grant model. USE CATALOG enables navigation but does not grant access to schemas or tables, so each level needs its own grant; conversely revoking a higher-level privilege such as USE CATALOG blocks all access to lower-level objects even if lower grants remain.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to query a table in a different Unity Catalog from the one currently active in their session. The target table is in the reporting catalog, the metrics schema, and is named monthly_kpis. Which query correctly accesses this table using the full three-level namespace?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM reporting.metrics.monthly_kpis"}, {"label": "B", "text": "SELECT * FROM metrics.monthly_kpis"}, {"label": "C", "text": "USE CATALOG reporting; SELECT * FROM monthly_kpis"}, {"label": "D", "text": "SELECT * FROM CATALOG reporting SCHEMA metrics TABLE monthly_kpis"}], "correct_answers": ["A"], "explanation": "The full three-level namespace syntax in Unity Catalog is catalog.schema.table. reporting.metrics.monthly_kpis correctly references the monthly_kpis table in the metrics schema of the reporting catalog regardless of which catalog is currently active in the session.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst needs to build a dashboard that refreshes automatically every hour and sends an alert if the daily order count drops below 500. Which two Databricks SQL features are required to implement both the automatic refresh and the alert?", "type": "multiple", "options": [{"label": "A", "text": "A Delta Live Tables pipeline that continuously monitors the orders table and triggers dashboard refreshes when the row count changes"}, {"label": "B", "text": "A scheduled dashboard refresh configured to run every hour to ensure the dashboard visualisations show up-to-date order counts"}, {"label": "C", "text": "A Materialised View that pre-aggregates daily order counts and is queried by both the dashboard and the alert to reduce compute duplication"}, {"label": "D", "text": "A Genie space configured with domain instructions that monitor order counts and send notifications when volumes change"}, {"label": "E", "text": "A SQL Alert based on a query that counts daily orders with the condition Value < 500, configured with a notification destination to send alerts when the threshold is breached"}], "correct_answers": ["B", "E"], "explanation": "A scheduled dashboard refresh automatically re-executes dashboard queries on a defined schedule to keep visualisations current, while a SQL Alert monitors a specific query result against a threshold and sends notifications when the condition is met. The two features operate independently.", "is_one_word": false}, {"source": "Udemy Exam Practice 5", "theme": "Query Optimization & Performance", "question": "A data analyst has a query that takes 3 minutes to run. After examining the Query Profiler the analyst sees that a HashAggregate node is consuming 80 percent of the total query time. The query groups by a high-cardinality customer_id column and sums order values. What is the most likely cause and recommended action?", "type": "single", "options": [{"label": "A", "text": "The HashAggregate node is only used for string columns and the analyst should cast customer_id to an integer type to enable the more efficient SortAggregate instead"}, {"label": "B", "text": "The HashAggregate is slow because the high-cardinality customer_id column causes the aggregation to process many distinct groups requiring significant memory and potentially spilling to disk. Pre-filtering to reduce row count before aggregation or repartitioning on customer_id may help"}, {"label": "C", "text": "HashAggregate always performs poorly for GROUP BY operations and the analyst should rewrite the query using window functions instead to avoid aggregation entirely"}, {"label": "D", "text": "The HashAggregate is slow because the GROUP BY column contains null values. The analyst should add WHERE customer_id IS NOT NULL to eliminate nulls before aggregation"}], "correct_answers": ["B"], "explanation": "High-cardinality GROUP BY columns force the aggregation engine to track many distinct group states simultaneously. If the number of distinct groups exceeds available memory the aggregation spills to disk, so reducing input rows with an early filter or partitioning on the GROUP BY key reduces aggregation cost.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Query Optimization & Performance", "question": "A data analyst migrating lakehouse workloads to Databricks manages a large table with thousands of columns and billions of rows and is concerned about scan performance, query speed, and processing overhead. In which two ways does the Photon engine help? (Choose two.)", "type": "multiple", "options": [{"label": "A", "text": "Photon automatically parallelizes all queries across multiple clusters without configuration."}, {"label": "B", "text": "Photon automatically merges small files into one large file before processing."}, {"label": "C", "text": "Photon uses a caching layer to transcode data into a CPU-efficient format for faster scans."}, {"label": "D", "text": "Photon uses a columnar, vectorized execution engine for efficient scans and aggregations."}, {"label": "E", "text": "Photon processes data row by row for maximum compatibility with legacy systems."}], "correct_answers": ["C", "D"], "explanation": "Photon's columnar, vectorized execution processes data in batches using modern CPU/SIMD instructions, and its caching/transcoding into a CPU-efficient layout speeds scans on very wide, huge tables. Row-by-row processing, automatic multi-cluster parallelism, and file merging aren't Photon's mechanisms.", "is_one_word": false}, {"source": "Udemy Test A", "theme": "Data Modeling & Architecture", "question": "Engineers build medallion pipelines in Delta Live Tables, and an analysis team consuming the gold-layer tables needs to do extra project-specific processing before analyzing them. What is this kind of work called?", "type": "single", "options": [{"label": "A", "text": "Data enhancement"}, {"label": "B", "text": "Data testing"}, {"label": "C", "text": "Last-mile ETL"}, {"label": "D", "text": "Data blending"}, {"label": "E", "text": "Last-mile dashboarding"}], "correct_answers": ["C"], "explanation": "Project-specific transformation applied to gold-layer data right before analysis is known as last-mile ETL: the final preparation step performed by analysts on top of the engineered tables.", "is_one_word": true}, {"source": "Udemy Test A", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is setting up a new AI/BI Genie space in Databricks for natural-language querying with high-quality, governed responses. Which component is essential for configuring a Genie space that returns accurate, useful results?", "type": "single", "options": [{"label": "A", "text": "Well-annotated datasets registered to Unity Catalog, curated sample queries, and domain-specific instructions to guide natural-language translation."}, {"label": "B", "text": "A standalone chatbot application integrated with Databricks through custom APIs."}, {"label": "C", "text": "A dedicated physical server allocated to the Genie space for availability and scalability."}, {"label": "D", "text": "An external data warehouse configured to store and replicate all data used by the Genie space."}], "correct_answers": ["A"],
