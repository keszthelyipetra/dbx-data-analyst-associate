s on Databricks", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to programmatically explore their Databricks environment. They want to view all schemas in the 'production' catalog and then see all tables in the 'sales' schema within that catalog. Which SQL statements should they use in the correct order?", "type": "single", "options": [{"label": "A", "text": "SHOW CATALOG; USE CATALOG production; SHOW TABLES IN sales;"}, {"label": "B", "text": "SHOW SCHEMAS IN production; SHOW TABLES IN production.sales;"}, {"label": "C", "text": "SET DEFAULT CATALOG production; SHOW SCHEMAS; SHOW TABLES IN sales;"}, {"label": "D", "text": "USE SCHEMA sales; SHOW SCHEMAS; SHOW TABLES;"}], "correct_answers": ["B"], "explanation": "SHOW SCHEMAS IN production; then SHOW TABLES IN production.sales; correctly lists schemas in the catalog and tables in the schema.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "Which of the following correctly describes how data lineage works in Unity Catalog and what information it provides?", "type": "single", "options": [{"label": "A", "text": "Data lineage in Unity Catalog tracks the physical movement of data files between storage locations, showing which cloud buckets data was copied to or from"}, {"label": "B", "text": "Data lineage in Unity Catalog requires analysts to manually document table relationships using tags and annotations before lineage information becomes visible in the Catalog Explorer"}, {"label": "C", "text": "Data lineage is only available for Delta tables created through Delta Live Tables pipelines and is not captured for tables created through SQL queries or notebooks"}, {"label": "D", "text": "Data lineage in Unity Catalog automatically captures upstream and downstream dependencies between tables and columns, showing which tables or queries produced a table and which downstream tables or dashboards consume it"}], "correct_answers": ["D"], "explanation": "Unity Catalog lineage records how data flows through the platform. For a given table it shows which upstream sources produced it and which downstream objects depend on it, and column-level lineage shows how individual columns are derived from source columns.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "Which of the following correctly describes how row-level security can be implemented in Unity Catalog to restrict which rows a user can see in a table?", "type": "single", "options": [{"label": "A", "text": "Create a dynamic view that includes a WHERE clause referencing current_user() or IS_MEMBER() functions to filter rows based on the identity of the querying user, then grant access to the view instead of the underlying table"}, {"label": "B", "text": "Apply a row filter using the ALTER TABLE command to add a FILTER clause that restricts rows based on column values for all users equally"}, {"label": "C", "text": "Grant SELECT permission on specific row ranges using GRANT SELECT ON ROWS to define which rows each user group can access"}, {"label": "D", "text": "Enable row-level security by setting the spark.databricks.rowLevelSecurity configuration property to true on the SQL Warehouse"}], "correct_answers": ["A"], "explanation": "Dynamic views support row-level security by embedding user identity functions such as current_user() and IS_MEMBER() in the WHERE clause. Users querying the view see only the rows permitted for their identity, and access to the underlying table is replaced with access to the view.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Data Modeling & Architecture", "question": "Which of the following correctly describes the Medallion Architecture and how it aligns with standard data modelling approaches?", "type": "single", "options": [{"label": "A", "text": "The Medallion Architecture replaces the need for star and snowflake schemas by storing all data in a single Bronze table that combines raw, cleaned, and aggregated data in one location"}, {"label": "B", "text": "The Medallion Architecture has three layers — Bronze, Silver, and Gold — where Bronze contains raw ingested data, Silver contains cleaned and enriched data, and Gold contains business-level aggregated data optimised for analytics and reporting"}, {"label": "C", "text": "The Medallion Architecture requires all three layers to be implemented using Delta Live Tables and cannot be built using standard SQL or notebook-based pipelines"}, {"label": "D", "text": "The Medallion Architecture is a security model where Bronze tables are public, Silver tables are internal, and Gold tables are restricted to senior management only"}], "correct_answers": ["B"], "explanation": "The Medallion Architecture is a layered data design pattern. Bronze is the raw landing zone preserving source data as-is, Silver applies cleaning, deduplication, and enrichment, and Gold contains business-level aggregations and dimensional models optimised for consumption by BI tools and analysts.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "Which of the following correctly describes the difference between a managed table and an external table in Unity Catalog?", "type": "single", "options": [{"label": "A", "text": "A managed table supports time travel and versioning while an external table does not support Delta Lake features"}, {"label": "B", "text": "A managed table stores data in the Unity Catalog managed storage location and dropping the table also deletes the underlying data files. An external table points to a user-specified storage location and dropping the table does not delete the underlying data files."}, {"label": "C", "text": "A managed table is only accessible to the table owner while an external table can be shared with other users"}, {"label": "D", "text": "A managed table stores data in a location specified by the user while an external table stores data in the default Unity Catalog managed storage location"}], "correct_answers": ["B"], "explanation": "For managed tables Unity Catalog owns and manages the data lifecycle including deletion. For external tables the data files are owned by the user and persist after the table is dropped.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Data Ingestion & Streaming", "question": "Which two statements correctly describe the Auto Loader feature in Databricks?", "type": "multiple", "options": [{"label": "A", "text": "Auto Loader automatically detects and ingests new files arriving in a cloud storage location such as S3 or ADLS incrementally without reprocessing previously ingested files"}, {"label": "B", "text": "Auto Loader can only ingest JSON files and does not support CSV, Parquet, or other file formats"}, {"label": "C", "text": "Auto Loader requires the analyst to manually specify the list of new files to ingest in each pipeline run"}, {"label": "D", "text": "Auto Loader supports schema evolution, automatically updating the target table schema when new columns are detected in incoming files"}, {"label": "E", "text": "Auto Loader permanently deletes source files from cloud storage after ingestion to prevent duplicate processing"}], "correct_answers": ["A", "D"], "explanation": "Auto Loader monitors a cloud storage directory and processes only newly arrived files using file notification or directory listing mode, tracking processed files so they are not reprocessed. It also includes schema inference and evolution, automatically updating the target table schema when new columns appear.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "SQL Basics & Syntax", "question": "An analyst is reviewing a query that was written by a colleague and is not producing the expected results. The query is: SELECT product_id, product_name, category FROM products WHERE category = 'Electronics' AND price > 500 OR discount > 0.1. The analyst expects to see only Electronics products that are either priced above 500 or have a discount above 10 percent. What is wrong with the query?", "type": "single", "options": [{"label": "A", "text": "The OR operator is not supported in Databricks SQL WHERE clauses and should be replaced with a UNION of two separate SELECT statements"}, {"label": "B", "text": "AND has higher operator precedence than OR, so the query is evaluated as: category = Electronics AND price > 500, OR any product with discount > 0.1 regardless of category. Parentheses are needed to group the OR conditions correctly."}, {"label": "C", "text": "The WHERE clause cannot combine AND and OR conditions in the same query and the query should use a CASE statement instead"}, {"label": "D", "text": "The query is missing a GROUP BY product_id clause which is required whenever multiple filter conditions are combined in a WHERE clause"}], "correct_answers": ["B"], "explanation": "In SQL AND binds more tightly than OR. Without parentheses the query returns all Electronics products priced above 500 plus all products from any category with a discount above 10 percent. The correct query wraps the OR conditions in parentheses: WHERE category = 'Electronics' AND (price > 500 OR discount > 0.1).", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst wants to display a summary table alongside a line chart on the same dashboard page, with both visualisations filtered by the same date range parameter. What is the correct approach to achieve this in an AI/BI Dashboard?", "type": "single", "options": [{"label": "A", "text": "Add both the summary table and the line chart as widgets on the same dashboard page and configure both to use the same dataset query that references a shared date range parameter"}, {"label": "B", "text": "Create two separate dashboards — one for the table and one for the chart — and link them using a shared parameter URL"}, {"label": "C", "text": "Export both visualisations as images and embed them in a text widget with a hardcoded date range"}, {"label": "D", "text": "Place the line chart and the summary table in separate tabs and configure a cross-tab parameter link in the dashboard settings"}], "correct_answers": ["A"], "explanation": "AI/BI Dashboards support multiple widgets on a single page. Both the table and chart widgets can reference the same dataset query or separate queries that use the same parameter, so when the parameter value changes both widgets update simultaneously.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "A dashboard has been built for a regional sales team and needs to be shared with external stakeholders who do not have Databricks workspace accounts. Which sharing method allows external users to view the dashboard without requiring a Databricks login?", "type": "single", "options": [{"label": "A", "text": "Export the dashboard as a PDF and email it to the external stakeholders"}, {"label": "B", "text": "Assign the external users the Viewer role in the Databricks workspace and share the dashboard URL directly"}, {"label": "C", "text": "Publish the dashboard and share it via a public shareable link, allowing anyone with the link to view it without logging in"}, {"label": "D", "text": "Embed the dashboard in an external application using the Databricks REST API with a service principal token"}], "correct_answers": ["C"], "explanation": "Databricks AI/BI Dashboards support publishing to a shareable link that does not require the viewer to have a Databricks account. This is the correct method for sharing with external stakeholders.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Delta Lake & Delta Tables", "question": "What is the correct SQL syntax to query a Delta table using time travel to retrieve data as it existed at version 5?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM sales.orders VERSION AS OF 5"}, {"label": "B", "text": "SELECT * FROM sales.orders AT VERSION = 5"}, {"label": "C", "text": "SELECT * FROM sales.orders WHERE _version = 5"}, {"label": "D", "text": "SELECT * FROM sales.orders HISTORICAL VERSION 5"}], "correct_answers": ["A"], "explanation": "VERSION AS OF is the correct Databricks SQL syntax for Delta Lake time travel by version number. This query returns the table data exactly as it existed when version 5 was committed to the transaction log.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to create a view in Unity Catalog that is recalculated every time it is queried and always reflects the current state of the underlying tables. Which object type should the analyst create?", "type": "single", "options": [{"label": "A", "text": "A Delta table clone, which creates a live mirror of the source table that updates automatically when the source changes"}, {"label": "B", "text": "A Streaming Table, which continuously processes new records from an append-only data source"}, {"label": "C", "text": "A dynamic view, which is evaluated at query time and always reflects the current state of the underlying tables without storing any pre-computed results"}, {"label": "D", "text": "A Materialized View, which pre-computes and stores query results and refreshes on a defined schedule"}], "correct_answers": ["C"], "explanation": "Dynamic views (standard SQL views) are evaluated at query time and always reflect the current state of the underlying tables. They do not store results, making them the correct choice for always-current on-demand access.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "An organisation wants to make a certified dataset available to external data consumers who use tools other than Databricks, such as Apache Spark on another cloud platform. Which feature of the Databricks Data Intelligence Platform enables this without copying the data?", "type": "single", "options": [{"label": "A", "text": "Auto Loader, which publishes new Delta table files to an external message queue that other platforms can subscribe to and consume"}, {"label": "B", "text": "Unity Catalog data lineage, which publishes table metadata to external catalogs so other platforms can discover and read the tables directly"}, {"label": "C", "text": "Delta Sharing, which provides an open protocol allowing external consumers on any compatible platform to access live Delta Lake data directly from the provider's storage without copying it"}, {"label": "D", "text": "Databricks Connect, which provides a client library allowing external applications to execute queries remotely against a Databricks cluster and retrieve the results without duplicating the underlying data"}], "correct_answers": ["C"], "explanation": "Delta Sharing is designed for exactly this use case. External consumers using Apache Spark, pandas, or other Delta Sharing compatible clients can access shared data directly from the provider's cloud storage using a sharing endpoint and credentials, without any data replication.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "Which of the following correctly describes the role of Trusted Assets in a Genie space?", "type": "single", "options": [{"label": "A", "text": "Trusted Assets are pre-validated SQL queries added to a Genie space by its administrators that Genie uses when answering questions about specific metrics, ensuring consistent and accurate results for key business calculations"}, {"label": "B", "text": "Trusted Assets are cached query results stored by Genie to improve response speed for frequently asked questions"}, {"label": "C", "text": "Trusted Assets are external data sources registered in Unity Catalog that Genie can access when the primary dataset does not contain the required information"}, {"label": "D", "text": "Trusted Assets are pre-approved Delta tables that Genie is permitted to query, preventing it from accessing sensitive tables in Unity Catalog"}], "correct_answers": ["A"], "explanation": "Trusted Assets allow Genie space administrators to define validated SQL queries for important business metrics. When a user asks a question that matches a Trusted Asset, Genie uses that pre-approved query rather than generating its own, guaranteeing accuracy for critical calculations.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "A Genie space has been created for a marketing team to explore campaign performance data using natural language questions. After launch, analysts report that Genie frequently returns incorrect results for questions about conversion rates. What is the most appropriate action to improve accuracy?", "type": "single", "options": [{"label": "A", "text": "Grant the marketing team the CAN MANAGE permission on the Genie space so they can edit the queries themselves"}, {"label": "B", "text": "Delete the Genie space and recreate it from scratch with a different SQL warehouse"}, {"label": "C", "text": "Switch the Genie space to use a larger SQL warehouse to improve query execution speed"}, {"label": "D", "text": "Review the questions users asked about conversion rates in the Genie space monitoring interface, then add domain-specific instructions clarifying how conversion rate is defined and add a vetted SQL query as a Trusted Asset for that metric"}], "correct_answers": ["D"], "explanation": "Genie spaces improve through iterative refinement. Reviewing user question logs identifies where Genie is misinterpreting intent. Adding clear domain instructions and a pre-validated SQL query as a Trusted Asset for conversion rate ensures Genie uses the correct calculation in future responses.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Databricks SQL & Warehouses", "question": "A data analyst needs to query a Delta table and a PostgreSQL federated data source in the same query to produce a unified report. Which Databricks feature enables this cross-system analytics capability?", "type": "single", "options": [{"label": "A", "text": "Lakehouse Federation, which allows Databricks SQL to query external data sources directly without moving the data"}, {"label": "B", "text": "Databricks Marketplace, which provides pre-built connectors that copy external database tables into the Databricks workspace"}, {"label": "C", "text": "Delta Sharing, which replicates the PostgreSQL data into a shared Delta table for querying"}, {"label": "D", "text": "Databricks Auto Loader, which ingests data from external sources into Delta Lake before querying"}], "correct_answers": ["A"], "explanation": "Lakehouse Federation enables Databricks SQL to query external systems such as PostgreSQL, MySQL, and Snowflake in place using foreign catalogs registered in Unity Catalog, allowing joins with Delta tables in a single query.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Data Modeling & Architecture", "question": "A team uses a snowflake schema for their data warehouse. How does a snowflake schema differ from a star schema?", "type": "single", "options": [{"label": "A", "text": "A snowflake schema has no fact table and instead links dimension tables directly to each other in a hierarchical chain"}, {"label": "B", "text": "A snowflake schema stores all data in a single wide flat table with no joins required, improving query performance compared to a star schema"}, {"label": "C", "text": "In a snowflake schema dimension tables are normalised into multiple related sub-dimension tables, reducing data redundancy at the cost of additional joins compared to a star schema"}, {"label": "D", "text": "A snowflake schema replaces dimension tables with materialised views that are refreshed on a schedule to reflect current dimensional data"}], "correct_answers": ["C"], "explanation": "A snowflake schema extends the star schema by normalising dimension tables into sub-dimensions. For example a product dimension might be split into product, category, and subcategory tables linked by foreign keys. This reduces storage redundancy but requires more joins in queries.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Query Optimization & Performance", "question": "What is the purpose of Liquid Clustering in Databricks and when should it be applied?", "type": "single", "options": [{"label": "A", "text": "Liquid Clustering compresses table data using an adaptive codec chosen based on the column data types, reducing storage costs for large tables"}, {"label": "B", "text": "Liquid Clustering replaces table partitioning and Z-ordering by incrementally clustering data on specified columns, improving query performance for filtered queries without requiring a full table rewrite"}, {"label": "C", "text": "Liquid Clustering physically reorganises table data by sorting rows in ascending order on a specified column, similar to an ORDER BY applied at write time"}, {"label": "D", "text": "Liquid Clustering should only be applied to streaming tables because it is designed to handle continuously arriving data and is incompatible with batch Delta tables"}], "correct_answers": ["B"], "explanation": "Liquid Clustering is the modern replacement for static partitioning and Z-ordering in Delta Lake. It incrementally reorganises data in the background on the specified columns, improving data skipping for queries that filter on those columns without requiring a full OPTIMIZE rewrite each time.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "Which two actions are available to a user with the CAN MANAGE permission on a Genie space?", "type": "multiple", "options": [{"label": "A", "text": "Query the underlying Unity Catalog tables directly using the Genie space as a SQL editor"}, {"label": "B", "text": "Edit the Genie space instructions, curated datasets, and trusted assets"}, {"label": "C", "text": "Share the Genie space with other users and manage their permission levels"}, {"label": "D", "text": "Automatically schedule the Genie space to generate and email reports to stakeholders"}, {"label": "E", "text": "Submit natural language questions to the Genie space and view the generated query results"}], "correct_answers": ["B", "C"], "explanation": "CAN MANAGE permission grants full administrative control over the Genie space configuration, including editing domain instructions, adding or removing curated datasets, and managing trusted assets, as well as sharing the space and assigning or modifying other users' permission levels.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to perform a full outer join between a customers table and an orders table on customer_id, returning all customers and all orders including those with no match on either side. Which query correctly implements this?", "type": "single", "options": [{"label": "A", "text": "SELECT c.customer_id, c.name, o.order_id FROM customers c INNER JOIN orders o ON c.customer_id = o.customer_id"}, {"label": "B", "text": "SELECT c.customer_id, c.name, o.order_id FROM customers c LEFT JOIN orders o ON c.customer_id = o.customer_id"}, {"label": "C", "text": "SELECT c.customer_id, c.name, o.order_id FROM customers c FULL OUTER JOIN orders o ON c.customer_id = o.customer_id"}, {"label": "D", "text": "SELECT c.customer_id, c.name, o.order_id FROM customers c CROSS JOIN orders o WHERE c.customer_id = o.customer_id"}], "correct_answers": ["C"], "explanation": "FULL OUTER JOIN returns all rows from both tables. Where a match exists on customer_id the row is combined, and where no match exists the columns from the missing side are filled with NULL values, satisfying the requirement to include all customers and all orders.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "A newly hired analyst needs read-only access to all current and future tables in the silver schema of the main catalog. Which approach correctly grants this access in Unity Catalog?", "type": "single", "options": [{"label": "A", "text": "GRANT USE CATALOG ON CATALOG main TO analyst_group; GRANT USE SCHEMA ON SCHEMA main.silver TO analyst_group; ALTER DEFAULT PRIVILEGES IN SCHEMA main.silver GRANT SELECT ON TABLES TO analyst_group"}, {"label": "B", "text": "GRANT READ ON SCHEMA main.silver TO analyst_group"}, {"label": "C", "text": "GRANT SELECT ON ALL TABLES IN SCHEMA main.silver TO analyst_group"}, {"label": "D", "text": "GRANT ALL PRIVILEGES ON CATALOG main TO analyst_group"}], "correct_answers": ["A"], "explanation": "USE CATALOG and USE SCHEMA allow navigation of the namespace hierarchy, and ALTER DEFAULT PRIVILEGES ensures SELECT is automatically granted on any new tables created in the schema in the future, covering both current and future tables.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Databricks SQL & Warehouses", "question": "Which two statements correctly describe the role of a SQL Warehouse in Databricks?", "type": "multiple", "options": [{"label": "A", "text": "A SQL Warehouse replaces the need for Unity Catalog by managing all data access permissions internally"}, {"label": "B", "text": "A SQL Warehouse stores query results permanently in Delta Lake tables for reuse across sessions"}, {"label": "C", "text": "A SQL Warehouse can only be used by a single user at a time and queues all other requests until the current query completes"}, {"label": "D", "text": "A SQL Warehouse can be configured as Serverless, Pro, or Classic, with Serverless offering the fastest startup time by using pre-warmed compute managed by Databricks"}, {"label": "E", "text": "A SQL Warehouse is a compute resource that executes SQL queries submitted through Databricks SQL, notebooks, and BI tools connected via JDBC or ODBC"}], "correct_answers": ["D", "E"], "explanation": "Databricks SQL Warehouses come in three types, with Serverless starting in seconds using Databricks-managed pre-warmed infrastructure. They are the compute engine for Databricks SQL workloads, processing queries from the SQL Editor, dashboards, alerts, and external BI tools connecting via JDBC/ODBC drivers.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Query Optimization & Performance", "question": "What does the Query Profiler in Databricks SQL show and how does it help identify performance issues?", "type": "single", "options": [{"label": "A", "text": "The Query Profiler displays a visual execution plan with timing and resource metrics for each operator in the query plan, allowing analysts to identify which stages such as scans, joins, and aggregations are consuming the most time"}, {"label": "B", "text": "The Query Profiler is only available for queries that have failed and cannot be used to analyse the performance of successfully completed queries"}, {"label": "C", "text": "The Query Profiler shows the raw SQL execution log including every row read and written during query execution, allowing analysts to trace exactly which records caused performance bottlenecks"}, {"label": "D", "text": "The Query Profiler compares the current query execution against historical executions and automatically suggests index creation or partition changes to improve performance"}], "correct_answers": ["A"], "explanation": "The Query Profiler in Databricks SQL visualises the physical execution plan as a DAG with metrics for each operator including execution time, rows processed, and bytes read. This allows analysts to pinpoint exactly which part of the query is the performance bottleneck.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Databricks SQL & Warehouses", "question": "Which two statements correctly describe how parameters work in Databricks SQL queries and dashboards?", "type": "multiple", "options": [{"label": "A", "text": "A parameter in a Databricks SQL query is defined using a named parameter marker with a colon syntax, such as :parameter_name. When the query runs, the placeholder is replaced with the value provided by the user at execution time."}, {"label": "B", "text": "Each parameter widget on a dashboard can only be linked to a single visualisation and a separate parameter must be created for each chart that needs filtering"}, {"label": "C", "text": "Parameters must be defined in the Unity Catalog schema before they can be used in a Databricks SQL query"}, {"label": "D", "text": "Parameters in Databricks SQL can only be used in WHERE clauses and cannot appear in SELECT lists, GROUP BY clauses, or other parts of a query"}, {"label": "E", "text": "A dashboard parameter widget can be linked to multiple query-based visualisations on the same page so that changing the parameter value updates all linked visualisations simultaneously"}], "correct_answers": ["A", "E"], "explanation": "Databricks uses :parameter_name syntax for query parameters, which are populated through widgets at execution time. Dashboard parameter widgets act as shared filters, so when a single widget is linked to multiple dataset queries on the same page, changing the value re-executes all linked queries and updates all associated visualisations at once.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns all orders placed in the last 30 days, calculating the total order value per customer and only including customers whose total exceeds 1000. Which query correctly achieves this?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_id, SUM(order_value) AS total_value FROM orders GROUP BY customer_id HAVING SUM(order_value) > 1000 WHERE order_date >= CURRENT_DATE - INTERVAL 30 DAYS"}, {"label": "B", "text": "SELECT customer_id, SUM(order_value) AS total_value FROM orders WHERE order_date >= CURRENT_DATE - INTERVAL 30 DAYS AND SUM(order_value) > 1000 GROUP BY customer_id"}, {"label": "C", "text": "SELECT customer_id, SUM(order_value) AS total_value FROM orders WHERE order_date >= CURRENT_DATE - INTERVAL 30 DAYS AND total_value > 1000 GROUP BY customer_id"}, {"label": "D", "text": "SELECT customer_id, SUM(order_value) AS total_value FROM orders WHERE order_date >= CURRENT_DATE - INTERVAL 30 DAYS GROUP BY customer_id HAVING SUM(order_value) > 1000"}], "correct_answers": ["D"], "explanation": "The correct clause order is FROM, WHERE, GROUP BY, HAVING. WHERE filters rows to the last 30 days before grouping, and HAVING SUM(order_value) > 1000 filters aggregated groups after grouping. Aggregate functions and SELECT aliases cannot be used in a WHERE clause.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Query Optimization & Performance", "question": "A data analyst runs the following query but notices it is scanning the entire table despite a filter on the order_date column: SELECT * FROM sales.orders WHERE order_date >= '2024-01-01'. The orders table is a large Delta table. Which feature should the analyst apply to improve filter performance on this column without repartitioning the table?", "type": "single", "options": [{"label": "A", "text": "Run OPTIMIZE with ZORDER BY order_date on the orders table to co-locate data with similar order_date values in the same files, improving data skipping for date-range filters"}, {"label": "B", "text": "Apply VACUUM to the orders table to remove old data files and reduce the amount of data scanned by the filter"}, {"label": "C", "text": "Add a secondary index on the order_date column using CREATE INDEX to enable fast lookups without a full table scan"}, {"label": "D", "text": "Convert the orders table from a managed table to an external table, which enables file-level predicate pushdown for date columns"}], "correct_answers": ["A"], "explanation": "ZORDER BY co-locates rows with similar values in the same files and updates the Delta file statistics, allowing the query engine to skip files whose min/max order_date range does not overlap with the filter, dramatically reducing the data scanned.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe best practices for securing data in Unity Catalog?", "type": "multiple", "options": [{"label": "A", "text": "Columns containing personally identifiable information such as email addresses and national identity numbers should be protected using column masking policies or dynamic views that restrict visibility based on user identity or group membership"}, {"label": "B", "text": "Granting privileges at the catalog level using ALL PRIVILEGES is the recommended approach for most users as it simplifies permission management"}, {"label": "C", "text": "All users in a workspace should be granted the metastore admin role to ensure they can always access the data they need without being blocked by permission issues"}, {"label": "D", "text": "External tables should always be used instead of managed tables because they provide stronger data security by storing files outside of Databricks-managed storage"}, {"label": "E", "text": "Table ownership should be assigned to a service principal or group rather than an individual user account to prevent access disruption when employees leave the organisation"}], "correct_answers": ["A", "E"], "explanation": "Unity Catalog supports column masking and dynamic views for PII protection, and assigning table ownership to a service principal or group ensures ownership and privileges persist when individual team members change roles or leave.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Databricks Workspace & Navigation", "question": "Which two correctly describe features or components of the Databricks Data Intelligence Platform?", "type": "multiple", "options": [{"label": "A", "text": "Databricks SQL is a serverless compute engine designed exclusively for streaming data ingestion and cannot be used for interactive SQL queries"}, {"label": "B", "text": "Unity Catalog provides a unified governance layer for data and AI assets across multiple workspaces, supporting fine-grained access control, data lineage, and auditing"}, {"label": "C", "text": "Lakeflow Jobs is a workflow orchestration service that schedules and manages multi-task pipelines including notebooks, SQL queries, Delta Live Tables pipelines, and other Databricks workloads"}, {"label": "D", "text": "Mosaic AI is a cloud storage optimisation service that automatically compresses and partitions Delta tables to reduce storage costs"}], "correct_answers": ["B", "C"], "explanation": "Unity Catalog is the centralised governance solution managing permissions, lineage, and audit logs, while Lakeflow Jobs is the native orchestration layer for scheduling and managing multi-step data pipelines.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst is building an AI/BI Dashboard and wants to add a text box explaining the methodology behind a revenue calculation to help viewers interpret the data. Which widget type should the analyst use?", "type": "single", "options": [{"label": "A", "text": "A Visualisation widget with a single-column table showing the methodology text as a row value"}, {"label": "B", "text": "A Counter widget configured to display a static string value as a KPI metric"}, {"label": "C", "text": "A Text widget, which supports Markdown formatting and is designed for adding static explanatory content such as descriptions, titles, and methodology notes to a dashboard"}, {"label": "D", "text": "A Filter widget configured with a static default value that displays the methodology text as a label"}], "correct_answers": ["C"], "explanation": "AI/BI Dashboards include a Text widget that renders Markdown-formatted content, the appropriate widget for adding headings, descriptions, methodology explanations, and other static contextual information alongside visualisations.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to query data stored in an external PostgreSQL database directly from Databricks without copying the data into Delta tables. The organization uses Unity Catalog and wants to centrally manage access permissions. Which Databricks feature should be used?", "type": "single", "options": [{"label": "A", "text": "Lakehouse Federation"}, {"label": "B", "text": "Auto Loader"}, {"label": "C", "text": "Delta Sharing"}, {"label": "D", "text": "Lakeflow Connect"}], "correct_answers": ["A"], "explanation": "Lakehouse Federation enables Databricks to query supported external databases, such as PostgreSQL, directly through Unity Catalog without moving the data, allowing centralized governance while keeping the data in the source system.", "is_one_word": true}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "Which of the following correctly describes the purpose of Delta Sharing in the Databricks Data Intelligence Platform?", "type": "single", "options": [{"label": "A", "text": "Delta Sharing is an open protocol that allows organisations to securely share live Delta Lake data with external consumers across different platforms and cloud providers without copying the data"}, {"label": "B", "text": "Delta Sharing creates a physical copy of shared tables in the recipient's storage account so they can query the data without network latency"}, {"label": "C", "text": "Delta Sharing is a feature that automatically replicates Delta tables across multiple Databricks workspaces within the same cloud account for disaster recovery"}, {"label": "D", "text": "Delta Sharing encrypts Delta table data at rest and in transit, replacing the default cloud storage encryption with a Databricks-managed key"}], "correct_answers": ["A"], "explanation": "Delta Sharing enables data providers to share read access to Delta tables with recipients who may use Databricks, Apache Spark, pandas, or other compatible tools; the data stays in the provider's storage and is accessed directly by the recipient.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Data Ingestion & Streaming", "question": "An analyst needs to bring a CSV file stored in Amazon S3 into Databricks for analysis without writing any code. Which approach correctly achieves this using the Databricks workspace UI?", "type": "single", "options": [{"label": "A", "text": "Create a Databricks Job that runs a notebook with spark.read.csv() to load the file and write it to a Delta table"}, {"label": "B", "text": "Use the Databricks SQL Editor to run a COPY INTO command referencing the S3 path directly"}, {"label": "C", "text": "Use the Databricks CLI to run a databricks fs cp command to copy the CSV file from S3 into the workspace file system"}, {"label": "D", "text": "Use the Data Ingestion UI in the Databricks workspace to upload or connect to the file, which guides the analyst through creating a table from the source without writing code"}], "correct_answers": ["D"], "explanation": "The Databricks workspace provides a data ingestion UI that allows analysts to upload files directly or connect to cloud storage locations and create Delta tables through a guided interface without writing any code.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Query Optimization & Performance", "question": "Which of the following correctly describes the purpose of the Photon execution engine in Databricks?", "type": "single", "options": [{"label": "A", "text": "Photon is a machine learning optimisation framework that automatically tunes query execution plans based on historical query performance data"}, {"label": "B", "text": "Photon is only available for streaming workloads and does not provide performance improvements for batch SQL queries run on Databricks SQL Warehouses"}, {"label": "C", "text": "Photon is a native vectorised execution engine written in C++ that accelerates SQL queries and DataFrame operations by processing data in columnar batches, improving performance for scan-heavy and aggregation-heavy workloads"}, {"label": "D", "text": "Photon is a query caching layer that stores the results of frequently run queries in memory so subsequent executions return instantly without hitting the data source"}], "correct_answers": ["C"], "explanation": "Photon replaces the standard JVM-based Spark execution engine for supported operations; its vectorised columnar processing significantly improves throughput for large-scale SQL scans, joins, aggregations, and sorts compared to the row-based JVM execution model.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "Which of the following correctly describes the difference between a scheduled dashboard refresh and a Databricks SQL Alert?", "type": "single", "options": [{"label": "A", "text": "Scheduled dashboard refreshes are only available on Databricks Premium workspaces while SQL Alerts are available on all workspace tiers"}, {"label": "B", "text": "A SQL Alert and a scheduled dashboard refresh are the same feature. The only difference is that SQL Alerts run more frequently than scheduled refreshes"}, {"label": "C", "text": "A scheduled dashboard refresh automatically updates the visualisations on a dashboard by re-running the underlying queries on a defined schedule. A SQL Alert monitors a query result against a threshold and sends a notification when the condition is met"}, {"label": "D", "text": "A scheduled dashboard refresh sends email notifications to viewers when new data is available. A SQL Alert updates dashboard visualisations automatically when a threshold is exceeded"}], "correct_answers": ["C"], "explanation": "Scheduled refreshes keep dashboard content current by periodically re-executing queries and updating visualisations, while SQL Alerts are a separate monitoring mechanism that evaluates a query result against a defined condition and triggers notifications when it is breached.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Delta Lake & Delta Tables", "question": "A data analyst wants to understand how a specific Delta table has changed over time, including who made changes and what operations were performed. Which feature should the analyst use?", "type": "single", "options": [{"label": "A", "text": "Use the Catalog Explorer lineage tab to view a graph of all transformations applied to the table"}, {"label": "B", "text": "Run DESCRIBE TABLE EXTENDED to view the full table schema and storage properties"}, {"label": "C", "text": "Run DESCRIBE HISTORY table_name to view the audit log of all operations performed on the Delta table including timestamps, user names, and operation types"}, {"label": "D", "text": "Query the Delta table transaction log directly by reading the _delta_log directory files"}], "correct_answers": ["C"], "explanation": "DESCRIBE HISTORY returns a structured result showing every commit made to the Delta table including the operation type such as WRITE, MERGE, or DELETE, the timestamp, the user who performed the operation, and additional operation parameters.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to create a bar chart showing total revenue by product category, with categories ordered from highest to lowest revenue. Which SQL query correctly supports this visualisation?", "type": "single", "options": [{"label": "A", "text": "SELECT category, SUM(revenue) AS total_revenue FROM sales GROUP BY category ORDER BY category ASC"}, {"label": "B", "text": "SELECT category, revenue FROM sales ORDER BY revenue DESC"}, {"label": "C", "text": "SELECT SUM(revenue) AS total_revenue FROM sales GROUP BY category"}, {"label": "D", "text": "SELECT category, SUM(revenue) AS total_revenue FROM sales GROUP BY category ORDER BY total_revenue DESC"}], "correct_answers": ["D"], "explanation": "GROUP BY category aggregates revenue per category, and ORDER BY total_revenue DESC sorts the results from highest to lowest revenue, the correct ordering for a descending bar chart showing top-performing categories first.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "Which of the following correctly describes the three-level namespace used in Unity Catalog?", "type": "single", "options": [{"label": "A", "text": "The three levels are Catalog, Schema, and Table or Volume, where a catalog contains schemas and each schema contains tables, views, and volumes"}, {"label": "B", "text": "The three levels are Workspace, Cluster, and Table, where each workspace contains clusters that execute queries against tables"}, {"label": "C", "text": "The three levels are Database, Table, and Column, where queries reference objects using the pattern database.table.column"}, {"label": "D", "text": "The three levels are Environment, Schema, and Delta Table, where environments separate development, staging, and production workloads within a single workspace"}], "correct_answers": ["A"], "explanation": "Unity Catalog uses a three-level namespace: Catalog at the top level, Schema (equivalent to a database) at the second level, and Tables, Views, and Volumes at the third level, with fully qualified names following the pattern catalog.schema.table.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Data Ingestion & Streaming", "question": "Which of the following correctly describes when to use a Streaming Table versus a Materialized View in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Use a Materialized View when source data arrives in real time from Kafka because it automatically consumes the Kafka topic and stores each message as a row"}, {"label": "B", "text": "Use a Streaming Table for all analytical workloads because it provides more up-to-date results than a Materialized View"}, {"label": "C", "text": "Use a Streaming Table when query results need to be cached for faster dashboard loading, and a Materialized View when data needs to be ingested from external systems"}, {"label": "D", "text": "Use a Streaming Table when you need to incrementally ingest new records from an append-only source such as Kafka or Auto Loader. Use a Materialized View when you need to pre-compute and store the results of a complex query that is refreshed on a schedule"}], "correct_answers": ["D"], "explanation": "Streaming Tables are designed for continuous or incremental ingestion from append-only streaming sources, while Materialized Views pre-compute query results including aggregations and joins and store them for fast repeated querying, refreshing on a defined schedule.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to apply cleaning operations to a Unity Catalog table that contains customer records with missing email addresses and invalid phone numbers that contain letters. Which two SQL operations correctly address these data quality issues?", "type": "multiple", "options": [{"label": "A", "text": "DELETE FROM customers WHERE email IS NULL"}, {"label": "B", "text": "SELECT * FROM customers WHERE email IS NOT NULL AND phone NOT RLIKE '[a-zA-Z]'"}, {"label": "C", "text": "ALTER TABLE customers DROP COLUMN email WHERE email IS NULL"}, {"label": "D", "text": "UPDATE customers SET phone = NULL WHERE phone RLIKE '[a-zA-Z]'"}, {"label": "E", "text": "TRUNCATE TABLE customers"}], "correct_answers": ["A", "D"], "explanation": "DELETE FROM with a WHERE IS NULL condition removes rows with missing email addresses, and UPDATE with RLIKE sets phone to NULL for any row where the phone column contains alphabetic characters, correctly cleaning invalid phone numbers.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Query Optimization & Performance", "question": "A SQL query joining a large Delta table with a small lookup table is running slowly. The query profiler shows the join is executing as a sort-merge join. Which change is most likely to improve performance?", "type": "single", "options": [{"label": "A", "text": "Rewrite the query to use a LEFT OUTER JOIN instead of an INNER JOIN to reduce the number of rows processed during the join"}, {"label": "B", "text": "Increase the SQL Warehouse cluster size to provide more memory for the sort-merge join operation"}, {"label": "C", "text": "Convert the small lookup table to a CSV file and join it using a UDF to bypass the sort-merge join planner"}, {"label": "D", "text": "Use a broadcast hint in the query to instruct Databricks SQL to broadcast the small lookup table to all nodes, avoiding the shuffle required by a sort-merge join"}], "correct_answers": ["D"], "explanation": "A broadcast join sends the small table to all worker nodes so each node can perform the join locally without shuffling the large table across the network, eliminating the expensive sort and shuffle phases of a sort-merge join for small lookup tables.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Query Optimization & Performance", "question": "A data analyst needs to identify which queries in a Databricks SQL workspace are consuming the most resources and taking the longest to execute. Which feature should the analyst use?", "type": "single", "options": [{"label": "A", "text": "The Cluster Event Log, which records all compute events including query execution times and resource consumption per query"}, {"label": "B", "text": "The Delta Table History, which logs all write operations to Delta tables including the queries that generated each write"}, {"label": "C", "text": "Query History, which provides a filterable log of all executed queries including duration, compute resource used, rows returned, and I/O metrics for each query"}, {"label": "D", "text": "The Unity Catalog Audit Log, which tracks all data access events and query execution times across the workspace"}], "correct_answers": ["C"], "explanation": "Query History in Databricks SQL records every query execution with detailed performance metrics; analysts can filter by user, date range, warehouse, and status, and sort by duration to identify the slowest and most resource-intensive queries.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Unity Catalog & Data Governance", "question": "A database administrator needs to ensure that analysts in the reporting team can query tables in the analytics schema of the prod catalog but cannot modify, delete, or create any objects. Which grant statement correctly implements this?", "type": "single", "options": [{"label": "A", "text": "GRANT SELECT ON SCHEMA prod.analytics TO reporting_team"}, {"label": "B", "text": "GRANT USE CATALOG ON CATALOG prod TO reporting_team; GRANT USE SCHEMA ON SCHEMA prod.analytics TO reporting_team; GRANT SELECT ON ALL TABLES IN SCHEMA prod.analytics TO reporting_team"}, {"label": "C", "text": "GRANT READ ON CATALOG prod.analytics TO reporting_team"}, {"label": "D", "text": "GRANT ALL PRIVILEGES ON SCHEMA prod.analytics TO reporting_team"}], "correct_answers": ["B"], "explanation": "In Unity Catalog access requires grants at each level of the three-level namespace: USE CATALOG allows navigating the catalog, USE SCHEMA allows navigating the schema, and SELECT ON ALL TABLES grants read access to all tables, together providing read-only query access.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "A daily revenue dashboard is showing only 13 data points instead of the expected 90 days of data. The dataset has columns transaction_date and revenue_amount. What is the most likely cause?", "type": "single", "options": [{"label": "A", "text": "The revenue_amount column contains null values which are being excluded by the visualisation engine, reducing the number of visible data points"}, {"label": "B", "text": "The transaction_date column is stored as a StringType rather than a DateType, causing the visualisation engine to group dates alphabetically and collapse duplicate string values"}, {"label": "C", "text": "The query is missing a GROUP BY transaction_date clause, causing revenue to be aggregated at the wrong granularity"}, {"label": "D", "text": "The dashboard date filter is set to group by week rather than day, rolling up daily data into 13 weekly summary points"}], "correct_answers": ["D"], "explanation": "When a dashboard date filter is set to group by week instead of day, 90 days of daily data rolls up into exactly 13 weekly summary points, directly explaining the symptom and a common misconfiguration in dashboard tools.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Caching & Performance", "question": "A data analyst notices that a frequently run dashboard query takes 45 seconds on first execution but only 2 seconds on subsequent executions within the same session. What is the most likely explanation for this behaviour?", "type": "single", "options": [{"label": "A", "text": "The SQL Warehouse automatically scales up additional clusters after the first query, providing more compute for subsequent executions"}, {"label": "B", "text": "The query result is being served from the Databricks SQL result cache, which stores the output of recently executed queries and returns them instantly when the same query is rerun without underlying data changes"}, {"label": "C", "text": "The analyst's SQL Warehouse was in a cold start state during the first execution and the 45-second delay was caused entirely by warehouse startup time"}, {"label": "D", "text": "The Delta table was automatically optimised by a background OPTIMIZE job between the first and second query executions"}], "correct_answers": ["B"], "explanation": "Databricks SQL maintains a result cache that stores query outputs for a period of time; when the same query is rerun and the underlying data has not changed the cached result is returned without re-executing against the data source, producing near-instant response times.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst is designing a dashboard for a retail operations team and needs to choose the most effective visualisation for showing the proportion of total sales contributed by each product category. Which visualisation type is most appropriate?", "type": "single", "options": [{"label": "A", "text": "A histogram showing the frequency distribution of sales amounts across all transactions"}, {"label": "B", "text": "A pie chart or donut chart showing each product category as a slice proportional to its share of total sales"}, {"label": "C", "text": "A line chart with one line per product category showing sales over time"}, {"label": "D", "text": "A scatter plot with product category on the x-axis and sales amount on the y-axis"}], "correct_answers": ["B"], "explanation": "Pie and donut charts are designed specifically for showing part-to-whole relationships, with each slice representing a category's proportional contribution to the total, making them the most effective visualisation for this use case when the number of categories is small.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is creating a Genie space for a finance team and wants to ensure that when users ask about monthly recurring revenue the answer is always calculated using a specific approved SQL formula. What should the analyst configure?", "type": "single", "options": [{"label": "A", "text": "Tag the monthly recurring revenue column in Unity Catalog with a certified tag so Genie automatically uses the certified column definition when generating queries"}, {"label": "B", "text": "Add the approved SQL query for monthly recurring revenue as a Trusted Asset in the Genie space so Genie uses this exact pre-validated query whenever users ask about that metric"}, {"label": "C", "text": "Set the Genie space to read-only mode so users can only view pre-generated results and cannot ask custom questions that might produce incorrect MRR calculations"}, {"label": "D", "text": "Add a domain instruction in natural language describing how monthly recurring revenue is calculated so Genie uses this description to generate the SQL query at runtime"}], "correct_answers": ["B"], "explanation": "Trusted Assets are pre-validated SQL queries that Genie uses for specific metric questions; by adding the approved MRR formula as a Trusted Asset the administrator ensures Genie always uses the correct calculation rather than generating its own interpretation.", "is_one_word": false}, {"source": "Udemy Exam Practice 1", "theme": "Data Modeling & Architecture", "question": "An analyst needs to create a star schema for a retail analytics workload in Databricks SQL. The schema should have a central fact table containing sales transactions and dimension tables for customers, products, and dates. Which statement correctly describes the relationship between the fact and dimension tables in this model?", "type": "single", "options": [{"label": "A", "text": "The fact table stores numeric measures such as sales amount and quantity sold along with foreign keys that reference the primary keys of the dimension tables"}, {"label": "B", "text": "The fact table contains descriptive attributes such as customer name and product description while dimension tables store numeric measures such as sales amount and quantity"}, {"label": "C", "text": "Each dimension table must be directly joined to every other dimension table to enable cross-dimensional analysis without going through the fact table"}, {"label": "D", "text": "The fact table and dimension tables must all be stored as external tables pointing to separate storage locations to enable the star schema pattern"}], "correct_answers": ["A"], "explanation": "In a star schema the fact table is at the centre and contains measurable business events expressed as numeric values, referencing dimension tables through foreign keys to provide context such as which customer, product, and date the sale relates to.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "An organisation wants to implement a data mesh architecture where different business domains own and publish their data products. Which Unity Catalog feature best supports this decentralised ownership model?", "type": "single", "options": [{"label": "A", "text": "Delta Sharing, which allows each domain team to share their Delta tables with other teams using a centralised sharing server managed by the platform team"}, {"label": "B", "text": "The Databricks Marketplace, which allows each domain team to publish their data products as marketplace listings that other teams can subscribe to and install"}, {"label": "C", "text": "Unity Catalog's query history, which allows each domain team to audit who has accessed their tables and revoke permissions when unauthorised access is detected"}, {"label": "D", "text": "Unity Catalog's support for multiple catalogs, where each business domain can own and manage a dedicated catalog containing their data products, with the central data platform team administering the metastore without owning individual domain catalogs"}], "correct_answers": ["D"], "explanation": "Unity Catalog's multi-catalog model is ideal for data mesh. Each domain team owns their catalog and controls access to their data products, while the central platform team administers the metastore without owning every domain's data.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to identify the top 5 products by total sales amount in the last 90 days. Which query correctly returns this result?", "type": "single", "options": [{"label": "A", "text": "SELECT product_id, SUM(sale_amount) AS total_sales FROM orders WHERE sale_date >= CURRENT_DATE - INTERVAL 90 DAYS GROUP BY product_id LIMIT 5 ORDER BY total_sales DESC"}, {"label": "B", "text": "SELECT product_id, SUM(sale_amount) AS total_sales FROM orders GROUP BY product_id HAVING sale_date >= CURRENT_DATE - INTERVAL 90 DAYS ORDER BY total_sales DESC LIMIT 5"}, {"label": "C", "text": "SELECT product_id, SUM(sale_amount) AS total_sales FROM orders WHERE sale_date >= CURRENT_DATE - INTERVAL 90 DAYS GROUP BY product_id ORDER BY total_sales DESC LIMIT 5"}, {"label": "D", "text": "SELECT TOP 5 product_id, SUM(sale_amount) AS total_sales FROM orders WHERE sale_date >= CURRENT_DATE - INTERVAL 90 DAYS GROUP BY product_id ORDER BY total_sales DESC"}], "correct_answers": ["C"], "explanation": "WHERE filters the last 90 days, GROUP BY aggregates per product, ORDER BY total_sales DESC sorts highest to lowest, and LIMIT 5 returns the top 5. All clauses are in the correct order.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Delta Lake & Delta Tables", "question": "Which two statements correctly describe features of Delta Lake that support data quality and reliability in analytics pipelines?", "type": "multiple", "options": [{"label": "A", "text": "Delta Lake enforces ACID transactions, ensuring that concurrent reads and writes do not produce inconsistent or partial results even when multiple users or processes access the table simultaneously"}, {"label": "B", "text": "Delta Lake automatically corrects data quality issues such as null values and duplicate rows during write operations without requiring any explicit data cleaning steps"}, {"label": "C", "text": "Delta Lake supports schema enforcement, automatically rejecting writes that do not conform to the table's defined schema and preventing columns with incompatible data types from being written"}, {"label": "D", "text": "Delta Lake stores all data in a proprietary binary format that is only readable through the Databricks platform, ensuring data security through format obfuscation"}], "correct_answers": ["A", "C"], "explanation": "ACID compliance guarantees atomicity, consistency, isolation, and durability so concurrent readers see a consistent snapshot. Schema enforcement rejects writes incompatible with the existing schema, preventing corruption.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to grant a colleague the ability to query a specific view in Unity Catalog without granting access to the underlying base tables that the view queries. Which statement correctly describes whether this is possible and how?", "type": "single", "options": [{"label": "A", "text": "Create a copy of the view as a new managed table and grant SELECT on the copy, since views in Unity Catalog always expose their underlying table permissions to the querying user"}, {"label": "B", "text": "It is not possible to grant access to a view without also granting access to the underlying tables because Databricks always requires the querying user to have SELECT on all objects in the query lineage"}, {"label": "C", "text": "Grant SELECT on the view and SELECT on all underlying tables to the colleague, as both grants are always required together for view queries to succeed"}, {"label": "D", "text": "Grant SELECT and USE SCHEMA on the view to the colleague. The colleague can query the view without needing SELECT on the underlying base tables because Unity Catalog uses the view owner's privileges to access the base tables at query time"}], "correct_answers": ["D"], "explanation": "Unity Catalog implements owner-based access control for views. When a user queries a view they use the view owner's privileges for the underlying tables, needing only SELECT on the view plus USE CATALOG and USE SCHEMA.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe the difference between row-level permissions and column-level permissions in Unity Catalog?", "type": "multiple", "options": [{"label": "A", "text": "Row-level security can only be applied to external tables and is not supported for managed Delta tables in Unity Catalog"}, {"label": "B", "text": "Row-level and column-level security in Unity Catalog are configured exclusively through the Catalog Explorer UI and cannot be implemented using SQL statements"}, {"label": "C", "text": "Column-level security restricts which columns a user can see or returns masked values for sensitive columns, implemented in Unity Catalog through column masks applied to table definitions or through dynamic views that omit or transform specific columns"}, {"label": "D", "text": "Column masks in Unity Catalog permanently delete the masked column values from the underlying storage to ensure sensitive data cannot be accessed by any means"}, {"label": "E", "text": "Row-level security restricts which rows a user can see in a table and is implemented in Unity Catalog through dynamic views with identity-based WHERE clauses or row filter policies"}], "correct_answers": ["C", "E"], "explanation": "Column-level security controls column value visibility via column masks or view-based omission. Row-level security filters visible rows based on identity using dynamic views or row filter policies. Both apply at query time.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Delta Lake & Delta Tables", "question": "What is the purpose of the VACUUM command in Delta Lake and what risk must be considered before running it?", "type": "single", "options": [{"label": "A", "text": "VACUUM refreshes the Delta table statistics used by the query optimiser for data skipping, and the risk is that incorrect statistics may cause the optimiser to choose an inefficient query plan"}, {"label": "B", "text": "VACUUM removes data files that are no longer referenced by the Delta transaction log after a specified retention period, freeing up storage space. The risk is that running VACUUM with a short retention period removes files needed for time travel queries to historical versions"}, {"label": "C", "text": "VACUUM compacts small files into larger ones to improve read performance and the risk is that it may merge files from different partitions incorrectly"}, {"label": "D", "text": "VACUUM rewrites all Delta table files in a columnar format to improve query performance, and the risk is that it temporarily locks the table during the rewrite operation"}], "correct_answers": ["B"], "explanation": "VACUUM deletes Parquet files no longer part of recent table versions, retaining files for 7 days by default. A retention period shorter than needed can delete files required to reconstruct historical versions for time travel.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Delta Lake & Delta Tables", "question": "A data analyst needs to query historical data from a Delta table as it existed on a specific date rather than by version number. Which syntax correctly retrieves the table state as of January 1 2024?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM sales.transactions AT TIMESTAMP '2024-01-01'"}, {"label": "B", "text": "SELECT * FROM sales.transactions TIMESTAMP AS OF '2024-01-01'"}, {"label": "C", "text": "SELECT * FROM sales.transactions WHERE _commit_timestamp = '2024-01-01'"}, {"label": "D", "text": "SELECT * FROM sales.transactions VERSION AS OF '2024-01-01'"}], "correct_answers": ["B"], "explanation": "TIMESTAMP AS OF is the correct syntax for Delta Lake time travel using a date or timestamp string, returning the table state at the nearest version committed at or before that time.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe how Unity Catalog manages access control compared to the legacy Hive metastore?", "type": "multiple", "options": [{"label": "A", "text": "Unity Catalog provides a centralised governance model where permissions are managed at the account level and apply consistently across all workspaces, whereas the legacy Hive metastore manages permissions locally within each individual workspace"}, {"label": "B", "text": "Unity Catalog automatically grants all users in a workspace SELECT access to all tables by default to simplify initial setup, requiring administrators to explicitly revoke access for sensitive tables"}, {"label": "C", "text": "Unity Catalog and the legacy Hive metastore are interchangeable and can be switched between without any migration or configuration changes"}, {"label": "D", "text": "Unity Catalog supports fine-grained access control including column-level security and row-level security through column masks and row filters, whereas the legacy Hive metastore only supports table-level GRANT and REVOKE operations"}, {"label": "E", "text": "Unity Catalog requires all tables to be stored in Delta format, whereas the legacy Hive metastore supports any file format including Parquet, ORC, and CSV"}], "correct_answers": ["A", "D"], "explanation": "Unity Catalog centralises governance at the account level so permissions apply across all workspaces, and it introduces fine-grained security like column masking and row filters not natively available in the Hive metastore.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "SQL Basics & Syntax", "question": "A data analyst is creating a report that needs to display product sales data with the following business rules: if a product has no sales it should show zero, and the revenue column should display the text Confidential for products in the Internal category. Which two SQL functions correctly implement these requirements?", "type": "multiple", "options": [{"label": "A", "text": "NULLIF(SUM(sale_amount), 0) to convert zero sales totals to NULL so they display as blank rather than zero"}, {"label": "B", "text": "COALESCE(SUM(sale_amount), 0) to replace NULL sales totals with zero for products with no sales records"}, {"label": "C", "text": "DECODE(category, 'Internal', 'Confidential', revenue) to map category values to display values"}, {"label": "D", "text": "ISNULL(revenue, 'Confidential') to replace NULL revenue values with the text Confidential"}, {"label": "E", "text": "CASE WHEN category = 'Internal' THEN 'Confidential' ELSE CAST(revenue AS STRING) END to conditionally display Confidential for Internal category products"}], "correct_answers": ["B", "E"], "explanation": "COALESCE returns the first non-null value, replacing NULL sales totals with zero. CASE WHEN implements the conditional logic to display Confidential for the Internal category and the revenue value otherwise.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst notices that a bar chart on a published dashboard is showing stale data that is several days old despite the underlying Delta table being updated daily. What is the most likely cause and how should the analyst fix it?", "type": "single", "options": [{"label": "A", "text": "The SQL Warehouse powering the dashboard has been auto-stopped due to inactivity and needs to be manually restarted before the dashboard can query fresh data"}, {"label": "B", "text": "The dashboard does not have an automatic refresh schedule configured or the refresh interval is too infrequent. The analyst should configure a dashboard refresh schedule that aligns with the frequency of the underlying data updates"}, {"label": "C", "text": "The Delta table has time travel enabled which is causing the dashboard query to read an older version of the table. The analyst should add VERSION AS OF CURRENT to the query"}, {"label": "D", "text": "The published dashboard is serving data from a materialised snapshot that must be manually republished each time the underlying data changes"}], "correct_answers": ["B"], "explanation": "Databricks AI/BI Dashboards do not automatically refresh unless a schedule is configured. If the refresh interval is longer than the data update frequency the dashboard shows stale results; configuring a suitable refresh schedule fixes it.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Delta Lake & Delta Tables", "question": "A business analyst notices that a COUNT(*) query against a Delta table returns different row counts each time it is run, even though no scheduled ETL or bulk load jobs have executed. What is the most likely explanation?", "type": "single", "options": [{"label": "A", "text": "Another user or process is concurrently running INSERT, UPDATE, DELETE, or MERGE operations on the Delta table between the analyst's query executions"}, {"label": "B", "text": "COUNT(*) is a non-deterministic function in Delta Lake and is not guaranteed to return consistent results"}, {"label": "C", "text": "Delta Lake automatically purges duplicate rows between queries as part of its background optimization process"}, {"label": "D", "text": "The SQL Warehouse query cache is returning stale results from different cache partitions that each contain a different subset of rows"}], "correct_answers": ["A"], "explanation": "Delta Lake uses snapshot isolation, so each query reads the table as it existed when the query began. Concurrent INSERT, UPDATE, DELETE, or MERGE operations between executions produce legitimately different counts.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns each customer's most recent order date and the total number of orders they have placed. The orders table has columns order_id, customer_id, order_date, and order_amount. Which query correctly produces this result?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_id, order_date, COUNT(order_id) AS total_orders FROM orders GROUP BY customer_id ORDER BY order_date DESC LIMIT 1"}, {"label": "B", "text": "SELECT customer_id, LAST(order_date) AS most_recent_order, COUNT(order_id) AS total_orders FROM orders GROUP BY customer_id"}, {"label": "C", "text": "SELECT customer_id, MAX(order_date) AS most_recent_order, COUNT(order_id) AS total_orders FROM orders GROUP BY customer_id"}, {"label": "D", "text": "SELECT customer_id, MAX(order_date) AS most_recent_order, COUNT(order_id) AS total_orders FROM orders"}], "correct_answers": ["C"], "explanation": "GROUP BY customer_id aggregates orders per customer, MAX(order_date) returns the most recent date and COUNT(order_id) counts the orders. All non-aggregated columns appear in the GROUP BY clause.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Analytics Fundamentals", "question": "Which of the following correctly describes the role of the Data Intelligence Engine in the Databricks Data Intelligence Platform?", "type": "single", "options": [{"label": "A", "text": "The Data Intelligence Engine is the AI-powered layer of the Databricks platform that understands the meaning and context of an organisation's data, powering features such as AI-assisted query optimisation, natural language search in Catalog Explorer, and intelligent recommendations across the platform"}, {"label": "B", "text": "The Data Intelligence Engine is an alternative name for the Photon execution engine that accelerates SQL queries through vectorised columnar processing"}, {"label": "C", "text": "The Data Intelligence Engine is a batch processing framework that orchestrates multi-step data pipelines and manages dependencies between Delta Live Tables pipeline stages"}, {"label": "D", "text": "The Data Intelligence Engine is a separate cloud service that stores all query results in a centralised cache, serving them to SQL Warehouses without re-executing queries against Delta tables"}], "correct_answers": ["A"], "explanation": "The Data Intelligence Engine uses AI to understand data semantics beyond metadata, powering natural language search in Catalog Explorer, Databricks Assistant, intelligent optimisation recommendations, and Genie's natural language analytics.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe the Databricks Marketplace?", "type": "multiple", "options": [{"label": "A", "text": "Databricks Marketplace requires consumers to have a Databricks workspace on the same cloud provider and region as the data publisher to access shared data products"}, {"label": "B", "text": "Databricks Marketplace is only accessible to Databricks Enterprise tier customers and is not available on standard workspace subscriptions"}, {"label": "C", "text": "Databricks Marketplace supports Delta Sharing as the underlying protocol for data product sharing, allowing consumers to access live data without it being copied into their workspace"}, {"label": "D", "text": "Databricks Marketplace automatically ingests all listed datasets into the consumer's Unity Catalog as managed Delta tables, replacing any existing tables with the same name"}, {"label": "E", "text": "Databricks Marketplace allows data providers to publish datasets, models, notebooks, and solution accelerators that other organisations can discover and access directly within their Databricks workspace"}], "correct_answers": ["C", "E"], "explanation": "Marketplace uses Delta Sharing so consumers access live data directly from the provider's storage rather than a static copy. Providers can publish datasets, models, notebooks, and solution accelerators that consumers discover and access.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "Which visualisation type is most appropriate for showing the trend of daily website visitors over a 12-month period?", "type": "single", "options": [{"label": "A", "text": "A line chart with the date on the x-axis and visitor count on the y-axis, showing the continuous trend over time"}, {"label": "B", "text": "A pie chart with each slice representing one month of visitor data"}, {"label": "C", "text": "A counter widget displaying the total visitor count summed across the entire 12-month period"}, {"label": "D", "text": "A scatter plot with visitor count on both axes to identify correlations in the data"}], "correct_answers": ["A"], "explanation": "Line charts are the most effective visualisation for time series data, clearly communicating trends, patterns, and fluctuations over a continuous time axis.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to join data from a Delta table stored in Unity Catalog with a table in an external PostgreSQL database in a single SQL query. Which feature must be configured in the Databricks workspace to enable this?", "type": "single", "options": [{"label": "A", "text": "A Lakehouse Federation connection registered in Unity Catalog that defines the external PostgreSQL database as a foreign catalog, allowing it to be queried alongside Delta tables"}, {"label": "B", "text": "A Delta S
