window.DEFS_DATA = [{"category": "Understanding of Databricks Data + AI Platform", "term": "Partner Connect", "definition": "A Databricks feature that streamlines connecting validated third-party tools (like Fivetran, Tableau, or Power BI) to a SQL warehouse. It auto-configures the integration and credentials. The easy path to wire external BI or ingestion tools.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Lakehouse", "definition": "An architecture that unifies the low-cost, open storage of a data lake with the reliability, governance, and performance of a data warehouse. It lets BI, SQL, and AI run on one copy of data. Databricks is built on this model.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Databricks Assistant", "definition": "An AI helper embedded across Databricks that composes, explains, and fixes SQL or code from natural-language prompts. Analysts use it to draft queries when defining datasets. It speeds authoring without bypassing governance.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Databricks Notebooks", "definition": "A collaborative, multi-language (SQL, Python, R, Scala) environment for interactive, reproducible analysis. Cells run against attached compute and mix code, results, and narrative. Common for exploration and data science.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Catalog Explorer", "definition": "The UI for browsing and inspecting Unity Catalog objects — catalogs, schemas, tables, columns, lineage, and permissions. Analysts use it to discover datasets and manage access via the Permissions tab. It surfaces the metadata that powers governance and Genie.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Databricks Marketplace", "definition": "An open exchange for discovering and ingesting shared data products and assets from providers. It is powered by Delta Sharing, so data is accessed without copying. Use it to bring external datasets into your workspace.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Mosaic AI", "definition": "Databricks' suite for building, deploying, and governing AI and machine-learning solutions, including domain-specific agentic applications. It integrates with Unity Catalog governance. It is the platform's AI product line.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Databricks Data Intelligence Platform components", "definition": "The platform includes Unity Catalog for governance, Lakeflow Jobs for workflow orchestration, Mosaic AI for machine learning, Delta Live Tables for pipeline development, Databricks SQL for analytics, and the Data Intelligence Engine for query optimization. Unity Catalog provides fine-grained access control, data lineage, and auditing across workspaces.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Data Intelligence Engine", "definition": "The Data Intelligence Engine is the AI layer that makes the Databricks platform intelligent about the meaning of an organisation's data beyond just metadata. It powers Databricks Assistant for query writing and debugging, natural language search and discovery in Catalog Explorer, AI/BI Genie for natural language analytics, and intelligent platform-wide recommendations. It differentiates Databricks as a Data Intelligence Platform rather than just a data processing platform.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "AI in the Databricks Data Intelligence Platform", "definition": "The Databricks Data Intelligence Platform integrates AI across the analyst experience in two primary ways. Databricks Assistant provides in-workflow AI coding assistance for query writing and debugging, and AI/BI Genie provides natural language analytics for business users. Both features are powered by the Data Intelligence Engine's understanding of organisational data semantics.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "SQL Warehouse concurrency and scaling", "definition": "SQL Warehouses handle concurrency through multi-cluster autoscaling, automatically adding clusters when concurrent query demand exceeds current capacity and removing them when demand drops. A single query runs within one cluster and is parallelised across its executors rather than distributed across clusters. Serverless warehouses offer the fastest startup by using Databricks-managed pre-warmed compute infrastructure.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Catalog Explorer capabilities", "definition": "Catalog Explorer is a governance and discovery interface within the Databricks workspace. It lets users browse the three-level namespace of catalogs, schemas, and tables, inspect table schemas and sample data, manage permissions, apply tags, and view data lineage showing upstream sources and downstream consumers. It is a read-only metadata tool, not a data editing or visual query building tool.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Databricks Lakehouse architecture", "definition": "The Lakehouse combines data lake economics (open Parquet formats on low-cost cloud object storage) with data warehouse reliability (ACID transactions, schema enforcement, performance optimizations) via Delta Lake's transaction log. Its key benefit is eliminating the two-tier lake-plus-warehouse design by enabling governed, high-performance analytics directly on Delta tables, reducing data duplication and pipeline complexity.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Data lineage in Unity Catalog", "definition": "Unity Catalog automatically captures column-level and table-level data lineage by analysing SQL query execution across the platform. The Catalog Explorer lineage tab for any governed table displays an interactive directed graph showing upstream source tables and downstream consumers including other tables, views, dashboards, and notebooks. This built-in lineage capability is always current and requires no manual documentation or external tools.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Catalog Explorer for data discovery", "definition": "Catalog Explorer is the primary data discovery and browsing tool in the Databricks workspace. It provides a visual interface for navigating the Unity Catalog three-level namespace hierarchy without requiring SQL. Analysts can view table schemas, read descriptions and comments, preview sample data, and explore lineage from a single interface, making it the recommended starting point for analysts new to a workspace.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Unity Catalog data lineage graph", "definition": "Unity Catalog automatically captures and displays data lineage in Catalog Explorer. The lineage graph shows upstream and downstream relationships between tables, views, and dashboards, enabling analysts to trace how data flows from raw ingestion through transformation layers to final consumption. Column-level lineage shows how individual output columns are derived from specific source columns, supporting impact analysis when source schemas change.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Databricks platform component mapping", "definition": "Databricks platform components map to common data engineering requirements. Delta Live Tables provides managed pipeline infrastructure for continuous and incremental ingestion from streaming and batch sources. Lakeflow Jobs orchestrates scheduled batch workflows including multi-step SQL and notebook pipelines. Unity Catalog provides the unified governance layer with the three-level namespace, access control, lineage tracking, and data discovery.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "SQL Warehouse elastic concurrency", "definition": "SQL Warehouses provide elastic concurrency through multi-cluster autoscaling. When demand exceeds current cluster capacity new clusters start automatically up to the configured maximum. Each cluster handles multiple concurrent queries and the warehouse routes queries across available clusters to balance load. Idle clusters are automatically paused, providing cost efficiency and performance scalability without manual cluster management.", "syntax": null}, {"category": "Understanding of Databricks Data + AI Platform", "term": "Business analyst role", "definition": "On the Databricks Lakehouse Platform, the business analyst role centers on ad-hoc queries, reports, and dashboards, so Databricks SQL is its primary service. Data scientist and data engineer roles primarily use engineering or data science surfaces.", "syntax": null}, {"category": "Managing Data", "term": "Delta Lake", "definition": "An open storage layer that brings ACID transactions, schema enforcement, and time travel to data lake files. It is the default table format in Databricks and stores data as Parquet plus a transaction log. It powers reliable batch and streaming on the same table.", "syntax": "CREATE TABLE t (id INT) USING DELTA;"}, {"category": "Managing Data", "term": "Transaction Log (_delta_log)", "definition": "An ordered record of every change made to a Delta table, stored as JSON/checkpoint files alongside the data. It is what guarantees ACID transactions and enables time travel and concurrency control. Readers use it to see a consistent snapshot of the table.", "syntax": null}, {"category": "Managing Data", "term": "Time Travel", "definition": "Lets you query or restore a previous version of a Delta table using a version number or timestamp. It relies on the transaction log and retained data files. Useful for audits, rollbacks, and reproducing past results (default history ~30 days).", "syntax": "SELECT * FROM t VERSION AS OF 12;  -- or TIMESTAMP AS OF '2026-01-01'"}, {"category": "Managing Data", "term": "MERGE INTO (Upsert)", "definition": "Combines insert, update, and delete into one atomic operation by matching a source against a target on a condition. It updates or deletes matched rows and inserts unmatched ones, avoiding a full rewrite. The standard way to apply change-data or upserts.", "syntax": "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *;"}, {"category": "Managing Data", "term": "OPTIMIZE & ZORDER", "definition": "OPTIMIZE compacts many small files into fewer large ones to speed up reads. ZORDER co-locates related data in the same files based on chosen columns, improving data skipping for those filters. Run them on frequently queried Delta tables.", "syntax": "OPTIMIZE t ZORDER BY (customer_id);"}, {"category": "Managing Data", "term": "VACUUM", "definition": "Permanently deletes data files no longer referenced by the transaction log and older than the retention threshold (default 7 days). It reclaims storage but removes the ability to time-travel before that point. Do not set the retention too low or you break time travel.", "syntax": "VACUUM t RETAIN 168 HOURS;"}, {"category": "Managing Data", "term": "RESTORE", "definition": "Rolls a Delta table back to an earlier version or timestamp, making that snapshot the current state. It is a metadata operation built on time travel. Useful to undo a bad write or reprocessing.", "syntax": "RESTORE TABLE t TO VERSION AS OF 12;"}, {"category": "Managing Data", "term": "Schema Enforcement & Evolution", "definition": "Schema enforcement rejects writes whose columns/types do not match the table, protecting data quality. Schema evolution optionally allows the table schema to grow to accept new columns when enabled. Together they balance safety and flexibility.", "syntax": "-- enable evolution for a write\nINSERT INTO t ... ;  -- with mergeSchema / autoMerge enabled"}, {"category": "Managing Data", "term": "Liquid Clustering", "definition": "A Delta feature that automatically and incrementally organizes data layout as it changes, replacing fixed partitioning and manual ZORDER. It adapts to evolving query patterns without full rewrites. Improves performance on high-cardinality or skewed keys.", "syntax": "CREATE TABLE t (...) CLUSTER BY (customer_id);"}, {"category": "Managing Data", "term": "Managed vs External Table", "definition": "For a managed table Databricks controls both the metadata and the underlying data location, so DROP TABLE deletes the data too. For an external table you specify a LOCATION and Databricks manages only the metadata, so dropping it leaves the files intact. Choose external when other tools also own the data.", "syntax": "CREATE TABLE t (...) LOCATION 's3://bucket/path';  -- external"}, {"category": "Managing Data", "term": "Three-Level Namespace", "definition": "Unity Catalog addresses objects as catalog.schema.table (or .volume). The catalog is the top container, the schema groups related objects, and the table/volume holds the data. Setting a default catalog and schema lets you avoid writing the full path each time.", "syntax": "SELECT * FROM production.sales.orders;"}, {"category": "Managing Data", "term": "Metastore", "definition": "The top-level container in Unity Catalog that holds catalogs, schemas, and their metadata for an account/region. Each workspace is attached to one metastore. It sits above catalogs in the object hierarchy.", "syntax": null}, {"category": "Managing Data", "term": "Data Lineage", "definition": "Unity Catalog automatically captures upstream and downstream relationships between tables and columns by analyzing query execution. It shows which sources produced a table and which dashboards or queries consume it, down to the column level. No manual annotation or specific pipeline type is required.", "syntax": null}, {"category": "Managing Data", "term": "Volumes", "definition": "Unity Catalog objects that govern access to non-tabular files (CSV, JSON, images, PDFs) in cloud storage. They live inside a schema and are the recommended place to upload files for table creation. They apply the same governance as tables.", "syntax": "SELECT * FROM read_files('/Volumes/main/raw/files/data.csv', header => true);"}, {"category": "Managing Data", "term": "Delta Sharing", "definition": "An open protocol for securely sharing live data with other organizations without copying it. It powers the Databricks Marketplace and cross-org data exchange. Recipients read the shared data directly, governed by the provider.", "syntax": null}, {"category": "Managing Data", "term": "Lakehouse Federation", "definition": "Lets Databricks query data in external systems (like PostgreSQL, MySQL, Snowflake, or Redshift) in place, without ingesting it first. Foreign catalogs surface those sources inside Unity Catalog with governance and lineage. Useful for querying across systems.", "syntax": null}, {"category": "Managing Data", "term": "CREATE TABLE AS SELECT (CTAS)", "definition": "Creates a new table and fills it in one step from the result of a query. It is the recommended way to build a Delta table from existing data or raw files. The schema is inferred from the query.", "syntax": "CREATE TABLE gold.summary AS\nSELECT dept, SUM(amount) AS total FROM sales GROUP BY dept;"}, {"category": "Managing Data", "term": "ALTER TABLE ... RENAME", "definition": "Renames an existing table without moving or copying the underlying data. On Delta tables it is a metadata-only operation. Use it instead of dropping and recreating a table.", "syntax": "ALTER TABLE old_name RENAME TO new_name;"}, {"category": "Managing Data", "term": "ACID Transactions", "definition": "Guarantees that operations are Atomic, Consistent, Isolated, and Durable, so concurrent readers and writers never see partial or corrupt data. Delta Lake provides ACID on data-lake storage via its transaction log. It is the foundation of reliable tables.", "syntax": null}, {"category": "Managing Data", "term": "DESCRIBE HISTORY", "definition": "Lists the version history of a Delta table, showing each version's timestamp, operation, and metadata. It underpins time travel and auditing. Use it to see exactly what changed and when.", "syntax": "DESCRIBE HISTORY sales;"}, {"category": "Managing Data", "term": "DESCRIBE TABLE EXTENDED", "definition": "Returns detailed metadata about a table, including columns, storage location, owner, and table properties. It is the standard way to inspect a table or find its owner programmatically. Add EXTENDED for the full detail.", "syntax": "DESCRIBE TABLE EXTENDED sales;"}, {"category": "Managing Data", "term": "Data cleaning with SQL DML", "definition": "Data cleaning on Unity Catalog Delta tables uses standard SQL DML operations. DELETE removes rows matching a condition such as IS NULL for missing values. UPDATE modifies specific field values using conditions such as RLIKE for pattern-based identification of invalid data. Both operations modify the underlying Delta table while preserving all other records.", "syntax": "DELETE FROM customers WHERE email IS NULL;\nUPDATE customers SET phone = NULL WHERE phone RLIKE '[a-zA-Z]'"}, {"category": "Managing Data", "term": "Delta Lake Snapshot Isolation", "definition": "Delta Lake uses snapshot isolation, so every query reads the table as it existed at the moment the query began. If another session commits an INSERT, UPDATE, DELETE, or MERGE between two queries, each query reads a legitimately different snapshot and can return a different COUNT(*), and both results are correct for their point in time. Caching produces identical results not varying ones, COUNT(*) is deterministic, and background operations like OPTIMIZE and VACUUM do not silently delete live rows.", "syntax": null}, {"category": "Managing Data", "term": "Unity Catalog Data Lineage", "definition": "Unity Catalog automatically captures data lineage at both the table and column level by analysing query execution, without requiring manual documentation. The lineage graph in Catalog Explorer shows upstream sources and downstream consumers for any registered table. This enables impact analysis when tables change and helps analysts understand data provenance.", "syntax": null}, {"category": "Managing Data", "term": "Managed vs External Tables", "definition": "The core difference is data lifecycle ownership. A managed table stores data in the Unity Catalog managed storage location and dropping the table also deletes the underlying data files. An external table points to a user-specified storage location, and dropping the table removes only the definition while the underlying files persist. Both types support Delta Lake features like time travel.", "syntax": "CREATE TABLE ext_tbl LOCATION 's3://bucket/path';"}, {"category": "Managing Data", "term": "Unity Catalog tags", "definition": "Tags in Unity Catalog are flexible key-value metadata labels for data discovery and governance. They can be applied to catalogs, schemas, tables, and columns to classify assets by sensitivity, domain, quality, or certification status. Tags are searchable in Catalog Explorer and support governance workflows such as PII tracking and data certification programmes.", "syntax": null}, {"category": "Managing Data", "term": "Unity Catalog lineage graph", "definition": "Unity Catalog automatically captures table and column-level lineage by analysing SQL query execution across notebooks, the SQL Editor, and pipelines. The lineage graph in Catalog Explorer displays a visual graph of upstream sources and downstream consumers for a selected table, including tables, dashboards, and notebooks that depend on it. It is the correct tool for impact analysis when planning schema changes or deprecating tables.", "syntax": null}, {"category": "Managing Data", "term": "Unity Catalog automatic data lineage", "definition": "Unity Catalog captures data lineage automatically at both table and column level as a by-product of query execution, without requiring manual configuration or annotation. Lineage covers all workspace interfaces and applies to both managed and external tables, staying current so it supports impact analysis and governance. The legacy Hive metastore had no native lineage capability.", "syntax": null}, {"category": "Managing Data", "term": "DROP TABLE behavior: managed vs external", "definition": "Dropping a managed table removes both its metadata from Unity Catalog and the underlying data files from managed storage, since the catalog owns the full data lifecycle. Dropping an external table removes only the metadata while leaving the underlying data files intact at the external location, so the data survives independently of the catalog definition.", "syntax": null}, {"category": "Managing Data", "term": "Creating a schema in a specific catalog", "definition": "Schemas in Unity Catalog must be created within a specific catalog context. The valid approaches are setting the active catalog with USE CATALOG then running CREATE SCHEMA, or using the fully qualified two-level name (catalog.schema). Clauses like UNDER, IN CATALOG, and USING are not recognized syntax for schema creation.", "syntax": "USE CATALOG analytics; CREATE SCHEMA reporting;"}, {"category": "Managing Data", "term": "Delta Lake concurrency control", "definition": "Delta Lake's concurrency model is optimistic with snapshot isolation for readers. Writers proceed without locks and conflicts are resolved at commit time. Readers always see a consistent snapshot and are never blocked by writers. This model enables high concurrency for both reads and writes while maintaining ACID guarantees through the transaction log.", "syntax": null}, {"category": "Managing Data", "term": "Adding a table comment", "definition": "COMMENT ON TABLE table_name IS 'description' is the standard SQL command for adding a human-readable description to a Unity Catalog table. The comment appears in Catalog Explorer and helps other analysts understand the table's purpose and contents without needing to examine the data directly. Comments can also be added to individual columns using COMMENT ON COLUMN.", "syntax": "COMMENT ON TABLE prod.silver.orders IS 'Cleaned order records'"}, {"category": "Managing Data", "term": "VACUUM command behaviour", "definition": "VACUUM is the storage reclamation command for Delta tables. It permanently deletes unreferenced files older than the retention threshold, and the files it deletes are unrecoverable. The 7-day minimum retention safeguard protects concurrent readers and time travel capability; overriding it requires explicitly disabling the retention check and should be avoided in production. VACUUM does not compact files, which is OPTIMIZE's role.", "syntax": "VACUUM table_name"}, {"category": "Managing Data", "term": "COMMENT ON TABLE", "definition": "COMMENT ON TABLE table_name IS 'description' is the standard Databricks SQL command for adding or updating a table description. The description is stored in Unity Catalog and displayed in Catalog Explorer's table details view, making tables self-documenting for analysts browsing the catalog. Column-level descriptions can be added similarly with COMMENT ON COLUMN.", "syntax": "COMMENT ON TABLE table_name IS 'description'"}, {"category": "Managing Data", "term": "Photon Engine", "definition": "Photon is Databricks' columnar, vectorized execution engine that processes data in batches using modern CPU/SIMD instructions for efficient scans and aggregations. It also uses a caching/transcoding layer to convert data into a CPU-efficient format, speeding scans on very wide, huge tables.", "syntax": null}, {"category": "Managing Data", "term": "Managed table in Unity Catalog", "definition": "A managed table places data under Unity Catalog's control, registering it in the metastore and governing its full lifecycle and storage. It enables automatic features like Predictive Optimization, making it best for frequently queried production data, unlike external or foreign tables that keep data outside that lifecycle.", "syntax": "CREATE TABLE catalog.schema.table_name (columns...);"}, {"category": "Managing Data", "term": "Data enhancement", "definition": "Data enhancement is the enrichment of existing refined (gold) tables with an additional dataset to add value. It is distinct from last-mile ETL, which is a transformation step.", "syntax": null}, {"category": "Managing Data", "term": "Gold layer (medallion architecture)", "definition": "Gold tables are the final, production-ready datasets — denormalized, curated models tuned for analytics, reporting, and machine learning after passing through Bronze and Silver. Raw ingestion is Bronze and cleaning/joining is Silver.", "syntax": null}, {"category": "Managing Data", "term": "OPTIMIZE command", "definition": "OPTIMIZE compacts many small files in a Delta table into fewer larger ones, improving read efficiency. VACUUM removes obsolete files, REFRESH updates metadata/cache, and ANALYZE TABLE collects statistics.", "syntax": "OPTIMIZE table_name;"}, {"category": "Managing Data", "term": "Databricks SQL vs notebooks/Jobs", "definition": "Joining and combining data sources into a single analytical dataset is core SQL work, well suited to Databricks SQL. Clustering algorithms, ML feature tracking, and multi-task workflow orchestration belong to notebooks and Jobs.", "syntax": null}, {"category": "Managing Data", "term": "Partitioning for query performance", "definition": "Partitioning a table into smaller chunks lets the engine prune and process less data per operation, often the most cost-effective performance gain on large datasets. Larger clusters or more parallelism can help but cost more, and increasing the query timeout does not speed anything up.", "syntax": null}, {"category": "Managing Data", "term": "Data Vault 2.0 Link Table", "definition": "In Data Vault 2.0, Hubs hold business keys, Satellites hold descriptive attributes, and Links model relationships. A Link Table holds the foreign keys to each hub and naturally represents many-to-many relationships, while Reference tables only store lookup/code data.", "syntax": null}, {"category": "Importing Data", "term": "Auto Loader", "definition": "Incrementally and efficiently ingests new files from cloud storage as they arrive, tracking what has already been processed. It scales to millions of files and infers/evolves schema. The recommended way to build streaming ingestion from files.", "syntax": "-- Structured Streaming source\ncloudFiles"}, {"category": "Importing Data", "term": "COPY INTO", "definition": "A SQL command that idempotently loads files from a location into a Delta table, skipping files it has already loaded. It suits batch or periodic loads of a known set of files. Simpler than Auto Loader for smaller, bounded ingestion.", "syntax": "COPY INTO t FROM 's3://bucket/path' FILEFORMAT = CSV;"}, {"category": "Importing Data", "term": "read_files()", "definition": "A table-valued function that reads files (CSV, JSON, Parquet, etc.) directly in a SQL query, with options like header and schema inference. Often combined with CTAS to create a table from raw files. Works well with Unity Catalog Volumes.", "syntax": "CREATE TABLE t AS SELECT * FROM read_files('/Volumes/main/raw/f.csv', header => true);"}, {"category": "Importing Data", "term": "Small-File Upload", "definition": "A Databricks SQL feature for quickly importing small text files (like CSV lookup tables) directly through the UI. It is meant for lightweight, immediate use in queries and dashboards. Avoids setting up pipelines or external storage for tiny datasets.", "syntax": null}, {"category": "Importing Data", "term": "Streaming Table", "definition": "A table that is continuously and incrementally updated from a streaming source such as Auto Loader. It requires a running SQL warehouse to create in Databricks SQL. Enables near-real-time pipelines on Delta.", "syntax": "CREATE STREAMING TABLE bronze AS\nSELECT * FROM STREAM read_files('/Volumes/main/raw/');"}, {"category": "Importing Data", "term": "LakeFlow Connect", "definition": "A managed ingestion capability for bringing data from external SaaS apps and databases into Databricks with minimal setup. It simplifies connecting and syncing sources. Part of the LakeFlow family.", "syntax": null}, {"category": "Importing Data", "term": "LakeFlow Designer", "definition": "A visual, low-code tool that lets business analysts build production-grade ETL pipelines using a drag-and-drop or natural-language interface. It targets analysts rather than engineers. It produces governed, maintainable pipelines.", "syntax": null}, {"category": "Importing Data", "term": "Data Ingestion UI", "definition": "The Databricks workspace UI includes a data ingestion interface that lets analysts import files from local storage or cloud sources like S3 through a guided wizard. It creates a Delta table without requiring any code, making it accessible for non-technical users. This is the no-code alternative to code-based approaches like spark.read.csv() or COPY INTO.", "syntax": null}, {"category": "Importing Data", "term": "Auto Loader vs COPY INTO", "definition": "Auto Loader is the preferred choice for continuous or high-frequency incremental file ingestion from cloud storage. Its file notification mode detects new files without directory scanning, making it scalable to millions of files. COPY INTO is more appropriate for one-time or periodic batch loads where simplicity is preferred over continuous streaming ingestion.", "syntax": null}, {"category": "Importing Data", "term": "REST API Ingestion with Auto Loader", "definition": "REST API ingestion into Databricks typically uses an intermediate pattern where API responses are written to cloud storage by a scheduler or serverless function, then Auto Loader detects and ingests the new files into a Delta table incrementally. This decouples the API integration from the ingestion layer and provides reliable near-real-time delivery with Auto Loader's exactly-once file processing guarantees.", "syntax": null}, {"category": "Importing Data", "term": "Databricks Marketplace and Delta Sharing", "definition": "Databricks Marketplace uses the Delta Sharing protocol to deliver data products. When a consumer gets instant access the dataset appears as a shared catalog in their Unity Catalog. The data remains in the provider's storage and is queried directly through the sharing endpoint without being copied to the consumer's storage. This eliminates data duplication and ensures the consumer always accesses the latest version of the shared data.", "syntax": null}, {"category": "Importing Data", "term": "Loading CSV into a managed Delta table with read_files()", "definition": "CREATE TABLE AS SELECT combined with read_files() is the correct approach for creating a new managed Delta table from a CSV file stored in a Unity Catalog volume. read_files() handles format detection and schema inference based on the provided options, and the resulting managed Delta table stores the data independently of the source CSV file.", "syntax": "CREATE TABLE t AS SELECT * FROM read_files('/Volumes/path/file.csv', format => 'csv', header => 'true', inferSchema => 'true')"}, {"category": "Importing Data", "term": "Auto Loader schema evolution", "definition": "Auto Loader supports schema evolution by inferring the schema from the first batch of files and storing it in the checkpoint location, avoiding re-inference on every microbatch. When it detects a new column in incoming files, it can automatically add the column to the target table schema and continue ingestion without manual intervention. It provides more robust schema evolution than COPY INTO and does not require an explicitly defined schema.", "syntax": null}, {"category": "Importing Data", "term": "COPY INTO idempotency", "definition": "COPY INTO's key feature for incremental loading is built-in idempotency through file tracking. It maintains a record of successfully loaded files in the Delta transaction log and automatically skips those files on subsequent runs. This lets analysts run the same statement repeatedly as new files arrive without manually tracking processed files and without duplicating loaded data.", "syntax": "COPY INTO target FROM '/path' FILEFORMAT = JSON"}, {"category": "Importing Data", "term": "COPY INTO for one-time batch load", "definition": "One-time batch loading into an existing Delta table from cloud storage uses either COPY INTO or INSERT INTO with read_files(). COPY INTO is purpose-built for this pattern and tracks loaded files to prevent duplicates on re-runs. INSERT INTO with read_files() is a SQL-first alternative. Auto Loader is for continuous streaming ingestion, and CREATE TABLE AS SELECT creates a new table rather than loading into an existing one.", "syntax": "COPY INTO target FROM '/path' FILEFORMAT = JSON"}, {"category": "Importing Data", "term": "Last-mile ETL", "definition": "Last-mile ETL is the project-specific transformation applied by analysts to gold-layer data right before analysis. It is the final preparation step performed on top of engineered medallion tables.", "syntax": null}, {"category": "Importing Data", "term": "Lakeflow Declarative Pipelines", "definition": "Lakeflow Spark Declarative Pipelines with Auto Loader automate scheduling, support multiple programming languages, and handle schema evolution automatically as new data arrives. This suits automated ETL from multiple sources better than manual schema handling or fixed-schema approaches.", "syntax": null}, {"category": "Importing Data", "term": "External table with LOCATION", "definition": "An external table that references a cloud object storage path via the LOCATION clause reads data directly from that storage without copying it. Direct ingestion from object storage is fully supported; DBFS/FROM or PATH variants use the wrong clause.", "syntax": "CREATE TABLE t ... LOCATION 's3://bucket/path';"}, {"category": "Importing Data", "term": "Lakeflow Spark Declarative Pipelines", "definition": "Lakeflow Spark Declarative Pipelines let teams define transformations declaratively, automatically enforce data-quality expectations at each stage, and route failed expectations to fallback actions without code changes. Lakeflow Jobs schedule work and Lakeflow Connect handles ingestion, neither providing this declarative quality model.", "syntax": null}, {"category": "Importing Data", "term": "UI drag-and-drop file ingestion", "definition": "The Databricks UI drag-and-drop ingestion lets users upload a file such as a CSV without any code while staying integrated with Unity Catalog governance. It is ideal for a one-off, no-code, secure load, whereas Auto Loader and notebook/SQL ETL require code or target automated and streaming ingestion.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "SELECT", "definition": "Retrieves columns and computed expressions from one or more tables. It is the core of every query and defines what the result set looks like. Combine it with FROM to name the source data.", "syntax": "SELECT col1, col2, agg(col3) FROM table;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "WHERE", "definition": "Filters individual rows before any grouping or aggregation happens. Only rows whose condition evaluates to TRUE are passed on. It cannot reference aggregate functions — use HAVING for that.", "syntax": "SELECT * FROM sales WHERE region = 'EU' AND amount > 100;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "GROUP BY", "definition": "Collapses rows that share the same values into summary rows, one per group. It is used together with aggregate functions like SUM, COUNT, or AVG. Every non-aggregated column in the SELECT must appear in the GROUP BY.", "syntax": "SELECT dept, COUNT(*) FROM emp GROUP BY dept;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "HAVING", "definition": "Filters groups after aggregation, whereas WHERE filters rows before it. Use HAVING to keep only groups whose aggregate meets a condition. It always follows GROUP BY.", "syntax": "SELECT dept, AVG(sal) FROM emp GROUP BY dept HAVING AVG(sal) > 5000;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "ORDER BY", "definition": "Sorts the final result set by one or more columns, ascending (ASC, default) or descending (DESC). It runs last, after filtering and grouping. Sorting large results can be expensive.", "syntax": "SELECT * FROM sales ORDER BY amount DESC;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "LIMIT", "definition": "Restricts the number of rows returned. In Databricks SQL (Spark SQL) LIMIT is the correct keyword — TOP and FETCH FIRST are not supported. Often paired with ORDER BY to get the top-N rows.", "syntax": "SELECT * FROM sales ORDER BY amount DESC LIMIT 5;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "DISTINCT", "definition": "Removes duplicate rows from the result so each combination of selected values appears once. It applies to the whole SELECT list, not a single column. Can be costly because it requires a shuffle to deduplicate.", "syntax": "SELECT DISTINCT region FROM sales;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "CASE WHEN", "definition": "Adds conditional (if/else) logic inside a query, returning different values based on conditions. Each WHEN is tested in order and the first match wins; ELSE covers everything else. Commonly used to bucket or label values.", "syntax": "SELECT amount, CASE WHEN amount < 50000 THEN 'Small' WHEN amount <= 200000 THEN 'Medium' ELSE 'Large' END AS tier FROM orders;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "LIKE", "definition": "Matches string patterns using wildcards: % matches any sequence of characters and _ matches a single character. Useful for partial text searches in a WHERE clause. Use ILIKE for case-insensitive matching.", "syntax": "SELECT * FROM customers WHERE name LIKE 'Jo%';"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "INNER JOIN", "definition": "Returns only rows that have a matching key in both tables. Rows without a match on either side are dropped. It is the default JOIN type when you write just JOIN.", "syntax": "SELECT * FROM a INNER JOIN b ON a.id = b.id;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "LEFT (OUTER) JOIN", "definition": "Returns every row from the left table plus matching rows from the right; where there is no match, right-side columns are NULL. Use it to keep all records from the primary table. RIGHT JOIN does the mirror image.", "syntax": "SELECT * FROM customers c LEFT JOIN orders o ON c.id = o.customer_id;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "FULL OUTER JOIN", "definition": "Returns all rows from both tables, matching them where possible and filling NULLs where there is no match on either side. It is the union of LEFT and RIGHT joins. Useful for reconciling two datasets.", "syntax": "SELECT * FROM a FULL OUTER JOIN b ON a.id = b.id;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "UNION vs UNION ALL", "definition": "Both stack the rows of two queries with identical columns. UNION removes duplicate rows (an implicit DISTINCT), while UNION ALL keeps every row including duplicates and is faster. Use UNION ALL when duplicates cannot occur or should be preserved.", "syntax": "SELECT id FROM q2023 UNION SELECT id FROM q2024;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "COALESCE", "definition": "Returns the first non-NULL value from a list of expressions, evaluated left to right. It is commonly used to substitute a default for missing values. Handy after LEFT JOINs where unmatched columns are NULL.", "syntax": "SELECT COALESCE(phone, mobile, 'N/A') FROM contacts;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "ROLLUP", "definition": "Produces subtotals along a hierarchy plus a grand total in a single GROUP BY. GROUP BY ROLLUP(a, b) returns totals per (a,b), per a, and overall. Ideal for hierarchical reports.", "syntax": "SELECT region, product, SUM(amt) FROM sales GROUP BY ROLLUP(region, product);"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "CUBE", "definition": "Generates subtotals for every possible combination of the grouped columns, not just a hierarchy. GROUP BY CUBE(a, b) gives totals per (a,b), per a, per b, and overall. Use it for multi-dimensional cross-tabs.", "syntax": "SELECT region, product, SUM(amt) FROM sales GROUP BY CUBE(region, product);"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "GROUPING SETS", "definition": "Lets you specify exactly which grouping combinations you want, instead of all (CUBE) or a hierarchy (ROLLUP). Each set in the list becomes its own level of aggregation. Gives fine-grained control over subtotals.", "syntax": "SELECT region, product, SUM(amt) FROM sales GROUP BY GROUPING SETS ((region, product), (region), ());"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "APPROX_COUNT_DISTINCT", "definition": "Estimates the number of distinct values much faster and with far less memory than COUNT(DISTINCT), using a probabilistic algorithm (HyperLogLog). The result is approximate but typically within a few percent. Ideal for very large datasets where exactness is not critical.", "syntax": "SELECT APPROX_COUNT_DISTINCT(user_id) FROM events;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Window Function (OVER)", "definition": "Performs a calculation across a set of rows related to the current row without collapsing them into one, unlike GROUP BY. The OVER clause defines the window, optionally partitioned and ordered. Enables running totals, rankings, and row-level comparisons.", "syntax": "SELECT name, dept, SUM(sal) OVER (PARTITION BY dept) FROM emp;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "ROW_NUMBER / RANK / DENSE_RANK", "definition": "Ranking window functions that number rows within a partition. ROW_NUMBER gives a unique sequential number; RANK leaves gaps after ties; DENSE_RANK ranks ties equally with no gaps. Use DENSE_RANK to find the Nth distinct value.", "syntax": "SELECT name, DENSE_RANK() OVER (ORDER BY sal DESC) AS r FROM emp;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Higher-Order Functions", "definition": "Functions that operate on array or map columns by taking a lambda expression, such as transform, filter, exists, and reduce. They let you process complex/nested data directly in SQL without exploding rows. Common for arrays of values inside a single column.", "syntax": "SELECT transform(ratings, x -> x + 1) FROM reviews;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Materialized View", "definition": "A view whose results are precomputed and stored, then refreshed on a schedule or on demand. Unlike a standard view (which re-runs its query every time), it serves fast reads of expensive aggregations. Ideal when source data updates less often than it is queried.", "syntax": "CREATE MATERIALIZED VIEW mv AS SELECT dept, SUM(amt) FROM sales GROUP BY dept;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Standard View vs Temp View", "definition": "A standard view stores a saved query that re-executes and reflects the latest data whenever queried. A temporary view exists only for the current session and disappears at logout. Neither stores data itself; they always read live from the source.", "syntax": "CREATE VIEW v AS SELECT ...;\nCREATE TEMP VIEW tv AS SELECT ...;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "SQL Warehouse", "definition": "The compute resource that runs SQL queries, dashboards, and alerts in Databricks SQL. Larger warehouses provide more parallelism and concurrency at higher cost. You must select one before creating streaming tables or running queries.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Serverless SQL Warehouse", "definition": "A SQL warehouse whose compute is managed by Databricks and starts almost instantly, eliminating spin-up wait time. It is cost-effective for spiky or scheduled workloads because there is no idle cluster to wait on. Ideal before time-sensitive scheduled reports.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Auto Stop", "definition": "A setting that shuts a SQL warehouse down after a period of inactivity to save cost. A query (or a dashboard refresh) arriving while it is stopped will restart it, adding a brief startup delay and cost. Balance it against how often the warehouse is used.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Subquery", "definition": "A query nested inside another query, in the WHERE, FROM, or SELECT clause. It produces an intermediate result the outer query uses, such as comparing each row to an aggregate. A correlated subquery references the outer query and runs per row.", "syntax": "SELECT name FROM emp WHERE sal > (SELECT AVG(sal) FROM emp);"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Common Table Expression (WITH / CTE)", "definition": "A named temporary result set defined with WITH that the main query can reference by name. It makes complex queries readable and lets you reuse a subquery. It exists only for the duration of that query.", "syntax": "WITH big AS (SELECT * FROM sales WHERE amount > 1000)\nSELECT region, COUNT(*) FROM big GROUP BY region;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "EXCEPT", "definition": "Returns rows from the first query that do not appear in the second (set difference), removing duplicates. Use it to find what exists in A but not in B. EXCEPT ALL keeps duplicates.", "syntax": "SELECT id FROM a EXCEPT SELECT id FROM b;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "INTERSECT", "definition": "Returns only the rows that appear in both queries (set intersection), removing duplicates. Use it to find the overlap between two result sets. The columns must match in number and type.", "syntax": "SELECT id FROM a INTERSECT SELECT id FROM b;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Databricks SQL Editor", "definition": "The in-product surface for writing and running SQL, previewing results, and building visualizations. It is the most familiar tool for analysts used to traditional SQL editors. It runs queries on a SQL warehouse.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Run Preview (Play button)", "definition": "Runs the current query in the SQL editor and shows the result table before you build a visualization or dashboard. It lets analysts quickly check output while iterating. A core part of the query-writing workflow.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "WHERE vs HAVING clause ordering", "definition": "WHERE filters individual rows before aggregation and cannot reference aggregate functions or SELECT aliases. HAVING filters grouped results after aggregation. A correct query applies row-level date filters in WHERE and aggregate thresholds in HAVING, following the standard SQL clause order.", "syntax": "SELECT customer_id, SUM(order_value) AS total_value\nFROM orders\nWHERE order_date >= CURRENT_DATE - INTERVAL 30 DAYS\nGROUP BY customer_id\nHAVING SUM(order_value) > 1000"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Streaming Table vs Materialized View", "definition": "Streaming Tables are designed for continuous or incremental ingestion from append-only or streaming sources such as Kafka or Auto Loader, where new records are appended. Materialized Views pre-compute and store the results of complex queries including aggregations and joins for fast repeated querying, refreshing on a defined schedule.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Top-N Query Clause Order", "definition": "Returning top-N results by an aggregate measure requires WHERE for row-level filtering, GROUP BY for aggregation, ORDER BY DESC on the measure to sort from highest to lowest, and LIMIT N to restrict the output. All four elements must appear in the correct clause order: WHERE before GROUP BY and ORDER BY before LIMIT.", "syntax": "SELECT product_id, SUM(sale_amount) AS total_sales\nFROM orders\nWHERE sale_date >= CURRENT_DATE - INTERVAL 90 DAYS\nGROUP BY product_id\nORDER BY total_sales DESC\nLIMIT 5"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Delta Lake Time Travel Syntax", "definition": "Delta Lake supports two time travel syntaxes. VERSION AS OF followed by an integer retrieves a specific commit version. TIMESTAMP AS OF followed by a date or timestamp string retrieves the table state at a specific point in time. DESCRIBE HISTORY can be used to find the version numbers and timestamps of past commits to guide time travel queries.", "syntax": "SELECT * FROM sales.transactions TIMESTAMP AS OF '2024-01-01';"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "COALESCE and CASE WHEN", "definition": "COALESCE is the standard function for replacing NULL values with defaults such as zero for missing sales, returning the first non-null value in its argument list. CASE WHEN implements conditional display logic based on column values, such as showing 'Confidential' for restricted categories. Both are fundamental SQL functions for implementing business display rules and data masking in query results.", "syntax": "SELECT COALESCE(SUM(sale_amount), 0),\n  CASE WHEN category = 'Internal' THEN 'Confidential' ELSE CAST(revenue AS STRING) END\nFROM orders;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "GROUP BY Aggregation Rules", "definition": "Per-customer aggregation uses GROUP BY customer_id with aggregate functions applied to the other columns. MAX(order_date) returns the most recent date within each customer group and COUNT(order_id) counts the rows. All columns in the SELECT list must either be in the GROUP BY clause or wrapped in an aggregate function.", "syntax": "SELECT customer_id, MAX(order_date) AS most_recent_order, COUNT(order_id) AS total_orders\nFROM orders\nGROUP BY customer_id"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Grand Total Column with Window Function", "definition": "Adding a grand total as a column alongside group-level aggregates uses either a window function SUM applied to the grouped aggregate or a scalar subquery that calculates the overall total independently. Both approaches produce one row per group with the group total and grand total in separate columns. The window function approach is generally more efficient for large tables as it avoids a second full table scan.", "syntax": "SELECT department, SUM(salary) AS dept_total, SUM(SUM(salary)) OVER () AS company_total FROM employees GROUP BY department"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Anti-Join with LEFT JOIN and IS NULL", "definition": "The safest and most explicit approach for finding rows in one table with no match in another is a LEFT JOIN combined with IS NULL on the right table's join key. NOT IN with a subquery also works but behaves unexpectedly when the subquery contains NULL values. EXCEPT is the correct set difference operator in Databricks SQL if a set-based approach is preferred over a join.", "syntax": "SELECT c.customer_id FROM customers c LEFT JOIN orders o ON c.customer_id = o.customer_id WHERE o.customer_id IS NULL"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Notebook Data Profile Feature", "definition": "The Databricks notebook data profile feature is the most efficient tool for initial data quality assessment. After running display(df) or a SQL query, the analyst clicks the data profile tab to instantly see null counts, distinct value counts, min, max, mean, and distribution histograms for every column. This replaces multiple manual profiling queries with a single interactive operation.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Top N Percent with PERCENT_RANK()", "definition": "Filtering on window function results requires a CTE or subquery because window functions are evaluated after WHERE. PERCENT_RANK() returns a value between 0 and 1 representing each row's relative position in the ordered set, so filtering on pct_rank <= 0.1 retrieves the top 10 percent. NTILE(10) is an alternative approach where filtering for NTILE = 1 also returns the top decile.", "syntax": "WITH ranked AS (SELECT customer_id, PERCENT_RANK() OVER (ORDER BY total_spend DESC) AS pct_rank FROM customer_spend) SELECT customer_id FROM ranked WHERE pct_rank <= 0.1"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Rolling Average with Window Frame", "definition": "Rolling averages use window functions with a ROWS BETWEEN clause to define the frame. For a 3-month rolling average, ROWS BETWEEN 2 PRECEDING AND CURRENT ROW includes the current month and the two immediately preceding months in the average calculation. The frame size is always one less than the number of periods because the current row counts as one of the periods.", "syntax": "AVG(total_revenue) OVER (ORDER BY revenue_month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS rolling_avg"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Running Total with UNBOUNDED PRECEDING", "definition": "Running totals use a window function with ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW to accumulate all values from the start of the partition to the current row. This is the standard SQL pattern for year-to-date, month-to-date, or any cumulative running total. No PARTITION BY is needed when the accumulation should span the entire dataset ordered by date.", "syntax": "SUM(daily_total) OVER (ORDER BY sale_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "GROUP BY Non-Aggregated Column Rule", "definition": "SQL requires every column in the SELECT list to either appear in the GROUP BY clause or be wrapped in an aggregate function such as SUM, COUNT, MAX, MIN, or AVG. A column that is neither grouped nor aggregated causes Databricks SQL to raise an AnalysisException. The fix is either to add the column to the GROUP BY clause or to remove it from the SELECT list.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "AND/OR Operator Precedence", "definition": "In SQL, AND has higher precedence than OR, so AND conditions are evaluated before OR conditions. When combining AND and OR in the same WHERE clause, use parentheses to explicitly control the evaluation order, otherwise the query can return too many or too few rows. This is a common source of subtle query bugs.", "syntax": "WHERE category = 'Electronics' AND (price > 500 OR discount > 0.1)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Delta Lake Time Travel", "definition": "Delta Lake time travel uses VERSION AS OF or TIMESTAMP AS OF syntax appended to the table reference in the FROM clause. VERSION AS OF uses the integer commit version number visible in DESCRIBE HISTORY, while TIMESTAMP AS OF uses a date or timestamp string. Both allow querying historical table states without modifying the current table.", "syntax": "SELECT * FROM sales.orders VERSION AS OF 5;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Dynamic (Standard SQL) Views", "definition": "Dynamic views (standard SQL views) are evaluated at query time and always reflect the current state of the underlying tables, without storing any pre-computed results. This contrasts with Materialized Views, which store pre-computed results and require scheduled refreshes, and Streaming Tables, which are for continuous ingestion. For always-current on-demand results, a dynamic view is the correct choice.", "syntax": "CREATE VIEW current_orders AS SELECT * FROM orders;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "SQL Warehouse Role", "definition": "A SQL Warehouse is a compute resource that executes SQL queries submitted through Databricks SQL, notebooks, and BI tools connected via JDBC or ODBC. It supports concurrent execution from multiple users and can auto-scale. Warehouses come in three types (Serverless, Pro, Classic), with Serverless offering the fastest startup using Databricks-managed pre-warmed compute. It does not store data or manage governance; that is Unity Catalog's role.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Query Parameters in Databricks SQL", "definition": "Databricks SQL parameters are defined inline within a query using a named parameter marker with colon syntax (:parameter_name) and can be surfaced as interactive widgets on dashboards. They do not require pre-registration in Unity Catalog and can be used in multiple parts of a query, not just WHERE clauses. A single dashboard parameter widget can be linked to multiple query-based visualisations so changing its value updates all linked visualisations simultaneously.", "syntax": "SELECT * FROM orders WHERE order_date >= :start_date;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "IN subquery pattern", "definition": "The IN subquery pattern is the standard approach for filtering rows in one table based on matching values returned by a query on another table. The subquery executes first and returns a set of values which the outer query then uses in the IN condition. Always use IN rather than = when the subquery may return multiple rows.", "syntax": "SELECT * FROM customers WHERE customer_id IN (SELECT customer_id FROM orders WHERE order_value > 1000);"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Creating an external table", "definition": "In Databricks SQL, external tables are created using CREATE TABLE with a LOCATION clause pointing to the external storage path, plus a USING clause specifying the file format. The table definition uses the three-level Unity Catalog namespace. Dropping an external table removes the metadata from the catalog but does not delete the underlying files at the LOCATION path.", "syntax": "CREATE TABLE prod.sales.transactions (id BIGINT) USING PARQUET LOCATION 's3://my-bucket/sales/transactions/';"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "RANK() window function with PARTITION BY", "definition": "Ranking within groups requires a window function with PARTITION BY on the grouping dimension. RANK() OVER (PARTITION BY region ORDER BY total_revenue DESC) resets the ranking independently for each region and assigns rank 1 to the highest earner. Because window functions cannot be applied directly to aggregate expressions at the same query level, a subquery or CTE is used to first compute the aggregated totals.", "syntax": "SELECT rep_name, region, RANK() OVER (PARTITION BY region ORDER BY total_revenue DESC) AS revenue_rank FROM (SELECT rep_name, region, SUM(revenue) AS total_revenue FROM sales GROUP BY rep_name, region);"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "LEFT JOIN with COALESCE for zero defaults", "definition": "Combining LEFT JOIN with COALESCE is the standard pattern for returning all rows from the left table with zero instead of NULL for aggregate functions when no matching rows exist on the right. LEFT JOIN preserves unmatched left-side rows and COALESCE handles the NULL that aggregate functions return when applied to no rows. Note that ISNULL is not a standard Databricks SQL function; use COALESCE or IFNULL.", "syntax": "SELECT p.product_id, COALESCE(SUM(o.sale_amount), 0) AS total_sales FROM products p LEFT JOIN orders o ON p.product_id = o.product_id GROUP BY p.product_id;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "CREATE TABLE AS SELECT with read_files()", "definition": "CREATE TABLE AS SELECT (CTAS) creates a managed Delta table by executing a query and persisting the result. read_files() is the correct function for reading files such as CSV stored in Unity Catalog volumes within a SQL query. Combining CTAS with read_files() and a JOIN lets analysts create unified Delta tables from multiple source types in a single statement.", "syntax": "CREATE TABLE prod.sales.unified AS SELECT d.customer_id, c.segment FROM prod.sales.customers d JOIN read_files('/Volumes/prod/sales/raw/segments.csv', format => 'csv', header => 'true') c ON d.customer_id = c.customer_id;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Common Table Expressions (CTEs)", "definition": "CTEs defined with the WITH clause create named temporary result sets at the top of a query that can be referenced multiple times in the main query body. They improve readability and reduce repetition of complex subquery logic within a single query, making multi-step analytical queries easier to understand and maintain.", "syntax": "WITH monthly AS (SELECT month, SUM(revenue) r FROM sales GROUP BY month) SELECT * FROM monthly;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "LEFT JOIN", "definition": "A LEFT JOIN returns all rows from the left table and matching rows from the right table, filling right-side columns with NULL where no match exists. It is the correct choice when all rows from one table must be preserved regardless of a match in the other, such as keeping all orders even when no matching customer record exists.", "syntax": "SELECT o.*, c.name FROM orders o LEFT JOIN customers c ON o.customer_id = c.id;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Percentage-of-total with window function", "definition": "Percentage contribution calculations require dividing each group's aggregate by the grand total. SUM(revenue) in the GROUP BY gives each category's total, while SUM(SUM(revenue)) OVER () is a window function computing the grand total across all categories in the same pass. This is generally more efficient than a scalar subquery that scans the table again.", "syntax": "SELECT category, SUM(revenue) / SUM(SUM(revenue)) OVER () * 100 AS pct_of_total FROM sales GROUP BY category;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "MERGE INTO on Delta tables", "definition": "MERGE INTO is the core upsert command for Delta Lake tables, handling insert, update, and delete operations atomically in a single statement using WHEN MATCHED and WHEN NOT MATCHED clauses. It is ACID-compliant so the operation completes fully or rolls back entirely, and it uses optimistic concurrency so concurrent readers are not blocked. The target table must already exist.", "syntax": "MERGE INTO target t USING source s ON t.id = s.id WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "USE CATALOG and USE SCHEMA", "definition": "USE CATALOG and USE SCHEMA are session-scoped context commands that set the default namespace for resolving unqualified object references, letting queries reference tables by name without the full three-level prefix. They do not grant permissions or create objects, and their effect lasts only for the current session or until changed.", "syntax": "USE CATALOG prod; USE SCHEMA silver; SELECT * FROM orders;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "EXCEPT set operator", "definition": "EXCEPT is the set-difference operator that returns distinct rows from the first query that do not appear in the second query, and is appropriate for finding records present in one dataset but absent from another. Like UNION, both queries must return the same number of columns with compatible types. EXCEPT ALL preserves duplicates for cases where row-level multiplicity matters.", "syntax": "SELECT id FROM staging EXCEPT SELECT id FROM target;"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Exporting query results to CSV in the SQL Editor", "definition": "The Databricks SQL Editor includes a Download button in the results panel that exports query results as a CSV or TSV file. This is the correct and simplest approach for exporting results for offline analysis, and the download captures the full result set rather than just the visible rows in the paginated grid display.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Case-insensitive substring matching", "definition": "Case-insensitive substring matching in Databricks SQL uses LOWER combined with LIKE and % wildcards, or the ILIKE operator which performs case-insensitive pattern matching directly. LOWER(column) LIKE '%pattern%' is the most widely compatible approach, while ILIKE '%pattern%' is a more concise alternative that achieves the same result without needing LOWER.", "syntax": "WHERE LOWER(product_name) LIKE '%wireless%'"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Filtering with Unix timestamps", "definition": "Working with Unix timestamps stored as integers requires converting either the stored integer to a timestamp for comparison, or converting the target date to a Unix integer. UNIX_TIMESTAMP() converts a date string to seconds since epoch for integer comparison. CAST AS TIMESTAMP and FROM_UNIXTIME convert the stored integer to a timestamp type. All three are valid approaches for the date filtering.", "syntax": "WHERE event_timestamp > UNIX_TIMESTAMP('2024-01-01')"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Multi-measure aggregation with GROUP BY", "definition": "Multi-measure aggregation queries combine multiple aggregate functions in a single GROUP BY query. Each aggregate function independently computes its measure across all rows in each group. COUNT DISTINCT is specifically required when counting unique entities within a group because COUNT without DISTINCT counts all non-null occurrences including duplicates. MEAN is not a valid Databricks SQL function; AVG is the correct equivalent.", "syntax": "SELECT category, SUM(order_value), AVG(order_value), COUNT(DISTINCT customer_id) FROM orders GROUP BY category"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Saved queries in the SQL Editor", "definition": "The Databricks SQL Query Editor supports saving queries by name using the Save button. Saved queries are stored in the workspace and appear in the Saved Queries panel, making them immediately accessible in future sessions without needing to rewrite them. Saved queries can also be used as data sources for dashboard widgets and alerts, making them a central reusable asset in a Databricks SQL workflow.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "ROLLUP operator", "definition": "ROLLUP is a GROUP BY extension for hierarchical subtotal reporting. It generates aggregate rows at each level of the column hierarchy from right to left, plus a grand total. It is commonly used for financial reports and sales summaries where subtotals by region, then by country, then by store, plus a grand total are needed. CUBE generates all possible combinations while ROLLUP respects the left-to-right column hierarchy.", "syntax": "SELECT year, quarter, SUM(sales) FROM t GROUP BY ROLLUP(year, quarter)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Materialized Views in Databricks SQL", "definition": "Materialised Views store pre-computed query results for fast repeated access and support incremental refresh to efficiently process only new or changed data. They are distinct from dynamic views which re-execute on every access and from Streaming Tables which are designed for continuous ingestion. Materialised Views are ideal for complex aggregation queries that power dashboards and are refreshed on a schedule aligned with source data update frequency.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Schema Inference with CREATE TABLE USING PARQUET LOCATION", "definition": "Creating a Delta or Parquet table from existing files using LOCATION without explicit column definitions causes Databricks to automatically infer the schema from the file metadata. Parquet files are particularly well suited because they store column names and types in the file footer. This approach avoids manually specifying schemas for wide tables and ensures the table definition matches the actual file structure.", "syntax": "CREATE TABLE prod.silver.events USING PARQUET LOCATION '/Volumes/prod/raw/events/'"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "GROUP BY Granularity", "definition": "GROUP BY creates one row per unique combination of all specified columns. Adding a second grouping column produces one row for each distinct combination, changing the aggregation granularity. To aggregate to a coarser level the GROUP BY clause should contain only the desired columns. This is a common misunderstanding where analysts add columns to GROUP BY without realising it changes the aggregation granularity.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Sharing Saved Queries in SQL Editor", "definition": "Databricks SQL Editor supports workspace-level query sharing through permission settings on saved queries. When a saved query is shared with view and run permissions the recipient executes it using their own credentials. Unity Catalog enforces the recipient's permissions so they see only the data they are authorised to access, respecting individual data access controls.", "syntax": null}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "MONTH() Function with IN", "definition": "The MONTH() function extracts the month number from a date column and is the correct tool for filtering by month across all years. IN (1, 2) matches either January or February. BETWEEN with specific dates restricts to a single year. LIKE is designed for string matching and is not appropriate for date columns. AND between two different month values always returns no rows because both conditions cannot be true simultaneously.", "syntax": "WHERE MONTH(order_date) IN (1, 2)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "DENSE_RANK() Window Function", "definition": "DENSE_RANK() is the correct window function when tied values should receive the same rank and subsequent ranks should not have gaps. It is the preferred choice for top-N queries where all tied rows at the boundary should be included. RANK() also handles ties but leaves gaps. ROW_NUMBER() assigns unique sequential numbers and does not handle ties. Always use DENSE_RANK() with a filter on the desired rank to retrieve all tied top performers.", "syntax": "DENSE_RANK() OVER (PARTITION BY region ORDER BY total_revenue DESC)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Finding First-Order Customers", "definition": "Finding customers whose first order occurred in a specific year requires either a HAVING clause on MIN(order_date) to filter to customers with a first order within the year, or a NOT IN subquery that excludes customers with orders before the year. The HAVING approach is more concise. The NOT IN approach is equivalent but requires two passes over the orders table.", "syntax": "GROUP BY customer_id HAVING MIN(order_date) >= '2024-01-01' AND MIN(order_date) < '2025-01-01'"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Second Highest Salary Query", "definition": "The most universally compatible method for finding the second highest value is the subquery approach using MAX with a less-than filter. It handles duplicate maximum values correctly and works across all SQL dialects. The LIMIT/OFFSET approach fails when duplicates exist at the top. Using DENSE_RANK requires a CTE or subquery wrapper to be valid because window functions cannot appear directly in a WHERE clause.", "syntax": "SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "HAVING vs WHERE for Aggregates", "definition": "When multiple post-aggregation conditions must both be satisfied they are combined in the HAVING clause using AND. Both conditions reference the full aggregate expressions not aliases. WHERE cannot reference aggregates and must appear before GROUP BY. HAVING is evaluated after aggregation and can reference any aggregate expression used in the query.", "syntax": "GROUP BY customer_id HAVING COUNT(order_id) > 5 AND SUM(order_value) > 1000"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "COUNT(*) OVER () window aggregate", "definition": "Adding an aggregate value as a column to all rows without collapsing the result uses a window function with an empty OVER clause or a scalar subquery. COUNT(*) OVER () computes the aggregate over the entire result set window, adding the total row count to every row while preserving individual rows.", "syntax": "SELECT col, COUNT(*) OVER () AS total FROM t"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "NULL comparison and IS NULL", "definition": "NULL comparisons using the equality operator = always return NULL in SQL because NULL represents an unknown value and any comparison with unknown produces unknown. The WHERE clause treats NULL as false so no rows pass the filter. To test for NULL values always use IS NULL or IS NOT NULL.", "syntax": "WHERE col IS NULL"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Correlated subquery", "definition": "A correlated subquery references a column from the outer query, so it re-executes for each outer row using that row's value. This enables comparisons against a group-level aggregate computed dynamically per row, such as finding employees who earn more than the average salary in their own department.", "syntax": "WHERE e.salary > (SELECT AVG(salary) FROM employees WHERE department = e.department)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "INTERSECT set operator", "definition": "Finding elements common to two datasets uses INTERSECT, which returns only rows present in both result sets. In contrast, UNION returns elements from either dataset while EXCEPT returns elements from only the first dataset that are absent from the second. A GROUP BY with HAVING COUNT DISTINCT is an equivalent alternative.", "syntax": "SELECT ... INTERSECT SELECT ..."}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "HAVING clause for filtering aggregates", "definition": "Filtering on aggregate results uses the HAVING clause, which is evaluated after GROUP BY aggregation. WHERE is evaluated before aggregation and cannot reference aggregate functions, so filtering groups on a value such as SUM(revenue) > 100000 must be done with HAVING.", "syntax": "GROUP BY region HAVING SUM(revenue) > 100000"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "DESCRIBE HISTORY command", "definition": "DESCRIBE HISTORY returns the full audit trail of all commits on a Delta table. Each row represents one transaction and includes the version number, timestamp, the userName of the user or service principal who performed the operation, and the operation type such as WRITE, MERGE, or OPTIMIZE. The first row is always the most recent commit.", "syntax": "DESCRIBE HISTORY table_name"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Per-customer aggregation with GROUP BY", "definition": "Per-customer aggregations use GROUP BY customer_id with MAX for the most recent date and COUNT for the total number of records. MAX(order_date) is reliable and deterministic unlike LAST(), and COUNT(order_id) is preferred over COUNT(DISTINCT order_id) when order_id is already unique because it is more efficient. All columns in the SELECT list must be either in GROUP BY or inside an aggregate function.", "syntax": "SELECT customer_id, MAX(order_date), COUNT(order_id) FROM orders GROUP BY customer_id"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "LIMIT clause for sampling rows", "definition": "Retrieving a sample of rows from a table uses LIMIT in Databricks SQL, with SELECT * FROM table LIMIT 10 being the most common idiomatic approach. FETCH FIRST n ROWS ONLY is the ANSI SQL equivalent also supported. TOP is T-SQL syntax and ROWNUM is Oracle syntax, neither of which is valid in Databricks SQL.", "syntax": "SELECT * FROM t LIMIT 10"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "CASE WHEN conditional categorisation", "definition": "CASE WHEN is the standard Databricks SQL construct for conditional categorisation. Conditions are evaluated in order and the first matching branch is returned. When using ordered thresholds like spending tiers, placing the highest threshold first lets subsequent conditions implicitly assume earlier thresholds were not met. IIF and DECODE are not supported in Databricks SQL.", "syntax": "CASE WHEN cond THEN val WHEN cond THEN val ELSE val END"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Replacing negative values with zero", "definition": "Replacing negative values with zero uses either CASE WHEN for explicit conditional logic or GREATEST for concise minimum-value clamping. GREATEST(column, 0) is particularly elegant because it naturally returns 0 when the column is negative and the column value when it is non-negative. Both approaches are correct and the choice is a matter of readability.", "syntax": "GREATEST(column, 0)"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "Common Table Expression (CTE)", "definition": "CTEs are the correct SQL feature for creating named reusable calculation blocks within a single query. Defined with the WITH keyword before the main SELECT, a CTE can be referenced multiple times within the same query execution. CTEs do not persist beyond the query and do not create catalog objects, making them ideal for encapsulating complex calculations used multiple times in a single analytical query.", "syntax": "WITH cte AS (SELECT ...) SELECT * FROM cte"}, {"category": "Executing Queries with Databricks SQL & Warehouses", "term": "LEFT JOIN with COALESCE zero-fill", "definition": "Including all rows from one table with aggregate
