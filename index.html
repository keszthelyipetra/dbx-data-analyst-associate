E reporting IN CATALOG analytics"}, {"label": "D", "text": "CREATE SCHEMA reporting USING analytics"}], "correct_answers": ["B"], "explanation": "Setting the active catalog context with USE CATALOG analytics allows CREATE SCHEMA reporting to create the schema within the analytics catalog without specifying the full path. UNDER, IN CATALOG, and USING are not valid clauses for schema creation.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Delta Lake & Delta Tables", "question": "Which two statements correctly describe the behaviour of the MERGE INTO command in Databricks SQL when applied to a Delta table?", "type": "multiple", "options": [{"label": "A", "text": "MERGE INTO locks the entire Delta table for the duration of the merge operation, preventing any concurrent reads from accessing the table"}, {"label": "B", "text": "MERGE INTO automatically creates the target table if it does not exist, making it safe to run a merge before the target Delta table has been initialised"}, {"label": "C", "text": "MERGE INTO is ACID-compliant on Delta tables, meaning the entire merge operation either completes fully or rolls back entirely, preventing partial updates from being committed"}, {"label": "D", "text": "MERGE INTO can handle insert, update, and delete operations in a single atomic statement by specifying WHEN MATCHED and WHEN NOT MATCHED clauses with different actions for each condition"}, {"label": "E", "text": "MERGE INTO can only be used when the source data has exactly the same schema as the target table, raising an error if any source columns are absent from the target"}], "correct_answers": ["C", "D"], "explanation": "Delta Lake's ACID transaction support makes MERGE INTO atomic (it fully completes or rolls back with no partial changes), and it is a multi-action DML statement using WHEN MATCHED (UPDATE/DELETE) and WHEN NOT MATCHED (INSERT) clauses in a single statement.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Query Optimization & Performance", "question": "A data analyst needs to investigate why a specific SQL query in their workspace has been slow for the past week. They want to see historical execution metrics and compare performance across multiple runs. Which feature should they use?", "type": "single", "options": [{"label": "A", "text": "The Unity Catalog audit log, which captures all data access events including SELECT query execution times and resource usage"}, {"label": "B", "text": "The Delta table DESCRIBE HISTORY command, which records all queries that have read from the tables used in the slow query"}, {"label": "C", "text": "The SQL Warehouse auto-stop log, which records the warehouse state at the time each slow query was executed"}, {"label": "D", "text": "The Query History feature in Databricks SQL, which provides a filterable log of past query executions including duration, bytes scanned, rows returned, and I/O metrics for each run"}], "correct_answers": ["D"], "explanation": "Query History records every query execution with detailed performance metrics. Filtering by query text or time range lets the analyst compare execution times and resource metrics across multiple runs to identify when performance degraded.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Delta Lake & Delta Tables", "question": "A data analyst needs to ensure that a Delta table they manage retains at least 30 days of history for time travel queries. What configuration correctly achieves this?", "type": "single", "options": [{"label": "A", "text": "Run VACUUM table_name RETAIN 30 DAYS to configure the table to automatically preserve 30 days of data files for time travel queries"}, {"label": "B", "text": "Set the table property delta.logRetentionDuration to interval 30 days using ALTER TABLE to ensure the transaction log entries for the last 30 days are preserved"}, {"label": "C", "text": "Run OPTIMIZE table_name to compact files older than 30 days into a single archive file that supports time travel queries for the retained period"}, {"label": "D", "text": "Set spark.databricks.delta.retentionDurationCheck.enabled to false to disable the retention check and allow unlimited time travel history"}], "correct_answers": ["B"], "explanation": "delta.logRetentionDuration controls how long Delta transaction log entries are retained. Setting it to interval 30 days ensures the log files covering the last 30 days are preserved, which is required for time travel to work correctly.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Caching & Performance", "question": "An analyst runs the same dashboard query multiple times in quick succession and notices it completes in under one second on every run after the first. The underlying Delta table has not been modified. What explains this behaviour?", "type": "single", "options": [{"label": "A", "text": "The query plan is being optimised by the Catalyst engine after each execution using runtime feedback to produce a progressively faster plan on each subsequent run"}, {"label": "B", "text": "Delta Lake is storing the filtered query result as a new Delta table in the background after the first execution making subsequent reads faster"}, {"label": "C", "text": "The SQL Warehouse added extra clusters after the first query to dedicate resources exclusively to that analyst's subsequent queries"}, {"label": "D", "text": "Databricks SQL result caching is returning the stored query result from the first execution without re-executing the query against the Delta table, since the underlying data has not changed"}], "correct_answers": ["D"], "explanation": "Databricks SQL automatically caches query results. When the same query is resubmitted and the underlying data has not changed, the cached result is returned immediately without re-executing, so subsequent runs complete in under one second.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "Which of the following correctly describes the purpose of the USE CATALOG and USE SCHEMA commands in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "USE CATALOG grants the current user access to all objects in the specified catalog regardless of their existing Unity Catalog permissions"}, {"label": "B", "text": "USE SCHEMA creates a new empty schema in the current catalog if the specified schema does not already exist"}, {"label": "C", "text": "USE CATALOG and USE SCHEMA permanently change the default catalog and schema for all users in the workspace until changed back by an administrator"}, {"label": "D", "text": "USE CATALOG sets the active catalog for the current session so that unqualified object references resolve to that catalog, and USE SCHEMA sets the active schema within the current catalog so that table references without a catalog or schema prefix resolve correctly"}], "correct_answers": ["D"], "explanation": "USE CATALOG and USE SCHEMA are session-level context commands. When set, queries can reference tables by name only without the full three-level namespace prefix. They do not grant permissions or create objects.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Data Modeling & Architecture", "question": "A data analyst is documenting their organisation's data architecture. The Bronze layer receives raw event data from IoT devices, the Silver layer cleans and enriches the data, and the Gold layer contains pre-aggregated metrics for dashboards. Which data modelling approach is most appropriate for the Gold layer tables that power BI dashboards?", "type": "single", "options": [{"label": "A", "text": "Store Gold layer data in normalised third normal form (3NF) to eliminate all data redundancy and ensure maximum data integrity for dashboard queries"}, {"label": "B", "text": "Use the same table structure as the Silver layer in the Gold layer, adding only a gold_ prefix to the table names to indicate they are production-ready"}, {"label": "C", "text": "Apply a star schema with fact tables containing pre-aggregated metrics and dimension tables containing descriptive attributes, optimised for fast JOIN performance and readable analytical queries from BI tools"}, {"label": "D", "text": "Store all Gold layer data in a single wide table with hundreds of columns combining all possible metrics and dimensions to minimise the number of queries needed by dashboards"}], "correct_answers": ["C"], "explanation": "The Gold layer is the analytical consumption layer. Star schemas are the standard approach because they optimise BI query performance with simple single-level joins, readable query structures, and efficient aggregations.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is building a dashboard for a finance team that needs to show quarterly revenue broken down by business unit. The analyst wants viewers to be able to select a specific quarter from a dropdown and see all charts update accordingly. Which combination of features correctly implements this?", "type": "single", "options": [{"label": "A", "text": "A Filter widget with a dropdown list of quarter values linked to a {{quarter}} parameter referenced in each dataset query's WHERE clause, so selecting a quarter updates all visualisations simultaneously"}, {"label": "B", "text": "A separate dashboard tab for each quarter containing the same set of charts pre-filtered to that quarter's data, with tab navigation allowing viewers to switch between quarters"}, {"label": "C", "text": "A Text widget displaying the list of quarters as static text, with the analyst manually updating the chart queries each time the selected quarter changes"}, {"label": "D", "text": "A Counter widget configured with a quarter selector that passes the selection to all other widgets on the page through a built-in widget communication protocol"}], "correct_answers": ["A"], "explanation": "Dashboard Filter widgets expose parameters passed into dataset queries. By referencing {{quarter}} in each query's WHERE clause and linking all queries to the same filter widget, selecting a quarter re-executes all queries and updates all charts simultaneously.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Unity Catalog & Data Governance", "question": "A data analyst creates a new Delta table using CREATE TABLE AS SELECT in the prod.gold schema. A colleague then runs a SELECT query against the table from a separate session but receives a permission denied error. What is the most likely explanation?", "type": "single", "options": [{"label": "A", "text": "The analyst who created the table is the table owner and has implicit access, but other users and sessions need explicit SELECT grants on the new table plus USE CATALOG and USE SCHEMA grants to query it"}, {"label": "B", "text": "Delta tables created with CREATE TABLE AS SELECT are read-only for 24 hours after creation to allow the transaction log to stabilise before external queries are permitted"}, {"label": "C", "text": "The CREATE TABLE AS SELECT statement does not commit the data to the Delta table until the creating session is closed, so other sessions cannot read the data until then"}, {"label": "D", "text": "The prod catalog is in a different cloud region from the SQL Warehouse and cross-region queries are blocked by default for performance reasons"}], "correct_answers": ["A"], "explanation": "Unity Catalog follows a deny-by-default model. Creating a table does not automatically grant access to others. The owner has access, but other users need explicit SELECT on the table plus hierarchical USE CATALOG and USE SCHEMA grants.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Query Optimization & Performance", "question": "A data analyst is reviewing query performance and notices that a query scanning a 500GB Delta table is reading far more data than expected despite a filter on the transaction_date column. DESCRIBE HISTORY shows the table has never had OPTIMIZE run on it. The table is not partitioned. What are the two most appropriate actions to improve scan efficiency?", "type": "multiple", "options": [{"label": "A", "text": "Run VACUUM transactions RETAIN 0 HOURS to remove all old files and force the query to scan only the latest data files which are smaller and faster to read"}, {"label": "B", "text": "Run OPTIMIZE transactions ZORDER BY (transaction_date) to compact small files and co-locate data with similar transaction dates, improving data skipping for date-range filters"}, {"label": "C", "text": "Apply Liquid Clustering on transaction_date using ALTER TABLE transactions CLUSTER BY (transaction_date) so future writes incrementally cluster data on the date column, reducing scan overhead for date-filtered queries over time"}, {"label": "D", "text": "Convert the Delta table to Parquet format which has built-in column pruning that eliminates the need for ZORDER or Liquid Clustering"}, {"label": "E", "text": "Add a LIMIT clause to the query to reduce the number of rows scanned from the 500GB table"}], "correct_answers": ["B", "C"], "explanation": "OPTIMIZE with ZORDER BY transaction_date compacts small files and updates file-level min/max statistics for immediate data skipping, while Liquid Clustering ensures future writes maintain the clustered layout incrementally without periodic manual OPTIMIZE runs.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Data Modeling & Architecture", "question": "A data analyst needs to implement a slowly changing dimension Type 2 (SCD Type 2) pattern for a customer dimension table in Databricks SQL. Which Delta Lake feature is most appropriate for tracking historical attribute changes?", "type": "single", "options": [{"label": "A", "text": "Implement SCD Type 2 manually using a MERGE INTO statement that inserts a new row with updated attributes and sets an end_date and is_current flag on the expiring row when changes are detected, maintaining the full history of attribute changes as multiple rows per customer"}, {"label": "B", "text": "Use Delta Lake time travel with TIMESTAMP AS OF to retrieve historical customer attributes on demand rather than storing multiple versions of each customer row in the table"}, {"label": "C", "text": "Partition the customer dimension table by an effective_date column and write new partitions for each day's snapshot, replacing the entire partition when customer attributes change"}, {"label": "D", "text": "DESCRIBE HISTORY on the customer dimension table to retrieve each historical version of a customer row and its attributes at each point in time"}], "correct_answers": ["A"], "explanation": "SCD Type 2 in Delta Lake is implemented using MERGE INTO with conditional logic. When a change is detected the MERGE closes the current record (setting end_date and is_current to false) and inserts a new active record, providing complete row-level change history.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Data Modeling & Architecture", "question": "A data analyst is comparing two table design options for storing product data in a Databricks SQL analytical workload. Option A uses a star schema with a dim_product table containing product_id, product_name, category, and subcategory. Option B uses a snowflake schema where category and subcategory are normalised into separate dim_category and dim_subcategory tables linked by foreign keys. Which statement correctly describes the trade-off between these two designs for analytical query performance?", "type": "single", "options": [{"label": "A", "text": "Option B (snowflake schema) performs better for analytical queries because normalised tables are always smaller and therefore faster to scan than the denormalised dim_product table in Option A"}, {"label": "B", "text": "Option A (star schema) requires more joins than Option B (snowflake schema) because each additional dimension attribute adds a new join to the query"}, {"label": "C", "text": "Option A (star schema) performs better for analytical queries because all product attributes are in a single table requiring only one join from the fact table, while Option B (snowflake schema) requires additional joins to retrieve category and subcategory attributes from their separate normalised tables"}, {"label": "D", "text": "Both designs perform identically in Databricks SQL because the Photon engine automatically denormalises snowflake schemas at query time before execution"}], "correct_answers": ["C"], "explanation": "Star schemas are optimised for analytical query performance by minimising joins. Denormalising category and subcategory into the product dimension means one join retrieves all attributes, while the snowflake schema trades query simplicity and performance for storage efficiency and normalisation.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "Which of the following correctly describes how to use the EXCEPT operator in Databricks SQL and when it is appropriate?", "type": "single", "options": [{"label": "A", "text": "EXCEPT is only supported in subqueries and cannot be used at the top level of a SELECT statement in Databricks SQL"}, {"label": "B", "text": "EXCEPT returns all rows from the first query that do not appear in the second query, removing duplicates from the result. It is appropriate for finding records in one dataset that are absent from another"}, {"label": "C", "text": "EXCEPT ALL returns distinct rows while EXCEPT returns all rows including duplicates, making EXCEPT ALL the more commonly used form"}, {"label": "D", "text": "EXCEPT filters rows from a table based on a list of excluded values, functioning as a shorthand for WHERE column NOT IN (value_list)"}], "correct_answers": ["B"], "explanation": "EXCEPT is the standard set difference operator. It returns distinct rows from the left query that have no matching row in the right query. Like UNION, it requires both queries to return the same number of columns with compatible types.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Unity Catalog & Data Governance", "question": "A data engineer has created a new Delta table in the prod catalog and silver schema and needs to allow the reporting_analysts group to query it. The group already has USE CATALOG and USE SCHEMA grants on the relevant catalog and schema. Which single grant statement correctly enables query access?", "type": "single", "options": [{"label": "A", "text": "GRANT SELECT ON TABLE prod.silver.new_table TO reporting_analysts"}, {"label": "B", "text": "GRANT READ ON TABLE prod.silver.new_table TO reporting_analysts"}, {"label": "C", "text": "GRANT ALL PRIVILEGES ON TABLE prod.silver.new_table TO reporting_analysts"}, {"label": "D", "text": "GRANT SELECT ON SCHEMA prod.silver TO reporting_analysts"}], "correct_answers": ["A"], "explanation": "Since the group already has USE CATALOG and USE SCHEMA, the only missing privilege is SELECT on the specific table. GRANT SELECT ON TABLE is the correct and minimal statement to enable query access without granting broader permissions.", "is_one_word": false}, {"source": "Udemy Section Questions", "theme": "Databricks SQL & Warehouses", "question": "While writing a query in the Databricks SQL editor, an analyst wants to preview the output before finalizing a visualization. What feature allows them to do this?", "type": "single", "options": [{"label": "A", "text": "The schema browser"}, {"label": "B", "text": "The run preview (play button)"}, {"label": "C", "text": "The data lineage tab"}, {"label": "D", "text": "The SQL warehouse logs"}], "correct_answers": ["B"], "explanation": "Analysts can preview results in the editor before moving to visualization or dashboard creation.", "is_one_word": false}, {"source": "Udemy Section Questions", gs reliability and structure to data lakes using ACID transactions, schema enforcement, and schema evolution.", "is_one_word": false}, {"source": "Udemy Section Questions", "theme": "Data Modeling & Architecture", "question": "A user creates a view in Databricks for repeated use in a dashboard. They want this view to persist even after they log out. What should they use?", "type": "single", "options": [{"label": "A", "text": "Temp view"}, {"label": "B", "text": "Permanent view"}, {"label": "C", "text": "External table"}, {"label": "D", "text": "Managed table"}], "correct_answers": ["B"], "explanation": "Permanent views are stored in the catalog and persist beyond a single session, unlike temporary views which disappear after logout.", "is_one_word": true}, {"source": "Udemy Section Questions", "theme": "Unity Catalog & Data Governance", "question": "A data analyst uses Data Explorer to inspect a table and sees sensitive customer emails in one column. As a table owner, what is their responsibility?", "type": "single", "options": [{"label": "A", "text": "Apply access controls to protect PII data"}, {"label": "B", "text": "Disable table indexing"}, {"label": "C", "text": "Only ensure high performance of the table"}, {"label": "D", "text": "Drop the table immediately"}], "correct_answers": ["A"], "explanation": "Table owners are responsible for securing sensitive data like PII using permissions and access controls in Databricks.", "is_one_word": false}, {"source": "Udemy Section Questions", "theme": "Unity Catalog & Data Governance", "question": "A data analyst wants to organize several related tables under a single namespace to simplify access and management. What should they create in Databricks?", "type": "single", "options": [{"label": "A", "text": "A cluster"}, {"label": "B", "text": "A workspace"}, {"label": "C", "text": "A schema"}, {"label": "D", "text": "A dashboard"}], "correct_answers": ["C"], "explanation": "In Databricks, a schema (or database) is used to group and organize tables and views under a single namespace.", "is_one_word": true}, {"source": "Udemy Section Questions", "theme": "SQL Basics & Syntax", "question": "You need to generate summary statistics for sales data by region, country, and year, but also include subtotals for each grouping level. Which SQL feature should you use to achieve this?", "type": "single", "options": [{"label": "A", "text": "SQL GROUP BY"}, {"label": "B", "text": "SQL ROLLUP"}, {"label": "C", "text": "SQL HAVING"}, {"label": "D", "text": "SQL WINDOW"}], "correct_answers": ["B"], "explanation": "ROLLUP is used to generate subtotals and grand totals in grouping operations, making it ideal for hierarchical summarization like region, country, and year.", "is_one_word": true}, {"source": "Udemy Section Questions", "theme": "SQL Basics & Syntax", "question": "You need to calculate the running total of sales across different months for a sales report, but you want to ensure that the total is reset for each year. Which SQL function is most appropriate for this?", "type": "single", "options": [{"label": "A", "text": "SQL Window Function - SUM() OVER()"}, {"label": "B", "text": "SQL GROUP BY"}, {"label": "C", "text": "SQL ROLLUP"}, {"label": "D", "text": "SQL INSERT INTO"}], "correct_answers": ["A"], "explanation": "Window functions allow you to perform calculations across a set of table rows related to the current row, such as running totals and partitioned calculations.", "is_one_word": false}, {"source": "Udemy Section Questions", "theme": "SQL Basics & Syntax", "question": "You want to update a target table with new records and also perform an upsert for records that already exist. Which SQL command should you use?", "type": "single", "options": [{"label": "A", "text": "INSERT INTO"}, {"label": "B", "text": "SQL UPDATE"}, {"label": "C", "text": "COPY INTO"}, {"label": "D", "text": "MERGE INTO"}], "correct_answers": ["D"], "explanation": "The MERGE INTO command allows you to perform both in  "Use a pie chart to visualize sales"}, {"label": "C", "text": "Add a bar chart"}, {"label": "D", "text": "Create a scatter plot to track sales over time"}], "correct_answers": ["A"], "explanation": "Counters with targets are useful for visualizing progress toward a specific goal, such as comparing actual sales with a predefined target.", "is_one_word": false}, {"source": "Udemy Section Questions", "theme": "AI/BI Dashboards & Visualization", "question": "You are creating an interactive dashboard and want users to filter data based on their input. Which feature should you use to allow users to select specific data criteria?", "type": "single", "options": [{"label": "A", "text": "Using predefined filters"}, {"label": "B", "text": "Adding a time-series chart"}, {"label": "C", "text": "Using a static query"}, {"label": "D", "text": "Adding parameters to dashboards"}], "correct_answers": ["D"], "explanation": "Parameters allow users to interactively filter data based on their selected values, providing dynamic filtering and improving the user experience.", "is_one_word": false}, {"source": "Udemy Section Questions", "theme": "Analytics Fundamentals", "question": "You are analyzing a dataset of student test scores and need to calculate the central tendency of the data. Which of the following measures would give you the most reliable representation if the dataset contains outliers?", "type": "single", "options": [{"label": "A", "text": "Mean"}, {"label": "B", "text": "Mode"}, {"label": "C", "text": "Median"}, {"label": "D", "text": "Range"}], "correct_answers": ["C"], "explanation": "The median is less sensitive to outliers and provides a better representation of the central tendency in skewed datasets compared to the mean.", "is_one_word": true}, {"source": "Udemy Section Questions", "theme": "Analytics Fundamentals", "question": "You have a dataset of daily temperatures for a month and want to understand the spread of temperatures. Which measure would you use to quantify the spread or variability of the data?", "type": "single", "options": [{"label": "A", "text": "Standard Deviation"}, {"label": "B", "text": "Median"}, {"label": "C", "text": "Mode"}, {"label": "D", "text": "Mean"}], "correct_answers": ["A"], "explanation": "Standard deviation quantifies the spread or variability of data around the mean, making it ideal for understanding the degree of variation in the dataset.", "is_one_word": true}, {"source": "Udemy Section Questions", "theme": "Analytics Fundamentals", "question": "In a dataset that includes both age and favorite color, which type of variable is represented by the \"favorite color\" field?", "type": "single", "options": [{"label": "A", "text": "Quantitative"}, {"label": "B", "text": "Qualitative"}, {"label": "C", "text": "Continuous"}, {"label": "D", "text": "Discrete"}], "correct_answers": ["B"], "explanation": "Qualitative variables, also known as categorical variables, represent attributes or categories, such as \"favorite color,\" that cannot be measured numerically.", "is_one_word": true}, {"source": "Udemy Section Questions", "theme": "Analytics Fundamentals", "question": "You want to combine customer data from two different sources: one contains purchase history and the other contains demographic information. Which process would you use to integrate these data sources?", "type": "single", "options": [{"label": "A", "text": "Data Blending"}, {"label": "B", "text": "Data Enhancement"}, {"label": "C", "text": "Data Filtering"}, {"label": "D", "text": "Data Normalization"}], "correct_answers": ["A"], "explanation": "Data blending refers to combining data from different sources, allowing you to integrate different datasets for analysis without needing to merge them into a single, unified dataset.", "is_one_word": true}, {"source": "Udemy Section Questions", "theme": "Analytics Fundamentals", "question": "You are working with a dataset of employees and want to add a new feature that indicates whether the employee is part of a high-performance team. Which process would help you add this information?", "type": "single", "options": [{"label": "A", "text": "Data Blending"}, {"label": "B", "text": "Data Normalization"}, {"label": "C", "text": "Data Cleaning"}, {"label": "D", "text": "Data Enhancement"}], "correct_answers": ["D"], "explanation": "Data enhancement involves adding additional, often external, data to improve the value of your dataset, such as adding team performance indicators to an employee dataset.", "is_one_word": true}, {"source": "Udemy Exam Practice 3", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe the Unity Catalog approach to data lineage and how it differs from the legacy Hive metastore?", "type": "multiple", "options": [{"label": "A", "text": "Unity Catalog automatically captures column-level lineage by analysing SQL query execution, showing how individual columns in a table are derived from source columns in upstream tables"}, {"label": "B", "text": "Unity Catalog lineage requires analysts to use Delta Live Tables pipelines for lineage to be captured, as standard SQL queries and notebooks do not generate lineage metadata"}, {"label": "C", "text": "Unity Catalog lineage is captured automatically without requiring any manual configuration or annotation by data engineers or analysts"}, {"label": "D", "text": "The legacy Hive metastore captures the same column-level lineage as Unity Catalog but stores it in a separate lineage database that must be queried independently"}, {"label": "E", "text": "Unity Catalog lineage is only available for external tables and is not tracked for managed tables"}], "correct_answers": ["A", "C"], "explanation": "Unity Catalog automatically captures lineage at both table and column level by analysing query execution across all workspace interfaces (SQL Editor, notebooks, DLT), with no manual configuration. The legacy Hive metastore had no native lineage capability.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Databricks SQL & Warehouses", "question": "An analyst runs a query that returns 1000 rows in the SQL Editor. They want to export all 1000 rows to a CSV file for offline analysis. Which approach correctly exports the complete result set?", "type": "single", "options": [{"label": "A", "text": "Re-run the query with LIMIT 1000 appended to ensure exactly 1000 rows are returned before downloading"}, {"label": "B", "text": "Use the Download button in the SQL Editor results panel to export the query results as a CSV file, which downloads the complete result set to the local machine"}, {"label": "C", "text": "Write the query results to a Delta table using CREATE TABLE AS SELECT and then use the Catalog Explorer to export the table as a CSV"}, {"label": "D", "text": "Copy the results from the SQL Editor grid by selecting all cells and pasting into a spreadsheet application"}], "correct_answers": ["B"], "explanation": "The Databricks SQL Editor provides a Download button in the query results panel that exports the full result set as a CSV or TSV file. This downloads all result rows to the local machine regardless of the number of rows displayed in the visible grid.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to find all products where the product name contains the word wireless anywhere in the string, regardless of case. Which WHERE clause correctly achieves this in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "WHERE LOWER(product_name) LIKE '%wireless%'"}, {"label": "B", "text": "WHERE product_name CONTAINS 'wireless'"}, {"label": "C", "text": "WHERE product_name LIKE 'wireless'"}, {"label": "D", "text": "WHERE product_name = 'wireless'"}], "correct_answers": ["A"], "explanation": "LOWER converts the product_name to lowercase so the comparison is case-insensitive. The LIKE pattern with % wildcards on both sides matches wireless appearing anywhere within the string regardless of its position or the original capitalisation.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Data Modeling & Architecture", "question": "Which of the following correctly describes the data vault modelling approach and how it aligns with the Medallion Architecture in Databricks?", "type": "single", "options": [{"label": "A", "text": "Data vault modelling aligns with the Silver layer of the Medallion Architecture where Hub tables store business keys, Link tables store relationships between entities, and Satellite tables store historical attribute changes, providing an auditable integration layer that feeds into Gold layer dimensional models"}, {"label": "B", "text": "Data vault modelling is used in the Gold layer of the Medallion Architecture where Hub, Link, and Satellite tables replace star schema fact and dimension tables for maximum query performance"}, {"label": "C", "text": "Data vault modelling replaces the need for the Medallion Architecture by providing Bronze, Silver, and Gold equivalent functionality within its Hub, Link, and Satellite table structure"}, {"label": "D", "text": "Data vault modelling is only appropriate for the Bronze layer where raw source data is ingested directly into Hub, Link, and Satellite tables without any transformation"}], "correct_answers": ["A"], "explanation": "Data vault is an integration modelling approach best suited to the Silver layer. It provides a highly auditable, flexible, and source-agnostic integration model. Hub, Link, and Satellite tables capture business keys, relationships, and attribute history respectively, and the integrated Silver layer feeds into Gold layer star or snowflake schemas for analytical consumption.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Unity Catalog & Data Governance", "question": "A data analyst wants to understand the full lineage of a Gold layer table — specifically which upstream Bronze and Silver tables contributed to it and which downstream reports consume it. Where in the Databricks workspace is this lineage information most readily accessible?", "type": "single", "options": [{"label": "A", "text": "A separate data cataloging tool that must be integrated with Databricks through the Unity Catalog API to generate lineage reports"}, {"label": "B", "text": "The Delta transaction log of the Gold table which records all upstream table names that contributed data through MERGE and INSERT operations"}, {"label": "C", "text": "The Databricks SQL Query History filtered by the Gold table name, which lists all queries that referenced the table and can be used to manually trace lineage"}, {"label": "D", "text": "The Unity Catalog Catalog Explorer lineage tab for the Gold table, which displays an interactive graph showing upstream source tables and downstream consumers including dashboards and notebooks"}], "correct_answers": ["D"], "explanation": "Unity Catalog automatically captures data lineage by analysing query execution. The Catalog Explorer lineage tab for any table shows an interactive graph of upstream tables that contributed data and downstream objects that consume it including other tables, dashboards, and notebooks. This provides the complete end-to-end lineage view without any manual documentation.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is setting up monitoring for a critical daily batch pipeline. The analyst wants to be notified if no new records are loaded into the pipeline_results Delta table during the expected daily load window. Which approach correctly implements this monitoring?", "type": "single", "options": [{"label": "A", "text": "Use DESCRIBE HISTORY pipeline_results to check whether a WRITE operation occurred today and configure a Databricks Job to send an email if no WRITE is found in the history"}, {"label": "B", "text": "Set up a Lakeflow Job that runs after the pipeline and checks the row count, sending a notification only if the count exceeds the expected daily volume rather than when it is zero"}, {"label": "C", "text": "Configure a Delta table constraint on the pipeline_results table that raises an error when no records are inserted during the load window, which Databricks automatically escalates as a workspace notification"}, {"label": "D", "text": "Create a Databricks SQL Alert based on a query that counts records inserted today using WHERE load_date = current_date(), set the condition to Value = 0, and configure the notification destination with the analyst's email"}], "correct_answers": ["D"], "explanation": "A SQL Alert monitoring a count of today's records with the condition Value = 0 correctly detects when no records were loaded during the expected window. When the scheduled query returns zero rows the alert fires and notifies the analyst, enabling prompt investigation of the pipeline failure.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Query Optimization & Performance", "question": "Which two features does the Query History in Databricks SQL provide to help analysts investigate query performance?", "type": "multiple", "options": [{"label": "A", "text": "Query History stores the complete data results returned by each query so analysts can retrieve previous results without re-running the query"}, {"label": "B", "text": "Query History is only accessible to workspace administrators and is not visible to regular analysts or data engineers"}, {"label": "C", "text": "Detailed execution metrics for each query including query duration, rows read, bytes scanned, and the SQL Warehouse on which the query ran"}, {"label": "D", "text": "The ability to filter query history by user, date range, query status such as succeeded or failed, and the compute resource used"}, {"label": "E", "text": "Automatic query optimisation suggestions generated after each query execution that appear in the Query History panel"}], "correct_answers": ["C", "D"], "explanation": "Query History records comprehensive execution metrics for every query including query duration, the amount of data scanned, rows read, and the warehouse used, and provides rich filtering by user, date range, query status, and warehouse. Together these help analysts identify slow queries and run targeted performance investigations.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst is working with a table that has a column event_timestamp stored as a Unix timestamp in seconds (integer type) rather than a TimestampType. The analyst needs to filter events that occurred after January 1 2024. Which WHERE clause correctly handles this conversion?", "type": "single", "options": [{"label": "A", "text": "WHERE event_timestamp > UNIX_TIMESTAMP('2024-01-01')"}, {"label": "B", "text": "WHERE event_timestamp > '2024-01-01'"}, {"label": "C", "text": "WHERE TO_DATE(event_timestamp) > '2024-01-01'"}, {"label": "D", "text": "WHERE event_timestamp > 2024"}], "correct_answers": ["A"], "explanation": "UNIX_TIMESTAMP converts the date string to a Unix timestamp integer representing the number of seconds since the Unix epoch. Comparing two integer Unix timestamps correctly identifies events that occurred after the specified date.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to produce a summary report showing total revenue, average order value, and the number of distinct customers for each product category. The orders table has columns order_id, customer_id, category, and order_value. Which query correctly produces this summary?", "type": "single", "options": [{"label": "A", "text": "SELECT category, SUM(order_value) AS total_revenue, AVG(order_value) AS avg_order_value, COUNT(DISTINCT customer_id) AS distinct_customers FROM orders GROUP BY category"}, {"label": "B", "text": "SELECT category, SUM(order_value) AS total_revenue, AVG(order_value) AS avg_order_value, COUNT(customer_id) AS distinct_customers FROM orders GROUP BY category ORDER BY total_revenue"}, {"label": "C", "text": "SELECT category, SUM(order_value), AVG(order_value), COUNT(customer_id) FROM orders GROUP BY category"}, {"label": "D", "text": "SELECT category, SUM(order_value) AS total_revenue, MEAN(order_value) AS avg_order_value, COUNT(DISTINCT customer_id) AS distinct_customers FROM orders GROUP BY category"}], "correct_answers": ["A"], "explanation": "GROUP BY category aggregates all three measures per category. SUM computes total revenue, AVG computes average order value, and COUNT DISTINCT counts unique customers. All aggregate functions operate on the correct columns and the GROUP BY clause contains the only non-aggregated column.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Delta Lake & Delta Tables", "question": "Which two statements correctly describe how Delta Lake handles concurrent write operations from multiple users or processes?", "type": "multiple", "options": [{"label": "A", "text": "Delta Lake requires all write operations to be performed sequentially in a single-threaded pipeline to ensure data consistency"}, {"label": "B", "text": "Delta Lake uses pessimistic locking where a write operation acquires an exclusive lock on the entire table, preventing any other reads or writes until the lock is released"}, {"label": "C", "text": "Readers are never blocked by concurrent write operations in Delta Lake because readers use snapshot isolation to see a consistent view of the table at the time their query started"}, {"label": "D", "text": "Delta Lake uses optimistic concurrency control where multiple writers can proceed simultaneously and conflicts are detected at commit time, with conflicting transactions being retried or failed depending on the conflict type"}, {"label": "E", "text": "Two concurrent INSERT operations on the same Delta table will always result in one of them failing because Delta Lake does not support parallel inserts"}], "correct_answers": ["C", "D"], "explanation": "Delta Lake's snapshot isolation model means readers always see a consistent committed snapshot and are never blocked by writers, while its optimistic concurrency control lets multiple writers proceed without locks and detects conflicts at commit time, retrying or failing conflicting transactions.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Databricks SQL & Warehouses", "question": "A data analyst has written a complex analytical query and wants to save it for reuse across sessions without creating a permanent table. The query should be accessible by name in subsequent SQL Editor sessions. Which approach correctly achieves this?", "type": "single", "options": [{"label": "A", "text": "Save the query in the Databricks SQL Query Editor using the Save button, which stores the named query in the workspace and makes it accessible in future sessions from the Saved Queries list"}, {"label": "B", "text": "Export the query as a Python file and store it in Databricks Repos so it can be imported and run in future sessions"}, {"label": "C", "text": "Save the query text in a Text widget on a dashboard so it can be copied and pasted in future sessions"}, {"label": "D", "text": "Create a global temporary view using CREATE GLOBAL TEMP VIEW query_name AS SELECT... which persists the view across all sessions indefinitely"}], "correct_answers": ["A"], "explanation": "The Databricks SQL Query Editor supports saving named queries to the workspace. Saved queries persist across sessions and are accessible from the Saved Queries panel in the SQL Editor. They can also be used as the basis for dashboard widgets and alerts.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst builds a bar chart in an AI/BI Dashboard showing monthly revenue. The chart is displaying all months as equal height bars despite the data having clear revenue differences between months. What is the most likely cause?", "type": "single", "options": [{"label": "A", "text": "The query powering the chart is missing a GROUP BY month clause, causing all revenue to be summed into a single total that is displayed identically for every month on the chart"}, {"label": "B", "text": "The bar chart y-axis scale is set to start from the maximum value rather than zero, compressing the visual differences between bar heights"}, {"label": "C", "text": "The dashboard parameter is set to a fixed date range that contains only one month of data, causing all bars to show the same single month's revenue repeated"}, {"label": "D", "text": "The bar chart type does not support time series data and should be replaced with a line chart to correctly display monthly values"}], "correct_answers": ["A"], "explanation": "Without GROUP BY month the SUM aggregate collapses all rows into one total value. When this single value is plotted against each month on the x-axis every bar shows the same height because every data point has the same total revenue value. Adding GROUP BY month correctly aggregates revenue per month.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Query Optimization & Performance", "question": "A data analyst wants to understand why a query against a large Delta table is slow. After opening the Query Profiler in Databricks SQL the analyst sees that the Scan node is processing 500GB of data despite the query having a filter on the region column. The table is not partitioned and has never had OPTIMIZE run. What does this indicate and what is the recommended action?", "type": "single", "options": [{"label": "A", "text": "The 500GB scan indicates that the SQL Warehouse does not have enough memory to apply the region filter as a predicate pushdown. Increasing the warehouse size will enable predicate pushdown and reduce the scan"}, {"label": "B", "text": "The 500GB scan is expected behaviour for Delta tables and cannot be reduced without converting the table to a partitioned Parquet format outside of Delta Lake"}, {"label": "C", "text": "The 500GB scan indicates that the region column contains too many distinct values for Delta Lake to apply any data skipping. The analyst should convert the region column to a numeric type to enable statistics-based skipping"}, {"label": "D", "text": "The 500GB scan indicates that data skipping is not effective because the table has not been optimised. Running OPTIMIZE with ZORDER BY (region) will compact small files, update file-level min/max statistics for the region column, and enable the query engine to skip files that do not contain the filtered region value"}], "correct_answers": ["D"], "explanation": "Without OPTIMIZE small files accumulate and file-level statistics may be incomplete or absent. Running OPTIMIZE compacts files and refreshes min/max statistics per column. ZORDER BY region co-locates data with the same region in the same files, allowing the query engine to skip files whose region range does not match the filter, dramatically reducing the 500GB scan.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Unity Catalog & Data Governance", "question": "A data analyst has been given access to a Unity Catalog table and can run SELECT queries successfully from the SQL Editor. However when the analyst tries to query the same table from a notebook the query fails with a permission error. What is the most likely cause?", "type": "single", "options": [{"label": "A", "text": "Notebook queries use a different SQL dialect than the SQL Editor and the permission model is incompatible between the two interfaces"}, {"label": "B", "text": "The notebook is attached to an all-purpose cluster that is not configured to use Unity Catalog, or the cluster's access mode does not support Unity Catalog table access"}, {"label": "C", "text": "The analyst's SELECT grant on the table was granted only for the SQL Editor interface and does not apply to notebook queries"}, {"label": "D", "text": "The table is stored in a different cloud region from the cluster attached to the notebook, causing a cross-region permission failure"}], "correct_answers": ["B"], "explanation": "Unity Catalog table access from notebooks requires the attached cluster to be configured for Unity Catalog. Clusters must use Single User or Shared access mode to access Unity Catalog governed tables. Clusters running in No Isolation Shared mode or using older runtime versions may not support Unity Catalog and would produce permission errors.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Delta Lake & Delta Tables", "question": "What is the primary purpose of Liquid Clustering in Delta Lake and how does it differ from traditional Hive-style partitioning?", "type": "single", "options": [{"label": "A", "text": "Liquid Clustering is a compression technique that reduces the physical size of Delta table files by clustering similar values together using dictionary encoding at the file level"}, {"label": "B", "text": "Liquid Clustering progressively reorganises data files to co-locate rows with similar clustering column values, improving query performance for filter predicates on those columns. Unlike Hive-style partitioning it handles high-cardinality columns, supports changing the clustering columns without rewriting the table, and is maintained incrementally with each OPTIMIZE run"}, {"label": "C", "text": "Liquid Clustering replaces the need for OPTIMIZE by automatically compacting small files in real time as new data is written to the table"}, {"label": "D", "text": "Liquid Clustering and Hive-style partitioning are equivalent approaches that produce identical data layouts and query performance outcomes"}], "correct_answers": ["B"], "explanation": "Liquid Clustering provides the data co-location benefits of partitioning without the limitations of static Hive-style partitioning. It handles high-cardinality columns that would create too many partitions in a Hive model, supports changing clustering columns with ALTER TABLE CLUSTER BY without rewriting data, and maintains the layout incrementally through OPTIMIZE rather than requiring upfront schema decisions.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Databricks Workspace & Navigation", "question": "A data analyst wants to share insights from a notebook analysis with stakeholders who are not Databricks users. The analyst wants the stakeholders to see the narrative text, code cells, and visualisation outputs without being able to run or modify the notebook. Which approach is most appropriate?", "type": "single", "options": [{"label": "A", "text": "Grant stakeholders CAN VIEW access to the Databricks workspace and share the notebook URL directly"}, {"label": "B", "text": "Share the notebook file directly by exporting it as a .dbc archive and emailing it to stakeholders so they can import it into their own Databricks workspace"}, {"label": "C", "text": "Export the notebook as an HTML file, which captures all cell outputs including text, code, and visualisations as a static document that can be viewed in any web browser without requiring Databricks access"}, {"label": "D", "text": "Publish the notebook to a shared Git repository so stakeholders can clone the repository and view the notebook source files"}], "correct_answers": ["C"], "explanation": "Databricks notebooks can be exported as HTML files that render all cell outputs including text, code, charts, and tables as a static web page. Stakeholders can open the HTML file in any browser without needing a Databricks account, and they cannot run or modify the content.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to add a description to a Unity Catalog table to help other analysts understand its contents and intended use. Which SQL command correctly adds a comment to the table?", "type": "single", "options": [{"label": "A", "text": "UPDATE TABLE prod.silver.orders SET description = 'Contains cleaned order records from the e-commerce platform'"}, {"label": "B", "text": "COMMENT ON TABLE prod.silver.orders IS 'Contains cleaned order records from the e-commerce platform'"}, {"label": "C", "text": "DESCRIBE TABLE prod.silver.orders ADD COMMENT 'Contains cleaned order records from the e-commerce platform'"}, {"label": "D", "text": "ALTER TABLE prod.silver.orders SET TBLPROPERTIES ('comment' = 'Contains cleaned order records from the e-commerce platform')"}], "correct_answers": ["B"], "explanation": "COMMENT ON TABLE IS is the standard SQL syntax for adding or updating a table description in Databricks SQL. The comment is stored in Unity Catalog and displayed in the Catalog Explorer table details panel, helping other analysts understand the table's purpose and contents.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Delta Lake & Delta Tables", "question": "A data analyst discovers that a Delta table they want to query using time travel no longer has the files for the requested version because VACUUM was run recently. What is the most likely reason the files were removed and how can this be prevented in future?", "type": "single", "options": [{"label": "A", "text": "The time travel request failed because the Delta transaction log was compacted by a background process that removes old log entries. Disable log compaction using delta.enableLogCompaction = false"}, {"label": "B", "text": "VACUUM was run with a retention period shorter than the age of the requested historical version, removing the data files needed to reconstruct that version. Set delta.deletedFileRetentionDuration to a value that covers the required time travel window to prevent this in future"}, {"label": "C", "text": "VACUUM removes files based on file size rather than age so large historical files were deleted first. Configure a minimum file size threshold using delta.vacuumMinFileSize to protect small historical files"}, {"label": "D", "text": "VACUUM automatically deletes all historical versions when the total table size exceeds 1TB to manage storage costs. Reduce the table size by deleting rows before running VACUUM"}], "correct_answers": ["B"], "explanation": "VACUUM deletes files older than the specified retention period. If VACUUM was run with a 7-day default retention and the analyst wants to travel back 30 days the files for that version have been permanently deleted. Setting delta.deletedFileRetentionDuration to cover the required time travel window prevents premature deletion of historical files.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst has created an AI/BI Dashboard and configured a daily refresh schedule. A stakeholder reports that the dashboard shows an error instead of data when they view it in the morning. Which two actions should the analyst take to investigate and resolve the issue?", "type": "multiple", "options": [{"label": "A", "text": "Delete the dashboard and recreate it from scratch as dashboard refresh errors cannot be resolved without rebuilding the dashboard"}, {"label": "B", "text": "Increase the SQL Warehouse cluster size to XXX-Large which resolves most dashboard refresh errors by providing more compute resources"}, {"label": "C", "text": "Disable result caching on the SQL Warehouse to force the dashboard to re-execute all queries, which clears errors caused by stale cached results"}, {"label": "D", "text": "Review the Query History in Databricks SQL filtering by the dashboard's SQL Warehouse and the refresh execution time to identify which specific query failed and what error it produced"}, {"label": "E", "text": "Check the dashboard refresh history to identify whether the scheduled refresh failed and review any error messages recorded for the failed refresh execution"}], "correct_answers": ["D", "E"], "explanation": "Query History records every query execution including those triggered by dashboard refreshes; filtering by warehouse and the refresh time surfaces the specific failing query and its error. Checking the dashboard refresh history shows the status of each scheduled refresh and any recorded error messages, which is the first step to diagnosis.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "Which of the following correctly describes the purpose of the ROLLUP operator in Databricks SQL and when it is useful?", "type": "single", "options": [{"label": "A", "text": "ROLLUP generates all possible combinations of the specified grouping columns, including combinations that do not follow the natural hierarchy of the columns"}, {"label": "B", "text": "ROLLUP generates subtotals and a grand total for a hierarchical set of grouping columns, producing aggregate rows at each level of the hierarchy in addition to the detailed group rows"}, {"label": "C", "text": "ROLLUP is equivalent to UNION ALL of multiple GROUP BY queries at different levels of aggregation but executes more efficiently by computing all levels in a single pass over the data"}, {"label": "D", "text": "ROLLUP is only supported for numeric columns and raises an error when applied to date or string grouping columns"}], "correct_answers": ["B"], "explanation": "ROLLUP is a GROUP BY extension that automatically adds subtotal rows at each level of the column hierarchy and a grand total row at the end. For example GROUP BY ROLLUP(year, quarter, month) produces subtotals for each year, each year-quarter combination, and a grand total in addition to the monthly detail rows.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "The finance team reports that a critical revenue dashboard has been showing the same figures for three days despite daily data loads completing successfully. What is the most likely cause and the correct resolution?", "type": "single", "options": [{"label": "A", "text": "The dashboard does not have a scheduled refresh configured or the scheduled refresh was accidentally disabled, causing it to continue displaying the result cache from the last successful execution three days ago"}, {"label": "B", "text": "The Delta tables powering the dashboard have not had OPTIMIZE run in three days causing the query engine to return outdated file statistics"}, {"label": "C", "text": "The SQL Warehouse running the dashboard queries has been paused for three days and needs to be manually restarted before the dashboard can refresh"}, {"label": "D", "text": "The Unity Catalog permissions on the underlying tables were changed three days ago preventing the dashboard from reading new data while continuing to serve the cached result"}], "correct_answers": ["A"], "explanation": "Without a scheduled refresh dashboards continue to show the most recently cached query results. If the refresh schedule was never configured or was accidentally disabled the dashboard displays the same data indefinitely even as the underlying tables are updated by the daily pipeline. Enabling or restoring the scheduled refresh resolves the issue.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Databricks SQL & Warehouses", "question": "Which two statements correctly describe the purpose and behaviour of Materialised Views in Databricks SQL?", "type": "multiple", "options": [{"label": "A", "text": "Creating a Materialised View automatically partitions the stored results by the first column in the SELECT list to improve query performance"}, {"label": "B", "text": "A Materialised View always reflects the real-time state of the underlying source tables and updates automatically within milliseconds of any source table change"}, {"label": "C", "text": "Materialised Views in Databricks SQL support incremental refresh, where only the data affected by new source records is reprocessed rather than recomputing the entire result set from scratch on each refresh"}, {"label": "D", "text": "A Materialised View pre-computes and stores the results of a query in a Delta table, allowing subsequent queries against the view to read the stored results rather than re-executing the underlying query each time"}, {"label": "E", "text": "Materialised Views can only be created on top of Delta tables and cannot query external tables or tables in other schemas or catalogs"}], "correct_answers": ["C", "D"], "explanation": "Materialised Views store pre-computed query results as Delta tables so queries read the stored results instead of re-executing the underlying query, and they support incremental refresh that recomputes only the affected portion when source data changes, making refreshes more efficient than full recomputation.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to produce a pivot table showing total sales for each product category by quarter. The sales table has columns quarter (Q1 through Q4), category, and sale_amount. Which query correctly pivots the data?", "type": "single", "options": [{"label": "A", "text": "SELECT category, Q1, Q2, Q3, Q4 FROM sales PIVOT (SUM(sale_amount)) FOR quarter VALUES ('Q1', 'Q2', 'Q3', 'Q4') GROUP BY category"}, {"label": "B", "text": "SELECT * FROM sales PIVOT (SUM(sale_amount) FOR quarter IN ('Q1', 'Q2', 'Q3', 'Q4'))"}, {"label": "C", "text": "SELECT category, PIVOT(SUM(sale_amount)) FOR quarter FROM sales GROUP BY category"}, {"label": "D", "text": "SELECT * FROM sales PIVOT (SUM(sale_amount) FOR quarter IN ('Q1', 'Q2', 'Q3', 'Q4')) GROUP BY category"}], "correct_answers": ["B"], "explanation": "This is the proper Databricks SQL PIVOT syntax. The PIVOT clause aggregates sale_amount for each quarter value into separate columns, with grouping handled automatically by the remaining non-aggregated columns.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is asked to recommend the most appropriate chart type for a new dashboard requirement. The stakeholder wants to compare actual quarterly revenue against the quarterly target for each of the four business units. Which visualisation type best communicates this comparison?", "type": "single", "options": [{"label": "A", "text": "A scatter plot with actual revenue on the x-axis and target revenue on the y-axis with one point per business unit"}, {"label": "B", "text": "A single line chart with quarters on the x-axis and one line for actual and one for target, aggregated across all business units"}, {"label": "C", "text": "A grouped bar chart with one group per business unit containing two bars per group — one for actual revenue and one for target revenue — allowing direct visual comparison of actual versus target for each unit"}, {"label": "D", "text": "A pie chart with one slice per business unit showing each unit's share of total actual revenue"}], "correct_answers": ["C"], "explanation": "A grouped bar chart is the most effective visualisation for comparing two related measures across multiple categories. Each business unit has two adjacent bars making the actual versus target gap immediately visible for every unit simultaneously.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is building a dashboard for a global sales team and needs to allow users to filter data by continent and then by country within the selected continent. The countries available should change based on the selected continent. How should this cascading filter be implemented in a Databricks AI/BI Dashboard?", "type": "single", "options": [{"label": "A", "text": "Create a continent filter widget linked to a {{continent}} parameter and a country filter widget whose dataset query includes a WHERE continent = {{continent}} clause, so the country options automatically update when the continent selection changes"}, {"label": "B", "text": "Add all continent-country combinations as a single flat dropdown list so users can select the exact continent-country pair they want in one selection"}, {"label": "C", "text": "Create two separate dashboards — one per continent — each containing pre-filtered country options for that continent, with navigation links between dashboards"}, {"label": "D", "text": "Use a Text widget to display instructions asking users to manually type their continent and country into a free-text parameter input"}], "correct_answers": ["A"], "explanation": "Cascading filters in Databricks AI/BI Dashboards are implemented by linking the downstream filter widget's dataset query to the upstream filter's parameter. The country filter queries available countries filtered by the selected continent, so changing the continent automatically updates the list of available countries.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "Which two statements correctly describe how to use CTEs (Common Table Expressions) in Databricks SQL?", "type": "multiple", "options": [{"label": "A", "text": "A CTE is defined using the WITH keyword before the main SELECT statement and can be referenced by name multiple times within the same query, avoiding repetition of complex subquery logic"}, {"label": "B", "text": "Multiple CTEs can be defined in a single WITH clause by separating each CTE definition with a comma, and later CTEs can reference earlier ones defined in the same WITH clause"}, {"label": "C", "text": "CTEs persist as temporary tables in the Unity Catalog schema for the duration of the session, allowing them to be queried from other notebooks or SQL Editor sessions"}, {"label": "D", "text": "A CTE improves query performance by materialising its result set to disk before the main query executes, ensuring the subquery only runs once regardless of how many times it is referenced"}, {"label": "E", "text": "CTEs can only be used in SELECT statements and are not valid in INSERT, UPDATE, MERGE, or other DML statements"}], "correct_answers": ["A", "B"], "explanation": "CTEs use the WITH clause to define named temporary result sets before the main query and can be referenced by name multiple times. Multiple CTEs are separated by commas and later CTEs can build on earlier ones, enabling step-by-step query construction.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Delta Lake & Delta Tables", "question": "A data analyst needs to understand what operations have been performed on a Delta table over the past week including who ran each operation and when. Which command provides this information?", "type": "single", "options": [{"label": "A", "text": "DESCRIBE HISTORY table_name"}, {"label": "B", "text": "SHOW TABLES IN schema_name"}, {"label": "C", "text": "EXPLAIN table_name"}, {"label": "D", "text": "DESCRIBE TABLE EXTENDED table_name"}], "correct_answers": ["A"], "explanation": "DESCRIBE HISTORY returns the complete transaction audit trail for the Delta table in reverse chronological order. Each row represents one committed operation and includes the version number, timestamp, userName of the principal who performed the operation, and the operation type.", "is_one_word": true}, {"source": "Udemy Exam Practice 4", "theme": "Unity Catalog & Data Governance", "question": "Which of the following correctly describes the difference between GRANT on a specific table versus GRANT on ALL TABLES IN SCHEMA in Unity Catalog?", "type": "single", "options": [{"label": "A", "text": "GRANT SELECT ON ALL TABLES IN SCHEMA prod.silver TO analyst_group automatically grants SELECT on all future tables created in the schema, eliminating the need for any additional grants when new tables are added"}, {"label": "B", "text": "GRANT SELECT ON ALL TABLES IN SCHEMA also grants USE SCHEMA and USE CATALOG permissions automatically, so no additional hierarchical grants are needed"}, {"label": "C", "text": "GRANT SELECT ON TABLE and GRANT SELECT ON ALL TABLES IN SCHEMA are functionally identical and can be used interchangeably in all scenarios"}, {"label": "D", "text": "GRANT SELECT ON TABLE prod.silver.orders TO analyst_group grants access only to the orders table. GRANT SELECT ON ALL TABLES IN SCHEMA prod.silver TO analyst_group grants access to all tables currently in the schema but does not automatically cover tables created after the grant is applied"}], "correct_answers": ["D"], "explanation": "These two grants have different scopes. The table-level grant covers only the specified table. The ALL TABLES IN SCHEMA grant covers all tables existing at the time of the grant but is not a standing policy that automatically applies to future tables; new tables require explicit grants or use of ALTER DEFAULT PRIVILEGES.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to grant a team of data scientists the ability to create new tables and views within the experiments schema of the dev catalog but not delete or modify existing objects owned by other users. Which grant correctly implements this minimum necessary privilege?", "type": "single", "options": [{"label": "A", "text": "GRANT ALL PRIVILEGES ON SCHEMA dev.experiments TO data_scientists"}, {"label": "B", "text": "GRANT CREATE ON CATALOG dev TO data_scientists"}, {"label": "C", "text": "GRANT INSERT ON SCHEMA dev.experiments TO data_scientists"}, {"label": "D", "text": "GRANT USE CATALOG ON CATALOG dev TO data_scientists; GRANT USE SCHEMA ON SCHEMA dev.experiments TO data_scientists; GRANT CREATE TABLE ON SCHEMA dev.experiments TO data_scientists"}], "correct_answers": ["D"], "explanation": "USE CATALOG and USE SCHEMA allow navigation of the namespace hierarchy, and CREATE TABLE on the schema allows data scientists to create new tables and views within the schema without granting modify or delete privileges on objects owned by other users. This is the minimum set of privileges for the stated requirement.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to create a table in Unity Catalog that automatically inherits the schema from a directory of Parquet files in a cloud storage volume without manually specifying column names and types. Which SQL statement correctly achieves this?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE prod.silver.events USING PARQUET OPTIONS (inferSchema = true) LOCATION '/Volumes/prod/raw/events/'"}, {"label": "B", "text": "CREATE TABLE prod.silver.events AS SELECT * FROM INFER_SCHEMA('/Volumes/prod/raw/events/', 'parquet')"}, {"label": "C", "text": "CREATE TABLE prod.silver.events USING PARQUET LOCATION '/Volumes/prod/raw/events/'"}, {"label": "D", "text": "CREATE TABLE prod.silver.events DETECT SCHEMA FROM '/Volumes/prod/raw/events/' FORMAT PARQUET"}], "correct_answers": ["C"], "explanation": "When CREATE TABLE is used with USING PARQUET and a LOCATION pointing to existing Parquet files without an explicit schema definition, Databricks automatically infers the schema from the Parquet file metadata. Parquet files embed schema information in their file footer making schema inference reliable and accurate.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Caching & Performance", "question": "Which two statements correctly describe how to optimise dashboard performance in Databricks SQL?", "type": "multiple", "options": [{"label": "A", "text": "Scheduling dashboard refreshes during off-peak hours reduces competition for SQL Warehouse resources and ensures queries complete faster than if they ran during peak usage periods"}, {"label": "B", "text": "Adding more visualisation widgets to a dashboard improves its performance because each widget loads data independently in parallel, reducing the total load time"}, {"label": "C", "text": "Increasing the SQL Warehouse size to XXX-Large is always the most effective way to improve dashboard query performance regardless of query structure"}, {"label": "D", "text": "Enabling query result caching on the SQL Warehouse ensures that repeated dashboard loads return instantly when the underlying data has not changed, reducing warehouse compute consumption"}, {"label": "E", "text": "Disabling auto-suspend on the SQL Warehouse so it remains running at all times ensures dashboard queries never wait for a warehouse to resume, which is the most effective way to improve dashboard load performance"}], "correct_answers": ["A", "D"], "explanation": "Result caching automatically stores query results and serves them for identical subsequent queries when underlying data has not changed, so repeated dashboard loads do not consume warehouse compute. Scheduling refreshes during off-peak hours reduces resource contention and ensures the refresh completes quickly.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst needs to configure a Genie space for a supply chain team. The team frequently asks about on-time delivery rates, which requires a complex calculation involving multiple joins and date comparisons. How should the analyst configure the Genie space to ensure this metric is always calculated correctly?", "type": "single", "options": [{"label": "A", "text": "Enable the auto-generate trusted assets setting in the Genie space configuration which automatically identifies complex calculations in the curated datasets and creates trusted assets for them"}, {"label": "B", "text": "Grant the supply chain team CAN MANAGE permission on the Genie space so they can edit the SQL queries themselves when the on-time delivery calculation returns incorrect results"}, {"label": "C", "text": "Write the on-time delivery rate calculation as a SQL view in Unity Catalog and add the view as a curated dataset in the Genie space so Genie queries the pre-defined view rather than generating the join logic from scratch"}, {"label": "D", "text": "Add the validated SQL query for on-time delivery rate as a Trusted Asset in the Genie space so that when users ask about delivery rates Genie uses this exact pre-approved calculation rather than generating its own interpretation"}], "correct_answers": ["D"], "explanation": "Trusted Assets are pre-validated SQL queries for specific business metrics. When a user asks a question that matches the Trusted Asset, Genie uses the approved query guaranteed, ensuring the complex join and date comparison logic is always executed correctly rather than being regenerated with potential errors.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst writes SELECT region, SUM(sales) FROM transactions GROUP BY region, product_line. The analyst expects one row per region but the result shows multiple rows per region. What explains this behaviour?", "type": "single", "options": [{"label": "A", "text": "The query groups by both region and product_line, producing one row per unique region and product_line combination rather than one row per region"}, {"label": "B", "text": "SUM cannot be used with multiple GROUP BY columns and should be replaced with COUNT"}, {"label": "C", "text": "The transactions table has duplicate rows that are inflating the GROUP BY results beyond one row per region"}, {"label": "D", "text": "ORDER BY region is missing from the query which causes rows to appear out of order making it look like there are multiple rows per region"}], "correct_answers": ["A"], "explanation": "GROUP BY region, product_line creates groups based on the combination of both columns. Each distinct pairing of region and product_line produces one row. To get one row per region with total sales across all product lines the GROUP BY should include only the region column.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Databricks SQL & Warehouses", "question": "A data analyst creates a query in the Databricks SQL Editor and wants to share it with colleagues so they can run it themselves with their own credentials and see results based on their own Unity Catalog permissions. Which sharing approach correctly achieves this?", "type": "single", "options": [{"label": "A", "text": "Share the saved query from the SQL Editor by setting the query permissions to allow colleagues to view and run it, so they can execute it using their own credentials against the data they have access to"}, {"label": "B", "text": "Publish the query as a dashboard widget set to public access so anyone with the dashboard link can run it with the analyst's credentials"}, {"label": "C", "text": "Create a Genie space containing the query as a Trusted Asset so colleagues can retrieve the query results by asking a natural language question in the Genie interface"}, {"label": "D", "text": "Export the query as a SQL file and email it to colleagues who import it into their own SQL Editor sessions"}], "correct_answers": ["A"], "explanation": "Databricks SQL Editor supports sharing saved queries with workspace users through permission settings. When a colleague runs a shared query it executes with their own credentials and Unity Catalog permissions, so they see only the data they are authorised to access.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "Query Optimization & Performance", "question": "The data engineering team has partitioned a Delta table on the country column. A data analyst writes a query that filters on order_date but not on country. After running OPTIMIZE ZORDER BY (order_date), query performance improves significantly. Why did ZORDER improve performance when the table was partitioned on a different column?", "type": "single", "options": [{"label": "A", "text": "ZORDER BY order_date automatically adds order_date as a secondary partition column alongside country, creating a hierarchical partition structure"}, {"label": "B", "text": "ZORDER BY replaces the existing country partition with a new order_date partition making the table partitioned on order_date instead"}, {"label": "C", "text": "ZORDER removes all files that do not contain the queried order_date values, permanently deleting data outside the filter range"}, {"label": "D", "text": "Within each country partition ZORDER BY order_date co-locates rows with similar order_date values in the same files and refreshes file-level statistics for the order_date column, enabling data skipping for order_date filters within each partition"}], "correct_answers": ["D"], "explanation": "ZORDER improves data layout within the existing partition structure. Within each country partition the files are reorganised so rows with similar order_date values are stored together, and refreshed file-level min/max statistics let the query engine skip files whose order_date range does not overlap the query filter, reducing data scanned.", "is_one_word": false}, {"source": "Udemy Exam Practice 4", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns all orders placed in January or February of any year. The orders table has an order_date column of DateType. Which WHERE clause correctly filters for these months?", "type": "single", "options": [{"label": "A", "text": "WHERE MONTH(order_date) = 1 AND MONTH(order_date) = 2"}, {"label": "B", "text": "WHERE order_date LIKE '%-01-%' OR order_date LIKE '%-02-%'"}, {"label": "C", "text": "WHERE MONTH(order_date) IN (1, 2)"}, {"label": "D", "text": "WHERE order_date BETWEEN '2000-01-01' AND '2000-02-28'"}], "correct_answers": ["C"], "explanation": "The MONTH() fu
