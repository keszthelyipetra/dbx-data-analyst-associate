haring endpoint that replicates the PostgreSQL table into a Delta format before the query runs"}, {"label": "C", "text": "An Auto Loader pipeline that continuously ingests the PostgreSQL table into a Bronze Delta table before the join query runs"}, {"label": "D", "text": "A SQL Warehouse configured with a JDBC driver pointing to the PostgreSQL instance, which automatically exposes all PostgreSQL tables as queryable views"}], "correct_answers": ["A"], "explanation": "Lakehouse Federation requires a connection object created in Unity Catalog pointing to the external database. Once registered the external tables appear as a foreign catalog and can be joined with Delta tables in a single query without moving data.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "What is the purpose of the sample questions feature in a Genie space and how should it be configured for best results?", "type": "single", "options": [{"label": "A", "text": "Sample questions are pre-executed queries whose results are cached so that common questions return answers instantly without executing against the live data"}, {"label": "B", "text": "Sample questions are example natural language questions defined by the Genie space administrator that are displayed to users when they open the space, helping them understand what questions the space can answer and guiding them toward well-supported query patterns"}, {"label": "C", "text": "Sample questions are automatically generated by Genie based on the column names and values in the curated datasets, requiring no configuration by the administrator"}, {"label": "D", "text": "Sample questions are mandatory and a Genie space cannot be published or shared until at least ten sample questions have been defined"}], "correct_answers": ["B"], "explanation": "Sample questions appear on the Genie space home screen as clickable examples that help users understand the space's scope and demonstrate question phrasing Genie handles well. They should be representative of common, valuable questions the target audience will ask.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Query Optimization & Performance", "question": "An analyst observes that a dashboard query scanning a large Delta table is slow despite a filter on the region column. Running DESCRIBE HISTORY on the table shows no recent OPTIMIZE operations. Which two actions would most improve query performance on the region column?", "type": "multiple", "options": [{"label": "A", "text": "Apply Liquid Clustering on the region column by running ALTER TABLE sales.orders CLUSTER BY (region), which incrementally reorganises data on the clustering column without requiring periodic full OPTIMIZE runs"}, {"label": "B", "text": "Increase the SQL Warehouse size to XXX-Large to provide enough memory for the query engine to cache the entire table in memory"}, {"label": "C", "text": "Convert the Delta table to a CSV file format which has better filter pushdown performance than Delta for single-column filters"}, {"label": "D", "text": "Run OPTIMIZE sales.orders ZORDER BY (region) to co-locate rows with the same region value in the same files, improving data skipping for region-based filters"}, {"label": "E", "text": "Run VACUUM sales.orders RETAIN 0 HOURS to remove all old files and force the query to scan only the most recent data files"}], "correct_answers": ["A", "D"], "explanation": "Liquid Clustering incrementally clusters data on the specified column and improves data skipping without periodic OPTIMIZE. OPTIMIZE with ZORDER BY co-locates rows with similar values and updates file statistics, both improving data skipping for region filters.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Query Optimization & Performance", "question": "An analyst runs OPTIMIZE on a large Delta table every night. They notice that query performance on the order_status column has not improved despite regular OPTIMIZE runs. What is the most likely reason?", "type": "single", "options": [{"label": "A", "text": "OPTIMIZE without ZORDER BY or Liquid Clustering compacts small files into larger ones but does not reorganise data by column values, so data skipping on specific columns does not improve"}, {"label": "B", "text": "The order_status column has too many distinct values for ZORDER to be effective and a different column should be chosen"}, {"label": "C", "text": "OPTIMIZE is only effective for tables partitioned by the order_status column and provides no performance benefit for non-partitioned tables"}, {"label": "D", "text": "OPTIMIZE requires the table to be in classic Hive partitioned format to improve query performance and Delta tables without Hive partitions do not benefit from OPTIMIZE"}], "correct_answers": ["A"], "explanation": "OPTIMIZE alone performs file compaction by merging small files, but without ZORDER BY or Liquid Clustering the data within files is not organised by column values, so targeted column-based data skipping does not improve.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "A Genie space editor can modify curated SQL queries and update instructions, but a colleague notices they cannot add new data sources or invite other users. Why?", "type": "single", "options": [{"label": "A", "text": "They have CAN USE permissions, which restricts all configuration changes"}, {"label": "B", "text": "They have CAN MANAGE permissions, but data source additions require a separate workspace admin role"}, {"label": "C", "text": "Genie spaces do not support adding data sources after initial setup regardless of permission level"}, {"label": "D", "text": "They have CAN EDIT permissions, which allows modifying existing configurations but reserves data source management and permission control for CAN MANAGE"}], "correct_answers": ["D"], "explanation": "CAN EDIT permits modifications to existing configurations like curated queries and instructions, but deliberately stops short of letting users add data sources or control access. Those actions are reserved for CAN MANAGE.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Data Ingestion & Streaming", "question": "Which of the following correctly describes when Auto Loader should be used instead of a standard COPY INTO command for data ingestion?", "type": "single", "options": [{"label": "A", "text": "Auto Loader should be used when ingesting data from relational databases via JDBC connections, as COPY INTO only supports file-based sources"}, {"label": "B", "text": "Auto Loader should be used when a one-time bulk load of all files in a directory is required, as COPY INTO can only process a single file per execution"}, {"label": "C", "text": "Auto Loader should only be used with JSON files because it requires schema inference which is only supported for semi-structured formats"}, {"label": "D", "text": "Auto Loader should be used when continuously ingesting large volumes of files arriving incrementally in cloud storage, as it uses file notification services or directory listing to efficiently detect and process only new files without scanning the entire directory each run"}], "correct_answers": ["D"], "explanation": "Auto Loader is optimised for continuous or scheduled incremental ingestion at scale, using cloud file notification services to detect new files without directory listing, making it more efficient than COPY INTO for high-volume or high-frequency file arrival.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst wants to create a counter visualisation on a dashboard showing the total number of active customers. The underlying query returns a single row with a single column called active_customer_count. Which widget type and configuration correctly displays this as a large prominent number on the dashboard?", "type": "single", "options": [{"label": "A", "text": "A Counter widget configured to display the active_customer_count column value, which renders a single large number suitable for KPI display on a dashboard"}, {"label": "B", "text": "A Table widget showing the single-row query result, which displays the column name and value in a grid format"}, {"label": "C", "text": "A Text widget where the analyst manually types the current customer count value as static text"}, {"label": "D", "text": "A bar chart widget with active_customer_count on the y-axis and no x-axis dimension"}], "correct_answers": ["A"], "explanation": "The Counter widget in Databricks AI/BI Dashboards is purpose-built for displaying single numeric KPI values prominently, rendering the value in large text as a headline metric.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "Which of the following correctly describes how to embed a Databricks AI/BI Dashboard in an external web application so that users can view it without a Databricks account?", "type": "single", "options": [{"label": "A", "text": "Publish the dashboard and use the generated embed URL or iframe code in the external application. Viewers access the live dashboard through the embed without requiring a Databricks login"}, {"label": "B", "text": "Connect the external application to the Databricks REST API and use the /api/2.0/preview/sql/queries endpoint to retrieve query results as JSON for rendering in custom visualisations"}, {"label": "C", "text": "Export the dashboard as an HTML file and host it on the organisation's web server, updating the file each time the dashboard data changes"}, {"label": "D", "text": "Share the dashboard with a service principal account that the external application uses to authenticate and render the dashboard content"}], "correct_answers": ["A"], "explanation": "Databricks AI/BI Dashboards support publishing to a shareable link and embedding in external applications via an iframe. The published dashboard is accessible to viewers without a Databricks account, providing live interactive access.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst wants to build a Genie space that helps the sales team answer questions about pipeline and deal data. After creating the space, the analyst notices Genie is struggling to understand sales-specific terminology like MQL, SQL, and ARR. What is the most appropriate action to resolve this?", "type": "single", "options": [{"label": "A", "text": "Rename all columns in the underlying Unity Catalog tables to match the exact terminology used by the sales team so Genie can match terms directly to column names"}, {"label": "B", "text": "Delete the curated datasets from the Genie space and replace them with pre-aggregated summary tables that have self-explanatory column names"}, {"label": "C", "text": "Add domain-specific instructions to the Genie space that define the sales terminology and explain how key terms like MQL, SQL, and ARR map to the underlying data columns and calculations"}, {"label": "D", "text": "Switch the Genie space to use a larger SQL Warehouse to give Genie more compute resources for interpreting complex sales terminology"}], "correct_answers": ["C"], "explanation": "Domain instructions in a Genie space let administrators provide context about business terminology, metric definitions, and data relationships, helping Genie correctly interpret user questions using that terminology.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "SQL Basics & Syntax", "question": "A data analyst is writing a query to find customers who have placed at least one order over 1000 in value. Which query correctly uses a subquery to achieve this?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM customers WHERE EXISTS (SELECT customer_id FROM orders WHERE order_value > 1000)"}, {"label": "B", "text": "SELECT * FROM customers WHERE customer_id = (SELECT customer_id FROM orders WHERE order_value > 1000)"}, {"label": "C", "text": "SELECT * FROM customers INNER JOIN orders ON customers.customer_id = orders.customer_id WHERE orders.order_value > 1000"}, {"label": "D", "text": "SELECT * FROM customers WHERE customer_id IN (SELECT customer_id FROM orders WHERE order_value > 1000)"}], "correct_answers": ["D"], "explanation": "The subquery returns a list of customer_ids from orders where order value exceeds 1000, and the outer query uses IN to retrieve all matching customer records. This is the correct and efficient subquery pattern.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "A sales analyst builds a dashboard with four visualisations all showing different metrics for the same time period. The analyst wants a single date range selector that filters all four visualisations simultaneously. After adding a date range filter widget, the visualisations do not update when the date range is changed. What is the most likely cause?", "type": "single", "options": [{"label": "A", "text": "The date range filter is not configured to apply to the date field or parameter used by the visualisations' underlying datasets."}, {"label": "B", "text": "The date range filter widget is not supported for dashboards with more than two visualisations and a separate filter must be added for each additional chart"}, {"label": "C", "text": "The SQL Warehouse powering the dashboard was restarted and needs to be manually resumed before filter interactions can trigger query re-execution"}, {"label": "D", "text": "The visualisations are using cached results from the last dashboard refresh and the cache must be manually cleared before filter changes take effect"}], "correct_answers": ["A"], "explanation": "A filter widget must be connected to the relevant field(s) or parameter(s) in the datasets used by the visualisations. If the filter is not connected to the appropriate dataset field or parameter, changing the date range will not affect the visualisations.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "Which of the following correctly describes the purpose of tagging a data asset in Unity Catalog and how tags can be used?", "type": "single", "options": [{"label": "A", "text": "Tags in Unity Catalog are key-value metadata labels that can be applied to catalogs, schemas, tables, and columns to support data discovery, classification, and governance workflows such as identifying PII columns or marking certified datasets"}, {"label": "B", "text": "Tags in Unity Catalog automatically encrypt the data in tagged columns using a Databricks-managed key, providing an additional layer of security for sensitive data"}, {"label": "C", "text": "Tags in Unity Catalog are used to define row-level security policies that restrict which rows a tagged table returns based on the tag value assigned to each row"}, {"label": "D", "text": "Tags in Unity Catalog can only be applied by the metastore admin and cannot be assigned by regular data analysts or data stewards"}], "correct_answers": ["A"], "explanation": "Tags let organisations attach searchable metadata to data assets for uses such as marking PII columns, labelling tables by domain or quality tier, and identifying certified datasets. Tags are visible in Catalog Explorer and can be used to filter and discover assets.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Query Optimization & Performance", "question": "A data analyst needs to calculate the approximate number of distinct customers who made a purchase in the last quarter from a table containing 500 million rows. The query must complete in seconds rather than minutes. Which SQL function is most appropriate?", "type": "single", "options": [{"label": "A", "text": "MAX(customer_id) - MIN(customer_id)"}, {"label": "B", "text": "APPROX_COUNT_DISTINCT(customer_id)"}, {"label": "C", "text": "SUM(customer_id)"}, {"label": "D", "text": "COUNT(DISTINCT customer_id)"}], "correct_answers": ["B"], "explanation": "APPROX_COUNT_DISTINCT uses the HyperLogLog algorithm to estimate the number of distinct values with a small, configurable error rate. It is orders of magnitude faster than exact COUNT DISTINCT on large datasets because it does not require a full shuffle.", "is_one_word": true}, {"source": "Udemy Exam Practice 2", "theme": "Data Modeling & Architecture", "question": "A data vault schema is being designed for a financial services data warehouse. Which statement correctly describes the role of a Hub table in a data vault model?", "type": "single", "options": [{"label": "A", "text": "A Hub table stores the unique business keys for a core business entity such as customer or account along with metadata about when and from which source system the key was first loaded, with no descriptive attributes"}, {"label": "B", "text": "A Hub table stores the relationships and foreign keys between two or more business entities, acting as a junction table that links different entity types together"}, {"label": "C", "text": "A Hub table stores all historical changes to a business entity including before and after values for each attribute change, providing a full audit trail of how the entity evolved over time"}, {"label": "D", "text": "A Hub table is a pre-aggregated summary of transactions for a business entity, optimised for fast querying by BI tools without requiring joins to other tables"}], "correct_answers": ["A"], "explanation": "In data vault modelling a Hub is the central table for a business entity. It stores the unique business key, a surrogate hash key, the load date, and the record source. Descriptive attributes go in Satellites and relationships go in Link tables.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Databricks SQL & Warehouses", "question": "Which two statements correctly describe how Databricks SQL Warehouses handle concurrency and scaling?", "type": "multiple", "options": [{"label": "A", "text": "SQL Warehouses automatically distribute a single large query across multiple clusters to reduce individual query execution time"}, {"label": "B", "text": "Serverless SQL Warehouses start faster than Pro or Classic warehouses because they use pre-warmed compute infrastructure managed by Databricks rather than provisioning new cloud instances on demand"}, {"label": "C", "text": "All SQL Warehouse types including Serverless, Pro, and Classic support the same maximum number of concurrent queries per cluster"}, {"label": "D", "text": "A SQL Warehouse can be configured to automatically add clusters when the number of concurrent queries exceeds the capacity of the current cluster count, distributing queries across multiple clusters to maintain performance"}, {"label": "E", "text": "A SQL Warehouse must be manually restarted by an administrator each time it needs to scale up to handle additional concurrent users"}], "correct_answers": ["B", "D"], "explanation": "Serverless warehouses use Databricks-managed pre-warmed compute pools for near-instant startup, and SQL Warehouses support multi-cluster scaling that automatically adds clusters when concurrent query demand exceeds capacity.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is designing an AI/BI Dashboard and wants to allow viewers to filter all visualisations by selecting a specific sales region from a dropdown list. Which steps correctly implement this?", "type": "single", "options": [{"label": "A", "text": "Add a Filter widget to the dashboard configured with a dropdown list of region values, then link the filter to each dataset query by referencing the parameter in the WHERE clause of each query using double curly brace syntax"}, {"label": "B", "text": "Add a Text widget containing a list of region names and instruct viewers to manually edit the underlying query to change the region filter as needed"}, {"label": "C", "text": "Use a Counter widget configured with a region selector that filters the underlying dataset before passing data to the other visualisation widgets on the page"}, {"label": "D", "text": "Create a separate dashboard page for each region and add navigation buttons so viewers can switch between region-specific pages"}], "correct_answers": ["A"], "explanation": "Dashboard filter widgets expose parameter values passed into dataset queries. By adding the parameter in each query's WHERE clause and linking the filter widget, changing the dropdown re-executes all linked queries, updating all visualisations simultaneously.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Data Modeling & Architecture", "question": "A data analyst is building a star schema in Databricks SQL for an e-commerce analytics workload. The schema includes a fact_orders table and dimension tables for dim_customer, dim_product, and dim_date. Which query correctly joins these tables to calculate total revenue per product category per month?", "type": "single", "options": [{"label": "A", "text": "SELECT dp.category, dd.month, SUM(fo.revenue) AS total_revenue FROM dim_product dp JOIN dim_date dd ON dp.product_id = dd.date_id GROUP BY dp.category, dd.month"}, {"label": "B", "text": "SELECT dp.category, dd.month, SUM(fo.revenue) AS total_revenue FROM fact_orders fo JOIN dim_product dp ON fo.product_id = dp.product_id JOIN dim_date dd ON fo.date_id = dd.date_id GROUP BY dp.category, dd.month ORDER BY dd.month, total_revenue DESC"}, {"label": "C", "text": "SELECT dp.category, dd.month, COUNT(fo.order_id) AS total_revenue FROM fact_orders fo JOIN dim_product dp ON fo.product_id = dp.product_id JOIN dim_date dd ON fo.date_id = dd.date_id GROUP BY dp.category, dd.month"}, {"label": "D", "text": "SELECT fo.product_id, fo.date_id, SUM(fo.revenue) AS total_revenue FROM fact_orders fo GROUP BY fo.product_id, fo.date_id"}], "correct_answers": ["B"], "explanation": "This query correctly joins the fact table to the relevant dimension tables using the foreign key relationships. GROUP BY on category and month produces the required breakdown and ORDER BY sorts by month and descending revenue.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "SQL Basics & Syntax", "question": "A database administrator needs to create an external table in Unity Catalog pointing to Parquet files stored in an S3 bucket. Which SQL statement correctly creates this external table?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE prod.sales.transactions (transaction_id BIGINT, amount DOUBLE, transaction_date DATE) USING PARQUET LOCATION 's3://my-bucket/sales/transactions/'"}, {"label": "B", "text": "CREATE EXTERNAL TABLE prod.sales.transactions USING PARQUET LOCATION 's3://my-bucket/sales/transactions/'"}, {"label": "C", "text": "CREATE TABLE prod.sales.transactions STORED AS PARQUET AT 's3://my-bucket/sales/transactions/'"}, {"label": "D", "text": "CREATE MANAGED TABLE prod.sales.transactions (transaction_id BIGINT, amount DOUBLE, transaction_date DATE) USING PARQUET"}], "correct_answers": ["A"], "explanation": "CREATE TABLE with USING PARQUET and LOCATION creates an external table in Unity Catalog. The three-level namespace places the table in the correct catalog and schema, and the LOCATION clause points to the S3 path containing the Parquet files.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "SQL Basics & Syntax", "question": "Which of the following correctly describes the behaviour of UNION versus UNION ALL in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "UNION ALL is only supported in subqueries and cannot be used at the top level of a SELECT statement in Databricks SQL"}, {"label": "B", "text": "UNION combines the results of two queries and removes duplicate rows from the output. UNION ALL combines the results of two queries and retains all rows including duplicates"}, {"label": "C", "text": "UNION combines rows from two queries and automatically joins them on matching column names, while UNION ALL stacks rows vertically without any column matching"}, {"label": "D", "text": "UNION ALL only works when both queries return the same number of rows while UNION works regardless of row count differences between the two queries"}], "correct_answers": ["B"], "explanation": "UNION performs an implicit DISTINCT on the combined result set, removing duplicate rows at the cost of additional processing. UNION ALL simply appends the results without deduplication, making it faster when duplicates are acceptable.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Data Modeling & Architecture", "question": "A data analyst is documenting a star schema for a retail data warehouse. The schema has a fact_sales table with foreign keys to dim_product, dim_customer, dim_store, and dim_date. Which statement correctly describes the advantage of this star schema design for analytical queries?", "type": "single", "options": [{"label": "A", "text": "The star schema simplifies query writing and optimises analytical performance by limiting joins to a single level between the fact table and its surrounding dimension tables, avoiding the multi-level joins required in a normalised transactional schema"}, {"label": "B", "text": "The star schema eliminates the need for any JOIN operations because all data is denormalised into the central fact table, making queries faster by avoiding multi-table lookups"}, {"label": "C", "text": "The star schema stores all historical changes to dimension attributes within the fact table using slowly changing dimension columns, eliminating the need for separate SCD tracking tables"}, {"label": "D", "text": "The star schema requires all dimension tables to have the same number of rows as the fact table to maintain referential integrity across the schema"}], "correct_answers": ["A"], "explanation": "The star schema's denormalised dimension tables mean joining the fact table to any dimension requires only a single join, contrasting with normalised schemas that may require chaining multiple joins. Simpler joins improve both query performance and readability.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Caching & Performance", "question": "A data analyst queries a Delta table and receives results that appear to be missing recent updates that were confirmed as committed by another team. What is the most likely explanation and how should the analyst investigate?", "type": "single", "options": [{"label": "A", "text": "The analyst may be reading a cached query result that was generated before the recent updates were committed. The analyst should clear the result cache or re-run the query with a forced refresh to retrieve the latest data"}, {"label": "B", "text": "Another user has an open transaction that has locked the table, preventing the analyst from reading the latest committed data until the transaction completes"}, {"label": "C", "text": "The Delta table has a schema mismatch that is causing recent rows to be silently dropped during reads. The analyst should run DESCRIBE TABLE EXTENDED to check for schema conflicts"}, {"label": "D", "text": "The Delta table is configured in append-only mode which prevents UPDATE and DELETE operations from modifying existing rows. The analyst should run DESCRIBE HISTORY to check the table configuration"}], "correct_answers": ["A"], "explanation": "Databricks SQL result caching serves identical queries from cache when the underlying data appears unchanged from the cache's perspective. Re-running with a forced refresh or invalidating the cache retrieves the latest committed data.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Databricks SQL & Warehouses", "question": "Which two components must be defined when configuring a Databricks SQL Alert?", "type": "multiple", "options": [{"label": "A", "text": "A dashboard widget that visualises the alert metric so viewers can see the current value"}, {"label": "B", "text": "A Delta Live Tables pipeline that continuously refreshes the data used by the alert query"}, {"label": "C", "text": "A SQL query whose result is evaluated against the alert condition"}, {"label": "D", "text": "A Databricks cluster with a minimum of 4 worker nodes to ensure the alert query executes reliably"}, {"label": "E", "text": "A threshold condition that defines when the alert should trigger, such as when a value is greater than, less than, or equal to a specified number"}], "correct_answers": ["C", "E"], "explanation": "A SQL Alert is based on a query whose result is evaluated against a threshold condition. The query returns the value to monitor and the threshold condition defines the comparison logic that determines when the alert fires.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Delta Lake & Delta Tables", "question": "A data analyst needs to create a table in Unity Catalog by joining data from an existing Delta table and a CSV file that has been uploaded to a volume. Which SQL statement correctly creates a managed Delta table from this combined source?", "type": "single", "options": [{"label": "A", "text": "CREATE TABLE prod.sales.unified_customers AS SELECT d.customer_id, d.name, c.segment FROM prod.sales.customers d JOIN read_files('/Volumes/prod/sales/raw/segments.csv', format => 'csv', header => 'true') c ON d.customer_id = c.customer_id"}, {"label": "B", "text": "INSERT INTO prod.sales.unified_customers SELECT d.customer_id, d.name FROM prod.sales.customers d JOIN read_files('/Volumes/prod/sales/raw/segments.csv') c ON d.customer_id = c.customer_id"}, {"label": "C", "text": "CREATE EXTERNAL TABLE prod.sales.unified_customers USING CSV AS SELECT d.customer_id, d.name, c.segment FROM prod.sales.customers d JOIN '/Volumes/prod/sales/raw/segments.csv' c ON d.customer_id = c.customer_id"}, {"label": "D", "text": "CREATE TABLE prod.sales.unified_customers USING DELTA AS SELECT * FROM prod.sales.customers UNION ALL SELECT * FROM '/Volumes/prod/sales/raw/segments.csv'"}], "correct_answers": ["A"], "explanation": "CREATE TABLE AS SELECT creates a managed Delta table from a query result. read_files() reads the CSV from the Unity Catalog volume path and the JOIN combines it with the existing Delta table, persisting the result as a new managed table.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Databricks SQL & Warehouses", "question": "A data analyst needs to configure a Databricks SQL Alert that notifies the data engineering team when the count of failed pipeline runs in the last hour exceeds 3. Which configuration correctly implements this?", "type": "single", "options": [{"label": "A", "text": "Configure a SQL Warehouse auto-stop policy to pause the warehouse when more than 3 pipeline failures are detected, which automatically notifies the data engineering team through the warehouse event log"}, {"label": "B", "text": "Add a counter visualisation to a dashboard showing the failed run count and instruct the data engineering team to manually check the dashboard every hour"}, {"label": "C", "text": "Create a query that counts failed pipeline runs in the last hour, set the alert condition to Value > 3, configure the notification destination as the data engineering team's email or Slack channel, and set the alert schedule to run every hour"}, {"label": "D", "text": "Create a Delta Live Tables pipeline that monitors failed runs and triggers a Databricks Job to send an email when failures are detected, then link the job to a SQL Alert dashboard widget"}], "correct_answers": ["C"], "explanation": "A SQL Alert requires a query that returns the monitored value, a threshold condition defining when to trigger, a notification destination, and a schedule. The alert evaluates the query result on each scheduled run and notifies when the count exceeds 3.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that ranks sales representatives by their total revenue within each region, assigning rank 1 to the highest earner in each region. Which query correctly achieves this?", "type": "single", "options": [{"label": "A", "text": "SELECT rep_name, region, SUM(revenue) AS total_revenue, ROW_NUMBER() OVER (PARTITION BY region ORDER BY rep_name) AS revenue_rank FROM sales GROUP BY rep_name, region"}, {"label": "B", "text": "SELECT rep_name, region, SUM(revenue) AS total_revenue, RANK() OVER (ORDER BY SUM(revenue) DESC) AS revenue_rank FROM sales GROUP BY rep_name, region"}, {"label": "C", "text": "SELECT rep_name, region, SUM(revenue) AS total_revenue FROM sales GROUP BY rep_name, region ORDER BY region, total_revenue DESC"}, {"label": "D", "text": "SELECT rep_name, region, total_revenue, RANK() OVER (PARTITION BY region ORDER BY total_revenue DESC) AS revenue_rank FROM (SELECT rep_name, region, SUM(revenue) AS total_revenue FROM sales GROUP BY rep_name, region)"}], "correct_answers": ["D"], "explanation": "The subquery first aggregates total revenue per rep per region. The outer query applies RANK() with PARTITION BY region so ranking resets independently for each region, and ORDER BY total_revenue DESC assigns rank 1 to the highest earner in each region.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "SQL Basics & Syntax", "question": "Which of the following queries correctly uses a LEFT JOIN to return all products and their total sales amount, including products that have never been sold showing zero instead of NULL for the sales total?", "type": "single", "options": [{"label": "A", "text": "SELECT p.product_id, p.product_name, ISNULL(SUM(o.sale_amount), 0) AS total_sales FROM products p LEFT JOIN orders o ON p.product_id = o.product_id GROUP BY p.product_id, p.product_name"}, {"label": "B", "text": "SELECT p.product_id, p.product_name, COALESCE(SUM(o.sale_amount), 0) AS total_sales FROM products p LEFT JOIN orders o ON p.product_id = o.product_id GROUP BY p.product_id, p.product_name"}, {"label": "C", "text": "SELECT p.product_id, p.product_name, SUM(o.sale_amount) AS total_sales FROM products p LEFT JOIN orders o ON p.product_id = o.product_id GROUP BY p.product_id, p.product_name"}, {"label": "D", "text": "SELECT p.product_id, p.product_name, SUM(o.sale_amount) AS total_sales FROM products p INNER JOIN orders o ON p.product_id = o.product_id GROUP BY p.product_id, p.product_name"}], "correct_answers": ["B"], "explanation": "LEFT JOIN retains all products including those with no orders. SUM returns NULL for products with no matching rows, and COALESCE replaces NULL with 0, satisfying the requirement to show zero instead of NULL for unsold products.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe how permissions work for views in Unity Catalog?", "type": "multiple", "options": [{"label": "A", "text": "A user can be granted SELECT on a view without being granted SELECT on the underlying base tables, because the view executes with the owner's privileges when accessing the base tables"}, {"label": "B", "text": "A view in Unity Catalog must be recreated each time the underlying base table schema changes, as schema changes automatically invalidate the view definition"}, {"label": "C", "text": "Granting SELECT on a view automatically grants SELECT on all underlying base tables to the user so they can also query the base tables directly"}, {"label": "D", "text": "Dynamic views can use the current_user() function in a WHERE clause or CASE expression to return different rows or column values to different users based on their identity, implementing row-level and column-level security within a single view definition"}, {"label": "E", "text": "Views in Unity Catalog can only reference tables within the same schema and cannot join tables from different schemas or catalogs"}], "correct_answers": ["A", "D"], "explanation": "Unity Catalog implements owner-based access for views, so the querying user only needs SELECT on the view itself. Dynamic views support identity-based filtering and masking using current_user() and IS_MEMBER() for row and column level security.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe the capabilities of the Catalog Explorer in Databricks Unity Catalog?", "type": "multiple", "options": [{"label": "A", "text": "The Catalog Explorer automatically optimises Delta tables by running OPTIMIZE and VACUUM commands on a schedule configured through the interface"}, {"label": "B", "text": "The Catalog Explorer allows users to directly edit table data by clicking on cells in the data preview, similar to a spreadsheet interface"}, {"label": "C", "text": "The Catalog Explorer can be used to view the data lineage of a table, showing which upstream sources produced it and which downstream objects depend on it"}, {"label": "D", "text": "The Catalog Explorer replaces the need for SQL queries entirely by providing a drag-and-drop interface for building complex multi-table joins and aggregations"}, {"label": "E", "text": "The Catalog Explorer allows users to browse the three-level namespace hierarchy of catalogs, schemas, and tables, and view table schemas, sample data, and metadata without writing any SQL"}], "correct_answers": ["C", "E"], "explanation": "Catalog Explorer includes a lineage tab showing upstream sources and downstream consumers, and provides a visual interface for navigating the Unity Catalog namespace to inspect schemas, sample data, and metadata without writing SQL.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Databricks Workspace & Navigation", "question": "Which of the following correctly describes the purpose of the Databricks Assistant and which tasks it can help with in a notebook or SQL Editor?", "type": "single", "options": [{"label": "A", "text": "Databricks Assistant is a data governance tool that automatically applies Unity Catalog tags and access policies to tables based on an analysis of the data content"}, {"label": "B", "text": "Databricks Assistant is an AI-powered coding assistant that can generate SQL queries and Python code from natural language descriptions, explain existing code, help debug errors, and suggest optimisations, but it cannot execute code on the user's behalf"}, {"label": "C", "text": "Databricks Assistant replaces the need for SQL knowledge by automatically translating business questions into optimised queries without any input from the analyst beyond selecting the target table"}, {"label": "D", "text": "Databricks Assistant is a dashboard building tool that generates AI/BI Dashboard layouts and visualisation configurations from a description of the business metrics the analyst wants to display"}], "correct_answers": ["B"], "explanation": "Databricks Assistant is embedded in notebooks and the SQL Editor to help write, understand, and improve code using natural language commands like /generate, /explain, /fix, and /optimize. It generates and suggests code but does not autonomously execute it.", "is_one_word": false}, {"source": "Udemy Exam Practice 2", "theme": "Unity Catalog & Data Governance", "question": "A data analyst needs to understand which tables are downstream consumers of a specific Silver layer Delta table in their Medallion Architecture pipeline. Which feature in the Databricks workspace provides this information?", "type": "single", "options": [{"label": "A", "text": "The Query History in Databricks SQL, which can be filtered by table name to show all queries that have referenced the table"}, {"label": "B", "text": "The Delta table DESCRIBE HISTORY command, which lists all queries and transformations that have read from the table"}, {"label": "C", "text": "The Unity Catalog lineage graph in Catalog Explorer, which shows upstream sources and downstream consumers for a selected table including tables, dashboards, and notebooks that depend on it"}, {"label": "D", "text": "The SQL Warehouse event log, which records all table read and write operations with source and target table details"}], "correct_answers": ["C"], "explanation": "Unity Catalog automatically captures data lineage by analysing query execution. The lineage tab in Catalog Explorer displays a visual graph of upstream sources and downstream consumers for any registered table, enabling impact analysis.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "AI/BI Dashboards & Visualization", "question": "Which two statements correctly describe the Databricks AI/BI Genie space and how it differs from a standard AI/BI Dashboard?", "type": "multiple", "options": [{"label": "A", "text": "A Genie space and an AI/BI Dashboard are interchangeable and provide identical user experiences for exploring data"}, {"label": "B", "text": "A Genie space supports ongoing conversational context within a session, allowing users to ask follow-up questions that refine or extend a previous answer without starting from scratch"}, {"label": "C", "text": "A Genie space can only answer questions about a single table and does not support questions that require joining multiple tables"}, {"label": "D", "text": "A Genie space allows business users to ask natural language questions about data and receive answers generated dynamically by AI, without requiring the user to write SQL or know the underlying table structure"}, {"label": "E", "text": "A Genie space requires users to have the Databricks SQL Editor open alongside it to see the SQL generated for each question"}], "correct_answers": ["B", "D"], "explanation": "Genie maintains conversational context within a session so users can ask follow-up questions without restating context, and it provides a natural language interface that generates and executes SQL so no SQL knowledge is required.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Delta Lake & Delta Tables", "question": "Which two statements correctly describe how Liquid Clustering differs from traditional Hive-style partitioning in Delta Lake?", "type": "multiple", "options": [{"label": "A", "text": "Liquid Clustering provides stronger data isolation guarantees than Hive-style partitioning by preventing concurrent reads and writes to the same cluster"}, {"label": "B", "text": "Hive-style partitioning always outperforms Liquid Clustering for queries that filter on date columns because date partitions are more granular than file-level clustering"}, {"label": "C", "text": "Liquid Clustering requires Delta Live Tables pipelines and cannot be applied to tables created with standard CREATE TABLE SQL statements"}, {"label": "D", "text": "Liquid Clustering can be applied to any column regardless of cardinality, whereas Hive-style partitioning performs poorly on high-cardinality columns because it creates too many small partition directories"}, {"label": "E", "text": "Liquid Clustering allows the clustering columns to be changed after table creation without rewriting all the table data, whereas changing Hive-style partition columns requires recreating the entire table"}], "correct_answers": ["D", "E"], "explanation": "Liquid Clustering uses file-level data layout optimisation that works for both low and high cardinality columns without creating directories, and its clustering columns can be changed with ALTER TABLE CLUSTER BY without a full table rewrite.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Unity Catalog & Data Governance", "question": "An analyst notices that two different colleagues are getting different results when querying the same view in Unity Catalog. The view includes a WHERE clause that references IS_MEMBER(). What is the most likely explanation?", "type": "single", "options": [{"label": "A", "text": "The view implements row-level security using IS_MEMBER() to filter rows based on each querying user's group membership, intentionally returning different rows to users in different groups"}, {"label": "B", "text": "The view is referencing a cached result that expires at different times for different users, causing some users to see fresher data than others"}, {"label": "C", "text": "The view has a syntax error in the IS_MEMBER() function that causes unpredictable results for different users depending on their session configuration"}, {"label": "D", "text": "The SQL Warehouse is randomly assigning different query execution nodes to different users causing non-deterministic query results"}], "correct_answers": ["A"], "explanation": "IS_MEMBER() returns true or false based on the current user's group membership, so a dynamic view using it in a WHERE clause intentionally returns different row subsets to different users, which is the expected row-level security behaviour.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Delta Lake & Delta Tables", "question": "A data analyst needs to use Delta Lake time travel to compare the current state of a Delta table with its state from 7 days ago to identify which rows have been added since then. Which approach correctly achieves this?", "type": "single", "options": [{"label": "A", "text": "Run VACUUM orders RETAIN 168 HOURS to ensure 7 days of history is available, then use SELECT * FROM orders VERSION AS OF 0 to retrieve the original table state"}, {"label": "B", "text": "Run DESCRIBE HISTORY orders and manually inspect each version's timestamp to identify which version corresponds to 7 days ago, then write two separate queries and compare the results manually"}, {"label": "C", "text": "Use SELECT * FROM orders WHERE _commit_date >= date_sub(current_date(), 7) to filter rows committed in the last 7 days"}, {"label": "D", "text": "Run DESCRIBE HISTORY orders to find the version from 7 days ago, then use SELECT * FROM orders EXCEPT SELECT * FROM orders TIMESTAMP AS OF date_sub(current_date(), 7) to find new rows"}], "correct_answers": ["D"], "explanation": "EXCEPT returns rows in the current table that do not appear in the historical snapshot, and using TIMESTAMP AS OF with date_sub to reference the table state 7 days ago correctly identifies rows added since that point.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Unity Catalog & Data Governance", "question": "A table named transactions in Unity Catalog contains a column called card_number storing credit card numbers. The security team requires that analysts see only the last four digits of the card number with the rest masked. Which approach correctly implements this in Unity Catalog?", "type": "single", "options": [{"label": "A", "text": "Create a dynamic view that uses a CASE expression to return CONCAT('****-****-****-', RIGHT(card_number, 4)) for unauthorised users and the full card_number for authorised users, then grant analysts access to the view instead of the base table"}, {"label": "B", "text": "Run UPDATE transactions SET card_number = CONCAT('****-****-****-', RIGHT(card_number, 4)) to permanently mask the card numbers in the underlying table"}, {"label": "C", "text": "Grant analysts the MASKED privilege on the card_number column using GRANT MASKED ON COLUMN transactions.card_number TO analysts"}, {"label": "D", "text": "Add a column tag of PII to the card_number column in Catalog Explorer, which automatically masks the column for all users who do not have the PII tag permission"}], "correct_answers": ["A"], "explanation": "A dynamic view with a CASE expression referencing IS_MEMBER() or current_user() applies masking at query time without modifying underlying data, and granting access to the view instead of the base table enforces the policy.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "AI/BI Dashboards & Visualization", "question": "Which two actions are required to make a Genie space available to business users who are not workspace administrators?", "type": "multiple", "options": [{"label": "A", "text": "Configure a dedicated SQL Warehouse exclusively for the Genie space that no other workspace users can access"}, {"label": "B", "text": "Register the Genie space as a certified data product in Unity Catalog before it can be accessed by non-administrator users"}, {"label": "C", "text": "Add a minimum of ten trusted assets to the Genie space before it can be shared with business users"}, {"label": "D", "text": "Publish the Genie space and share it with specific users or groups by granting them CAN USE permission, or generate a shareable link for external access"}, {"label": "E", "text": "Curate at least one Unity Catalog dataset in the Genie space so users have data to query when they access the space"}], "correct_answers": ["D", "E"], "explanation": "Genie spaces must be explicitly shared with users by granting CAN USE permission (or a shareable link), and the space must have at least one curated Unity Catalog dataset so users have data to query.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns each department, the total salary for that department, and the overall company total salary in the same row. Which approach correctly adds the company total as a column alongside each department's total?", "type": "single", "options": [{"label": "A", "text": "SELECT department, SUM(salary) AS dept_total, (SELECT SUM(salary) FROM employees GROUP BY department) AS company_total FROM employees GROUP BY department"}, {"label": "B", "text": "SELECT department, SUM(salary) AS dept_total, MAX(SUM(salary)) OVER () AS company_total FROM employees GROUP BY department"}, {"label": "C", "text": "SELECT department, SUM(salary) AS dept_total FROM employees GROUP BY department UNION ALL SELECT 'TOTAL', SUM(salary) FROM employees"}, {"label": "D", "text": "SELECT department, SUM(salary) AS dept_total, SUM(SUM(salary)) OVER () AS company_total FROM employees GROUP BY department"}], "correct_answers": ["D"], "explanation": "GROUP BY department aggregates salary per department, and SUM(SUM(salary)) OVER () is a window function applied to the grouped aggregates that computes the grand total across all departments, producing both totals in the same row.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Databricks SQL & Warehouses", "question": "Which two statements correctly describe the capabilities and limitations of Databricks SQL Alerts?", "type": "multiple", "options": [{"label": "A", "text": "A SQL Alert can send notifications to multiple destinations simultaneously including email addresses, Slack channels, and webhook endpoints when the alert condition is triggered"}, {"label": "B", "text": "SQL Alerts require a dedicated always-on SQL Warehouse that cannot be shared with other queries to ensure reliable alert execution"}, {"label": "C", "text": "A SQL Alert evaluates its condition based on the result of a SQL query and triggers notifications when the query result meets the configured threshold condition such as a value being greater than, less than, or equal to a specified number"}, {"label": "D", "text": "A SQL Alert can directly modify data in a Delta table when triggered, such as automatically updating a status column to flag records that exceed the threshold"}, {"label": "E", "text": "A SQL Alert automatically pauses itself after triggering three consecutive times to prevent notification spam and requires manual reactivation"}], "correct_answers": ["A", "C"], "explanation": "SQL Alerts support multiple simultaneous notification destinations, and they evaluate a SQL query result against a configured threshold condition, firing notifications when the condition is met.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Query Optimization & Performance", "question": "A data analyst discovers that a query joining a large fact table with a small dimension table is running a sort-merge join in the Query Profiler. The dimension table has 5,000 rows. Which SQL hint correctly instructs the query engine to use a broadcast join instead?", "type": "single", "options": [{"label": "A", "text": "SELECT /*+ COALESCE(dim_product) */ f.order_id, p.product_name FROM fact_orders f JOIN dim_product p ON f.product_id = p.product_id"}, {"label": "B", "text": "SELECT /*+ MERGE(dim_product) */ f.order_id, p.product_name FROM fact_orders f JOIN dim_product p ON f.product_id = p.product_id"}, {"label": "C", "text": "SELECT /*+ SHUFFLE_HASH(dim_product) */ f.order_id, p.product_name FROM fact_orders f JOIN dim_product p ON f.product_id = p.product_id"}, {"label": "D", "text": "SELECT /*+ BROADCAST(dim_product) */ f.order_id, p.product_name FROM fact_orders f JOIN dim_product p ON f.product_id = p.product_id"}], "correct_answers": ["D"], "explanation": "The BROADCAST hint instructs the query engine to broadcast the specified table to all worker nodes, enabling a broadcast join that avoids the expensive shuffle of a sort-merge join. Small dimension tables are ideal candidates.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Databricks Workspace & Navigation", "question": "Which two statements correctly describe how the Databricks Data Intelligence Platform uses AI to improve the analyst experience?", "type": "multiple", "options": [{"label": "A", "text": "AI/BI Genie uses AI to interpret natural language questions from business users and generate the appropriate SQL queries against curated datasets, enabling self-service analytics without SQL knowledge"}, {"label": "B", "text": "The Catalog Explorer uses AI to automatically certify datasets based on their usage frequency and query performance, removing the need for human data stewards to review and certify data products"}, {"label": "C", "text": "Databricks Assistant uses AI to help analysts write, explain, fix, and optimise SQL queries and Python code through natural language commands within notebooks and the SQL Editor"}, {"label": "D", "text": "The Data Intelligence Engine uses AI to automatically rewrite analyst-submitted queries to a more efficient form and submits the rewritten version for execution without informing the analyst"}, {"label": "E", "text": "Databricks AI automatically creates Unity Catalog tables from unstructured data sources such as PDF documents and images without any configuration by the data engineer"}], "correct_answers": ["A", "C"], "explanation": "Genie translates plain language questions into SQL for self-service analytics, and Databricks Assistant provides in-workflow AI coding assistance to write, explain, fix, and optimise queries and code.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to find all customers who have never placed an order. The customers table has a customer_id column and the orders table also has a customer_id column. Which query correctly identifies customers with no orders?", "type": "single", "options": [{"label": "A", "text": "SELECT c.customer_id FROM customers c INNER JOIN orders o ON c.customer_id = o.customer_id WHERE o.customer_id IS NULL"}, {"label": "B", "text": "SELECT c.customer_id FROM customers c LEFT JOIN orders o ON c.customer_id = o.customer_id WHERE o.customer_id = 0"}, {"label": "C", "text": "SELECT customer_id FROM customers MINUS SELECT customer_id FROM orders"}, {"label": "D", "text": "SELECT c.customer_id FROM customers c LEFT JOIN orders o ON c.customer_id = o.customer_id WHERE o.customer_id IS NULL"}], "correct_answers": ["D"], "explanation": "LEFT JOIN returns all customers including those with no matching orders, where o.customer_id is NULL. Filtering WHERE o.customer_id IS NULL isolates exactly those customers who have no orders.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Databricks Workspace & Navigation", "question": "A data analyst wants to understand the data quality of a newly delivered dataset before using it for analysis. The analyst wants to see the count of null values, the number of distinct values, minimum and maximum values, and summary statistics for all columns in a single operation. Which Databricks feature most efficiently provides this information?", "type": "single", "options": [{"label": "A", "text": "Run SELECT COUNT(*) FROM table to check the row count, then write individual queries for each column to check nulls, distinct counts, min, and max values separately"}, {"label": "B", "text": "Run DESCRIBE TABLE table_name to retrieve all data quality metrics including null counts and value distributions for every column"}, {"label": "C", "text": "Use the data profile feature available in Databricks notebooks by clicking the data profile button after running a display() command, which automatically generates summary statistics, null counts, distinct value counts, and histograms for all columns"}, {"label": "D", "text": "Run ANALYZE TABLE table_name COMPUTE STATISTICS FOR ALL COLUMNS to generate data quality statistics and then query the system table to retrieve them"}], "correct_answers": ["C"], "explanation": "The Databricks notebook data profile feature generates a comprehensive column-by-column quality report in a single click after displaying a DataFrame, showing null counts, distinct counts, min, max, mean, and histograms without additional queries.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst is asked to produce a report showing only the top 10 percent of customers by total spend. The customer_spend table has columns customer_id and total_spend. Which query correctly returns the top 10 percent?", "type": "single", "options": [{"label": "A", "text": "WITH ranked AS (SELECT customer_id, total_spend, PERCENT_RANK() OVER (ORDER BY total_spend DESC) AS pct_rank FROM customer_spend) SELECT customer_id, total_spend FROM ranked WHERE pct_rank <= 0.1"}, {"label": "B", "text": "SELECT customer_id, total_spend FROM customer_spend WHERE total_spend >= PERCENTILE(total_spend, 0.9) OVER ()"}, {"label": "C", "text": "SELECT customer_id, total_spend FROM customer_spend WHERE PERCENT_RANK() OVER (ORDER BY total_spend DESC) <= 0.1"}, {"label": "D", "text": "SELECT customer_id, total_spend FROM customer_spend ORDER BY total_spend DESC LIMIT 10"}], "correct_answers": ["A"], "explanation": "The CTE calculates PERCENT_RANK() for each customer ordered by total_spend descending, returning values between 0 and 1 where 0 is highest. Filtering WHERE pct_rank <= 0.1 returns the top 10 percent.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to write a query that calculates a 3-month rolling average of monthly revenue. The monthly_revenue table has columns revenue_month of DateType and total_revenue. Which query correctly calculates this rolling average?", "type": "single", "options": [{"label": "A", "text": "SELECT revenue_month, AVG(total_revenue) OVER (ORDER BY revenue_month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS rolling_avg FROM monthly_revenue"}, {"label": "B", "text": "SELECT revenue_month, AVG(total_revenue) OVER (ORDER BY revenue_month ROWS BETWEEN 3 PRECEDING AND CURRENT ROW) AS rolling_avg FROM monthly_revenue"}, {"label": "C", "text": "SELECT revenue_month, SUM(total_revenue) / 3 AS rolling_avg FROM monthly_revenue GROUP BY revenue_month"}, {"label": "D", "text": "SELECT revenue_month, AVG(total_revenue) OVER (PARTITION BY revenue_month ORDER BY revenue_month) AS rolling_avg FROM monthly_revenue"}], "correct_answers": ["A"], "explanation": "AVG with ROWS BETWEEN 2 PRECEDING AND CURRENT ROW averages the current row and the two preceding rows, producing a 3-month rolling average ordered by revenue_month. No PARTITION BY is needed.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Data Ingestion & Streaming", "question": "An organisation needs to bring data into Databricks from an external REST API that delivers new records every hour as JSON payloads. The data must land in a Delta table and be available for analytics within minutes of each API response. Which approach is most appropriate?", "type": "single", "options": [{"label": "A", "text": "Use Auto Loader to monitor an S3 bucket where the API responses are written as JSON files by an intermediate process, ingesting new files into a Delta table incrementally as they arrive"}, {"label": "B", "text": "Use Delta Sharing to subscribe to the REST API as a shared data source, which Databricks manages and delivers to the target Delta table automatically"}, {"label": "C", "text": "Use Databricks SQL to run a scheduled COPY INTO query every hour that reads directly from the REST API endpoint URL"}, {"label": "D", "text": "Use Databricks Marketplace to subscribe to the REST API as a data product, which automatically delivers new records to a managed Delta table on an hourly schedule"}], "correct_answers": ["A"], "explanation": "A common pattern for REST API ingestion is to have API responses written to cloud storage by an intermediate service, then use Auto Loader to detect and ingest new JSON files into a Delta table incrementally with exactly-once processing.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst creates a dashboard and shares it with a colleague using the shareable link feature. The colleague reports that they see data from last week rather than today's data. What is the most likely cause?", "type": "single", "options": [{"label": "A", "text": "The colleague's browser is caching the old dashboard page and they need to clear their browser cache to see the latest data"}, {"label": "B", "text": "The dashboard does not have a scheduled refresh configured or the last scheduled refresh has not yet run since the new data was loaded, so the visualisations show results from the previous refresh execution"}, {"label": "C", "text": "The shareable link restricts the dashboard to a read-only snapshot mode that prevents live query execution for security reasons"}, {"label": "D", "text": "The shareable link creates a static snapshot of the dashboard at the time it was published and the data does not update until the link is regenerated"}], "correct_answers": ["B"], "explanation": "Databricks AI/BI Dashboards display results from the most recent query execution. Without a refresh schedule, or when the schedule runs less frequently than the data update cadence, the dashboard shows stale data from the last execution.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to write a query that returns the running total of daily sales, accumulating from the beginning of the year to each day. The daily_sales table has columns sale_date and daily_total. Which query correctly calculates this?", "type": "single", "options": [{"label": "A", "text": "SELECT sale_date, SUM(daily_total) OVER (PARTITION BY sale_date ORDER BY sale_date) AS running_total FROM daily_sales"}, {"label": "B", "text": "SELECT sale_date, daily_total + LAG(daily_total) OVER (ORDER BY sale_date) AS running_total FROM daily_sales"}, {"label": "C", "text": "SELECT sale_date, SUM(daily_total) OVER (ORDER BY sale_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total FROM daily_sales"}, {"label": "D", "text": "SELECT sale_date, SUM(daily_total) AS running_total FROM daily_sales GROUP BY sale_date"}], "correct_answers": ["C"], "explanation": "SUM with ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW accumulates all values from the first row up to and including the current row ordered by sale_date, producing the correct running year-to-date total.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst writes the following query but it returns an error: SELECT customer_id, order_date, SUM(order_value) FROM orders GROUP BY customer_id. What is the reason for the error?", "type": "single", "options": [{"label": "A", "text": "The query is missing an ORDER BY clause which is required whenever GROUP BY is used in Databricks SQL"}, {"label": "B", "text": "The order_date column appears in the SELECT list but is not included in the GROUP BY clause and is not wrapped in an aggregate function, which violates the SQL grouping rules"}, {"label": "C", "text": "SUM cannot be used with GROUP BY and should be replaced with COUNT to aggregate order values"}, {"label": "D", "text": "The customer_id column cannot appear in both the SELECT list and the GROUP BY clause simultaneously"}], "correct_answers": ["B"], "explanation": "In SQL every column in the SELECT list must either appear in the GROUP BY clause or be used inside an aggregate function. order_date is selected but not grouped or aggregated, causing an AnalysisException.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst needs to create a visualisation showing the distribution of customer ages across predefined age bands such as 18-25, 26-35, 36-50, and 51 plus. Which visualisation type is most appropriate?", "type": "single", "options": [{"label": "A", "text": "A counter widget displaying the total number of customers across all age bands as a single KPI number"}, {"label": "B", "text": "A bar chart with age band on the x-axis and count of customers on the y-axis, showing the number of customers in each discrete age group"}, {"label": "C", "text": "A scatter plot with customer_id on the x-axis and age on the y-axis showing individual customer ages"}, {"label": "D", "text": "A line chart with age on the x-axis and count of customers on the y-axis"}], "correct_answers": ["B"], "explanation": "A bar chart is the most appropriate visualisation for showing the count or frequency of observations across discrete categorical groups. Each bar represents an age band and its height shows the number of customers, making comparisons immediate.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Caching & Performance", "question": "A data analyst wants to query a Delta table and ensure the query always reflects the most recently committed data without any possibility of reading a stale cached result. What is the most reliable approach?", "type": "single", "options": [{"label": "A", "text": "Add a WHERE 1=1 condition to the query which forces the query engine to re-evaluate all rows rather than serving a cached result"}, {"label": "B", "text": "Use TIMESTAMP AS OF current_timestamp() in the query to ensure Delta Lake reads the current version of the table"}, {"label": "C", "text": "Refresh the dashboard or re-run the query after first running REFRESH TABLE table_name to force Databricks SQL to invalidate any cached metadata and result cache entries for the table"}, {"label": "D", "text": "Add OPTION (nocache) to the query to instruct the SQL Warehouse to bypass the result cache and execute directly against the Delta table"}], "correct_answers": ["C"], "explanation": "REFRESH TABLE instructs Databricks SQL to invalidate cached metadata and result cache entries for the table. After running it, the subsequent query re-executes against the current table state rather than serving a cached result.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Unity Catalog & Data Governance", "question": "What is the correct way to reference a Unity Catalog table in a Databricks SQL query using the full three-level namespace?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM catalog_name/schema_name/table_name"}, {"label": "B", "text": "SELECT * FROM [catalog_name].[schema_name].[table_name]"}, {"label": "C", "text": "SELECT * FROM catalog_name.schema_name.table_name"}, {"label": "D", "text": "SELECT * FROM catalog_name::schema_name::table_name"}], "correct_answers": ["C"], "explanation": "Unity Catalog uses dot notation to separate the three levels of the namespace. The fully qualified reference format is catalog.schema.table, allowing Databricks SQL to unambiguously identify the exact table.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to combine results from two queries. The first query returns sales from 2023 and the second returns sales from 2024. Some transactions appear in both years due to a data issue. The analyst wants to include all transactions from both years but return each unique transaction only once. Which set operation is correct?", "type": "single", "options": [{"label": "A", "text": "UNION, which combines both result sets and removes duplicate rows, returning each unique transaction once regardless of whether it appeared in one or both result sets"}, {"label": "B", "text": "UNION ALL, which combines both result sets and keeps all rows including duplicates from both years"}, {"label": "C", "text": "EXCEPT, which returns transactions from 2023 that do not appear in 2024, excluding the duplicates entirely"}, {"label": "D", "text": "INTERSECT, which returns only the transactions that appear in both the 2023 and 2024 result sets"}], "correct_answers": ["A"], "explanation": "UNION performs an implicit DISTINCT on the combined result, removing duplicate rows. Transactions appearing in both the 2023 and 2024 results appear only once, satisfying the requirement for unique transactions.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "AI/BI Dashboards & Visualization", "question": "An analyst creates the following query in Databricks SQL: SELECT order_year, order_month, SUM(revenue) AS monthly_revenue FROM orders GROUP BY order_year, order_month ORDER BY order_year, order_month. Which visualisation type and configuration most effectively communicates monthly revenue trends over multiple years?", "type": "single", "options": [{"label": "A", "text": "A scatter plot with order_year on the x-axis and monthly_revenue on the y-axis showing one point per month"}, {"label": "B", "text": "A line chart with order_month on the x-axis, monthly_revenue on the y-axis, and a separate line for each order_year, allowing direct year-over-year comparison of monthly trends"}, {"label": "C", "text": "A single bar chart with one bar per combination of order_year and order_month showing all periods as a continuous sequence"}, {"label": "D", "text": "A pie chart with one slice per month showing each month's share of total annual revenue"}], "correct_answers": ["B"], "explanation": "A multi-series line chart is the most effective visualisation for comparing monthly trends across multiple years. Each year is a separate line, making it easy to see seasonal patterns and year-over-year differences at the same monthly period.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Data Modeling & Architecture", "question": "Which two statements correctly describe the Databricks Lakehouse architecture and how it combines the benefits of data lakes and data warehouses?", "type": "multiple", "options": [{"label": "A", "text": "The Lakehouse architecture eliminates the need for separate ETL pipelines between a data lake and a data warehouse by enabling BI tools and ML workloads to operate directly on the same curated Delta tables using Unity Catalog for governance"}, {"label": "B", "text": "The Lakehouse architecture stores data in open file formats such as Parquet on cloud object storage, providing the low-cost scalable storage characteristic of data lakes while adding ACID transactions, schema enforcement, and query performance optimisations characteristic of data warehouses"}, {"label": "C", "text": "The Lakehouse architecture is specific to Databricks and cannot be implemented on other platforms or cloud providers"}, {"label": "D", "text": "The Lakehouse architecture provides stronger query performance guarantees than dedicated cloud data warehouses for all workload types regardless of data volume or query complexity"}, {"label": "E", "text": "The Lakehouse architecture requires all data to be loaded into a proprietary columnar storage format before it can be queried, similar to traditional data warehouse loading processes"}], "correct_answers": ["A", "B"], "explanation": "The Lakehouse lets BI tools query Delta tables directly, eliminating the duplicate copy and ETL overhead of two separate systems, and combines open-format cloud storage economics with data warehouse reliability features (ACID, schema enforcement, data skipping) via Delta Lake.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Unity Catalog & Data Governance", "question": "A database administrator needs to grant a service principal used by an automated pipeline full control over all objects within the silver schema of the main catalog, including the ability to create and drop tables. Which set of grants correctly achieves this with the minimum necessary privileges?", "type": "single", "options": [{"label": "A", "text": "GRANT USE CATALOG ON CATALOG main TO pipeline_sp; GRANT ALL PRIVILEGES ON SCHEMA main.silver TO pipeline_sp"}, {"label": "B", "text": "GRANT ALL PRIVILEGES ON CATALOG main TO pipeline_sp"}, {"label": "C", "text": "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA main.silver TO pipeline_sp"}, {"label": "D", "text": "GRANT CREATE ON SCHEMA main.silver TO pipeline_sp"}], "correct_answers": ["A"], "explanation": "USE CATALOG lets the service principal navigate the catalog, and ALL PRIVILEGES on the specific schema main.silver grants full control (CREATE, DROP, READ, WRITE) within that schema only, without exposing other schemas.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst is writing a complex multi-step SQL query and wants to improve readability by defining intermediate named result sets that can be referenced multiple times in the final query. Which SQL feature should the analyst use?", "type": "single", "options": [{"label": "A", "text": "Common Table Expressions (CTEs) defined with the WITH clause, which create named temporary result sets that can be referenced multiple times within the same query"}, {"label": "B", "text": "Materialised Views created with CREATE MATERIALIZED VIEW, which pre-compute and store intermediate results for reuse across queries"}, {"label": "C", "text": "Subqueries embedded inline within the FROM clause of each step that needs the intermediate result"}, {"label": "D", "text": "Temporary views created with CREATE TEMP VIEW, which persist for the duration of the session and can be referenced in subsequent queries"}], "correct_answers": ["A"], "explanation": "CTEs defined with the WITH keyword name intermediate result sets at the top of a query that can be referenced multiple times in the main query body, improving readability and avoiding repetition of subquery logic.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "Databricks SQL & Warehouses", "question": "A data analyst wants to monitor daily order volumes and receive an automatic notification if the number of orders on any given day falls below 100, which would indicate a potential data pipeline failure. Which Databricks feature correctly implements this monitoring requirement?", "type": "single", "options": [{"label": "A", "text": "Configure a SQL Warehouse auto-stop policy to trigger when daily order counts fall below 100, which sends an automatic notification to the analyst through the warehouse management interface"}, {"label": "B", "text": "Create an AI/BI Dashboard with a counter showing today's order count and instruct the analyst to check it every morning to see if the count is below 100"}, {"label": "C", "text": "Use Delta Lake DESCRIBE HISTORY to check whether any WRITE operations have occurred on the orders table today and send a manual notification if no writes are found"}, {"label": "D", "text": "Create a Databricks SQL Alert based on a query that counts today's orders, set the condition to Value < 100, and configure the notification destination to alert the analyst when the condition is met"}], "correct_answers": ["D"], "explanation": "A SQL Alert is the correct feature for threshold-based automated monitoring. The query calculates today's order count, the condition Value < 100 triggers when the count is too low, and the notification destination alerts the analyst automatically.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to return all orders along with the customer name for each order. Some orders may have a customer_id that does not match any record in the customers table due to data quality issues. The analyst wants to keep all orders in the result even when no matching customer exists. Which join type is correct?", "type": "single", "options": [{"label": "A", "text": "FULL OUTER JOIN, which returns all orders and all customers regardless of whether they match"}, {"label": "B", "text": "LEFT JOIN with orders as the left table, which returns all orders and NULL for customer columns where no matching customer exists"}, {"label": "C", "text": "RIGHT JOIN with customers as the right table, which returns all customers and their associated orders"}, {"label": "D", "text": "INNER JOIN, which returns only orders that have a matching customer_id in the customers table"}], "correct_answers": ["B"], "explanation": "LEFT JOIN returns all rows from the left table (orders) and matching rows from customers, filling customer columns with NULL where no match exists, satisfying the requirement to keep all orders.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst is building a report that needs to show the percentage contribution of each product category to total annual revenue. The sales table has columns category and revenue. Which query correctly calculates the percentage contribution for each category?", "type": "single", "options": [{"label": "A", "text": "SELECT category, SUM(revenue) * 100 AS pct_of_total FROM sales GROUP BY category"}, {"label": "B", "text": "SELECT category, SUM(revenue) / COUNT(*) * 100 AS pct_of_total FROM sales GROUP BY category"}, {"label": "C", "text": "SELECT category, revenue / SUM(revenue) OVER () * 100 AS pct_of_total FROM sales GROUP BY category"}, {"label": "D", "text": "SELECT category, SUM(revenue) / SUM(SUM(revenue)) OVER () * 100 AS pct_of_total FROM sales GROUP BY category"}], "correct_answers": ["D"], "explanation": "SUM(revenue) in the GROUP BY calculates each category's total, and SUM(SUM(revenue)) OVER () is a window function that computes the grand total across all categories. Dividing the category total by the grand total and multiplying by 100 gives the percentage contribution.", "is_one_word": false}, {"source": "Udemy Exam Practice 3", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to create a new schema called reporting within an existing catalog named analytics in Unity Catalog. Which SQL statement correctly creates this schema?", "type": "single", "options": [{"label": "A", "text": "CREATE SCHEMA reporting UNDER analytics"}, {"label": "B", "text": "USE CATALOG analytics; CREATE SCHEMA reporting"}, {"label": "C", "text": "CREATE DATABAS
