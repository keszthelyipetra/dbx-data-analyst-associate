 using column masks or view-based column omission. Both are implemented through SQL-based governance features and apply at query time without modifying the underlying stored data.", "syntax": "CREATE VIEW v AS SELECT * FROM t\nWHERE current_user() = owner_column OR IS_MEMBER('admins');"}, {"category": "Securing Data", "term": "Unity Catalog vs Legacy Hive Metastore", "definition": "Unity Catalog improves on the legacy Hive metastore in two key ways. First, it centralises governance across workspaces at the account level rather than managing permissions locally in each workspace. Second, it enables fine-grained security including column masking and row filters that were not natively available in the Hive metastore.", "syntax": null}, {"category": "Securing Data", "term": "Row-Level Security with IS_MEMBER()", "definition": "Dynamic views using IS_MEMBER() or current_user() in WHERE clauses intentionally return different results to different users based on their identity or group membership. This is the correct and expected behaviour for row-level security implementations in Unity Catalog. Analysts seeing different results from the same view is a sign that the security policy is working as designed.", "syntax": "CREATE VIEW v AS SELECT * FROM t WHERE IS_MEMBER('group_name')"}, {"category": "Securing Data", "term": "Column Masking with Dynamic Views", "definition": "Column-level security in Unity Catalog is implemented through dynamic views with identity-based CASE expressions or through column mask policies. The dynamic view approach transforms sensitive column values at query time based on the querying user's identity or group membership. The original data is preserved in the base table and authorised users can still access unmasked values through appropriate permissions.", "syntax": "CASE WHEN is_member('auth') THEN card_number ELSE CONCAT('****-****-****-', RIGHT(card_number,4)) END"}, {"category": "Securing Data", "term": "Row-Level Security with Dynamic Views", "definition": "Row-level security in Unity Catalog is implemented using dynamic views that reference user identity functions such as current_user() or IS_MEMBER() in the WHERE clause. By granting users access to the view instead of the base table, each user sees only the rows they are permitted to access based on their identity or group membership.", "syntax": "CREATE VIEW sales_secure AS SELECT * FROM sales WHERE region = current_user();"}, {"category": "Securing Data", "term": "Granting Access to Current and Future Tables", "definition": "To grant read access to all current and future tables in a schema, USE CATALOG and USE SCHEMA grants allow namespace navigation, while ALTER DEFAULT PRIVILEGES ensures the SELECT grant automatically applies to new tables as they are created. Using GRANT SELECT ON ALL TABLES alone only covers tables existing at grant time and misses future additions. There is no single READ privilege.", "syntax": "GRANT USE CATALOG ON CATALOG main TO analyst_group;\nGRANT USE SCHEMA ON SCHEMA main.silver TO analyst_group;\nALTER DEFAULT PRIVILEGES IN SCHEMA main.silver GRANT SELECT ON TABLES TO analyst_group;"}, {"category": "Securing Data", "term": "Unity Catalog view permissions", "definition": "Two key view permission behaviours in Unity Catalog are owner-based privilege execution and dynamic identity-based access control. Owner-based execution lets a user query a view with only SELECT on the view (plus USE grants) without needing access to the underlying base tables, since the view runs with the owner's privileges. Dynamic views use current_user() and IS_MEMBER() to implement row-level and column-level security within a single view definition.", "syntax": null}, {"category": "Securing Data", "term": "Schema-level full control grants", "definition": "Granting a principal full control over a schema in Unity Catalog requires USE CATALOG to enable catalog navigation plus ALL PRIVILEGES on the specific schema for complete object control (CREATE, DROP, READ, WRITE). Scoping the grant to that schema rather than the whole catalog or metastore follows the principle of least privilege.", "syntax": "GRANT USE CATALOG ON CATALOG main TO pipeline_sp; GRANT ALL PRIVILEGES ON SCHEMA main.silver TO pipeline_sp;"}, {"category": "Securing Data", "term": "Deny-by-default access on new tables", "definition": "Unity Catalog follows a deny-by-default access model, so creating a table does not automatically grant other users access to it. The table creator is the owner and has access, but other users (and even other sessions of the same user in some configurations) need explicit SELECT on the table plus USE CATALOG on the catalog and USE SCHEMA on the schema to query it.", "syntax": null}, {"category": "Securing Data", "term": "GRANT SELECT ON TABLE for query access", "definition": "When a group already has USE CATALOG and USE SCHEMA grants, the only additional privilege needed for read-only query access is SELECT on the specific table. Granting SELECT on the schema does not cascade to individual tables, and ALL PRIVILEGES would exceed the requirement, so GRANT SELECT ON TABLE follows the principle of least privilege.", "syntax": "GRANT SELECT ON TABLE prod.silver.new_table TO reporting_analysts;"}, {"category": "Securing Data", "term": "Unity Catalog cluster access modes", "definition": "Unity Catalog access from notebooks requires the cluster to be configured with a compatible access mode. Clusters must use Single User access mode (dedicated to one user) or Shared access mode (multi-user with Unity Catalog enforcement) to access Unity Catalog governed tables. Clusters in No Isolation Shared mode or legacy access modes do not support Unity Catalog permissions and produce access errors even when the user has the correct grants.", "syntax": null}, {"category": "Securing Data", "term": "GRANT on Table vs ALL TABLES IN SCHEMA", "definition": "Table-level grants cover a single specific object. Schema-level ALL TABLES grants cover all tables existing at grant time but not future tables. Understanding this distinction is critical for permission management in Unity Catalog. Use ALTER DEFAULT PRIVILEGES to ensure future tables are automatically covered, and always combine with USE CATALOG and USE SCHEMA grants for complete access.", "syntax": "GRANT SELECT ON ALL TABLES IN SCHEMA prod.silver TO analyst_group"}, {"category": "Securing Data", "term": "Minimum Privileges for Table Creation", "definition": "Granting the ability to create new tables within a specific schema requires three grants following the Unity Catalog hierarchy: USE CATALOG on the catalog, USE SCHEMA on the schema, and CREATE TABLE on the schema. This combination allows object creation within the specified schema without granting modify or delete privileges on existing objects owned by other users, satisfying the principle of least privilege.", "syntax": "GRANT USE CATALOG ON CATALOG dev TO g; GRANT USE SCHEMA ON SCHEMA dev.experiments TO g; GRANT CREATE TABLE ON SCHEMA dev.experiments TO g"}, {"category": "Securing Data", "term": "Column-level security in Unity Catalog", "definition": "Unity Catalog supports column-level security through two complementary mechanisms. Column mask policies applied with ALTER TABLE provide declarative access control the platform enforces automatically, while dynamic views with CASE-based masking provide a SQL-first approach using view definitions. Both evaluate user identity at query time and return masked or original values without modifying the stored data.", "syntax": "ALTER TABLE t ALTER COLUMN c SET MASK mask_func"}, {"category": "Securing Data", "term": "Dynamic views for context-aware masking", "definition": "Row-level and context-aware column masking in Unity Catalog is implemented using dynamic views that evaluate the current user's identity or group membership. The view applies a CASE expression using IS_MEMBER() or current_user() to return masked or real values, and users are granted access to the view instead of the base table so the restriction is always enforced transparently.", "syntax": null}, {"category": "Securing Data", "term": "Unity Catalog system.access audit logs", "definition": "Unity Catalog system.access audit logs provide a comprehensive queryable audit trail of data access and governance events. They capture who accessed which tables, when permissions were granted or revoked, and when data modifications occurred. Stored as queryable Delta tables, they are essential for regulatory compliance, security investigations, and governance reporting.", "syntax": null}, {"category": "Securing Data", "term": "Unity Catalog explicit non-cascading grants", "definition": "Unity Catalog uses an explicit non-cascading grant model. Grants do not automatically propagate down the hierarchy from catalog to schema to table; all three levels must be explicitly granted for a user to query a table. Conversely, revoking a higher-level privilege such as USE CATALOG effectively blocks all access to lower-level objects even if lower-level grants remain. This explicit model enables precise least-privilege access control.", "syntax": null}, {"category": "Securing Data", "term": "Unity Catalog Certification Tags", "definition": "Unity Catalog conveys certification status through system-controlled tags, so setting the tag 'system.certification_status' to 'deprecated' is recognized by the Databricks UI and tools as the official deprecated flag. A generic tag lacks the system namespace, a comment is not a status flag, and TBLPROPERTIES is not the certification-tag mechanism.", "syntax": "ALTER TABLE sales_data SET TAGS ('system.certification_status' = 'deprecated');"}, {"category": "Securing Data", "term": "Query Scheduling in the Query Editor", "definition": "Any saved query in Databricks SQL can be given a refresh schedule directly from the Query Editor, independent of whether it is used in a dashboard or alert.", "syntax": null}, {"category": "Securing Data", "term": "Setting session catalog and schema (USE CATALOG / USE SCHEMA)", "definition": "Unqualified table names resolve against the session's current catalog and schema. Running USE CATALOG and USE SCHEMA sets those defaults for the session only, so unqualified queries resolve correctly without rewriting them or changing workspace settings. Spark-config options do not apply to a SQL Warehouse session this way.", "syntax": "USE CATALOG corp_data; USE SCHEMA reporting;"}, {"category": "Securing Data", "term": "GRANT SELECT (read-only access)", "definition": "GRANT SELECT provides read-only access to a table, the least privilege needed for reporting. MODIFY allows writes, ALL PRIVILEGES is excessive, and OWNERSHIP transfers control of the object.", "syntax": "GRANT SELECT ON TABLE sales TO report_group;"}, {"category": "Securing Data", "term": "Handling unauthorized PII access", "definition": "When an analyst finds PII they shouldn't have access to, the correct response is to stop working with the data and escalate to a supervisor so it is handled according to company policy and the law. Deleting data or quietly working around it bypasses proper governance.", "syntax": null}, {"category": "Securing Data", "term": "Refresh schedules", "definition": "A refresh schedule automatically re-runs a query on an interval and is distinct from an alert. Regular users can configure refresh schedules on their own queries (admin privileges are not required), and a scheduled refresh consumes a SQL Warehouse when it runs. Schedules can be set up in the Query Editor.", "syntax": null}, {"category": "Securing Data", "term": "Workspace search tag: operator", "definition": "The Databricks workspace search bar supports the tag: operator, so tag:confidential finds all assets carrying that tag key. Boolean forms like confidential:true aren't evaluated as tag filters, and hyphen or equals-sign forms aren't valid search syntax.", "syntax": null}, {"category": "Securing Data", "term": "Dynamic Views with IS_MEMBER()", "definition": "Dynamic views use IS_MEMBER() to evaluate the caller's group membership at query time, exposing non-PII columns to unprivileged users while the base table retains full PII. This centralizes governance in Unity Catalog rather than destroying source data or over-granting access.", "syntax": "CREATE VIEW v AS SELECT CASE WHEN is_member('admins') THEN pii ELSE 'REDACTED' END FROM t;"}, {"category": "Securing Data", "term": "CREATE SCHEMA with LOCATION", "definition": "When CREATE SCHEMA includes an explicit LOCATION clause, the database directory is created at exactly that path with no appended schema name or .db extension. The default Hive warehouse path only applies when no LOCATION is specified.", "syntax": "CREATE SCHEMA accounting LOCATION 'dbfs:/accounting/data';"}, {"category": "Securing Data", "term": "Data Explorer (Catalog Explorer)", "definition": "Data Explorer is a Databricks SQL UI for data discovery and governance, letting users inspect metadata and data and view or change permissions. Running updates, building dashboards, and BI connections are handled by other tools.", "syntax": null}, {"category": "Securing Data", "term": "Filtering rows with a view (WHERE clause)", "definition": "To exclude specific erroneous values in a view, use a WHERE predicate that removes exactly those rows while keeping all others via SELECT *. HAVING without grouping is invalid, and overly broad predicates can drop valid edge cases.", "syntax": "CREATE VIEW clean_sales_data AS SELECT * FROM sales_data WHERE order_quantity != -1;"}];

</script>

// ── DATA ────────────────────────────────────────────────────────────────────
let Q = [];
let DEFS = [];
let META = { count: 0, themeCount: 0, updated: '' };

function getCorrectTexts(q) {
  return q.correct_answers.map(l => {
    const o = q.options.find(x => x.label === l);
    return o ? o.text : l;
  });
}
// "Self-assessment" questions have meaningless Yes/No confirmation options
// ("Yes, I Understood" / "No, I Don't"). They are excluded from Exam Mode and
// shown in Study Mode with their explanation as the answer instead.
function isSelfAssessment(q) {
  if (!q.options || q.options.length < 2) return false;
  const texts = q.options.map(o => o.text.trim().toLowerCase());
  return texts.includes("no, i don't") && texts.includes('yes, i understood');
}
function examEligible() { return Q.filter(q => !isSelfAssessment(q)); }

// ── STATE ─────────────────────────────────────────────────────────────────────
const S = {
  screen: 'home',
  exam: { pool: [], idx: 0, sel: [], answers: [], submitted: false, score: 0, start: 0, elapsed: 0 },
  study: { theme: 'all' },
  reviewFilter: 'all',
};

// ── UTILS ─────────────────────────────────────────────────────────────────────
function shuffle(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function fmtTime(ms) { const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── NAV ───────────────────────────────────────────────────────────────────────
function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }
function startExam() {
  const eligible = examEligible();
  S.exam = { pool: shuffle(eligible).slice(0, Math.min(45, eligible.length)), idx: 0, sel: [], answers: [], submitted: false, score: 0, start: Date.now(), elapsed: 0 };
  go('exam');
}
function startStudy() { S.study.theme = 'all'; S.study.tab = 'definitions'; go('study'); }

// ── RENDER ────────────────────────────────────────────────────────────────────
const app = document.getElementById('app');
function render() {
  const screens = { home: renderHome, exam: renderExam, results: renderResults, review: renderReview, study: renderStudy };
  app.innerHTML = (screens[S.screen] || renderHome)();
}
function navBar(title, back) {
  return `<nav class="nav">
    <div class="nav-brand" data-action="${back}">
      ${abylonLogo(26)}
      <span class="nav-title">${esc(title)}</span>
    </div>
    <button class="btn btn-ghost btn-sm" data-action="go:home">Home</button>
  </nav>`;
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function renderHome() {
  return `<div class="screen anim-fade">
    <div class="home-hero">
      <div class="home-logo-big">
        ${abylonLogo(56)}
      </div>
      <h1 class="home-title">Databricks Data Analyst Associate<br><span class="hl">Exam Preparation</span></h1>
      <div class="home-stats">
        <div class="home-stat"><div class="home-stat-val">${META.count}</div><div class="home-stat-lbl">Questions</div></div>
        <div class="home-stat"><div class="home-stat-val">${DEFS.length}</div><div class="home-stat-lbl">Definitions</div></div>
        <div class="home-stat"><div class="home-stat-val">${META.themeCount}</div><div class="home-stat-lbl">Themes</div></div>
        <div class="home-stat"><div class="home-stat-val" style="font-size:1rem;padding-top:6px">${esc(META.updated || '—')}</div><div class="home-stat-lbl">Last Updated</div></div>
      </div>
    </div>

    <div class="mode-grid mode-grid-2">
      <div class="mode-card" data-action="startExam">
        <span class="mode-icon">🎯</span>
        <div class="mode-name">Exam Mode</div>
        <div class="mode-desc">45 random questions simulating the real exam. Score, review, and improve.</div>
        <div class="mode-pill">45 Questions</div>
      </div>
      <div class="mode-card" data-action="startStudy">
        <span class="mode-icon">📚</span>
        <div class="mode-name">Study Mode</div>
        <div class="mode-desc">Browse questions by theme and ${DEFS.length} definitions across the 9 exam topics.</div>
        <div class="mode-pill">${META.themeCount} Themes</div>
      </div>
    </div>
  </div>`;
}

// ── EXAM ──────────────────────────────────────────────────────────────────────
function renderExam() {
  const e = S.exam, q = e.pool[e.idx];
  const pct = ((e.idx) / e.pool.length * 100).toFixed(1);
  const optHtml = q.options.map(opt => {
    const sel = e.sel.includes(opt.label);
    const isCorrect = e.submitted && q.correct_answers.includes(opt.label);
    const isWrong = e.submitted && sel && !q.correct_answers.includes(opt.label);
    let cls = 'opt';
    if (!e.submitted && sel) cls += ' opt-selected';
    if (e.submitted && isCorrect) cls += ' opt-correct';
    if (e.submitted && isWrong) cls += ' opt-wrong';
    if (e.submitted) cls += ' opt-disabled';
    const action = e.submitted ? '' : `data-opt="${esc(opt.label)}"`;
    return `<div class="${cls}" ${action}><div class="opt-key">${esc(opt.label)}</div><div class="opt-text">${esc(opt.text)}</div></div>`;
  }).join('');
  let feedback = '';
  if (e.submitted) {
    const last = e.answers[e.answers.length - 1];
    const ok = last?.isCorrect;
    const correctTxt = getCorrectTexts(q).join(', ');
    feedback = `<div class="feedback ${ok ? 'feedback-ok' : 'feedback-bad'}">
      <strong>${ok ? '✓ Correct!' : '✗ Incorrect'}</strong>
      ${!ok ? `<br>Correct: <em>${esc(correctTxt)}</em>` : ''}
      ${q.explanation ? `<br><br>${esc(q.explanation)}` : ''}
    </div>`;
  }
  const canSubmit = e.sel.length > 0 && !e.submitted;
  const isLast = e.idx === e.pool.length - 1;
  return `<div class="screen anim-fade">
    ${navBar('Exam Mode', 'go:home')}
    <div class="exam-meta">
      <span class="q-counter">Question ${e.idx + 1} of ${e.pool.length}</span>
      <span class="score-chip">✓ ${e.score} / ${e.answers.length}</span>
    </div>
    <div class="progress-bar mb-4"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-card">
      <div class="badge badge-accent mb-3">${esc(q.theme)}</div>
      <div class="q-text">${esc(q.question)}</div>
      ${q.type === 'multiple' ? '<div class="q-hint">Select all that apply</div>' : ''}
    </div>
    <div class="opts mb-4">${optHtml}</div>
    ${feedback}
    <div class="exam-footer">
      ${!e.submitted ? `<button class="btn btn-primary" data-action="submitAnswer" ${canSubmit ? '' : 'disabled'}>Submit Answer</button>` : ''}
      ${e.submitted && !isLast ? `<button class="btn btn-primary" data-action="nextQ">Next →</button>` : ''}
      ${e.submitted && isLast ? `<button class="btn btn-primary" data-action="finishExam">See Results 🎉</button>` : ''}
    </div>
  </div>`;
}
function toggleOpt(label) {
  const e = S.exam, q = e.pool[e.idx];
  if (q.type === 'multiple') e.sel = e.sel.includes(label) ? e.sel.filter(l => l !== label) : [...e.sel, label];
  else e.sel = [label];
  render();
}
function submitAnswer() {
  const e = S.exam, q = e.pool[e.idx];
  const isCorrect = [...e.sel].sort().join(',') === [...q.correct_answers].sort().join(',');
  if (isCorrect) e.score++;
  e.answers.push({ q, selected: [...e.sel], isCorrect });
  e.submitted = true;
  render();
}
function nextQ() { S.exam.idx++; S.exam.submitted = false; S.exam.sel = []; render(); }
function finishExam() { S.exam.elapsed = Date.now() - S.exam.start; go('results'); }

// ── RESULTS ───────────────────────────────────────────────────────────────────
function renderResults() {
  const e = S.exam, total = e.pool.length, pct = Math.round(e.score / total * 100), passed = pct >= 70;
  const ring = passed ? 'var(--green)' : 'var(--accent)';
  return `<div class="screen anim-fade">
    ${navBar('Results', 'go:home')}
    <div class="results-hero">
      <h2>${passed ? '🎉 Passed!' : '📊 Results'}</h2>
      <div class="score-ring anim-pop" style="border-color:${ring}"><div class="score-big" style="color:${ring}">${e.score}</div><div class="score-denom">of ${total}</div></div>
      <p style="font-size:1.1rem;color:${passed?'var(--green-txt)':'var(--red-txt)'};font-weight:700">${pct}% — ${passed ? 'Above the 70% pass mark!' : 'Below the 70% pass mark'}</p>
    </div>
    <div class="stats-3">
      <div class="stat-box"><div class="stat-val" style="color:var(--green-txt)">${e.score}</div><div class="stat-lbl">Correct</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--red-txt)">${total - e.score}</div><div class="stat-lbl">Wrong</div></div>
      <div class="stat-box"><div class="stat-val">${fmtTime(e.elapsed)}</div><div class="stat-lbl">Time</div></div>
    </div>
    <div class="flex gap-3 mt-4 flex-wrap">
      <button class="btn btn-secondary flex-1" data-action="reviewAll">📋 Review All Answers</button>
      <button class="btn btn-secondary flex-1" data-action="reviewWrong">❌ Review Wrong Only</button>
    </div>
    <div class="flex gap-3 mt-3">
      <button class="btn btn-primary flex-1" data-action="startExam">🔄 New Exam</button>
      <button class="btn btn-ghost flex-1" data-action="go:home">🏠 Home</button>
    </div>
  </div>`;
}

// ── REVIEW ────────────────────────────────────────────────────────────────────
function renderReview() {
  const filter = S.reviewFilter;
  const ans = filter === 'wrong' ? S.exam.answers.filter(a => !a.isCorrect) : S.exam.answers;
  if (ans.length === 0) {
    return `<div class="screen anim-fade">${navBar(filter === 'wrong' ? 'Wrong Answers' : 'All Answers', 'go:results')}
      <div class="empty"><div class="empty-icon">🎯</div><h2>Perfect Score!</h2><p class="text-muted mt-3">No wrong answers to show.</p><button class="btn btn-primary mt-4" data-action="go:results">← Back</button></div></div>`;
  }
  const byTheme = {};
  ans.forEach(a => { const t = a.q.theme || 'General'; (byTheme[t] = byTheme[t] || []).push(a); });
  const sections = Object.entries(byTheme).map(([theme, items]) => {
    const cards = items.map(a => {
      const q = a.q;
      const optHtml = q.options.map(opt => {
        const isC = q.correct_answers.includes(opt.label);
        const isSW = a.selected.includes(opt.label) && !isC;
        const cls = isC ? 'rv-opt rv-correct' : isSW ? 'rv-opt rv-selected-wrong' : 'rv-opt rv-neutral';
        const icon = isC ? '✓ ' : isSW ? '✗ ' : '   ';
        return `<div class="${cls}">${icon}<strong>${esc(opt.label)}.</strong> ${esc(opt.text)}</div>`;
      }).join('');
      return `<div class="review-q ${a.isCorrect ? 'rv-right' : 'rv-wrong'}">
        <div class="badge ${a.isCorrect ? 'badge-green' : 'badge-accent'} mb-3">${a.isCorrect ? '✓ Correct' : '✗ Wrong'}</div>
        <div class="q-text mb-3">${esc(q.question)}</div>
        <div class="rv-opts">${optHtml}</div>
        ${q.explanation ? `<div class="rv-expl"><strong style="color:var(--text2);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em">Explanation</strong><br>${esc(q.explanation)}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="theme-section"><div class="theme-hdr"><h3>${esc(theme)}</h3><span class="theme-count">${items.length}</span></div>${cards}</div>`;
  }).join('');
  return `<div class="screen anim-fade">
    ${navBar(filter === 'wrong' ? `Wrong Answers (${ans.length})` : `All Answers (${ans.length})`, 'go:results')}
    <div class="flex gap-2 mb-4">
      <button class="btn btn-sm ${filter === 'all' ? 'btn-primary' : 'btn-secondary'}" data-action="reviewAll">All</button>
      <button class="btn btn-sm ${filter === 'wrong' ? 'btn-primary' : 'btn-secondary'}" data-action="reviewWrong">Wrong Only</button>
    </div>
    ${sections}
    <div class="flex gap-3 mt-4"><button class="btn btn-secondary flex-1" data-action="go:results">← Results</button><button class="btn btn-primary flex-1" data-action="startExam">New Exam</button></div>
  </div>`;
}

// ── STUDY ─────────────────────────────────────────────────────────────────────
function studySeg(tab) {
  return `<div class="study-seg">
    <button class="seg-btn ${tab==='definitions'?'active':''}" data-studytab="definitions">📖 Definitions</button>
    <button class="seg-btn ${tab==='questions'?'active':''}" data-studytab="questions">❓ Questions</button>
  </div>`;
}

function renderStudy() {
  const tab = S.study.tab || 'definitions';
  return tab === 'questions' ? renderStudyQuestions() : renderStudyDefinitions();
}

function renderStudyQuestions() {
  const s = S.study;
  const themeCounts = {};
  Q.forEach(q => { themeCounts[q.theme] = (themeCounts[q.theme]||0)+1; });
  const themes = Object.keys(themeCounts).sort();
  const filtered = s.theme === 'all' ? Q : Q.filter(q => q.theme === s.theme);
  const tabs = `<button class="theme-btn ${s.theme==='all'?'active':''}" data-theme="all">All Topics <span class="tc">${Q.length}</span></button>` +
    themes.map(t => `<button class="theme-btn ${s.theme===t?'active':''}" data-theme="${esc(t)}">${esc(t)} <span class="tc">${themeCounts[t]}</span></button>`).join('');
  const qCards = filtered.map(q => {
    // Self-assessment questions: the option ("Yes, I Understood") is meaningless,
    // so present the explanation itself as the explained answer.
    if (isSelfAssessment(q)) {
      return `<div class="study-q">
        <div class="badge badge-accent mb-3">${esc(q.theme)}</div>
        <div class="study-q-text">${esc(q.question)}</div>
        <div class="study-lbl">Answer</div>
        <div class="study-answer">${esc(q.explanation || 'See explanation.')}</div>
      </div>`;
    }
    const ansHtml = q.correct_answers.map(l => { const o = q.options.find(x => x.label === l); return `<strong>${esc(l)}.</strong> ${esc(o ? o.text : l)}`; }).join('<br>');
    return `<div class="study-q">
      <div class="badge badge-accent mb-3">${esc(q.theme)}</div>
      <div class="study-q-text">${esc(q.question)}</div>
      <div class="study-lbl">Correct Answer</div>
      <div class="study-answer">${ansHtml}</div>
      ${q.explanation ? `<div class="study-lbl">Explanation</div><div class="study-expl">${esc(q.explanation)}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="screen screen-wide anim-fade">
    ${navBar('Study Mode', 'go:home')}
    ${studySeg('questions')}
    <div class="study-wrap">
      <div class="study-sidebar">
        <div class="card card-sm" style="padding:14px">
          <div class="sidebar-hdr">THEMES</div>
          ${tabs}
        </div>
      </div>
      <div class="study-main">
        <p class="text-muted text-sm mb-4">Showing <strong style="color:var(--text)">${filtered.length}</strong> question${filtered.length!==1?'s':''} ${s.theme!=='all'?`in <strong style="color:var(--accent)">${esc(s.theme)}</strong>`:'across all themes'}</p>
        ${qCards || '<div class="empty"><div class="empty-icon">📭</div><p>No questions in this theme.</p></div>'}
      </div>
    </div>
  </div>`;
}

function renderStudyDefinitions() {
  const s = S.study;
  if (!DEFS.length) {
    return `<div class="screen screen-wide anim-fade">
      ${navBar('Study Mode', 'go:home')}
      ${studySeg('definitions')}
      <div class="empty"><div class="empty-icon">📖</div><h2>No definitions found</h2>
      <p class="text-muted mt-3">Add terms to <code>definitions.json</code> and reload.</p></div>
    </div>`;
  }
  // Preserve category order as first seen in the file
  const cats = [];
  const byCat = {};
  DEFS.forEach(d => {
    const c = d.category || 'Other';
    if (!byCat[c]) { byCat[c] = []; cats.push(c); }
    byCat[c].push(d);
  });
  const active = s.defCat && cats.includes(s.defCat) ? s.defCat : 'all';
  const shownCats = active === 'all' ? cats : [active];

  const nav = `<button class="theme-btn ${active==='all'?'active':''}" data-defcat="all">All Definitions <span class="tc">${DEFS.length}</span></button>` +
    cats.map(c => `<button class="theme-btn ${active===c?'active':''}" data-defcat="${esc(c)}">${esc(c)} <span class="tc">${byCat[c].length}</span></button>`).join('');

  const sections = shownCats.map(c => {
    const cards = byCat[c].map(d => `
      <div class="def-card">
        <div class="def-term">${esc(d.term)}</div>
        <div class="def-def">${esc(d.definition)}</div>
        ${d.syntax ? `<pre class="def-syntax"><code>${esc(d.syntax)}</code></pre>` : ''}
      </div>`).join('');
    return `<div class="def-section">
      <div class="theme-hdr"><h3>${esc(c)}</h3><span class="theme-count">${byCat[c].length}</span></div>
      <div class="def-grid">${cards}</div>
    </div>`;
  }).join('');

  return `<div class="screen screen-wide anim-fade">
    ${navBar('Study Mode', 'go:home')}
    ${studySeg('definitions')}
    <div class="study-wrap">
      <div class="study-sidebar">
        <div class="card card-sm" style="padding:14px">
          <div class="sidebar-hdr">CATEGORIES</div>
          ${nav}
        </div>
      </div>
      <div class="study-main">
        <p class="text-muted text-sm mb-4">Key Databricks &amp; SQL terms, functions, and components — each with a short definition and its SQL structure where relevant.</p>
        ${sections}
      </div>
    </div>
  </div>`;
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
// Listeners are attached ONCE in init() via delegation. #app persists across
// renders (only its innerHTML changes), so a single delegated handler covers
// every screen — re-attaching per render would stack duplicate handlers.
function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (el) { handleAction(el.dataset.action, el); return; }
  const opt = e.target.closest('[data-opt]');
  if (opt && S.screen === 'exam' && !S.exam.submitted) { toggleOpt(opt.dataset.opt); return; }
  const tb = e.target.closest('[data-theme]');
  if (tb) { S.study.theme = tb.dataset.theme; render(); return; }
  const st = e.target.closest('[data-studytab]');
  if (st) { S.study.tab = st.dataset.studytab; render(); return; }
  const dc = e.target.closest('[data-defcat]');
  if (dc) { S.study.defCat = dc.dataset.defcat; render(); }
}
function handleAction(action, el) {
  const actions = {
    startExam, startStudy, submitAnswer, nextQ, finishExam,
    reviewAll: () => { S.reviewFilter='all'; go('review'); },
    reviewWrong: () => { S.reviewFilter='wrong'; go('review'); },
  };
  if (action.startsWith('go:')) { go(action.slice(3)); return; }
  if (actions[action]) actions[action]();
}
function onKey(e) {
  if (S.screen === 'exam') {
    const map = {'1':'A','2':'B','3':'C','4':'D','5':'E','a':'A','b':'B','c':'C','d':'D','e':'E','A':'A','B':'B','C':'C','D':'D','E':'E'};
    if (map[e.key] && !S.exam.submitted) { toggleOpt(map[e.key]); return; }
    if (e.key === 'Enter' && !S.exam.submitted && S.exam.sel.length) { submitAnswer(); return; }
    if (e.key === 'Enter' && S.exam.submitted) { if (S.exam.idx < S.exam.pool.length - 1) nextQ(); else finishExam(); return; }
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// The single source of truth is questions.json — edit that one file to add or
// change questions. The app fetches it directly (no build step) and computes
// every KPI live: question count and theme count from the data, and the
// "Last Updated" date from the file's own modified time (the Last-Modified
// HTTP header served by serve.py).
function computeMeta(lastModified) {
  let updated = '';
  if (lastModified) {
    const d = new Date(lastModified);
    if (!isNaN(d)) updated = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  return {
    count: Q.length,
    themeCount: new Set(Q.map(q => q.theme)).size,
    updated,
  };
}

function showError(msg) {
  app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px"><div>
    <div style="margin-bottom:20px">${abylonLogo(52)}</div>
    <h2>Couldn't load questions</h2>
    <p style="color:var(--text2);margin-top:12px;max-width:420px;line-height:1.65">${msg}</p>
    <p style="color:var(--text3);margin-top:16px;font-size:0.82rem">Tip: launch the app by double-clicking <code>DBX-Quiz.command</code> — opening index.html directly won't work.</p>
  </div></div>`;
}

async function init() {
  // Attach global listeners ONCE (delegation) — never inside render().
  app.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);

  // OFFLINE / STANDALONE mode: build_offline.py inlines the data as globals so
  // the single .html works with no server (e.g. opened in Safari on an iPhone).
  if (Array.isArray(window.QUESTIONS_DATA) && window.QUESTIONS_DATA.length) {
    Q = window.QUESTIONS_DATA.map((q, i) => ({ ...q, id: i }));
    if (Array.isArray(window.DEFS_DATA)) DEFS = window.DEFS_DATA;
    META = { count: Q.length, themeCount: new Set(Q.map(q => q.theme)).size, updated: window.BUILD_DATE || '' };
    render();
    return;
  }

  try {
    const res = await fetch('questions.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) throw new Error('questions.json is empty or not a JSON array.');
    Q = data.map((q, i) => ({ ...q, id: i }));
    META = computeMeta(res.headers.get('Last-Modified'));
    // Definitions are optional — a missing/broken file just hides that tab's content.
    try {
      const dres = await fetch('definitions.json', { cache: 'no-store' });
      if (dres.ok) { const dd = await dres.json(); if (Array.isArray(dd)) DEFS = dd; }
    } catch (e) { /* definitions optional */ }
    render();
  } catch (err) {
    showError(`Could not read <code>questions.json</code>. ${esc(err.message || err)}`);
  }
}
init();
</script>
</body>
</html>
