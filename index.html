<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Databricks Data Analyst Associate — Exam Preparation</title>
<style>
:root {
  /* ABYLON palette */
  --brand-cyan: #00ACF8;
  --brand-blue: #0274C5;
  --brand-light: #6EC1E4;
  --brand-pale: #B7D1DA;
  --navy-1: #1F2D5A;
  --navy-2: #1F3147;
  --teal-dark: #094B6E;
  --slate: #7C8AA5;

  --bg: #0A0F1E;
  --bg2: #0E1528;
  --card: #131C33;
  --card2: #1B2743;
  --border: #26355A;

  --accent: #00ACF8;
  --accent2: #0274C5;
  --accent-soft: rgba(0,172,248,0.12);

  --green: #2E8B57;
  --green-txt: #6FD69B;
  --red: #A52A2A;
  --red-txt: #E8918F;
  --yellow: #E8DB7D;

  --text: #E6EDF7;
  --text2: #8EA0C0;
  --text3: #4C5E82;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; overflow-wrap: break-word; -webkit-text-size-adjust: 100%; }
#app { min-height: 100vh; }

h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; }
h2 { font-size: 1.4rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 600; }
code { font-family: 'SF Mono', 'Fira Code', monospace; background: var(--card2); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; color: var(--brand-light); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 22px; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.18s; font-family: var(--font); white-space: nowrap; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
.btn-primary { background: var(--accent); color: #032338; box-shadow: 0 4px 16px rgba(0,172,248,0.3); }
.btn-primary:not(:disabled):hover { background: var(--brand-light); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,172,248,0.4); }
.btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text2); }
.btn-ghost:not(:disabled):hover { background: var(--card2); color: var(--text); }
.btn-success { background: var(--green); color: white; box-shadow: 0 4px 14px rgba(46,139,87,0.3); }
.btn-success:not(:disabled):hover { background: #35a066; transform: translateY(-1px); }
.btn-lg { padding: 14px 28px; font-size: 1rem; border-radius: 12px; }
.btn-sm { padding: 7px 14px; font-size: 0.8rem; border-radius: 8px; }

.screen { min-height: 100vh; padding: 20px; max-width: 860px; margin: 0 auto; }
.screen-wide { max-width: 1100px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.flex-1 { flex: 1; }
.flex-wrap { flex-wrap: wrap; }
.w-full { width: 100%; }
.text-center { text-align: center; }
.mt-3 { margin-top: 12px; }
.mt-4 { margin-top: 16px; }
.mt-6 { margin-top: 24px; }
.mb-3 { margin-bottom: 12px; }
.mb-4 { margin-bottom: 16px; }
.text-sm { font-size: 0.85rem; }
.text-xs { font-size: 0.75rem; }
.text-muted { color: var(--text2); }
.text-accent { color: var(--accent); }
.font-bold { font-weight: 700; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
.card-sm { padding: 16px; border-radius: 12px; }

.progress-bar { width: 100%; height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--brand-blue), var(--brand-cyan)); border-radius: 3px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.badge-accent { background: var(--accent-soft); color: var(--accent); }
.badge-green { background: rgba(46,139,87,0.15); color: var(--green-txt); }

/* NAVBAR */
.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.nav-brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.nav-title { font-weight: 700; font-size: 0.95rem; color: var(--text); }
.nav-title span { color: var(--accent); }

/* ABYLON LOGO */
.abylon-logo { display: inline-flex; align-items: center; gap: 10px; }
.abylon-mark { flex-shrink: 0; }
.abylon-word { font-weight: 800; letter-spacing: 0.02em; font-size: 1.5rem; background: linear-gradient(135deg, var(--brand-cyan), var(--brand-blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

@keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
@keyframes pop { 0% { transform:scale(0.85); opacity:0; } 100% { transform:scale(1); opacity:1; } }
.anim-fade { animation: fadeUp 0.3s ease both; }
.anim-pop { animation: pop 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }

/* HOME */
.home-hero { text-align: center; padding: 48px 0 30px; }
.home-logo-big { display: inline-flex; align-items: center; gap: 16px; margin-bottom: 26px; }
.home-word { font-weight: 800; letter-spacing: 0.02em; font-size: 2.6rem; background: linear-gradient(135deg, var(--brand-cyan), var(--brand-blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.home-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 22px; color: var(--text); }
.home-title .hl { background: linear-gradient(135deg, var(--brand-cyan), var(--brand-light)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.home-stats { display: inline-flex; gap: 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.home-stat { padding: 14px 26px; text-align: center; border-right: 1px solid var(--border); }
.home-stat:last-child { border-right: none; }
.home-stat-val { font-size: 1.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
.home-stat-lbl { font-size: 0.72rem; color: var(--text2); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; }

.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 34px 0; }
.mode-grid-2 { grid-template-columns: repeat(2, 1fr); max-width: 620px; margin-left: auto; margin-right: auto; }
.mode-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 28px 20px; cursor: pointer; transition: all 0.25s; text-align: center; position: relative; overflow: hidden; }
.mode-card::after { content:''; position:absolute; inset:0; border-radius:20px; box-shadow: 0 0 0 1.5px var(--accent); opacity:0; transition:opacity 0.25s; }
.mode-card:hover { transform: translateY(-5px); box-shadow: 0 20px 48px rgba(0,0,0,0.45); }
.mode-card:hover::after { opacity:1; }
.mode-icon { font-size: 42px; margin-bottom: 14px; display: block; }
.mode-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
.mode-desc { color: var(--text2); font-size: 0.83rem; line-height: 1.55; }
.mode-pill { display: inline-block; margin-top: 14px; background: var(--accent-soft); color: var(--accent); font-size: 0.72rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; }

/* EXAM */
.exam-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.q-counter { font-size:0.85rem; color:var(--text2); font-weight:600; }
.score-chip { background: rgba(46,139,87,0.12); color:var(--green-txt); padding:5px 14px; border-radius:20px; font-size:0.82rem; font-weight:700; }
.q-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:28px; margin-bottom:20px; }
.q-text { font-size:1.05rem; line-height:1.7; font-weight:500; }
.q-hint { color:var(--text2); font-size:0.78rem; margin-top:8px; font-style:italic; }
.opts { display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:flex-start; gap:14px; padding:14px 18px; border-radius:12px; border:1.5px solid var(--border); background:var(--card2); cursor:pointer; transition:all 0.18s; user-select:none; }
.opt:hover:not(.opt-disabled) { border-color:rgba(0,172,248,0.5); background:var(--accent-soft); }
.opt.opt-selected { border-color:var(--accent); background:var(--accent-soft); }
.opt.opt-correct { border-color:var(--green); background:rgba(46,139,87,0.1); }
.opt.opt-wrong { border-color:var(--red); background:rgba(165,42,42,0.12); }
.opt.opt-disabled { cursor:default; }
.opt-key { min-width:28px; width:28px; height:28px; border-radius:8px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.78rem; font-weight:700; color:var(--text2); transition:all 0.18s; flex-shrink:0; margin-top:1px; }
.opt.opt-selected .opt-key { border-color:var(--accent); background:var(--accent); color:#032338; }
.opt.opt-correct .opt-key { border-color:var(--green); background:var(--green); color:white; }
.opt.opt-wrong .opt-key { border-color:var(--red); background:var(--red); color:white; }
.opt-text { font-size:0.92rem; line-height:1.55; color:var(--text); flex:1; }
.feedback { margin-top:14px; padding:14px 18px; border-radius:12px; font-size:0.88rem; line-height:1.65; }
.feedback-ok { background:rgba(46,139,87,0.1); border:1px solid rgba(46,139,87,0.3); color:var(--green-txt); }
.feedback-bad { background:rgba(165,42,42,0.1); border:1px solid rgba(165,42,42,0.3); color:var(--red-txt); }
.exam-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }

/* RESULTS */
.results-hero { text-align:center; padding:32px 0 20px; }
.score-ring { width:150px; height:150px; border-radius:50%; border:6px solid var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; margin:20px auto; background:radial-gradient(circle, var(--accent-soft) 0%, transparent 70%); }
.score-big { font-size:2.4rem; font-weight:800; color:var(--accent); line-height:1; }
.score-denom { font-size:0.9rem; color:var(--text2); margin-top:2px; }
.stats-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:20px 0; }
.stat-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; }
.stat-val { font-size:1.5rem; font-weight:800; }
.stat-lbl { color:var(--text2); font-size:0.75rem; margin-top:3px; }

/* REVIEW */
.review-q { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:14px; }
.review-q.rv-wrong { border-left:4px solid var(--red); }
.review-q.rv-right { border-left:4px solid var(--green); }
.rv-opts { margin:12px 0; display:flex; flex-direction:column; gap:6px; }
.rv-opt { font-size:0.88rem; padding:3px 0; }
.rv-opt.rv-correct { color:var(--green-txt); font-weight:600; }
.rv-opt.rv-selected-wrong { color:var(--red-txt); text-decoration:line-through; }
.rv-opt.rv-neutral { color:var(--text2); }
.rv-expl { background:var(--card2); border-radius:10px; padding:12px 15px; font-size:0.86rem; color:var(--text2); line-height:1.65; margin-top:12px; }
.theme-section { margin-bottom:28px; }
.theme-hdr { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.theme-count { background:var(--card2); color:var(--text3); padding:2px 9px; border-radius:20px; font-size:0.75rem; }

/* KP watermark logo — always visible, bottom-right */
.kp-logo { position:fixed; right:14px; bottom:12px; height:24px; width:auto; z-index:9999; opacity:0.7; pointer-events:none; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.45)); }

/* STUDY */
.study-wrap { display:flex; gap:24px; align-items:flex-start; }
.study-sidebar { width:230px; min-width:230px; position:sticky; top:20px; }
.study-main { flex:1; min-width:0; }
.theme-btn { display:block; width:100%; text-align:left; padding:9px 13px; border-radius:8px; border:none; background:transparent; color:var(--text2); font-size:0.83rem; cursor:pointer; transition:all 0.18s; font-family:var(--font); margin-bottom:3px; }
.theme-btn:hover { background:var(--card2); color:var(--text); }
.theme-btn.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.theme-btn .tc { float:right; background:var(--card2); color:var(--text3); padding:1px 7px; border-radius:10px; font-size:0.72rem; }
.study-q { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:14px; }
.study-q-text { font-size:0.97rem; line-height:1.65; font-weight:500; margin-bottom:14px; }
.study-lbl { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text3); font-weight:700; margin-bottom:7px; }
.study-answer { background:rgba(46,139,87,0.1); border:1px solid rgba(46,139,87,0.3); border-radius:10px; padding:11px 15px; color:var(--green-txt); font-size:0.92rem; margin-bottom:12px; }
.study-expl { background:var(--card2); border-radius:10px; padding:12px 15px; color:var(--text2); font-size:0.87rem; line-height:1.65; }
.sidebar-hdr { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text3); font-weight:700; margin-bottom:10px; }

/* STUDY segmented control (Questions / Definitions) */
.study-seg { display:inline-flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:20px; }
.seg-btn { padding:9px 20px; border:none; border-radius:9px; background:transparent; color:var(--text2); font-size:0.88rem; font-weight:600; cursor:pointer; font-family:var(--font); transition:all 0.18s; }
.seg-btn:hover { color:var(--text); }
.seg-btn.active { background:var(--accent); color:#032338; }

/* DEFINITIONS */
.def-section { margin-bottom:28px; }
.def-grid { display:flex; flex-direction:column; gap:14px; }
.def-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
.def-term { font-size:1rem; font-weight:700; color:var(--accent); margin-bottom:8px; }
.def-def { font-size:0.88rem; line-height:1.6; color:var(--text); }
.def-syntax { margin-top:12px; background:var(--bg2); border:1px solid var(--border); border-radius:9px; padding:11px 13px; overflow-x:auto; max-width:100%; }
.def-syntax code { font-family:'SF Mono','Fira Code',monospace; font-size:0.8rem; line-height:1.5; color:var(--brand-light); background:none; padding:0; white-space:pre; }

.empty { text-align:center; padding:80px 20px; }
.empty-icon { font-size:56px; margin-bottom:16px; }

@media (max-width:640px) {
  .screen { padding:14px; }
  h1 { font-size:1.5rem; }
  .mode-grid { grid-template-columns:1fr; }
  .stats-3 { grid-template-columns:1fr 1fr; }
  .study-wrap { flex-direction:column; }
  .study-sidebar { width:100%; min-width:0; position:static; }
  .home-hero { padding:30px 0 22px; }
  .home-title { font-size:1.45rem; }
  .home-logo-big img { height:44px !important; }
  /* KPI bar -> 2x2 grid, full width, hairline separators */
  .home-stats { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); width:100%; }
  .home-stat { border-right:none !important; padding:13px 10px; background:var(--card); }
  .q-card { padding:20px; }
  .q-text { font-size:1rem; }
  .opt { padding:12px 14px; gap:11px; }
  .nav-title { font-size:0.85rem; }
  .def-card, .study-q, .review-q { padding:16px; }
  .exam-footer .btn, .fc-btns .btn { width:100%; }
  .exam-footer, .fc-btns { flex-direction:column; }
  .kp-logo { height:16px; opacity:0.5; right:10px; bottom:8px; }
  .theme-hdr h3 { font-size:0.95rem; }
}
</style>
</head>

<script>
window.QUESTIONS_DATA = [{"source": "SkillcertPro", "theme": "Data Ingestion & Streaming", "question": "In Databricks SQL, when dealing with the ingestion of data, how does the platform handle directories containing multiple files?", "type": "single", "options": [{"label": "A", "text": "Databricks SQL automatically converts and ingests files of different types from a directory into a standard format."}, {"label": "B", "text": "Databricks SQL can ingest directories containing files of mixed types, such as CSV and JSON, simultaneously."}, {"label": "C", "text": "Databricks SQL can ingest directories of files, provided all files in the directory are of the same type, such as all CSV or all JSON."}, {"label": "D", "text": "Databricks SQL requires manual conversion of all files in a directory to a uniform format before ingestion."}, {"label": "E", "text": "Databricks SQL can only ingest a single file at a time, regardless of file type."}], "correct_answers": ["C"], "explanation": "Databricks SQL supports ingestion from directories, but all files must share the same format. For example, if the directory contains only CSV files, Databricks SQL can treat them as a single logical dataset. Mixing file types (CSV + JSON) in the same directory is not supported for direct ingestion.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Analytics Fundamentals", "question": "In the context of analytics, what is an example of effectively enhancing data in a common application?", "type": "single", "options": [{"label": "A", "text": "Keeping data in its original, raw format for archival purposes."}, {"label": "B", "text": "Strictly categorizing data based on its source without additional processing."}, {"label": "C", "text": "Integrating weather data into a retail sales analysis to understand the impact of weather on sales trends."}, {"label": "D", "text": "Restricting data access to a limited number of users to ensure data security."}, {"label": "E", "text": "Performing routine software updates on data analysis tools without modifying data."}], "correct_answers": ["C"], "explanation": "By integrating weather data, analysts can assess how external factors such as temperature, precipitation, or seasonal patterns impact sales trends, enabling optimizing business strategies and enhanced predictive analytics.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Caching & Performance", "question": "What is the purpose of caching in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Speed up query execution by storing intermediate results"}, {"label": "B", "text": "Store historical query data for auditing"}, {"label": "C", "text": "Improve data durability"}, {"label": "D", "text": "Optimize storage utilization"}], "correct_answers": ["A"], "explanation": "Caching in Databricks SQL is primarily used to store frequently used intermediate results from previous queries, allowing subsequent queries to access them directly from the cache instead of recomputing from source data, significantly reducing query execution times.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Query Optimization & Performance", "question": "What function does the EXPLAIN statement serve in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Displays execution plan for a query"}, {"label": "B", "text": "Executes a SQL query"}, {"label": "C", "text": "Generates query suggestions"}, {"label": "D", "text": "Validates SQL syntax"}], "correct_answers": ["A"], "explanation": "The EXPLAIN statement's primary function is to display the execution plan for a query, including details about the different stages of query execution, the chosen operators and algorithms, and the estimated cost of each step. It is used to visualize and understand the existing query plan for optimizing queries.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Databricks Workspace & Navigation", "question": "What type of tokens cannot be used to automate Databricks account-level functionality?", "type": "single", "options": [{"label": "A", "text": "Service principals"}, {"label": "B", "text": "OAuth tokens for Databricks account admin users"}, {"label": "C", "text": "Databricks personal access tokens"}, {"label": "D", "text": "Username and password of Databricks account-level admins"}], "correct_answers": ["C"], "explanation": "Databricks Personal Access Tokens (PATs) cannot be used to automate account-level functionality. PATs are designed for workspace-level operations only. Account-level operations require Service Principals or OAuth tokens for Databricks account admin users.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "SQL Basics & Syntax", "question": "A data analyst is tasked with finding the top 5 customers who have made the highest average purchase amounts. What is the correct SQL query?", "type": "single", "options": [{"label": "A", "text": "SELECT customer, AVG(purchase_amount) FROM orders GROUP BY customer ORDER BY AVG(purchase_amount) DESC LIMIT 5;"}, {"label": "B", "text": "SELECT TOP 5 customer, AVG(purchase_amount) FROM orders GROUP BY customer ORDER BY AVG(purchase_amount) DESC;"}, {"label": "C", "text": "SELECT customer, AVG(purchase_amount) FROM orders GROUP BY customer HAVING AVG(purchase_amount) ORDER BY AVG(purchase_amount) DESC LIMIT 5;"}, {"label": "D", "text": "SELECT customer, AVG(purchase_amount) FROM orders GROUP BY customer HAVING AVG(purchase_amount) ORDER BY AVG(purchase_amount) DESC FETCH FIRST 5 ROWS ONLY;"}], "correct_answers": ["A"], "explanation": "Databricks SQL uses LIMIT to restrict rows. Option A correctly groups by customer, calculates average purchase amount, orders descending, and limits to 5. SELECT TOP 5 is SQL Server syntax not supported in Databricks SQL. FETCH FIRST ROWS ONLY is also not supported.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "SQL Basics & Syntax", "question": "In a Spark SQL dataset EmployeeData, you have a column monthlyPerformanceRatings which is an array of integers representing monthly performance ratings. You are tasked with identifying employees whose performance has consistently improved over the last three months. Which Spark SQL query utilizing a higher-order function is best suited for this task?", "type": "single", "options": [{"label": "A", "text": "SELECT employeeId FROM EmployeeData WHERE ARRAY_SORT(monthlyPerformanceRatings) = monthlyPerformanceRatings;"}, {"label": "B", "text": "SELECT employeeId FROM EmployeeData WHERE ZIP_WITH(monthlyPerformanceRatings, monthlyPerformanceRatings, (current, next) -> next > current);"}, {"label": "C", "text": "SELECT employeeId FROM EmployeeData WHERE REDUCE(monthlyPerformanceRatings, 0, (acc, rating) -> acc + rating, acc -> acc) > 3;"}, {"label": "D", "text": "SELECT employeeId FROM EmployeeData WHERE EXISTS(monthlyPerformanceRatings, rating -> rating > 3);"}, {"label": "E", "text": "SELECT employeeId FROM EmployeeData WHERE SLICE(monthlyPerformanceRatings, -3, 3) = ARRAY_SORT(SLICE(monthlyPerformanceRatings, -3, 3));"}], "correct_answers": ["E"], "explanation": "SLICE extracts the last 3 elements of the monthlyPerformanceRatings array, and ARRAY_SORT sorts those 3 elements. If the sliced array equals the sorted array, the ratings are in non-decreasing order, indicating consistent improvement over the last three months.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Delta Lake & Delta Tables", "question": "An organization wants to create a table in Databricks SQL that maintains historical versions of data. Which type of table should they create to achieve this requirement?", "type": "single", "options": [{"label": "A", "text": "Managed table"}, {"label": "B", "text": "Unmanaged table"}, {"label": "C", "text": "Temp view"}, {"label": "D", "text": "Delta Lake table"}], "correct_answers": ["D"], "explanation": "Delta Lake tables support ACID transactions and maintain historical versions of data through time travel, allowing analysts to query older snapshots. Managed and unmanaged tables do not inherently provide historical versioning. Temp views are session-scoped and do not persist data.", "is_one_word": true}, {"source": "SkillcertPro", "theme": "Data Ingestion & Streaming", "question": "An organization wants to import small lookup tables and perform quick data integrations using Databricks SQL. Which method is suitable for importing small text files like lookup tables into Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Serverless Databricks SQL endpoint"}, {"label": "B", "text": "Partner Connect"}, {"label": "C", "text": "Small-file upload"}, {"label": "D", "text": "Import from object storage"}], "correct_answers": ["C"], "explanation": "Databricks SQL provides a small-file upload feature that allows analysts to quickly import small text files (such as CSVs or lookup tables) directly into Databricks SQL. This method is designed for lightweight integrations and avoids the overhead of configuring pipelines or external storage.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "SQL Basics & Syntax", "question": "You are working with a sales data table in Databricks SQL with columns for Region, Product, and SalesAmount. You want to generate a report with total sales for each Region+Product combination, total for each Region, and an overall total. Which SQL query achieves this?", "type": "single", "options": [{"label": "A", "text": "SELECT Region, Product, SUM(SalesAmount) FROM sales GROUP BY Region, Product WITH CUBE;"}, {"label": "B", "text": "SELECT Region, Product, SUM(SalesAmount) FROM sales GROUP BY CUBE(Region, Product);"}, {"label": "C", "text": "SELECT Region, Product, SUM(SalesAmount) FROM sales GROUP BY ROLLUP(Region, Product);"}, {"label": "D", "text": "SELECT Region, Product, SUM(SalesAmount) FROM sales GROUP BY Region, Product WITH ROLLUP;"}, {"label": "E", "text": "SELECT Region, Product, SUM(SalesAmount) FROM sales GROUP BY GROUPING SETS ((Region, Product), (Region), ());"}], "correct_answers": ["C"], "explanation": "GROUP BY ROLLUP(Region, Product) produces totals for each Region+Product combination, totals for each Region, and a grand total — matching the requirement exactly. CUBE generates all possible grouping combinations including Product alone, which are not required. WITH CUBE and WITH ROLLUP are incorrect syntax for Databricks SQL.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Query Optimization & Performance", "question": "How can you optimize a SQL query in Databricks to improve its performance on large datasets? (Key optimization techniques)", "type": "single", "options": [{"label": "A", "text": "No, I Don't"}, {"label": "B", "text": "Yes, I Understood"}], "correct_answers": ["B"], "explanation": "Key optimization techniques in Databricks SQL: Use indexes on columns in WHERE clauses. Avoid SELECT * and retrieve only needed columns. Use partitioning and clustering in Delta Lake to minimize scans. Optimize JOINs with proper join types. Cache intermediate results with CACHE TABLE. Address data skewness. Use ANALYZE TABLE COMPUTE STATISTICS. Apply partition pruning and predicate pushdown. Adjust cluster configuration (nodes, types, memory).", "is_one_word": false}, {"source": "SkillcertPro", "theme": "AI/BI Dashboards & Visualization", "question": "A company needs to create interactive dashboards showcasing real-time sales data to stakeholders. Which tool can be integrated with Databricks SQL to create visually appealing and interactive dashboards for real-time data analysis?", "type": "single", "options": [{"label": "A", "text": "Tableau"}, {"label": "B", "text": "Fivetran"}, {"label": "C", "text": "Small-file upload"}, {"label": "D", "text": "Databricks SQL schema browser"}], "correct_answers": ["A"], "explanation": "Tableau offers a powerful interface for creating visually engaging and interactive dashboards, connects directly to Databricks SQL, and enables live refreshes with real-time data. Fivetran focuses on data ingestion, not visualization. Small-file upload is for data import. The schema browser helps explore data structures but does not offer dashboarding.", "is_one_word": true}, {"source": "SkillcertPro", "theme": "SQL Basics & Syntax", "question": "Consider the following SQL query with a LEFT OUTER JOIN between employees and sales_employees tables. The result shows Employee 1 (Tom, Sales Rep), Employee 2 (Luke, NULL/NULL), and Employee 3 (Sarah, Sales Director). What type of SQL JOIN is represented?", "type": "single", "options": [{"label": "A", "text": "INNER"}, {"label": "B", "text": "LEFT OUTER"}, {"label": "C", "text": "RIGHT OUTER"}, {"label": "D", "text": "FULL OUTER"}], "correct_answers": ["B"], "explanation": "A LEFT OUTER JOIN returns all rows from the left table (employees) and matching rows from the right table. Where there is no match, NULL values are returned for right table columns. Luke exists in employees but has no matching record in sales_employees — exactly the behavior of a LEFT OUTER JOIN.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Query Optimization & Performance", "question": "Using which tool offered by Databricks can you troubleshoot performance bottlenecks during the query execution?", "type": "single", "options": [{"label": "A", "text": "query parameters"}, {"label": "B", "text": "query history"}, {"label": "C", "text": "query profile"}, {"label": "D", "text": "query task"}], "correct_answers": ["C"], "explanation": "The Query Profile in Databricks SQL provides detailed insights into query execution, showing execution plans, stages, and resource usage to identify bottlenecks such as inefficient joins, large scans, or skewed data distribution. Query parameters are for passing values dynamically. Query history shows previous runs without performance breakdown.", "is_one_word": true}, {"source": "SkillcertPro", "theme": "AI/BI Dashboards & Visualization", "question": "What is the significance of setting a refresh schedule for dashboards in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Setting a refresh schedule is optional and does not impact dashboard functionality."}, {"label": "B", "text": "A refresh schedule ensures that dashboards always display real-time data by automatically updating the data at specified intervals, keeping information current and relevant."}, {"label": "C", "text": "Refresh schedules are only applicable to visualizations, not entire dashboards."}, {"label": "D", "text": "Dashboards automatically refresh whenever users access them, so a refresh schedule is unnecessary."}], "correct_answers": ["B"], "explanation": "The refresh schedule in Databricks SQL automates updating dashboards so users see the most recent query results without manual refreshing. This is especially important for monitoring and reporting use cases. Without a schedule, dashboards will show stale data.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Unity Catalog & Data Governance", "question": "How can you change access rights to a table in Databricks using Catalog Explorer?", "type": "single", "options": [{"label": "A", "text": "Access rights can only be changed via the Databricks CLI, not in Catalog Explorer."}, {"label": "B", "text": "By executing a SQL command in Catalog Explorer for access modification."}, {"label": "C", "text": "By editing the table schema in the 'Schema' section of Catalog Explorer."}, {"label": "D", "text": "Through the 'Access Rights' menu in the table's context menu in Catalog Explorer."}, {"label": "E", "text": "By selecting the table, navigating to the 'Permissions' tab, and modifying permissions."}], "correct_answers": ["E"], "explanation": "In Catalog Explorer, you can manage access rights by opening the table, going to the Permissions tab, and then adding, removing, or modifying user and group permissions. This is the supported way to configure access rights directly in the Databricks UI.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "SQL Basics & Syntax", "question": "In a sales database, a data analyst needs to identify the customers whose total order value exceeds the average total order value. What is the correct SQL query?", "type": "single", "options": [{"label": "A", "text": "SELECT customer FROM orders GROUP BY customer HAVING SUM(order_value) > AVG(SUM(order_value));"}, {"label": "B", "text": "SELECT customer FROM orders GROUP BY customer HAVING SUM(order_value) > (SELECT AVG(SUM(order_value)) FROM orders);"}, {"label": "C", "text": "SELECT customer FROM orders GROUP BY customer HAVING AVG(order_value) < SUM(order_value);"}, {"label": "D", "text": "SELECT customer FROM orders GROUP BY customer HAVING AVG(order_value) < (SELECT AVG(order_value) FROM orders);"}], "correct_answers": ["B"], "explanation": "Option B correctly calculates total order value per customer (SUM(order_value)) then compares against the average of all customers' totals using a subquery. Nested aggregates like AVG(SUM(...)) in HAVING require a subquery to be valid. Option C compares AVG to SUM within the same group which is meaningless. Option D compares average order value not total order value.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Analytics Fundamentals", "question": "Compare the features and capabilities of Matplotlib, Seaborn, and Databricks Visualizations for data visualization tasks.", "type": "single", "options": [{"label": "A", "text": "Yes, I Understood"}, {"label": "B", "text": "No, I Don't"}], "correct_answers": ["A"], "explanation": "Matplotlib: highly customizable, complex learning curve, best for fine-tuned static visualizations. Seaborn: simplified statistical visualization, easier integration with Pandas, limited customization. Databricks Visualizations: interactive and scalable, best for EDA within the Databricks platform, limited outside Databricks. Use Matplotlib for flexibility, Seaborn for simplicity, Databricks Visualizations for interactive Databricks-native analysis.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Databricks SQL & Warehouses", "question": "Can alerts be configured to trigger as frequently as every minute for timely notifications upon completion of a critical project with tight timelines?", "type": "single", "options": [{"label": "A", "text": "It is possible, however, Databricks only supports scheduling alerts with frequency for as low as 5 mins"}, {"label": "B", "text": "Databricks can trigger alerts on hourly basis only"}, {"label": "C", "text": "It is possible, however, the smallest interval for which alerts can be scheduled in Databricks is 1 min"}, {"label": "D", "text": "No, it is not possible to have such frequent alerts"}], "correct_answers": ["C"], "explanation": "Databricks allows alerts to be scheduled at a minimum frequency of 1 minute. This ensures real-time monitoring and timely notifications, which is especially useful for critical projects with tight deadlines.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Databricks SQL & Warehouses", "question": "What is the trade-off between cluster size and cost for Databricks SQL endpoints/warehouses?", "type": "single", "options": [{"label": "A", "text": "Larger clusters incur higher costs"}, {"label": "B", "text": "Smaller clusters incur higher costs"}, {"label": "C", "text": "Larger clusters reduce query performance"}, {"label": "D", "text": "Smaller clusters reduce query performance"}], "correct_answers": ["A"], "explanation": "Larger clusters provide more compute resources (nodes, memory, CPU) which improve query performance and concurrency, but this comes at the trade-off of higher cost since billing is based on the size and uptime of the cluster.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Databricks SQL & Warehouses", "question": "Where in the Databricks SQL workspace can a data analyst configure a refresh schedule for a query when the query is not attached to a dashboard or alert?", "type": "single", "options": [{"label": "A", "text": "The Dashboard Editor"}, {"label": "B", "text": "The Visualization Editor"}, {"label": "C", "text": "The Query Editor"}, {"label": "D", "text": "SQL Warehouse"}, {"label": "E", "text": "Data Explorer"}], "correct_answers": ["C"], "explanation": "In the Databricks SQL workspace, a data analyst can configure a refresh schedule for a query that is not attached to a dashboard or alert in the Query Editor.", "is_one_word": true}, {"source": "SkillcertPro", "theme": "Data Modeling & Architecture", "question": "A data analyst is working with gold-layer tables to complete an ad-hoc project. A stakeholder has provided the analyst with an additional dataset that can be used to augment the gold-layer tables already in use. Which term is used to describe this data augmentation?", "type": "single", "options": [{"label": "A", "text": "Data testing"}, {"label": "B", "text": "Last-mile ETL"}, {"label": "C", "text": "Ad-hoc improvements"}, {"label": "D", "text": "Data enhancement"}, {"label": "E", "text": "Last-mile dashboarding"}], "correct_answers": ["D"], "explanation": "Data enhancement involves enriching or expanding existing datasets with additional data to improve their completeness, accuracy, or value. Options A, B, C, and E do not specifically describe the process of augmenting datasets with additional data.", "is_one_word": true}, {"source": "SkillcertPro", "theme": "SQL Basics & Syntax", "question": "The data analyst has 10 SQL statements that are identical except for a single name value in the WHERE clause (e.g. WHERE name='John', WHERE name='Chris', etc.). Is there a more efficient way provided by Databricks for the data analyst to accelerate their work rather than manually entering these queries?", "type": "single", "options": [{"label": "A", "text": "There is no out of box offering from Databricks"}, {"label": "B", "text": "Data Analysts should use 'Query parameter' Instead"}, {"label": "C", "text": "Data analyst should use 'select * from user;' to get all the results instead of the WHERE clause"}, {"label": "D", "text": "All the above queries are a good approach to get the result quickly"}], "correct_answers": ["B"], "explanation": "Query parameters in Databricks enable the dynamic substitution of values into a query during runtime. Enclosed within double curly braces ({{}}), any string is recognized as a query parameter. Upon execution, a widget emerges above the results pane, allowing the analyst to set the parameter value.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst is trying to determine whether to develop their dashboard in Databricks SQL or a partner business intelligence (BI) tool like Tableau, Power BI, or Looker. When is it advantageous to use Databricks SQL instead of using third-party BI tools to develop the dashboard?", "type": "single", "options": [{"label": "A", "text": "When the data being transformed as part of the visualizations is very large"}, {"label": "B", "text": "When the visualizations require custom formatting"}, {"label": "C", "text": "When the visualizations require production-grade, customizable branding"}, {"label": "D", "text": "When the data being transformed is in table format"}], "correct_answers": ["A"], "explanation": "Databricks SQL may be advantageous when dealing with large-scale data transformations, as it is specifically designed to handle big data processing efficiently. Databricks SQL is integrated with the Databricks platform, making it suitable for scenarios with extensive data processing needs.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "AI/BI Dashboards & Visualization", "question": "What is the role of a basic alert in Databricks SQL dashboards?", "type": "single", "options": [{"label": "A", "text": "Basic alerts are decorative elements that enhance the visual appeal of dashboards."}, {"label": "B", "text": "Basic alerts display real-time notifications based on predefined conditions, allowing users to stay informed about critical events or data thresholds."}, {"label": "C", "text": "Basic alerts serve as hyperlinks to external resources for additional information."}, {"label": "D", "text": "Basic alerts automatically generate reports and send them to predefined recipients."}], "correct_answers": ["B"], "explanation": "The role of a basic alert in Databricks SQL dashboards is to display real-time notifications based on predefined conditions. Basic alerts help users stay informed about critical events or data thresholds by providing visual cues or notifications within the dashboard.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Databricks SQL & Warehouses", "question": "How does Databricks SQL handle concurrency control in queries?", "type": "single", "options": [{"label": "A", "text": "Prioritizes long-running queries"}, {"label": "B", "text": "Queues queries based on arrival time"}, {"label": "C", "text": "Uses dynamic resource allocation"}, {"label": "D", "text": "Rejects concurrent queries"}], "correct_answers": ["C"], "explanation": "Databricks SQL handles concurrency control by using dynamic resource allocation to manage resource utilization across concurrent queries. Cluster resources are automatically scaled up or down to accommodate the workload. This allows Databricks SQL to handle concurrent queries efficiently, ensuring smooth execution for all users without compromising performance.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst at an e-commerce company is using Databricks SQL to visualize customer feedback scores (ranging from 1 to b) against product categories. The analyst wants to identify patterns and outliers in the feedback scores across different categories. Which visualization type should the analyst select in Databricks SQL to effectively communicate these insights?", "type": "single", "options": [{"label": "A", "text": "Stacked bar chart, for showing the total feedback scores by category."}, {"label": "B", "text": "Bubble chart, for showing the volume of feedback in relation to scores across categories."}, {"label": "C", "text": "Radar chart, to compare the feedback scores of different categories in a circular format."}, {"label": "D", "text": "Box chart, to display the distribution of feedback scores within each category, highlighting the median, quartiles, and outliers."}, {"label": "E", "text": "Treemap, to represent feedback scores as proportions within each category."}], "correct_answers": ["D"], "explanation": "A Box chart (Box plot or Box-and-Whisker plot) is an effective visualization for comparing the distribution of feedback scores within different categories. Box charts provide a clear visual representation of the distribution, display key summary statistics (median, Q1, Q3), and outliers (points outside the whiskers of the plot) are easily identified.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Data Modeling & Architecture", "question": "Which layer in the medallion architecture corresponds to table structures 'as-is' along with any additional metadata columns?", "type": "single", "options": [{"label": "A", "text": "Gold layer"}, {"label": "B", "text": "Diamond layer"}, {"label": "C", "text": "Bronze layer"}, {"label": "D", "text": "Silver layer"}], "correct_answers": ["C"], "explanation": "In the Medallion Architecture, the layer that corresponds to table structures 'as-is' along with any additional metadata columns is the Bronze layer. The Bronze layer represents raw, unprocessed data as it is ingested into the data lake, including any additional metadata that may be associated with the raw data.", "is_one_word": true}, {"source": "SkillcertPro", "theme": "Caching & Performance", "question": "How does query caching reduce query latency in SQL databases?", "type": "single", "options": [{"label": "A", "text": "By storing the query results temporarily"}, {"label": "B", "text": "By compressing the query data"}, {"label": "C", "text": "By executing queries in parallel"}, {"label": "D", "text": "By optimizing the query execution plan"}], "correct_answers": ["A"], "explanation": "Query caching reduces query latency by storing the query results temporarily. When a query is executed, the database system may cache the results so that if the same query is issued again, the system can return the cached results instead of re-executing the query. This can significantly reduce the time it takes to retrieve data, especially for queries that are repeated frequently.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Unity Catalog & Data Governance", "question": "A data engineering team is working with personally identifiable information (PII) data in Databricks SQL and needs to adhere to organization-specific considerations regarding data privacy. What is a key consideration when dealing with PII data in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "PII data can be stored in plain text format"}, {"label": "B", "text": "PII data should be anonymized and masked"}, {"label": "C", "text": "PII data is automatically encrypted in Databricks SQL"}, {"label": "D", "text": "PII data is accessible to all users by default"}], "correct_answers": ["B"], "explanation": "The key consideration when dealing with PII data in Databricks SQL is that PII data should be anonymized and masked. Storing PII data in plain text makes it vulnerable to unauthorized access. Databricks SQL offers various tools and techniques for data encryption and masking to preserve statistical properties while protecting individual privacy.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "AI/BI Dashboards & Visualization", "question": "Which element can be used as visualizations within Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Fixed-size images"}, {"label": "B", "text": "Custom JavaScript code"}, {"label": "C", "text": "Customizable tables"}, {"label": "D", "text": "External web pages"}], "correct_answers": ["C"], "explanation": "Customizable tables Within Databricks SQL, the element that can be used as visualizations is customizable tables. Databricks SQL allows you to create and customize tables to present data in a structured and visual manner. While it doesn't directly support fixed-size images, custom JavaScript code, or embedding external web pages, it provides capabilities for creating and customizing tables for data visualization.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Delta Lake & Delta Tables", "question": "What is the primary role of the Delta Lake transaction log?", "type": "single", "options": [{"label": "A", "text": "Records schema changes only"}, {"label": "B", "text": "Records all table operations for ACID transactions"}, {"label": "C", "text": "Records query performance metrics"}, {"label": "D", "text": "Records backup information"}], "correct_answers": ["B"], "explanation": "The Delta Lake transaction log records all table operations for ACID transactions. This comprehensive record is crucial for ACID transactions: Atomicity ensures each transaction either completes fully or fails. Consistency ensures data integrity. Isolation maintains data consistency through ACID. Durability ensures data persists even in case of system failures.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Delta Lake & Delta Tables", "question": "How long does Delta Lake tables maintain history by default?", "type": "single", "options": [{"label": "A", "text": "7 days"}, {"label": "B", "text": "30 days"}, {"label": "C", "text": "60 days"}, {"label": "D", "text": "Unlimited history"}], "correct_answers": ["B"], "explanation": "By default, Delta Lake tables maintain history for 30 days. All versions of the table data (inserts, updates, deletions) are retained for 30 days, after which oldest data versions are automatically deleted. You can configure the delta.logRetentionDuration property to specify different retention periods.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Unity Catalog & Data Governance", "question": "Which of the following is NOT a component of the Unity Catalog from below options?", "type": "single", "options": [{"label": "A", "text": "Data versioning"}, {"label": "B", "text": "Data governance"}, {"label": "C", "text": "Data auditing"}, {"label": "D", "text": "Data Sharing"}], "correct_answers": ["A"], "explanation": "Data versioning is not a built-in component of Unity Catalog. While Unity Catalog offers features for managing data access, security, and auditing, it doesn't directly track or manage different versions of data objects. Data governance establishes rules and policies for data access, usage, and security. Data auditing tracks and logs user actions. Data sharing enables controlled sharing across workspaces and organizations.", "is_one_word": true}, {"source": "SkillcertPro", "theme": "Data Ingestion & Streaming", "question": "A data analyst is working on a project that involves processing large volumes of streaming data. What caution should the analyst be aware of while working with streaming data in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Streaming data cannot be processed in Databricks SQL"}, {"label": "B", "text": "Streaming data may introduce latency and require careful handling"}, {"label": "C", "text": "Streaming data is always accurate and reliable"}, {"label": "D", "text": "Streaming data can only be processed in batch mode"}], "correct_answers": ["B"], "explanation": "Streaming data may introduce latency and require careful handling. Real-time processing of streaming data involves dealing with data that arrives continuously and in a potentially unbounded fashion. Handling issues such as event time, out-of-order events, and potential delays in processing are critical considerations to ensure accurate and reliable results.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "SQL Basics & Syntax", "question": "A data analyst wants to retrieve data from the database where the 'status' column is 'completed'. Which SQL query should the analyst use to achieve this?", "type": "single", "options": [{"label": "A", "text": "SELECT * FROM table WHERE status = 'completed';"}, {"label": "B", "text": "SELECT * FROM table HAVING status = 'completed';"}, {"label": "C", "text": "SELECT * FROM table FILTER BY status = 'completed';"}, {"label": "D", "text": "SELECT * FROM table WHEN status = 'completed';"}], "correct_answers": ["A"], "explanation": "The correct answer is SELECT * FROM table WHERE status = 'completed'. The HAVING clause is used for filtering groups of rows after aggregation, not filtering individual rows. FILTER BY syntax is not standard SQL. WHEN status is not available in SQL. The simplest and most standard way to filter data based on the 'status' column is to use the WHERE clause with an equality comparison.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Analytics Fundamentals", "question": "A data analyst is working with customer survey data. Which statistical measure can provide insights into the average customer satisfaction level of the surveyed population?", "type": "single", "options": [{"label": "A", "text": "Median"}, {"label": "B", "text": "Range"}, {"label": "C", "text": "Mean"}, {"label": "D", "text": "Standard Deviation"}], "correct_answers": ["C"], "explanation": "The mean calculates the sum of all survey responses divided by the total number of responses, providing a straightforward quantitative estimate of the 'average' level of customer satisfaction across the entire surveyed population. It captures the overall sentiment and can be easily understood and interpreted even by non-statisticians.", "is_one_word": true}, {"source": "SkillcertPro", "theme": "Delta Lake & Delta Tables", "question": "How does Delta Lake manage table metadata?", "type": "single", "options": [{"label": "A", "text": "Stores metadata in external databases"}, {"label": "B", "text": "Stores metadata in transaction log files"}, {"label": "C", "text": "Uses separate metadata files"}, {"label": "D", "text": "Stores metadata in Parquet files"}], "correct_answers": ["B"], "explanation": "Delta Lake relies on dedicated transaction log files to track all changes to table metadata, including schema modifications, data insertions, deletions, and updates. This approach offers advantages: Atomicity and consistency through ACID transactions, versioning and rollback capabilities, enabling smooth auditing and lineage tracking. Parquet files store the data but the table metadata is not embedded within them.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "AI/BI Dashboards & Visualization", "question": "What is the purpose of the 'Query Based Dropdown List' in Databricks SQL dashboards?", "type": "single", "options": [{"label": "A", "text": "It allows users to manually input values for a query parameter."}, {"label": "B", "text": "It dynamically populates a dropdown list based on the distinct values retrieved from a specified query, serving as a source for query parameters."}, {"label": "C", "text": "It automatically generates queries based on user input in the dropdown list."}, {"label": "D", "text": "It is used to filter dashboards based on predefined static values, enhancing user experience."}], "correct_answers": ["B"], "explanation": "The 'Query Based Dropdown List' dynamically populates a dropdown based on distinct values from a specified query. It primarily serves as a dynamic source for existing query parameters. By pre-defining a query that retrieves relevant values, the dropdown list adapts to the data and allows users to select specific options that influence the underlying parameters of the dashboard queries.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "SQL Basics & Syntax", "question": "What is the purpose of the COALESCE function in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "Concatenates strings"}, {"label": "B", "text": "Computes the average of a numeric expression"}, {"label": "C", "text": "Returns the first non-null expression in a list"}, {"label": "D", "text": "Computes the sum of a numeric expression"}], "correct_answers": ["C"], "explanation": "The purpose of the COALESCE function in Databricks SQL is to return the first non-null expression in a list. It evaluates expressions from left to right and returns the first one that is not NULL. This makes it useful for replacing NULL values with a default value in a query result, filling in gaps in time series data, and handling missing values in calculations.", "is_one_word": false}, {"source": "SkillcertPro", "theme": "Data Modeling & Architecture", "question": "The Medallion Architecture in Databricks is a conceptual framework for data organization and pipeline management. How does it structure the data processing pipeline?", "type": "single", "options": [{"label": "A", "text": "It uses a reverse-pyramid structure starting with the most refined data in the base layer, moving to semi-processed data, and ending with raw data at the top."}, {"label": "B", "text": "It begins with raw data in Bronze tables, moves to refined data in Silver tables, and culminates in curated data in Gold tables."}, {"label": "C", "text": "It involves a single stage of data processing where raw, refined, and curated data are merged into a unified table known as the Platinum table."}, {"label": "D", "text": "It starts with unstructured data in Gold tables, then structures the data in Silver tables, and finally stores the raw data in Bronze tables."}, {"label": "E", "text": "None of the above"}], "correct_answers": ["B"], "explanation": "The Medallion Architecture structures the data processing pipeline: Bronze Tables are the initial layer where raw data is ingested without transformations. Silver layer is where data undergoes refinement and transformation to improve quality and usability (cleaning, deduplication, normalization, schema enforcement). Gold Tables contain curated and optimized data ready for specific analytics or business needs.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Query Optimization & Performance", "question": "A data analyst runs the following query but receives unexpected results.\n\nSELECT department, COUNT(*) FROM employees GROUP BY department HAVING department = 'Engineering'.\n\nWhat would be a more efficient way to write this query?", "type": "single", "options": [{"label": "A", "text": "Remove the GROUP BY clause and use a subquery to apply the department filter before counting"}, {"label": "B", "text": "Replace HAVING with WHERE so the filter is applied before grouping, reducing the rows processed by the GROUP BY aggregation"}, {"label": "C", "text": "Replace COUNT(*) with COUNT(DISTINCT department) to ensure accurate counts when HAVING is used"}, {"label": "D", "text": "Add ORDER BY department at the end of the query to ensure the HAVING clause applies correctly"}], "correct_answers": ["B"], "explanation": "Correct: HAVING filters after aggregation while WHERE filters before. Since the filter on department is not based on an aggregate function it should be in the WHERE clause. Moving the filter to WHERE department = 'Engineering' allows the database to reduce the input rows before the GROUP BY aggregation, which is more efficient especially for large tables.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Delta Lake & Delta Tables", "question": "The MERGE INTO statement in Databricks SQL is used for which primary purpose?", "type": "single", "options": [{"label": "A", "text": "MERGE INTO creates a new empty table with the same schema as an existing table without copying any data"}, {"label": "B", "text": "MERGE INTO is used exclusively for merging the schemas of two tables when their column definitions differ"}, {"label": "C", "text": "MERGE INTO copies all files from one Delta table location to another without executing any SQL transformation logic"}, {"label": "D", "text": "MERGE INTO performs an upsert operation combining INSERT and UPDATE logic in a single atomic statement, inserting new rows when no match is found and updating existing rows when a match is found"}], "correct_answers": ["D"], "explanation": "Correct: MERGE INTO is the standard SQL upsert command. It joins a source dataset to a target table on a specified condition. When a match is found the WHEN MATCHED clause typically performs an UPDATE. When no match exists the WHEN NOT MATCHED clause performs an INSERT. This atomically handles both new and changed records in one statement.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "A data analyst needs to handle nested JSON data in a Databricks SQL query. The events table has a column called event_data stored as a JSON string containing a field called user_id. Which approach correctly extracts the user_id value from the nested JSON?", "type": "single", "options": [{"label": "A", "text": "SELECT JSON_VALUE(event_data, 'user_id') AS user_id FROM events"}, {"label": "B", "text": "SELECT event_data.user_id FROM events"}, {"label": "C", "text": "SELECT GET_JSON_OBJECT(event_data, '$.user_id') AS user_id FROM events"}, {"label": "D", "text": "SELECT PARSE_JSON(event_data, 'user_id') AS user_id FROM events"}], "correct_answers": ["C"], "explanation": "Correct: GET_JSON_OBJECT extracts a specific field from a JSON string using a JSONPath expression. The $ represents the root of the JSON object and .user_id navigates to the user_id field. This is the correct approach for extracting individual fields from JSON string columns in Databricks SQL.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "Which SQL statement correctly uses a CASE expression to categorise customers into three segments based on their total_spend column: High for spend above 10000, Medium for spend between 5000 and 10000, and Low for spend below 5000?", "type": "single", "options": [{"label": "A", "text": "SELECT customer_id, total_spend, DECODE(total_spend, 10000, 'High', 5000, 'Medium', 'Low') AS spend_segment FROM customers"}, {"label": "B", "text": "SELECT customer_id, total_spend, CASE WHEN total_spend > 10000 THEN 'High' WHEN total_spend >= 5000 THEN 'Medium' ELSE 'Low' END AS spend_segment FROM customers"}, {"label": "C", "text": "SELECT customer_id, total_spend, CASE total_spend WHEN > 10000 THEN 'High' WHEN >= 5000 THEN 'Medium' ELSE 'Low' END AS spend_segment FROM customers"}, {"label": "D", "text": "SELECT customer_id, total_spend, IF(total_spend > 10000, 'High', IF(total_spend >= 5000, 'Medium', 'Low')) AS spend_segment FROM customers"}], "correct_answers": ["B"], "explanation": "Correct: CASE WHEN evaluates conditions in order. The first condition captures customers with spend above 10000 as High. Customers reaching the second condition have already been excluded from High so total_spend >= 5000 correctly captures the 5000 to 10000 range as Medium. ELSE assigns Low to all remaining customers below 5000.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Databricks SQL & Warehouses", "question": "Which statement correctly describes when a Materialized View should be preferred over a standard view in Databricks SQL?", "type": "single", "options": [{"label": "A", "text": "A Materialized View should be preferred when a complex query involving multiple joins and aggregations is executed frequently and the underlying data changes infrequently or on a predictable schedule"}, {"label": "B", "text": "A Materialized View should always be preferred over a standard view because it provides faster query performance in every scenario"}, {"label": "C", "text": "A Materialized View should be preferred for tables that are written to thousands of times per second because it absorbs write load from the source tables"}, {"label": "D", "text": "A Materialized View should be preferred when analysts need to see real-time data within milliseconds of each source table update"}], "correct_answers": ["A"], "explanation": "Correct: Materialized Views provide the greatest benefit when the query is expensive to compute (multiple joins and aggregations) and is executed frequently by many users. Pre-computing and storing the result means subsequent queries read the stored result rather than re-executing the expensive computation. When data changes infrequently the staleness trade-off is acceptable and the performance benefit is significant.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Caching & Performance", "question": "A data analyst wants to cache a frequently queried table in Databricks to speed up repeated queries during an interactive analysis session. Which command correctly caches the table?", "type": "single", "options": [{"label": "A", "text": "OPTIMIZE orders CACHE"}, {"label": "B", "text": "CREATE CACHE orders AS SELECT * FROM orders"}, {"label": "C", "text": "PERSIST TABLE orders TO MEMORY"}, {"label": "D", "text": "CACHE TABLE orders"}], "correct_answers": ["D"], "explanation": "Correct: CACHE TABLE in Databricks SQL caches the table data in memory across the cluster. Subsequent queries against the cached table read from memory rather than from cloud storage, significantly reducing query latency for repeated access during an interactive analysis session. The cache persists until explicitly released with UNCACHE TABLE or until the cluster restarts.", "is_one_word": true}, {"source": "Udemy Practice Test 1", "theme": "Data Ingestion & Streaming", "question": "Which two statements correctly describe how COPY INTO differs from INSERT INTO in Databricks SQL?", "type": "multiple", "options": [{"label": "A", "text": "COPY INTO automatically creates the target table if it does not exist, while INSERT INTO requires the target table to be created in advance"}, {"label": "B", "text": "COPY INTO is designed for loading data from files in cloud storage into a Delta table and tracks which files have already been loaded to prevent duplicate ingestion, whereas INSERT INTO does not track file history and re-inserts data every time it is run"}, {"label": "C", "text": "INSERT INTO requires the target table to be empty before it can execute. If the target table contains existing rows INSERT INTO raises an error"}, {"label": "D", "text": "COPY INTO supports loading multiple file formats including CSV, JSON, Parquet, and Avro from cloud storage paths, whereas INSERT INTO operates on SQL query results from existing tables or inline values"}], "correct_answers": ["B", "D"], "explanation": "Correct: COPY INTO is purpose-built for idempotent file-based ingestion. It maintains an internal record of processed files and skips them on subsequent runs. COPY INTO reads from cloud storage paths and supports multiple file formats, while INSERT INTO takes SQL expressions such as SELECT statements from existing tables or VALUES clauses as its data source. They serve fundamentally different data loading patterns.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Analytics Fundamentals", "question": "What is data blending and when is it most commonly used in analytics?", "type": "single", "options": [{"label": "A", "text": "Data blending refers to gradually migrating data from a legacy database to a new cloud data platform while keeping both systems running in parallel"}, {"label": "B", "text": "Data blending is the process of removing duplicate records from a dataset to ensure each entity appears exactly once in the analytical output"}, {"label": "C", "text": "Data blending is the process of converting data from one file format to another such as converting CSV files to Parquet for better query performance"}, {"label": "D", "text": "Data blending combines data from multiple disparate sources with potentially different structures or granularities into a unified dataset for analysis, often used when data from different systems must be analysed together"}], "correct_answers": ["D"], "explanation": "Correct: Data blending is the practice of merging data from different source systems such as a CRM, an ERP, and a web analytics platform into a single analytical view. Sources may have different granularities (daily vs hourly), different schemas, or be stored in different systems. Blending enables cross-source analysis that would be impossible within a single source.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "AI/BI Dashboards & Visualization", "question": "A data analyst needs to implement a dashboard that allows users to dynamically switch between viewing data by day, week, or month without creating three separate dashboards. Which Databricks AI/BI Dashboard feature correctly supports this dynamic time granularity switching?", "type": "single", "options": [{"label": "A", "text": "Configure the visualisation widget's x-axis to automatically detect time granularity from the data and adjust the display without requiring any SQL changes"}, {"label": "B", "text": "Create three separate queries each aggregating data at a different time granularity and add a dashboard parameter widget that controls which query result is displayed in the visualisation"}, {"label": "C", "text": "Create a Materialised View for each time granularity and add a dropdown filter that selects which Materialised View to query"}, {"label": "D", "text": "Use a dashboard parameter widget that passes a granularity value such as day, week, or month into the underlying SQL query which uses a CASE expression to apply the appropriate DATE_TRUNC function based on the parameter value"}], "correct_answers": ["D"], "explanation": "Correct: Dashboard parameters inject values into SQL queries using double curly brace syntax. The SQL query can use a CASE expression on the {{granularity}} parameter to apply DATE_TRUNC('day', date), DATE_TRUNC('week', date), or DATE_TRUNC('month', date) accordingly. The single query dynamically aggregates at the selected granularity based on the user's selection.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "The marketing team wants to understand which acquisition channel brings in customers with the highest average lifetime value. The customer_ltv table has columns acquisition_channel and lifetime_value. Which query correctly ranks channels by average lifetime value from highest to lowest?", "type": "single", "options": [{"label": "A", "text": "SELECT acquisition_channel, AVG(lifetime_value) AS avg_ltv FROM customer_ltv GROUP BY acquisition_channel ORDER BY avg_ltv"}, {"label": "B", "text": "SELECT acquisition_channel, AVG(lifetime_value) AS avg_ltv FROM customer_ltv ORDER BY avg_ltv DESC"}, {"label": "C", "text": "SELECT acquisition_channel, AVG(lifetime_value) AS avg_ltv FROM customer_ltv GROUP BY acquisition_channel ORDER BY avg_ltv DESC"}, {"label": "D", "text": "SELECT acquisition_channel, SUM(lifetime_value) AS avg_ltv FROM customer_ltv GROUP BY acquisition_channel ORDER BY avg_ltv DESC"}], "correct_answers": ["C"], "explanation": "Correct: GROUP BY acquisition_channel computes the average lifetime value per channel. ORDER BY avg_ltv DESC sorts the result from the channel with the highest average lifetime value to the lowest, correctly answering the ranking question.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Data Modeling & Architecture", "question": "What is the purpose of last mile ETL in the context of analytics and business intelligence?", "type": "single", "options": [{"label": "A", "text": "Last mile ETL refers to the automated testing and validation processes run after all ETL pipelines complete to verify data quality before dashboards are refreshed"}, {"label": "B", "text": "Last mile ETL is a backup process that copies Gold layer data to an external location for disaster recovery purposes"}, {"label": "C", "text": "Last mile ETL refers to the final data transformation and preparation steps that occur closest to the end user or consumption layer, such as creating business-specific aggregations, calculated metrics, and formatted datasets ready for dashboards and reports"}, {"label": "D", "text": "Last mile ETL refers to the initial ingestion of raw data from source systems into the Bronze layer of the data platform"}], "correct_answers": ["C"], "explanation": "Correct: Last mile ETL covers the transformations that take clean integrated Silver layer data and shape it into the specific structures, aggregations, and metrics that business users and BI tools need. This includes creating star schema dimensional models, computing KPIs, and formatting data for specific reporting requirements. It represents the final mile between integrated data and business consumption.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Data Modeling & Architecture", "question": "Which two differences correctly distinguish a standard view from a temporary view in Databricks?", "type": "multiple", "options": [{"label": "A", "text": "A temporary view can be created without specifying a catalog or schema because it is stored in a session-specific context, whereas a standard view must be created within an existing schema"}, {"label": "B", "text": "Standard views require a SQL Warehouse to be running at all times to maintain the view definition in memory, whereas temporary views are stored on disk"}, {"label": "C", "text": "A standard view is persisted in the catalog and schema and remains accessible across sessions and to other users with appropriate permissions, whereas a temporary view exists only for the duration of the current session and is not visible to other users"}, {"label": "D", "text": "Temporary views support time travel queries while standard views do not, making temporary views more suitable for historical data analysis"}], "correct_answers": ["A", "C"], "explanation": "Correct: Temporary views use CREATE TEMP VIEW with just a name and no schema qualification because they are stored in the session's temporary context. Standard views require CREATE VIEW with a fully qualified name or an active USE CATALOG and USE SCHEMA context. Standard views are permanent catalog objects that persist across sessions and are accessible to permissioned users, whereas temporary views are session-scoped and invisible to other users.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "SQL Basics & Syntax", "question": "After running the following query a data analyst notices that all rows are returned rather than only the rows matching the filter.\n\nSELECT * FROM customers WHERE customer_name LIKE 'J%'\n\nThe table contains customer names starting with both uppercase and lowercase letters. What is the most likely cause?", "type": "single", "options": [{"label": "A", "text": "LIKE patterns require the wildcard to appear at both the beginning and end of the pattern. Using only a trailing % causes LIKE to match all rows"}, {"label": "B", "text": "The % wildcard in LIKE patterns matches only numeric characters, so LIKE 'J%' only returns rows where J is followed by digits rather than letters"}, {"label": "C", "text": "The LIKE pattern 'J%' is case-sensitive and only matches names starting with uppercase J. Names starting with lowercase j are not returned, but if all rows appear to be returned the filter column may contain leading spaces or the wrong column is being filtered"}, {"label": "D", "text": "The LIKE operator is not supported for string columns in Databricks SQL and should be replaced with the = operator for pattern matching"}], "correct_answers": ["C"], "explanation": "Correct: LIKE in Databricks SQL is case-sensitive by default. LIKE 'J%' matches names starting with uppercase J but not lowercase j. If the analyst expects to filter correctly but sees unexpected results the cause is often a case sensitivity mismatch, leading whitespace in the data, or an incorrect column reference.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Unity Catalog & Data Governance", "question": "Which two statements correctly describe Delta Sharing in Databricks?", "type": "multiple", "options": [{"label": "A", "text": "Delta Sharing automatically replicates all tables in a catalog to the recipient's workspace on a daily schedule"}, {"label": "B", "text": "Delta Sharing requires the recipient to have write access to the provider's storage account to read the shared data directly"}, {"label": "C", "text": "Delta Sharing allows data providers to share specific tables or partitions with recipients while the data remains in the provider's storage, avoiding the need to physically copy data to the recipient's environment"}, {"label": "D", "text": "Delta Sharing is an open protocol that enables secure sharing of live Delta Lake data with external recipients across different cloud platforms and organisations without requiring the recipient to have a Databricks account"}], "correct_answers": ["C", "D"], "explanation": "Correct: Delta Sharing provides access to data in place rather than copying it. The provider grants access to specific shares containing tables or table partitions. The recipient queries the data through the sharing protocol while the data physically remains in the provider's cloud storage. It is an open protocol so recipients do not need a Databricks account, enabling cross-organisation and cross-platform data sharing.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "AI/BI Dashboards & Visualization", "question": "Which two statements correctly describe how to create and use a Genie space in Databricks?", "type": "multiple", "options": [{"label": "A", "text": "A Genie space automatically connects to all tables in the workspace without any configuration, making all data immediately available for natural language querying"}, {"label": "B", "text": "Genie spaces can only be used by workspace administrators and are not accessible to regular business users or analysts"}, {"label": "C", "text": "A Genie space is configured by an administrator or analyst who adds curated datasets from Unity Catalog and optionally provides domain instructions and sample questions to guide Genie's interpretation of business terminology"}, {"label": "D", "text": "Once configured business users can open the Genie space and type questions in plain English such as show me total revenue by region last quarter and Genie generates and executes the corresponding SQL query returning results in a table or chart"}], "correct_answers": ["C", "D"], "explanation": "Correct: Genie space setup requires an administrator or data analyst to configure the space by specifying which Unity Catalog tables serve as the data sources, adding domain instructions, and optionally providing sample questions. Once configured business users interact with data through natural language questions without writing SQL. Genie translates questions into SQL, executes them, and presents results.", "is_one_word": false}, {"source": "Udemy Practice Test 1", "theme": "Delta Lake & Delta Tables", "question": "A data analyst needs to add a column called revenue_tier to an existing Delta table that does not currently have this column. The column should be added with a default value of Standard for all existing rows. Which SQL commands correctly add the column and populate existing rows?", "type": "single", "options": [{"label": "A", "text": "ALTER TABLE prod.silver.sales ADD COLUMN revenue_tier STRING; UPDATE prod.silver.sales SET revenue_tier = 'Standard' WHERE revenue_tier IS NULL"}, {"lab
